version: "3"

# The tasks themselves live in thematic files under .taskfiles/, included below.
#
# Every include uses `flatten: true` ON PURPOSE: CI workflows (backend.yml,
# frontend.yml, …) invoke targets by their unqualified names — `task
# lint:backend`, `task test:backend:unit` — and a namespaced include would
# silently rename them all. Flatten keeps every historical name stable; the
# price is that names must be unique across ALL included files (Task errors on
# a collision, so a clash cannot slip through silently).
#
# When adding a task, put it in the thematic file it belongs to — or a new
# .taskfiles/<topic>.yaml with its own include entry here — not in this file.
# Needs Task >= 3.39 (flatten); verified against 3.52.

vars:
  CLUSTER_NAME: kamerplanter

includes:
  dev:
    taskfile: .taskfiles/dev.yaml
    flatten: true
  backend:
    taskfile: .taskfiles/backend.yaml
    flatten: true
  libs:
    taskfile: .taskfiles/libs.yaml
    flatten: true
  frontend:
    taskfile: .taskfiles/frontend.yaml
    flatten: true
  e2e:
    taskfile: .taskfiles/e2e.yaml
    flatten: true
  checks:
    taskfile: .taskfiles/checks.yaml
    flatten: true
  deploy:
    taskfile: .taskfiles/deploy.yaml
    flatten: true
  docs:
    taskfile: .taskfiles/docs.yaml
    flatten: true
  mcp:
    taskfile: .taskfiles/mcp.yaml
    flatten: true
  claude:
    taskfile: .taskfiles/claude.yaml
    flatten: true

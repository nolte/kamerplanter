[pytest]
# Enforce that every marker used as a decorator is registered. Unregistered or
# mistyped markers become a hard error instead of a silent warning, keeping the
# REQ + feature selection axes (registered in conftest.py::pytest_configure)
# drift-free. See project/requirements/e2e-test-identifizierbarkeit.md (R3).
addopts = --strict-markers

# Custom markers are registered dynamically in conftest.py:
#   - the 4 legacy markers (smoke, core_crud, requires_auth, requires_desktop),
#   - the semantic feature axis (KNOWN_FEATURE_MARKERS: plant, watering,
#     nutrient, harvest, calendar, journey),
#   - one req<NNN> marker per test_req<NNN>_*.py file (REQ axis).
# Run `pytest --markers` to list them all.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']
      - id: check-yaml
        args: ['--allow-multiple-documents', '--unsafe']
        exclude: ^helm/
      - id: check-json
        exclude: ^src/frontend/src/i18n/
      - id: check-merge-conflict

  # ── Crash-recovery guard ───────────────────────────────────────────────
  # Refuses commits from a worktree nested under .claude/worktrees/. Sessions
  # run from there have no resumable top-level transcript, so a crash strands
  # the work (see CLAUDE.md §"Crash recovery"). Use `task worktree:add` instead.
  - repo: local
    hooks:
      - id: guard-nested-worktree
        name: no commits from .claude/worktrees/ (not resumable)
        entry: scripts/guard_nested_worktree.sh
        language: system
        always_run: true
        pass_filenames: false

  # ── Resume-artifact guard ──────────────────────────────────────────────
  # Fails in CI (the required `static` job runs pre-commit) when the branch
  # tip still tracks .resume/ files. Inverse to the guard above: a no-op on
  # local commits so a developer may checkpoint .resume/ into git during work,
  # but it forces the strip before the PR merges to develop. See
  # scripts/guard_resume_files.sh and spec/project/parallel-working-copies/.
  - repo: local
    hooks:
      - id: guard-resume-files
        name: no .resume/ artifacts on the branch (CI-only)
        entry: scripts/guard_resume_files.sh
        language: system
        always_run: true
        pass_filenames: false

  # ── E2E suite (Python) ────────────────────────────────────────────────
  # Deferred in #776 because the tree was red -- the 13 `F841` before-state
  # captures it reported were real findings, not noise, and silencing them to
  # turn the gate green would have destroyed the evidence. They are resolved
  # (#802), so the gate can be armed: `tests/e2e/ruff.toml` is the config that
  # applies here (the backend's pyproject only covers `src/backend`).
  - repo: local
    hooks:
      - id: ruff-lint-e2e
        name: ruff check (E2E suite)
        entry: bash -c 'cd tests/e2e && ruff check --fix "${@/#tests\/e2e\//}"' --
        language: python
        additional_dependencies: ['ruff>=0.15.0']
        files: ^tests/e2e/.*\.py$
        types: [python]
      - id: ruff-format-e2e
        name: ruff format (E2E suite)
        entry: bash -c 'cd tests/e2e && ruff format "${@/#tests\/e2e\//}"' --
        language: python
        additional_dependencies: ['ruff>=0.15.0']
        files: ^tests/e2e/.*\.py$
        types: [python]

  # ── Spec-to-test traceability ─────────────────────────────────────────
  # Runs in the required `static` job, which is the whole point: until #775 the
  # classic suite's docstring TC-IDs were verified by nothing, so 616 of them
  # had drifted into a per-file running count that only coincidentally hit a
  # real spec number — and nobody noticed, because no gate looked.
  #
  # Both channels are checked: the Gherkin `@TC-…` tags and the classic
  # docstrings. Two shrink-only baselines in the script hold the remainder that
  # cannot be resolved mechanically, so the check is green today and a *new*
  # violation still fails immediately. A permanently red check gets switched off
  # within a week, which would waste the exercise.
  #
  # Standard library only, no stack, no browser — cheap enough for every commit.
  - repo: local
    hooks:
      - id: e2e-traceability
        name: E2E spec-to-test traceability (#775)
        entry: python3 scripts/check_bdd_traceability.py
        language: system
        files: ^(tests/e2e/|spec/e2e-testcases/|scripts/check_bdd_traceability\.py)
        pass_filenames: false

  # ── Backend (Python) ──────────────────────────────────────────────────
  # Uses ruff via pip (not the pre-commit mirror) to support py314 target-version.
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff check (backend)
        entry: bash -c 'cd src/backend && ruff check --fix "${@/#src\/backend\//}"' --
        language: python
        additional_dependencies: ['ruff>=0.15.0']
        files: ^src/backend/.*\.py$
        types: [python]
      - id: ruff-format
        name: ruff format (backend)
        entry: bash -c 'cd src/backend && ruff format "${@/#src\/backend\//}"' --
        language: python
        additional_dependencies: ['ruff>=0.15.0']
        files: ^src/backend/.*\.py$
        types: [python]

  # ── Microservices / shared lib (mypy type baseline, SCR-001) ───────────
  # The backend declares mypy strict=true but ships no mypy CI step; these
  # sibling Python packages carried no static type-checker at all. A non-strict
  # mypy baseline (config in each package's pyproject.toml) now runs in the
  # required `static` gate. Each hook cd-s into its package like the ruff hooks
  # and runs in an isolated venv carrying mypy only — the packages' own
  # [tool.mypy] overrides ignore runtime imports absent from that venv. The
  # separate backend-mypy CI gap is left as a documented follow-up (not wired
  # here). pass_filenames is false so mypy sees each package as a whole module.
  - repo: local
    hooks:
      - id: mypy-kp-vectordb
        name: mypy (kp_vectordb)
        entry: bash -c 'cd src/libs/kp_vectordb && mypy kp_vectordb'
        language: python
        additional_dependencies: ['mypy>=1.13.0']
        files: ^src/libs/kp_vectordb/kp_vectordb/.*\.py$
        pass_filenames: false
      - id: mypy-knowledge-service
        name: mypy (knowledge-service)
        entry: bash -c 'cd src/knowledge-service && mypy app'
        language: python
        additional_dependencies: ['mypy>=1.13.0']
        files: ^src/knowledge-service/app/.*\.py$
        pass_filenames: false
      - id: mypy-inference-service
        name: mypy (inference-service)
        entry: bash -c 'cd src/inference-service && mypy app'
        language: python
        additional_dependencies: ['mypy>=1.13.0']
        files: ^src/inference-service/app/.*\.py$
        pass_filenames: false

  # ── Steckbrief ↔ seed consistency (Issue #680) ─────────────────────────
  # Fails the required `static` gate when a lifecycle-driving attribute
  # (growth_habit / photoperiod_type / photosynthesis_type / flowering_strategy
  # / growth_determinacy) drifts between a Steckbrief (spec/knowledge/plants/*.md)
  # and the seed YAMLs. Seed = source of truth, Steckbrief = documentation that
  # must follow it; deliberate divergences are recorded in the validator's
  # ALLOWED_DISCREPANCIES allowlist. Self-contained (stdlib + PyYAML) so it runs
  # in this isolated pre-commit venv as well as under pytest.
  - repo: local
    hooks:
      - id: steckbrief-seed-consistency
        name: Steckbrief ↔ seed consistency (#680)
        entry: python src/backend/app/migrations/seed_steckbrief_consistency.py
        language: python
        additional_dependencies: ['PyYAML>=6.0']
        always_run: true
        pass_filenames: false

  # ── Frontend (TypeScript/React) ────────────────────────────────────────
  # These hooks require node_modules — run locally only.
  # In CI, frontend linting runs via .github/workflows/frontend.yml (npm ci + eslint + tsc).
  - repo: local
    hooks:
      # Both entries route through scripts/frontend_hook.sh, which refuses to
      # report success for a check it did not run (#814). The previous inline
      # `test -d src/frontend/node_modules || exit 0` printed `Passed` when the
      # dependencies were absent — a commit that did not compile went through
      # with two green hooks.
      - id: frontend-eslint
        name: ESLint (frontend)
        entry: scripts/frontend_hook.sh eslint
        language: system
        files: ^src/frontend/src/.*\.(ts|tsx)$
        types_or: [ts, tsx]
      - id: frontend-tsc
        name: TypeScript check (frontend)
        entry: scripts/frontend_hook.sh tsc
        language: system
        files: ^src/frontend/src/.*\.(ts|tsx)$
        pass_filenames: false

  # ── Security (Nuclei templates) ─────────────────────────────────────────
  # Validates project-specific Nuclei templates (NFR-014 §3.2). Skips when
  # nuclei is not installed locally so the hook does not block contributors
  # who never touch security templates. The CI security-nuclei workflow
  # (Phase 2B) is the authoritative gate.
  - repo: local
    hooks:
      - id: nuclei-validate
        name: Nuclei template validate
        entry: bash -c 'command -v nuclei >/dev/null 2>&1 || { echo "nuclei not in PATH — skipping local validate."; exit 0; }; nuclei -validate -t tests/security/nuclei-templates/'
        language: system
        files: ^tests/security/nuclei-templates/.*\.yaml$
        pass_filenames: false

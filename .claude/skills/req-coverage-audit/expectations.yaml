# Erwartungs-Manifest fuer den /req-coverage-audit Skill.
# Quelle der Wahrheit dafuer, welche Artefakte (Files, Globs, Configs) pro Anforderung
# erwartet werden. JEDE Anforderung in spec/req/, spec/nfr/, spec/ui-nfr/ MUSS einen
# Eintrag haben (Pflicht, sonst BLOCKER im Audit).
#
# Schema:
#   requirements.<ID>:
#     title: <Kurzbezeichnung>
#     type: req|nfr|ui-nfr
#     spec_path: <pfad>
#     expected_artefacts:
#       <dimension>:                  # backend|frontend|tests|artefacts|validation
#         - kind: file|glob|dir|pattern
#           path: <repo-relativer Pfad oder Glob>
#           role: <router|model|service|engine|repository|page|slice|test|config|...>
#           contains: <optional: substring der im File vorkommen muss>
#           optional: true|false      # default false
#           rationale: <warum erwartet>
#     drift:
#       memory_status_field: <hint zur MEMORY.md Pruefung>
#       cross_refs: [<REQ-NNN>, <NFR-NNN>]

requirements:


  #   statefulset:
  #     volumeClaimTemplates:
  #       - name: data
  #         accessMode: ReadWriteOnce
  #         size: 2Gi
  #         globalMounts:
  #           - path: /var/lib/postgresql/data

  # -- Embedding Service (optional — sentence-transformers CPU inference, disabled by default)
  # embedding-service:
  #   type: deployment
  #   replicas: 1
  #   pod:
  #     securityContext:
  #       runAsUser: 1000
  #       runAsGroup: 1000
  #   containers:
  #     main:
  #       image:
  #         repository: ghcr.io/nolte/kamerplanter-embedding-service
  #         tag: latest
  #         pullPolicy: IfNotPresent
  #       securityContext:
  #         allowPrivilegeEscalation: false
  #         readOnlyRootFilesystem: true
  #         capabilities:
  #           drop: ["ALL"]
  #       env:
  #         EMBEDDING_MODEL: "paraphrase-multilingual-MiniLM-L12-v2"
  #       probes:
  #         liveness:
  #           enabled: true
  #           custom: true
  #           spec:
  #             httpGet:
  #               path: /health
  #               port: 8080
  #             initialDelaySeconds: 60
  #             periodSeconds: 30
  #             timeoutSeconds: 10
  #             failureThreshold: 3
  #         readiness:
  #           enabled: true
  #           custom: true
  #           spec:
  #             httpGet:

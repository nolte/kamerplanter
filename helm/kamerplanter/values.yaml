# -- IMAGE PINNING INVARIANT (#1025, and #1024 which measured it).
#
# In a RELEASED chart every Kamerplanter ``image.tag`` is
# ``<version>@sha256:<digest>``: the release job rewrites it before packaging
# (scripts/ci/pin_chart_image_digests.sh) and scripts/check_chart_image_digests.py
# proves it did. The digest is what identifies the bytes; the version in front
# of it is only a human-readable label. Together with ``pullPolicy: IfNotPresent``
# that is exact and cheap: the kubelet never re-resolves a tag, because a digest
# cannot move.
#
# In THIS tree the tag is ``latest``. Two things read this tree, and neither
# resolves that tag: Skaffold deploys it into the dev cluster with every owned
# image reference — main containers AND the frontend init container —
# overridden by ``setValueTemplates`` in skaffold.yaml to the locally built
# image; and docker-publish packages it as the ``-dev`` chart, whose OCI tag is
# rewritten by every ``helm/`` merge and which no deployment points at
# (docs/deployment/ci-cd.md, "Zwei Kanäle"). Until 2026-09-10 the develop tree
# carried ``latest@sha256:…`` too, kept current by a Renovate rule; that fed
# nothing and its pull request was rebased by every publish and never merged
# (#1326), so it was removed. A new owned image reference here MUST be added
# to skaffold.yaml's overrides, or the dev cluster pulls ghcr.io's ``latest``
# with ``IfNotPresent`` — the cache trap described below.
#
# **A deployment overlay must NOT add a per-controller ``image.tag`` override.**
# Doing so replaces a digest with a mutable tag, and ``IfNotPresent`` then means
# "keep whatever is already on the node" — measured in #1024: a rollout restart
# silently kept an old image, and the same class had already caught
# inference-service. The failure is invisible from every side except the running
# container.
#
# The division of responsibility that follows from this:
#   * the overlay's ``targetRevision`` selects the chart **version**;
#   * the chart selects the **bytes**.
# An overlay that pins tags takes the second job away from the chart while still
# looking like configuration.
#
# The prod overlay in ``nolte/k8s-home-lab`` still carries such overrides on six
# controllers. That change belongs in that repository; this comment is the
# invariant it has to satisfy, kept next to the values that enforce it here.

# -- NFR-013 Object-storage configuration (§4.1, §10) — THE storage switch (#2124).
#
# This block is the one place an operator chooses where attachments live. Since
# bjw-s common 5.2 every string in these values is rendered as a template, and
# the backend + celery-worker controllers and the ``backend-attachments``
# persistence below read this block through ``{{ .Values.storage.* }}``
# expressions. Until #2124 nothing read it: setting ``backend: s3`` here still
# deployed local-fs with a volume — a switch the docs described and the chart
# ignored.
#
#   * ``local-fs`` (default): the ``backend-attachments`` claim is rendered and
#     mounted at ``localFs.root`` in the backend and the celery-worker.
#   * ``s3``: no claim, no mount; the backend + worker get ``STORAGE_BACKEND=s3``,
#     the ``s3.*`` parameters and the two credential keys from
#     ``s3.credentialsRef``. **Required for shared (multi-node / SaaS)
#     operation**, see ``localFs.singleNode``.
#
# SECRETS (NFR-013 §4.1): the S3 access key / secret are NEVER placed in
# values.yaml, a ConfigMap or Git. They come from the Secret named in
# ``s3.credentialsRef`` (e.g. produced by the External Secrets Operator) and are
# injected key by key via ``secretKeyRef`` — only those two keys, not the whole
# Secret. The references are ``optional`` so that a local-fs release, which has
# no such Secret, still starts; with ``backend: s3`` and the Secret missing, the
# storage health check fails readiness (the rollout stops, the old pods serve).
storage:
  backend: local-fs   # local-fs | s3
  maxFileSizeMb: 25
  presignTtlSeconds: 900
  virusScan:
    enabled: false
    endpoint: ""

  localFs:
    root: /data/attachments
    pvc:
      size: 20Gi
      # The claim is mounted by the backend AND the celery-worker. A
      # ReadWriteOnce volume attaches to ONE node: a second pod scheduled onto
      # another node stays in ContainerCreating with `Multi-Attach error`. So more
      # than one backend or worker replica on local-fs needs ReadWriteMany on a
      # CSI that supports it (Longhorn RWX, NFS, CephFS) — or S3. The render
      # refuses the combination (``renderChecks.attachmentVolume`` below).
      accessMode: ReadWriteOnce
      storageClass: ""   # "" = cluster default StorageClass
    # Set to true ONLY on a single-node cluster: there every pod shares the one
    # node, so ReadWriteOnce carries several replicas. On more than one node it
    # does not, whatever this flag says.
    singleNode: false

  s3:
    endpointUrl: https://s3.eu-central-1.amazonaws.com
    region: eu-central-1
    bucket: kamerplanter-prod
    usePathStyle: false
    forceTls: true
    kmsKeyId: ""
    # A private / in-cluster endpoint (MinIO, Ceph RGW) is refused by the
    # admin "test connection" probe unless this is true (SEC-002). The
    # backend's NetworkPolicy also excludes RFC1918 egress — an in-cluster
    # endpoint additionally needs an egress rule in your values.
    allowPrivateEndpoint: false
    # Name and keys of the Secret holding the S3 credentials (synced by the
    # External Secrets Operator or created by hand). NEVER inline the values.
    credentialsRef:
      secretName: storage-s3-credentials
      accessKeyIdKey: STORAGE_S3_ACCESS_KEY_ID
      secretAccessKeyKey: STORAGE_S3_SECRET_ACCESS_KEY

# -- Render-time checks (#2124). bjw-s renders every string in these values as a
# template, and ``fail`` aborts ``helm template`` / ``helm upgrade`` / the ArgoCD
# render with the message — before anything reaches the cluster. The checks
# render to an empty string when they pass and are read by nothing else.
renderChecks:
  attachmentVolume: >-
    {{- $storage := .Values.storage -}}
    {{- if not (has $storage.backend (list "local-fs" "s3")) -}}
    {{- fail (printf "storage.backend must be local-fs or s3, got %q" (toString $storage.backend)) -}}
    {{- end -}}
    {{- if and (eq $storage.backend "local-fs") (ne $storage.localFs.pvc.accessMode "ReadWriteMany") (not $storage.localFs.singleNode) -}}
    {{- range $name := list "backend" "celery-worker" -}}
    {{- $controller := index $.Values.controllers $name | default dict -}}
    {{- if and (ne (toString $controller.enabled) "false") (gt (int (default 1 $controller.replicas)) 1) -}}
    {{- fail (printf "controllers.%s.replicas=%d with storage.backend=local-fs on a %s attachment volume: the volume attaches to one node, so a second pod on another node never starts (Multi-Attach error). Use storage.backend=s3 (required for shared operation), or storage.localFs.pvc.accessMode=ReadWriteMany with an RWX storage class, or - on a cluster with exactly one node - storage.localFs.singleNode=true. See docs/deployment/helm.md#storage-konfiguration-nfr-013 (#2124)." $name (int $controller.replicas) $storage.localFs.pvc.accessMode) -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
  # #2122 — an enabled backup without a bucket would run every night and fail
  # every night; refuse it at render time instead.
  backupTarget: >-
    {{- if and .Values.backup.enabled (empty .Values.backup.s3.bucket) -}}
    {{- fail "backup.enabled=true needs backup.s3.bucket (and the Secret named in backup.s3.credentialsRef). See docs/deployment/backup-restore.md (#2122)." -}}
    {{- end -}}

# -- ArangoDB application account (#2126). The backend, celery-worker and
# celery-beat connect with this account (their ARANGODB_USERNAME renders it), and
# the arangodb `app-user` container provisions it with ARANGODB_PASSWORD from
# kamerplanter-secrets: `rw` on the application database and its collections,
# no access to `_system`. Until #2126 the application connected as root.
#
# Set to `root` to keep the old behaviour (the provisioner then does nothing).
# What the chart cannot do for you: the backend still receives the whole
# kamerplanter-secrets, so as long as ARANGO_ROOT_PASSWORD lives in that Secret
# the backend can read it. Move it into a Secret of its own and give the
# application account its own ARANGODB_PASSWORD — docs/deployment/kubernetes.md.
database:
  arangodb:
    appUsername: kamerplanter
    # Secret holding ARANGO_ROOT_PASSWORD, read by the arangodb pod only. The
    # default keeps today's place; set a Secret of its own to take the root
    # password out of what the backend receives.
    rootPasswordSecret: kamerplanter-secrets

# -- ArangoDB backup (#2122, NFR-002 §8, NFR-012 §9.1). OFF by default — an
# enabled backup needs a bucket and credentials only the operator has.
#
# A CronJob (controller ``arangodb-backup``) runs ``arangodump`` of the
# application database into a scratch volume (init container, the SAME arangodb
# image and tag as the database, so client and server versions cannot drift),
# then ``rclone`` copies the dump to ``s3://<bucket>/<prefix>/<UTC stamp>/`` and
# writes ``<prefix>/LATEST`` with that stamp — the recovery point, readable
# without a cluster (RPO = now − LATEST). Retention deletes dump directories
# older than ``retentionDays``, never the one the run just wrote, so a backup
# outage cannot age the last good dump away.
#
# Credentials: the dump reads ``ARANGODB_USERNAME`` / ``ARANGODB_PASSWORD`` — the
# application account, which can read its own database; the root password is
# not in this pod. The S3 keys come key by key from ``s3.credentialsRef``. No
# password is ever on a command line: arangodump expands ``@ARANGODB_PASSWORD@``
# from its own environment.
#
# Encryption: ``s3.serverSideEncryption`` (``AES256`` or ``aws:kms`` with
# ``s3.kmsKeyId``) is requested on every upload; the bucket's own default
# encryption and versioning are the operator's to set.
#
# What this does NOT back up: attachments (with ``storage.backend: s3`` use
# bucket versioning / replication, NFR-013 §7.1; with local-fs a CSI
# VolumeSnapshot of the ``backend-attachments`` claim) and TimescaleDB (not part
# of this chart's production values). Restore: docs/deployment/backup-restore.md.
backup:
  enabled: false
  schedule: "15 2 * * *"
  retentionDays: 30
  # Node-disk scratch for one dump; size it above the compressed database.
  scratchSize: 10Gi
  s3:
    # rclone's S3 provider name: AWS, Minio, Ceph, Cloudflare, Other, ...
    provider: AWS
    endpointUrl: https://s3.eu-central-1.amazonaws.com
    region: eu-central-1
    bucket: ""
    prefix: kamerplanter/arangodb
    forcePathStyle: false
    serverSideEncryption: AES256   # "" | AES256 | aws:kms
    kmsKeyId: ""
    credentialsRef:
      secretName: kamerplanter-backup-s3
      accessKeyIdKey: AWS_ACCESS_KEY_ID
      secretAccessKeyKey: AWS_SECRET_ACCESS_KEY

# -- Default pod-level security context applied to all controllers (SEC-M-004)
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

# -- Image references (#987)
#
# Every Kamerplanter-owned image below is addressed as `tag: latest` HERE and as
# `tag: <version>@sha256:<digest>` in the released chart — see the invariant at
# the top of this file. READ THE PART AFTER THE `@` in a release: the digest is
# what the kubelet resolves and it is content-addressed, so the reference cannot
# move underneath a running cluster. `latest` is rewritten by every publish, so
# "roll back to the previous image" had nothing to name when the released chart
# still carried it — the documented recovery path was inert in exactly the
# situation it exists for. That is what the release-time rewrite fixes.
#
# Why the digest goes INTO `tag:` and not into the `digest:` field that
# bjw-s/common also offers: pin_chart_image_digests.sh addresses the same
# `repository` + `tag` pair the guard checks, and one field carrying the whole
# reference cannot be half-updated — a tag bumped without its digest would leave
# a cluster silently on the old image, which is the failure renovate.json5
# guards against for the workflow images.
#
# How a new version reaches a cluster:
#   1. docker-publish pushes the images and moves `:latest` in GHCR on every
#      develop merge — nothing deploys from that
#   2. a maintainer publishes a release; the same workflow pins every image here
#      to `<version>@sha256:<digest>` and pushes the chart as that version
#   3. the GitOps repository moves ArgoCD's `targetRevision` to it; pods roll
#      because the pod spec changed
# Rollback is moving `targetRevision` back — the previous chart version carries
# its own immutable digests.
#
# pullPolicy stays `IfNotPresent` deliberately. A digest is content-addressed:
# an image already present on the node IS the requested bytes, so a re-pull can
# only confirm what is there, and `Always` would make every pod start depend on
# GHCR being reachable. The same setting IS a trap with a moving tag — an
# explicit `IfNotPresent` beats the implicit `Always` Kubernetes applies to a
# `:latest` reference, so a node with a cached `latest` keeps serving the old
# image straight through a `rollout restart` (that is how the inference-service
# answered 404 on the pest routes for weeks). Which is why every owned
# reference in this tree, where the tag IS `latest`, is overridden by Skaffold
# and why nothing else deploys it.
controllers:
  backend:
    type: deployment
    replicas: 1
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: 0
    pod:
      # NOTE: setting pod.securityContext here REPLACES the
      # defaultPodOptions.securityContext (bjw-s does not deep-merge it), so
      # fsGroup MUST be repeated. Without it the backend-attachments PVC mounts
      # as root:root and the uid-1000 process can't write — storage health_check
      # fails and readiness stays 503 (NFR-013).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    containers:
      main:
        image:
          repository: ghcr.io/nolte/kamerplanter-backend
          tag: latest
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        envFrom:
          # kamerplanter-secrets also carries INTERNAL_SERVICE_TOKEN (AP-4,
          # INF-S1/S2): the shared M2M secret sent to the knowledge-/inference-
          # service. It arrives automatically via envFrom, so no explicit env
          # entry is needed here.
          - secret: kamerplanter-secrets
        env:
          ARANGODB_HOST: kamerplanter-arangodb
          ARANGODB_PORT: "8529"
          ARANGODB_DATABASE: kamerplanter
          # #2126 — the application account, provisioned by the arangodb
          # `app-user` container; see `database.arangodb.appUsername`.
          ARANGODB_USERNAME: '{{ .Values.database.arangodb.appUsername }}'
          REDIS_URL: redis://kamerplanter-valkey:6379/0
          # How many proxy addresses this deployment's own infrastructure appends
          # to X-Forwarded-For, counted from the right (#1151). Only the backend
          # needs it — the Celery controllers serve no requests.
          #
          # `1` because the chain is client -> ingress -> nginx -> backend, and
          # each of those appends: the ingress records the caller, nginx then
          # appends the ingress's own address, so the caller is the
          # second-to-last entry. Verified against the reference deployment
          # (k8s-home-lab), where the ingress is Contour/Envoy and *both* routes
          # — `/` and `/api` — point at `kamerplanter-frontend:80`, i.e. `/api`
          # is proxied by nginx rather than reaching the backend service直接.
          #
          # A deployment that routes /api straight to the backend Service has one
          # proxy fewer and must set this to 0 — the value follows the request
          # path, not the product name.
          #
          # Not optional decoration. The application default is 0 — the shallow,
          # dev-shaped chain — and leaving it at 0 here would resolve every
          # caller to Traefik's pod IP. The device-pairing lockout buckets on
          # that value (MAX_ATTEMPTS = 5, up to MAX_LOCKOUT_MINUTES = 240), so
          # five wrong codes from one attacker would lock *every* user out of
          # pairing for four hours, and every service account with an
          # `ip_allowlist` would fail closed with 401.
          TRUSTED_PROXY_HOPS: "1"
          # #777 — optional Sentry-protocol error tracking. Empty DSN => the SDK
          # is never initialised and the process is unchanged, so this block is
          # safe to ship enabled-by-absence. Set SENTRY_DSN in the ArgoCD
          # valuesObject (or via kamerplanter-secrets) to switch it on; the DSN
          # carries only a public ingest key, not a credential.
          # SENTRY_ENVIRONMENT must come from the closed vocabulary the alert
          # rules filter on: development | e2e | staging | production.
          SENTRY_DSN: ""
          SENTRY_ENVIRONMENT: "production"
          # Set to the image tag the deployment rolls out, so a regression is
          # attributable to the release that introduced it.
          SENTRY_RELEASE: ""
          SENTRY_SAMPLE_RATE: "1.0"
          # NetworkPolicy caveat: the external-egress rule below deliberately
          # EXCLUDES the RFC1918 ranges, so a self-hosted tracker on a private
          # address is unreachable until the operator adds an explicit egress
          # rule for it. Events would be dropped silently — the SDK does not
          # surface a blocked connection. Enabling the DSN is therefore two
          # changes, not one.
          CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://localhost:8080"]'
          DEBUG: "false"
          # #1948 — a self-registered account must confirm its address before it
          # can sign in (also the application default).
          # WARNING: this chart sets NO EMAIL_ADAPTER, so the backend uses the
          # console adapter, which delivers no mail. Without a mail adapter
          # (EMAIL_ADAPTER=smtp or resend plus its settings), NEW REGISTRATIONS
          # CANNOT LOG IN unless you set REQUIRE_EMAIL_VERIFICATION: "false" in
          # your values. Existing accounts are unaffected. The backend logs
          # email_adapter_console_in_production at startup in that state.
          REQUIRE_EMAIL_VERIFICATION: "true"
          # #1236 — the last delivery hop, made measurable. `GET /api/health`
          # discloses `build_revision` (the full 40-character commit the running
          # image was built from) only when this is true; the application default
          # is false, so without this line a deployment cannot be asked what it
          # runs and hop 4 — *does the pod actually serve the bytes the chart
          # pins?* — has no observable at all. That is the hop the 2026-08-17
          # incident failed on, with the hop-3 digest check green and correct.
          #
          # SET HERE, IN THE CHART, ON PURPOSE. #1236's earlier investigation
          # concluded the variable "would need to be set in the GitOps overlay,
          # not in this repository" and stalled on it. That is wrong: production
          # deploys THIS chart (ArgoCD `targetRevision` against
          # `oci://ghcr.io/nolte/charts/kamerplanter`), and Helm merges an
          # operator's `valuesObject` env map INTO this one rather than replacing
          # it. Verified by rendering released chart 0.2.1 with the production
          # Application's own valuesObject: this default and every operator
          # override (KAMERPLANTER_MODE, CORS_ORIGINS, ...) both survive.
          #
          # THE TRADE, STATED PLAINLY. `/api/health` is unauthenticated. The
          # commit hash itself is public — the repository is — but the mapping
          # *this host runs that commit* is not, and it yields the exact patch
          # distance to develop: `git log <revision>..develop` reads off which
          # fixes this instance has NOT got, amplified by this project publishing
          # its own security findings. docs/{de,en}/deployment/ci-cd.md weighs
          # that trade and calls `true` the recommended setting for a production
          # instance whose delivery state should be auditable; this line
          # implements that recommendation as the chart default instead of
          # leaving every deployment to rediscover it.
          #
          # An operator who does not want to disclose overrides this to "false"
          # in their own values — and should then stop running
          # `scripts/ci/check_deployed_build.py` against that instance, which
          # reports "not disclosed" as loud-undetermined, never as clean.
          HEALTH_EXPOSE_BUILD_REVISION: "true"
          MDNS_ENABLED: "false"  # mDNS is LAN-only, disable in K8s
          # REQ-029 Plant identification (Phase 1 — Pl@ntNet-first). All optional:
          # without an API key the feature is disabled and all camera UI is hidden.
          # PLANTNET_API_KEY must be supplied via a Secret (never hard-coded here),
          # e.g. through envFrom/secret injection — see §6.2 of REQ-029.
          IDENTIFICATION_PRIMARY_ADAPTER: "plantnet"
          IDENTIFICATION_CONFIDENCE_AUTO_ACCEPT: "0.85"
          IDENTIFICATION_CONFIDENCE_MIN_SHOW: "0.10"
          IDENTIFICATION_MAX_IMAGE_SIZE_MB: "5"
          # Read timeout (s) for the external /identify call — Pl@ntNet's upload +
          # ML inference can exceed 30s under load (surfaces as ReadTimeout).
          IDENTIFICATION_HTTP_TIMEOUT: "60"
          # Longest edge (px) the image is downscaled to before upload.
          IDENTIFICATION_MAX_IMAGE_DIMENSION: "1024"
          # REQ-033 MCP server — the Streamable-HTTP tool interface for external
          # LLM clients (Claude Code and friends), served in-process by this
          # backend under /api/v1/mcp. Opt-in and OFF by default: while false,
          # every /mcp/* route answers HTTP 404, so the interface is not merely
          # unauthenticated-but-present, it is absent.
          #
          # Turning it on exposes tool calls authenticated by `kp_` API keys —
          # personal ones included — each scoped to its owner's tenant
          # memberships. It needs no extra pod and no extra egress; sessions live
          # in the Valkey instance the backend already uses (REDIS_URL above).
          MCP_SERVER_ENABLED: "false"
          # Replay window for a write tool's idempotency_key (REQ-033 §2.6).
          MCP_IDEMPOTENCY_TTL_HOURS: "24"
          # mcp_audit_log retention; the floor is set by NFR-011, not by taste.
          MCP_AUDIT_RETENTION_DAYS: "90"
          # NFR-013 Object storage (§4.1) — rendered from the top-level
          # ``storage`` block (#2124); set the backend THERE, not here. The
          # celery-worker carries the same lines and must stay identical.
          STORAGE_BACKEND: '{{ .Values.storage.backend }}'
          STORAGE_LOCAL_FS_ROOT: '{{ .Values.storage.localFs.root }}'
          STORAGE_MAX_FILE_SIZE_MB: '{{ .Values.storage.maxFileSizeMb }}'
          STORAGE_PRESIGN_TTL_SECONDS: '{{ .Values.storage.presignTtlSeconds }}'
          STORAGE_VIRUS_SCAN_ENABLED: '{{ .Values.storage.virusScan.enabled }}'
          STORAGE_VIRUS_SCAN_ENDPOINT: '{{ .Values.storage.virusScan.endpoint }}'
          # The S3 parameters are empty (= the application defaults) unless the
          # backend is s3; the two booleans always carry the configured value.
          STORAGE_S3_ENDPOINT_URL: '{{ if eq .Values.storage.backend "s3" }}{{ .Values.storage.s3.endpointUrl }}{{ end }}'
          STORAGE_S3_REGION: '{{ if eq .Values.storage.backend "s3" }}{{ .Values.storage.s3.region }}{{ end }}'
          STORAGE_S3_BUCKET: '{{ if eq .Values.storage.backend "s3" }}{{ .Values.storage.s3.bucket }}{{ end }}'
          STORAGE_S3_KMS_KEY_ID: '{{ if eq .Values.storage.backend "s3" }}{{ .Values.storage.s3.kmsKeyId }}{{ end }}'
          STORAGE_S3_USE_PATH_STYLE: '{{ .Values.storage.s3.usePathStyle }}'
          STORAGE_S3_FORCE_TLS: '{{ .Values.storage.s3.forceTls }}'
          STORAGE_S3_ALLOW_PRIVATE_ENDPOINT: '{{ .Values.storage.s3.allowPrivateEndpoint }}'
          # S3 credentials: only these two keys of the Secret named in
          # storage.s3.credentialsRef, never inlined (NFR-013 §4.1).
          STORAGE_S3_ACCESS_KEY_ID:
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.storage.s3.credentialsRef.secretName }}'
                key: '{{ .Values.storage.s3.credentialsRef.accessKeyIdKey }}'
                optional: true
          STORAGE_S3_SECRET_ACCESS_KEY:
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.storage.s3.credentialsRef.secretName }}'
                key: '{{ .Values.storage.s3.credentialsRef.secretAccessKeyKey }}'
                optional: true
        probes:
          # #2125 — the lifespan runs ensure_collections, every pending migration
          # and the seeds BEFORE uvicorn listens (measured 2026-10-04 on an empty
          # ArangoDB: ~6 s import + ~33 s database work on a workstation), and a
          # replica that finds the migration lock held waits up to
          # BARRIER_TIMEOUT_SECONDS (600 s) for it. Liveness alone killed that
          # start ~35 s in, and a killed migrator leaves its lock fresh, so the
          # next start waited and was killed again. Liveness and readiness only
          # begin once this probe succeeded; its budget (10 s x 90 = 900 s) must
          # stay above the barrier so the application's own bounded wait, not
          # the kubelet, decides that a start failed
          # (tests/unit/guards/test_chart_backend_startup_budget.py).
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v1/health/live
                port: &backend-port 8000
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 90
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v1/health/live
                port: *backend-port
              initialDelaySeconds: 15
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v1/health/ready
                port: *backend-port
              initialDelaySeconds: 10
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 3
        # Image upload (REQ-034) decodes photos in-memory (Pillow quality
        # assessment); a few-MB JPEG balloons to 100+ MB decoded, so 512Mi
        # OOMKills the pod on upload. 2Gi gives headroom up to the 25 MB max.
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi

  frontend:
    type: deployment
    replicas: 1
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: 0
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
    initContainers:
      init-runtime-config:
        image:
          repository: ghcr.io/nolte/kamerplanter-frontend
          tag: latest
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        command: ["sh", "-c"]
        args:
          - |
            cat <<EOF > /runtime-config/runtime-config.js
            window.__RUNTIME_CONFIG__ = {
              KAMERPLANTER_MODE: "${KAMERPLANTER_MODE:-full}",
              SENTRY_DSN: "${SENTRY_DSN:-}",
              SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-}",
              SENTRY_RELEASE: "${SENTRY_RELEASE:-}",
              SENTRY_SAMPLE_RATE: "${SENTRY_SAMPLE_RATE:-}"
            };
            EOF
        env:
          KAMERPLANTER_MODE:
            value: "full"
          # #777 — mirrors the container's own docker-entrypoint.d script. Empty
          # DSN => the browser never fetches the SDK chunk, so the initial
          # payload budget (UI-NFR-003) is untouched when tracking is off.
          SENTRY_DSN:
            value: ""
          SENTRY_ENVIRONMENT:
            value: "production"
          SENTRY_RELEASE:
            value: ""
          SENTRY_SAMPLE_RATE:
            value: "1.0"
    containers:
      main:
        image:
          repository: ghcr.io/nolte/kamerplanter-frontend
          tag: latest
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        env:
          VITE_BACKEND_URL: "http://kamerplanter-backend:8000"
          # #777 — the nginx container needs the DSN too, not just the
          # init container: docker-entrypoint.d/30-error-tracking-csp.sh runs
          # here and widens connect-src by exactly the configured ingest origin.
          # Keep this in step with the init container's value, or the browser
          # loads the SDK and then has its events blocked by the CSP.
          SENTRY_DSN: ""
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: &frontend-port 8080
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: *frontend-port
              initialDelaySeconds: 5
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi

  arangodb:
    type: statefulset
    replicas: 1
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
    containers:
      main:
        image:
          repository: arangodb
          tag: "3.12.12"
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        # #2126 — exactly the root password, nothing else of the application
        # Secret. Until #2126 this was `envFrom: kamerplanter-secrets`, which put
        # JWT_SECRET_KEY, FERNET_KEY, INTERNAL_SERVICE_TOKEN and every mail/API
        # key into the database pod. `optional` keeps the old behaviour for a
        # Secret without the key (the image only reads it to initialise an
        # empty volume). To separate the root password from the application
        # Secret, set `database.arangodb.rootPasswordSecret` (docs: kubernetes.md).
        env:
          ARANGO_ROOT_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.database.arangodb.rootPasswordSecret }}'
                key: ARANGO_ROOT_PASSWORD
                optional: true
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8529
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8529
              initialDelaySeconds: 15
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 5
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
      # -- #2126 application account. Provisions — idempotently, on every pod
      # start — the account the backend connects with: the application database
      # (created if missing), the account with ARANGODB_PASSWORD, `rw` on that
      # database and its collections, `none` on `_system`. Then it idles.
      # It reads ARANGODB_USERNAME/ARANGODB_DATABASE from the backend's own env,
      # so a backend overridden to `root` makes it provision nothing.
      # Runs beside arangod because that is the one pod that holds the root
      # password anyway; it reaches the server on localhost (no NetworkPolicy
      # change), and passes no password on a command line (arangosh expands
      # `@ARANGO_ROOT_PASSWORD@` from its environment). A failure is retried every
      # 15 s and logged; it never blocks the database itself. Verified against
      # ArangoDB 3.12.12 under this security context on 2026-10-04.
      app-user:
        image:
          repository: arangodb
          # Same image and tag as the server (client == server version).
          tag: '{{ .Values.controllers.arangodb.containers.main.image.tag }}'
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -u
            trap 'exit 0' TERM INT
            provision() {
              arangosh \
                --server.endpoint tcp://127.0.0.1:8529 \
                --server.username root \
                --server.password @ARANGO_ROOT_PASSWORD@ \
                --console.history false \
                --quiet \
                --javascript.execute-string "$(cat <<'JS'
            const users = require('@arangodb/users');
            const env = require('internal').env;
            const name = env.ARANGODB_DATABASE;
            const user = env.ARANGODB_USERNAME;
            const password = env.ARANGODB_PASSWORD;
            if (!name || !user || !password) {
              throw new Error('ARANGODB_DATABASE, ARANGODB_USERNAME and ARANGODB_PASSWORD must be set');
            }
            if (user === 'root') {
              print('app-user: the application connects as root, nothing to provision');
            } else {
              if (!db._databases().includes(name)) {
                db._createDatabase(name);
                print('app-user: created database ' + name);
              }
              if (users.exists(user)) {
                users.update(user, password, true);
              } else {
                users.save(user, password, true);
              }
              users.grantDatabase(user, name, 'rw');
              users.grantCollection(user, name, '*', 'rw');
              users.grantDatabase(user, '_system', 'none');
              print('app-user: ' + user + ' has rw on ' + name + ' and no access to _system');
            }
            JS
            )"
            }
            until provision; do
              echo "app-user: provisioning failed, retrying in 15s"
              sleep 15 &
              wait $!
            done
            while :; do
              sleep 3600 &
              wait $!
            done
        env:
          ARANGODB_DATABASE: '{{ tpl .Values.controllers.backend.containers.main.env.ARANGODB_DATABASE $ }}'
          ARANGODB_USERNAME: '{{ tpl .Values.controllers.backend.containers.main.env.ARANGODB_USERNAME $ }}'
          # Both optional: a missing key must never stop the database pod; the
          # script then logs and retries.
          ARANGODB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: kamerplanter-secrets
                key: ARANGODB_PASSWORD
                optional: true
          ARANGO_ROOT_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.database.arangodb.rootPasswordSecret }}'
                key: ARANGO_ROOT_PASSWORD
                optional: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 256Mi
    statefulset:
      volumeClaimTemplates:
        - name: data
          accessMode: ReadWriteOnce
          size: 5Gi
          annotations:
            helm.sh/resource-policy: keep
          # The database volume belongs to arangod alone, not to `app-user`
          # (#2126). The claim template itself is unchanged.
          advancedMounts:
            main:
              - path: /var/lib/arangodb3

  # -- #2122 ArangoDB backup CronJob — configured through the top-level
  # ``backup`` block; ``enabled`` renders to "true" or "" (see the storage
  # persistence for why not "false").
  arangodb-backup:
    enabled: '{{ if .Values.backup.enabled }}true{{ end }}'
    type: cronjob
    cronjob:
      schedule: '{{ .Values.backup.schedule }}'
      concurrencyPolicy: Forbid
      successfulJobsHistory: 3
      failedJobsHistory: 3
      backoffLimit: 2
      activeDeadlineSeconds: 7200
    pod:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    initContainers:
      dump:
        image:
          repository: arangodb
          # The database's own tag (client == server version); Renovate bumps
          # the arangodb controller above and this follows.
          tag: '{{ .Values.controllers.arangodb.containers.main.image.tag }}'
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            arangodump \
              --server.endpoint "tcp://${ARANGODB_HOST}:${ARANGODB_PORT}" \
              --server.username "${ARANGODB_USERNAME}" \
              --server.password @ARANGODB_PASSWORD@ \
              --server.database "${ARANGODB_DATABASE}" \
              --include-system-collections true \
              --compress-output true \
              --output-directory "/backup/${stamp}"
            printf '%s\n' "${stamp}" > /backup/STAMP
        env:
          # The application's own connection — whatever account the backend
          # uses, the backup uses.
          ARANGODB_HOST: '{{ tpl .Values.controllers.backend.containers.main.env.ARANGODB_HOST $ }}'
          ARANGODB_PORT: '{{ tpl .Values.controllers.backend.containers.main.env.ARANGODB_PORT $ }}'
          ARANGODB_DATABASE: '{{ tpl .Values.controllers.backend.containers.main.env.ARANGODB_DATABASE $ }}'
          ARANGODB_USERNAME: '{{ tpl .Values.controllers.backend.containers.main.env.ARANGODB_USERNAME $ }}'
          ARANGODB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: kamerplanter-secrets
                key: ARANGODB_PASSWORD
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
    containers:
      main:
        image:
          repository: rclone/rclone
          tag: "1.75.1"
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            # The dump holds personal data; it leaves the node with the upload
            # and is never left behind in a finished pod's volume.
            trap 'rm -rf /backup/*' EXIT
            stamp="$(cat /backup/STAMP)"
            dest="backup:${BACKUP_S3_BUCKET}/${BACKUP_S3_PREFIX}"
            rclone copy "/backup/${stamp}" "${dest}/${stamp}"
            printf '%s\n' "${stamp}" | rclone rcat "${dest}/LATEST"
            echo "backup ${stamp} uploaded"
            if [ "${BACKUP_RETENTION_DAYS}" -gt 0 ]; then
              cutoff="$(date -u -d "@$(( $(date -u +%s) - BACKUP_RETENTION_DAYS * 86400 ))" +%Y%m%dT%H%M%SZ)"
              rclone lsf --dirs-only "${dest}" | sed 's#/$##' | while read -r old; do
                case "${old}" in
                  [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]T[0-9][0-9][0-9][0-9][0-9][0-9]Z) ;;
                  *) continue ;;
                esac
                if [ "${old}" != "${stamp}" ] && [ "${old}" \< "${cutoff}" ]; then
                  rclone purge "${dest}/${old}"
                  echo "backup ${old} expired (older than ${BACKUP_RETENTION_DAYS} days)"
                fi
              done
            fi
        env:
          HOME: /tmp
          RCLONE_CONFIG: /tmp/rclone.conf
          BACKUP_S3_BUCKET: '{{ .Values.backup.s3.bucket }}'
          BACKUP_S3_PREFIX: '{{ .Values.backup.s3.prefix }}'
          BACKUP_RETENTION_DAYS: '{{ .Values.backup.retentionDays }}'
          # rclone remote "backup:" configured entirely from the environment.
          RCLONE_CONFIG_BACKUP_TYPE: s3
          RCLONE_CONFIG_BACKUP_PROVIDER: '{{ .Values.backup.s3.provider }}'
          RCLONE_CONFIG_BACKUP_ENDPOINT: '{{ .Values.backup.s3.endpointUrl }}'
          RCLONE_CONFIG_BACKUP_REGION: '{{ .Values.backup.s3.region }}'
          RCLONE_CONFIG_BACKUP_FORCE_PATH_STYLE: '{{ .Values.backup.s3.forcePathStyle }}'
          RCLONE_CONFIG_BACKUP_SERVER_SIDE_ENCRYPTION: '{{ .Values.backup.s3.serverSideEncryption }}'
          RCLONE_CONFIG_BACKUP_SSE_KMS_KEY_ID: '{{ .Values.backup.s3.kmsKeyId }}'
          # The bucket must exist; the backup key needs no CreateBucket right.
          RCLONE_CONFIG_BACKUP_NO_CHECK_BUCKET: "true"
          RCLONE_CONFIG_BACKUP_ENV_AUTH: "false"
          RCLONE_CONFIG_BACKUP_ACCESS_KEY_ID:
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.backup.s3.credentialsRef.secretName }}'
                key: '{{ .Values.backup.s3.credentialsRef.accessKeyIdKey }}'
          RCLONE_CONFIG_BACKUP_SECRET_ACCESS_KEY:
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.backup.s3.credentialsRef.secretName }}'
                key: '{{ .Values.backup.s3.credentialsRef.secretAccessKeyKey }}'
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi

  celery-worker:
    type: deployment
    replicas: 1
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: 0
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # celery-worker mounts the same backend-attachments PVC as backend
        # (thumbnails + DSGVO erasure writes) — fsGroup:1000 required, else the
        # volume mounts root:root and the uid-1000 process can't write.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    containers:
      main:
        image:
          repository: ghcr.io/nolte/kamerplanter-backend
          tag: latest
          pullPolicy: IfNotPresent
        command: ["celery"]
        args: ["-A", "app.tasks", "worker", "--loglevel=info", "--concurrency=2"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        envFrom:
          # kamerplanter-secrets also carries INTERNAL_SERVICE_TOKEN (AP-4,
          # INF-S1/S2): the shared M2M secret sent to the knowledge-/inference-
          # service. It arrives automatically via envFrom, so no explicit env
          # entry is needed here.
          - secret: kamerplanter-secrets
        env:
          ARANGODB_HOST: kamerplanter-arangodb
          ARANGODB_PORT: "8529"
          ARANGODB_DATABASE: kamerplanter
          # #2126 — the application account, provisioned by the arangodb
          # `app-user` container; see `database.arangodb.appUsername`.
          ARANGODB_USERNAME: '{{ .Values.database.arangodb.appUsername }}'
          REDIS_URL: redis://kamerplanter-valkey:6379/0
          # #777 — optional Sentry-protocol error tracking. Empty DSN => the SDK
          # is never initialised and the process is unchanged, so this block is
          # safe to ship enabled-by-absence. Set SENTRY_DSN in the ArgoCD
          # valuesObject (or via kamerplanter-secrets) to switch it on; the DSN
          # carries only a public ingest key, not a credential.
          # SENTRY_ENVIRONMENT must come from the closed vocabulary the alert
          # rules filter on: development | e2e | staging | production.
          SENTRY_DSN: ""
          SENTRY_ENVIRONMENT: "production"
          # Set to the image tag the deployment rolls out, so a regression is
          # attributable to the release that introduced it.
          SENTRY_RELEASE: ""
          SENTRY_SAMPLE_RATE: "1.0"
          # NetworkPolicy caveat: the external-egress rule below deliberately
          # EXCLUDES the RFC1918 ranges, so a self-hosted tracker on a private
          # address is unreachable until the operator adds an explicit egress
          # rule for it. Events would be dropped silently — the SDK does not
          # surface a blocked connection. Enabling the DSN is therefore two
          # changes, not one.
          # NFR-013 — the worker generates thumbnails (§8.2) and runs the DSGVO
          # storage erasure (§6.2), so it MUST see the same backend + volume as
          # the backend pod: these lines are the backend's, verbatim (#2124).
          STORAGE_BACKEND: '{{ .Values.storage.backend }}'
          STORAGE_LOCAL_FS_ROOT: '{{ .Values.storage.localFs.root }}'
          STORAGE_MAX_FILE_SIZE_MB: '{{ .Values.storage.maxFileSizeMb }}'
          STORAGE_PRESIGN_TTL_SECONDS: '{{ .Values.storage.presignTtlSeconds }}'
          STORAGE_VIRUS_SCAN_ENABLED: '{{ .Values.storage.virusScan.enabled }}'
          STORAGE_VIRUS_SCAN_ENDPOINT: '{{ .Values.storage.virusScan.endpoint }}'
          STORAGE_S3_ENDPOINT_URL: '{{ if eq .Values.storage.backend "s3" }}{{ .Values.storage.s3.endpointUrl }}{{ end }}'
          STORAGE_S3_REGION: '{{ if eq .Values.storage.backend "s3" }}{{ .Values.storage.s3.region }}{{ end }}'
          STORAGE_S3_BUCKET: '{{ if eq .Values.storage.backend "s3" }}{{ .Values.storage.s3.bucket }}{{ end }}'
          STORAGE_S3_KMS_KEY_ID: '{{ if eq .Values.storage.backend "s3" }}{{ .Values.storage.s3.kmsKeyId }}{{ end }}'
          STORAGE_S3_USE_PATH_STYLE: '{{ .Values.storage.s3.usePathStyle }}'
          STORAGE_S3_FORCE_TLS: '{{ .Values.storage.s3.forceTls }}'
          STORAGE_S3_ALLOW_PRIVATE_ENDPOINT: '{{ .Values.storage.s3.allowPrivateEndpoint }}'
          STORAGE_S3_ACCESS_KEY_ID:
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.storage.s3.credentialsRef.secretName }}'
                key: '{{ .Values.storage.s3.credentialsRef.accessKeyIdKey }}'
                optional: true
          STORAGE_S3_SECRET_ACCESS_KEY:
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.storage.s3.credentialsRef.secretName }}'
                key: '{{ .Values.storage.s3.credentialsRef.secretAccessKeyKey }}'
                optional: true
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["celery", "-A", "app.tasks", "inspect", "ping", "--timeout", "5"]
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 3
          readiness:
            enabled: false
        # The worker does the same in-memory Pillow image decoding as the
        # backend (thumbnail generation §8.2), so 512Mi OOMKills it under load.
        # Match the backend's 2Gi headroom.
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 2Gi

  celery-beat:
    type: deployment
    replicas: 1
    strategy: Recreate
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    containers:
      main:
        image:
          repository: ghcr.io/nolte/kamerplanter-backend
          tag: latest
          pullPolicy: IfNotPresent
        command: ["celery"]
        args: ["-A", "app.tasks", "beat", "--loglevel=info", "--schedule=/tmp/celery-beat/celerybeat-schedule"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        envFrom:
          # kamerplanter-secrets also carries INTERNAL_SERVICE_TOKEN (AP-4,
          # INF-S1/S2): the shared M2M secret sent to the knowledge-/inference-
          # service. It arrives automatically via envFrom, so no explicit env
          # entry is needed here.
          - secret: kamerplanter-secrets
        env:
          ARANGODB_HOST: kamerplanter-arangodb
          ARANGODB_PORT: "8529"
          ARANGODB_DATABASE: kamerplanter
          # #2126 — the application account, provisioned by the arangodb
          # `app-user` container; see `database.arangodb.appUsername`.
          ARANGODB_USERNAME: '{{ .Values.database.arangodb.appUsername }}'
          REDIS_URL: redis://kamerplanter-valkey:6379/0
          # #777 — optional Sentry-protocol error tracking. Empty DSN => the SDK
          # is never initialised and the process is unchanged, so this block is
          # safe to ship enabled-by-absence. Set SENTRY_DSN in the ArgoCD
          # valuesObject (or via kamerplanter-secrets) to switch it on; the DSN
          # carries only a public ingest key, not a credential.
          # SENTRY_ENVIRONMENT must come from the closed vocabulary the alert
          # rules filter on: development | e2e | staging | production.
          SENTRY_DSN: ""
          SENTRY_ENVIRONMENT: "production"
          # Set to the image tag the deployment rolls out, so a regression is
          # attributable to the release that introduced it.
          SENTRY_RELEASE: ""
          SENTRY_SAMPLE_RATE: "1.0"
          # NetworkPolicy caveat: the external-egress rule below deliberately
          # EXCLUDES the RFC1918 ranges, so a self-hosted tracker on a private
          # address is unreachable until the operator adds an explicit egress
          # rule for it. Events would be dropped silently — the SDK does not
          # surface a blocked connection. Enabling the DSN is therefore two
          # changes, not one.
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["sh", "-c", "test -f /tmp/celery-beat/celerybeat-schedule"]
              initialDelaySeconds: 30
              periodSeconds: 60
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

  # -- VectorDB (REQ-029-A — PostgreSQL + pgvector store for DINOv2 recognition).
  # Disabled by default; the operator enables it (controllers.vectordb.enabled,
  # service.vectordb.enabled, persistence.vectordb-data.enabled,
  # networkpolicies.vectordb.enabled) in the ArgoCD valuesObject together with
  # the inference-service. Modelled on the ``arangodb`` statefulset above.
  vectordb:
    enabled: false
    type: statefulset
    replicas: 1
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
    containers:
      main:
        image:
          repository: ghcr.io/nolte/kamerplanter-vectordb
          tag: latest
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
          POSTGRES_DB: kamerplanter_vectors
          POSTGRES_USER: postgres
          PGDATA: /var/lib/postgresql/data/pgdata
          # POSTGRES_PASSWORD is NEVER inlined here — the operator sets this one
          # key in ``kamerplanter-secrets``. Pulled by secretKeyRef (scoped to
          # the single key, no envFrom of the whole Secret); the inference
          # service derives its VECTORDB_PASSWORD from the same key.
          POSTGRES_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: kamerplanter-secrets
                key: POSTGRES_PASSWORD
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["pg_isready", "-U", "postgres"]
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["pg_isready", "-U", "postgres"]
              initialDelaySeconds: 15
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 5
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    statefulset:
      volumeClaimTemplates:
        - name: data
          accessMode: ReadWriteOnce
          size: 5Gi
          annotations:
            helm.sh/resource-policy: keep
          globalMounts:
            - path: /var/lib/postgresql/data

  # -- Inference Service (REQ-029-A — DINOv2 embedding + pgvector match, CPU-only,
  # model baked at build). Disabled by default; the operator enables it together
  # with the vectordb (controllers.inference-service.enabled,
  # service.inference-service.enabled, networkpolicies.inference-service.enabled).
  # INFERENCE_SERVICE_ENABLED is set in GitOps, not here — and it MUST be set,
  # together with INFERENCE_SERVICE_URL (INTERNAL_SERVICE_TOKEN comes from
  # kamerplanter-secrets), on BOTH the backend AND the celery-worker (#1753):
  # the backend writes user contributions to the index, the worker runs the
  # scheduled Art. 17 erasure that must delete them. A worker without the flag
  # holds every erasure while contributions are on record.
  inference-service:
    enabled: false
    type: deployment
    replicas: 1
    strategy: Recreate
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    containers:
      main:
        image:
          repository: ghcr.io/nolte/kamerplanter-inference-service
          tag: latest
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        env:
          VECTORDB_HOST: kamerplanter-vectordb
          VECTORDB_PORT: "5432"
          VECTORDB_DATABASE: kamerplanter_vectors
          VECTORDB_USERNAME: postgres
          # Single DB-password secret key: the operator sets ONLY
          # ``POSTGRES_PASSWORD`` in ``kamerplanter-secrets`` (PostgreSQL's
          # mandated env name, consumed by the vectordb container). The inference
          # service reads its own ``VECTORDB_PASSWORD`` from that same key via
          # secretKeyRef — never inlined, and scoped to just this one key (no
          # envFrom of the whole Secret).
          VECTORDB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: kamerplanter-secrets
                key: POSTGRES_PASSWORD
          # AP-4 (INF-S2): shared M2M service token. The backend/celery pods
          # receive the same key via envFrom of kamerplanter-secrets; here it is
          # pulled by scoped secretKeyRef (never inlined). The operator sets
          # INTERNAL_SERVICE_TOKEN once in kamerplanter-secrets (openssl rand
          # -hex 32). Without it the service refuses to start (fail-fast).
          INTERNAL_SERVICE_TOKEN:
            valueFrom:
              secretKeyRef:
                name: kamerplanter-secrets
                key: INTERNAL_SERVICE_TOKEN
          MODEL_PATH: /app/models/dinov2
          # #777 — optional Sentry-protocol error tracking. Empty DSN => the SDK
          # is never initialised and the process is unchanged, so this block is
          # safe to ship enabled-by-absence. Set SENTRY_DSN in the ArgoCD
          # valuesObject (or via kamerplanter-secrets) to switch it on; the DSN
          # carries only a public ingest key, not a credential.
          # SENTRY_ENVIRONMENT must come from the closed vocabulary the alert
          # rules filter on: development | e2e | staging | production.
          SENTRY_DSN: ""
          SENTRY_ENVIRONMENT: "production"
          # Set to the image tag the deployment rolls out, so a regression is
          # attributable to the release that introduced it.
          SENTRY_RELEASE: ""
          SENTRY_SAMPLE_RATE: "1.0"
          # NetworkPolicy caveat: the external-egress rule below deliberately
          # EXCLUDES the RFC1918 ranges, so a self-hosted tracker on a private
          # address is unreachable until the operator adds an explicit egress
          # rule for it. Events would be dropped silently — the SDK does not
          # surface a blocked connection. Enabling the DSN is therefore two
          # changes, not one.
          MODEL_NAME: dinov2_vits14
          MODEL_DIM: "384"
          INPUT_SIZE: "224"
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: &inference-port 8000
              initialDelaySeconds: 15
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 10
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ready
                port: *inference-port
              initialDelaySeconds: 15
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 30
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi

  # -- TimescaleDB (optional — disabled by default, enable via values override)
  # timescaledb:

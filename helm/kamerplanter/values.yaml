# -- NFR-013 Object-storage configuration (§4.1, §10).
#
# This block is the operator-facing source of truth for the storage backend.
# The bjw-s common chart consumes ``controllers``/``persistence`` literally
# (values.yaml is not templated), so the concrete wiring lives there:
#   * ``STORAGE_*`` env vars on the backend + celery-worker controllers
#   * the ``backend-uploads`` PVC mounted at ``storage.localFs.root`` (local-fs)
# Keep this block and that wiring in sync when changing the backend.
#
# SECRETS (NFR-013 §4.1): the S3 access key / secret are NEVER placed in
# values.yaml, a ConfigMap or Git. They are resolved from a Secret produced by
# the External Secrets Operator (``s3.credentialsRef``) and injected via
# ``envFrom`` — see the commented example on the backend controller.
storage:
  backend: local-fs   # local-fs | s3
  maxFileSizeMb: 25
  presignTtlSeconds: 900
  virusScan:
    enabled: false
    endpoint: ""

  localFs:
    root: /data/attachments
    pvc:
      size: 20Gi
      # ReadWriteMany is required once the backend runs with >1 replica AND the
      # celery-worker shares the volume (thumbnail generation). With a single
      # backend replica + single worker on the same node, ReadWriteOnce is fine
      # but limits horizontal scaling — prefer RWX on a CSI that supports it
      # (Longhorn, NFS, CephFS).
      accessMode: ReadWriteOnce
      storageClass: ""   # "" = cluster default StorageClass

  s3:
    endpointUrl: https://s3.eu-central-1.amazonaws.com
    region: eu-central-1
    bucket: kamerplanter-prod
    usePathStyle: false
    forceTls: true
    kmsKeyId: ""
    # External Secrets Operator reference — the operator syncs the upstream
    # secret store into a Kubernetes Secret with these keys. NEVER inline the
    # values here (NFR-013 §4.1).
    credentialsRef:
      secretName: storage-s3-credentials
      accessKeyIdKey: AWS_ACCESS_KEY_ID
      secretAccessKeyKey: AWS_SECRET_ACCESS_KEY

# -- Default pod-level security context applied to all controllers (SEC-M-004)
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

controllers:
  backend:
    type: deployment
    replicas: 1
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: 0
    pod:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
    containers:
      main:
        image:
          repository: ghcr.io/nolte/kamerplanter-backend
          tag: latest
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        envFrom:
          - secret: kamerplanter-secrets
        env:
          ARANGODB_HOST: kamerplanter-arangodb
          ARANGODB_PORT: "8529"
          ARANGODB_DATABASE: kamerplanter
          ARANGODB_USERNAME: root
          REDIS_URL: redis://kamerplanter-valkey:6379/0
          CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://localhost:8080"]'
          DEBUG: "false"
          MDNS_ENABLED: "false"  # mDNS is LAN-only, disable in K8s
          # REQ-029 Plant identification (Phase 1 — Pl@ntNet-first). All optional:
          # without an API key the feature is disabled and all camera UI is hidden.
          # PLANTNET_API_KEY must be supplied via a Secret (never hard-coded here),
          # e.g. through envFrom/secret injection — see §6.2 of REQ-029.
          IDENTIFICATION_PRIMARY_ADAPTER: "plantnet"
          IDENTIFICATION_CONFIDENCE_AUTO_ACCEPT: "0.85"
          IDENTIFICATION_CONFIDENCE_MIN_SHOW: "0.10"
          IDENTIFICATION_MAX_IMAGE_SIZE_MB: "5"
          # NFR-013 Object storage (§4.1). Defaults target the local-fs backend
          # whose root MUST match the backend-uploads PVC mount below. Switch to
          # s3 by setting STORAGE_BACKEND=s3 + the STORAGE_S3_* values and adding
          # the credentials via envFrom from the ESO-synced Secret (see comment).
          STORAGE_BACKEND: "local-fs"
          STORAGE_LOCAL_FS_ROOT: /data/attachments
          STORAGE_MAX_FILE_SIZE_MB: "25"
          STORAGE_PRESIGN_TTL_SECONDS: "900"
          STORAGE_VIRUS_SCAN_ENABLED: "false"
          # -- S3 backend (uncomment + set STORAGE_BACKEND=s3 to enable):
          # STORAGE_S3_ENDPOINT_URL: https://s3.eu-central-1.amazonaws.com
          # STORAGE_S3_REGION: eu-central-1
          # STORAGE_S3_BUCKET: kamerplanter-prod
          # STORAGE_S3_USE_PATH_STYLE: "false"
          # STORAGE_S3_FORCE_TLS: "true"
          # STORAGE_S3_KMS_KEY_ID: ""
          # -- S3 credentials come ONLY from the External Secrets Operator —
          # never inline them here (NFR-013 §4.1). Provide a Secret named
          # ``storage-s3-credentials`` (keys STORAGE_S3_ACCESS_KEY_ID /
          # STORAGE_S3_SECRET_ACCESS_KEY) and reference it via envFrom:
          #   envFrom:
          #     - secret: kamerplanter-secrets
          #     - secret: storage-s3-credentials
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v1/health/live
                port: &backend-port 8000
              initialDelaySeconds: 15
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v1/health/ready
                port: *backend-port
              initialDelaySeconds: 10
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi

  frontend:
    type: deployment
    replicas: 1
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: 0
    pod:
      securityContext:
        runAsUser: 101
        runAsGroup: 101
    initContainers:
      init-runtime-config:
        image:
          repository: ghcr.io/nolte/kamerplanter-frontend
          tag: latest
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        command: ["sh", "-c"]
        args:
          - |
            cat <<EOF > /runtime-config/runtime-config.js
            window.__RUNTIME_CONFIG__ = {
              KAMERPLANTER_MODE: "${KAMERPLANTER_MODE:-full}"
            };
            EOF
        env:
          KAMERPLANTER_MODE:
            value: "full"
    containers:
      main:
        image:
          repository: ghcr.io/nolte/kamerplanter-frontend
          tag: latest
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        env:
          VITE_BACKEND_URL: "http://kamerplanter-backend:8000"
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: &frontend-port 80
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: *frontend-port
              initialDelaySeconds: 5
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi

  arangodb:
    type: statefulset
    replicas: 1
    pod:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
    containers:
      main:
        image:
          repository: arangodb
          tag: "3.12.9"
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        envFrom:
          - secret: kamerplanter-secrets
        env: {}
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8529
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8529
              initialDelaySeconds: 15
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 5
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
    statefulset:
      volumeClaimTemplates:
        - name: data
          accessMode: ReadWriteOnce
          size: 5Gi
          annotations:
            helm.sh/resource-policy: keep
          globalMounts:
            - path: /var/lib/arangodb3

  celery-worker:
    type: deployment
    replicas: 1
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: 0
    pod:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
    containers:
      main:
        image:
          repository: ghcr.io/nolte/kamerplanter-backend
          tag: latest
          pullPolicy: IfNotPresent
        command: ["celery"]
        args: ["-A", "app.tasks", "worker", "--loglevel=info", "--concurrency=2"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        envFrom:
          - secret: kamerplanter-secrets
        env:
          ARANGODB_HOST: kamerplanter-arangodb
          ARANGODB_PORT: "8529"
          ARANGODB_DATABASE: kamerplanter
          ARANGODB_USERNAME: root
          REDIS_URL: redis://kamerplanter-valkey:6379/0
          # NFR-013 — the worker generates thumbnails (§8.2) and runs the DSGVO
          # storage erasure (§6.2), so it MUST see the same backend + volume as
          # the backend pod. Keep these in sync with the backend controller.
          STORAGE_BACKEND: "local-fs"
          STORAGE_LOCAL_FS_ROOT: /data/attachments
          STORAGE_MAX_FILE_SIZE_MB: "25"
          # For the s3 backend, add the same STORAGE_S3_* vars + an envFrom on
          # the ESO-synced ``storage-s3-credentials`` Secret (see backend).
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["celery", "-A", "app.tasks", "inspect", "ping", "--timeout", "5"]
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 3
          readiness:
            enabled: false
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

  celery-beat:
    type: deployment
    replicas: 1
    strategy: Recreate
    pod:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
    containers:
      main:
        image:
          repository: ghcr.io/nolte/kamerplanter-backend
          tag: latest
          pullPolicy: IfNotPresent
        command: ["celery"]
        args: ["-A", "app.tasks", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        envFrom:
          - secret: kamerplanter-secrets
        env:
          ARANGODB_HOST: kamerplanter-arangodb
          ARANGODB_PORT: "8529"
          ARANGODB_DATABASE: kamerplanter
          ARANGODB_USERNAME: root
          REDIS_URL: redis://kamerplanter-valkey:6379/0
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["sh", "-c", "test -f /tmp/celerybeat-schedule"]
              initialDelaySeconds: 30
              periodSeconds: 60
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

  # -- VectorDB (REQ-029-A — PostgreSQL + pgvector store for DINOv2 recognition).
  # Disabled by default; the operator enables it (controllers.vectordb.enabled,
  # service.vectordb.enabled, persistence.vectordb-data.enabled,
  # networkpolicies.vectordb.enabled) in the ArgoCD valuesObject together with
  # the inference-service. Modelled on the ``arangodb`` statefulset above.
  vectordb:
    enabled: false
    type: statefulset
    replicas: 1
    pod:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
    containers:
      main:
        image:
          repository: ghcr.io/nolte/kamerplanter-vectordb
          tag: latest
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
          POSTGRES_DB: kamerplanter_vectors
          POSTGRES_USER: postgres
          PGDATA: /var/lib/postgresql/data/pgdata
          # POSTGRES_PASSWORD is NEVER inlined here — the operator sets this one
          # key in ``kamerplanter-secrets``. Pulled by secretKeyRef (scoped to
          # the single key, no envFrom of the whole Secret); the inference
          # service derives its VECTORDB_PASSWORD from the same key.
          POSTGRES_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: kamerplanter-secrets
                key: POSTGRES_PASSWORD
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["pg_isready", "-U", "postgres"]
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["pg_isready", "-U", "postgres"]
              initialDelaySeconds: 15
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 5
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    statefulset:
      volumeClaimTemplates:
        - name: data
          accessMode: ReadWriteOnce
          size: 5Gi
          annotations:
            helm.sh/resource-policy: keep
          globalMounts:
            - path: /var/lib/postgresql/data

  # -- Inference Service (REQ-029-A — DINOv2 embedding + pgvector match, CPU-only,
  # model baked at build). Disabled by default; the operator enables it together
  # with the vectordb (controllers.inference-service.enabled,
  # service.inference-service.enabled, networkpolicies.inference-service.enabled).
  # INFERENCE_SERVICE_ENABLED on the backend is set in GitOps, not here.
  inference-service:
    enabled: false
    type: deployment
    replicas: 1
    strategy: Recreate
    pod:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
    containers:
      main:
        image:
          repository: ghcr.io/nolte/kamerplanter-inference-service
          tag: latest
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        env:
          VECTORDB_HOST: kamerplanter-vectordb
          VECTORDB_PORT: "5432"
          VECTORDB_DATABASE: kamerplanter_vectors
          VECTORDB_USERNAME: postgres
          # Single DB-password secret key: the operator sets ONLY
          # ``POSTGRES_PASSWORD`` in ``kamerplanter-secrets`` (PostgreSQL's
          # mandated env name, consumed by the vectordb container). The inference
          # service reads its own ``VECTORDB_PASSWORD`` from that same key via
          # secretKeyRef — never inlined, and scoped to just this one key (no
          # envFrom of the whole Secret).
          VECTORDB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: kamerplanter-secrets
                key: POSTGRES_PASSWORD
          MODEL_PATH: /app/models/dinov2
          MODEL_NAME: dinov2_vits14
          MODEL_DIM: "384"
          INPUT_SIZE: "224"
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: &inference-port 8000
              initialDelaySeconds: 15
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 10
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ready
                port: *inference-port
              initialDelaySeconds: 15
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 30
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi

  # -- TimescaleDB (optional — disabled by default, enable via values override)
  # timescaledb:
  #   type: statefulset
  #   replicas: 1
  #   pod:
  #     securityContext:
  #       runAsUser: 999
  #       runAsGroup: 999
  #       fsGroup: 999
  #   containers:
  #     main:
  #       image:
  #         repository: timescale/timescaledb
  #         tag: "2.17.2-pg16"
  #         pullPolicy: IfNotPresent
  #       securityContext:
  #         allowPrivilegeEscalation: false
  #         capabilities:
  #           drop: ["ALL"]
  #       env:
  #         POSTGRES_DB: kamerplanter_sensors
  #         POSTGRES_USER: postgres
  #         POSTGRES_PASSWORD: changeme
  #       probes:
  #         liveness:
  #           enabled: true
  #           custom: true
  #           spec:
  #             exec:
  #               command: ["pg_isready", "-U", "postgres"]
  #             initialDelaySeconds: 30
  #             periodSeconds: 10
  #             timeoutSeconds: 5
  #             failureThreshold: 5
  #         readiness:
  #           enabled: true
  #           custom: true
  #           spec:
  #             exec:
  #               command: ["pg_isready", "-U", "postgres"]
  #             initialDelaySeconds: 15
  #             periodSeconds: 5
  #             timeoutSeconds: 3
  #             failureThreshold: 5
  #       resources:
  #         requests:
  #           cpu: 250m
  #           memory: 512Mi
  #         limits:
  #           cpu: "1"
  #           memory: 1Gi
  #   statefulset:
  #     volumeClaimTemplates:
  #       - name: data
  #         accessMode: ReadWriteOnce
  #         size: 10Gi
  #         globalMounts:
  #           - path: /var/lib/postgresql/data

  # -- VectorDB (optional — PostgreSQL + pgvector for AI/RAG, disabled by default)
  # vectordb:
  #   type: statefulset
  #   replicas: 1
  #   pod:
  #     securityContext:
  #       runAsUser: 999
  #       runAsGroup: 999
  #       fsGroup: 999
  #   containers:
  #     main:
  #       image:
  #         repository: kamerplanter-vectordb
  #         tag: latest
  #         pullPolicy: IfNotPresent
  #       securityContext:
  #         allowPrivilegeEscalation: false
  #         capabilities:
  #           drop: ["ALL"]
  #       env:
  #         POSTGRES_DB: kamerplanter_vectors
  #         POSTGRES_USER: postgres
  #         POSTGRES_PASSWORD: changeme
  #       probes:
  #         liveness:
  #           enabled: true
  #           custom: true
  #           spec:
  #             exec:
  #               command: ["pg_isready", "-U", "postgres"]
  #             initialDelaySeconds: 30
  #             periodSeconds: 10
  #             timeoutSeconds: 5
  #             failureThreshold: 5
  #         readiness:
  #           enabled: true
  #           custom: true
  #           spec:
  #             exec:
  #               command: ["pg_isready", "-U", "postgres"]
  #             initialDelaySeconds: 15
  #             periodSeconds: 5
  #             timeoutSeconds: 3
  #             failureThreshold: 5
  #       resources:

<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kamerplanter - Plant Lifecycle Management" />
    <title>Kamerplanter</title>
    <style>
      /* #612 — boot splash. Translations are code-split and awaited before the
         app mounts, so this neutral, text-free spinner covers the brief boot
         window instead of a blank screen. React replaces #root on mount. */
      #app-boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        #app-boot-splash {
          background: #121212;
        }
      }
      #app-boot-splash::after {
        content: '';
        width: 40px;
        height: 40px;
        border: 4px solid rgba(46, 125, 50, 0.25);
        border-top-color: #2e7d32;
        border-radius: 50%;
        animation: app-boot-spin 0.8s linear infinite;
      }
      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-boot-splash::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-boot-splash" role="status" aria-label="Loading"></div>
    </div>
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

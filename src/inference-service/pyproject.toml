[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kamerplanter-inference-service"
version = "1.0.0"
description = "DINOv2 embedding extraction and pgvector species matching for Kamerplanter"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",
    "onnxruntime>=1.20.0",
    "numpy>=2.0.0",
    "pillow>=11.0.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "structlog>=24.0.0",
    # #777 — optional error tracking; no-op without SENTRY_DSN. It was installed
    # into both images through requirements.txt while being absent from this
    # table (#1374 measured the drift); with the lock generated from here, the
    # declaration is the only way it reaches the image.
    "sentry-sdk[fastapi]>=2.20.0",
]

[project.optional-dependencies]
# REQ-038 PlantCV phenotype pipeline (MPL-2.0). Kept OUT of the base image to
# avoid pulling OpenCV/Matplotlib into every deployment; installed only where the
# phenotype panel is wanted. The service degrades gracefully when it is absent
# (PhenotypeEngine.is_available() -> False). PlantCV is used unmodified.
cv = [
    "plantcv>=4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    # Test-only: the API tests drive the FastAPI app through Starlette's
    # TestClient, which needs an httpx transport. httpx is NOT a runtime
    # dependency of this service (unlike knowledge-service), so it lives here in
    # the dev extra rather than in [project].dependencies (#1058).
    "httpx>=0.28.0",
]

# Dockerfile build-stage inputs, locked with everything else (#1374) rather than
# installed unpinned inside the image. `build` carries the ONNX export toolchain
# the `model-export` stage runs (torch/torchvision come from the CPU-only
# PyTorch index declared below — the GPU build pulls multi-GB CUDA wheels that
# exhaust the CI runner disk); `dev` carries the hot-reload watcher the `dev`
# image target needs. Both are PEP 735 dependency groups rather than entries in
# the extras above, so neither reaches the production image.
[dependency-groups]
build = [
    "torch",
    "torchvision",
    "onnx",
    "onnxscript",
]
dev = [
    "watchfiles",
]

# CPU-only wheels for the export stage. `explicit = true` keeps this index out
# of the resolution of every other package: only what [tool.uv.sources] points
# here is fetched from it.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008", "A003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Non-strict mypy baseline (SCR-001). The backend runs mypy strict=true; this
# service starts non-strict but still checks the bodies of untyped functions,
# so type-shape defects surface. strict adoption is a recorded follow-up.
[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_configs = true

# Runtime dependencies ship inline types and are checked for real locally; the
# isolated pre-commit venv (mypy only) does not install them, so their imports
# are ignored there rather than reported as missing.
[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "numpy.*",
    "PIL.*",
    "psycopg.*",
    "psycopg_pool.*",
    "pydantic.*",
    "pydantic_settings.*",
    "sentry_sdk.*",
    "structlog.*",
]
ignore_missing_imports = true

# Optional, lazily-imported ML dependencies (REQ-038 phenotype / ONNX runtime)
# that publish no type stubs; ignored in every environment.
[[tool.mypy.overrides]]
module = ["onnxruntime.*", "plantcv.*"]
ignore_missing_imports = true

[tool.uv]
# The lock toolchain (NFR-009 section 2.3), pinned EXACT to the same value as
# src/backend/pyproject.toml: Renovate's pep621 processor resolves the uv it
# relocks with from here, the Dockerfile copies `ghcr.io/astral-sh/uv:<same>`
# and CI installs `uv==<same>`. renovate.json5 groups all references into one
# `uv toolchain` pull request, so the reading and the relocking side never age
# apart (#1296 class).
required-version = "==0.12.15"

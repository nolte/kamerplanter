[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kp-vectordb"
version = "1.0.0"
description = "Shared pgvector connection pool + migration runner for Kamerplanter microservices"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.setuptools.packages.find]
include = ["kp_vectordb*"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]

# Non-strict mypy baseline (SCR-001). The backend runs mypy strict=true; this
# shared lib starts non-strict but still checks the bodies of untyped functions,
# so type-shape defects surface. strict adoption is a recorded follow-up.
[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_configs = true

# Runtime dependencies ship inline types and are checked for real locally; the
# isolated pre-commit venv (mypy only) does not install them, so their imports
# are ignored there rather than reported as missing.
[[tool.mypy.overrides]]
module = ["psycopg.*", "psycopg_pool.*", "structlog.*"]
ignore_missing_imports = true

[tool.uv]
# The lock toolchain (NFR-009 section 2.3), pinned EXACT to the same value as
# src/backend/pyproject.toml: Renovate's pep621 processor resolves the uv it
# relocks with from here, and CI installs `uv==<same>` through
# `astral-sh/setup-uv` with `version-file:`. renovate.json5 groups all references
# into one `uv toolchain` pull request, so the reading and the relocking side
# never age apart (#1296 class). This library ships no image of its own, so the
# Dockerfile leg the four service pins have is simply absent here (#1464).
required-version = "==0.12.19"

[tool.pytest.ini_options]
testpaths = ["tests"]

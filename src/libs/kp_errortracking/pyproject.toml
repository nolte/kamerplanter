[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kp-errortracking"
version = "1.0.0"
description = "Shared optional Sentry-protocol error-tracking wiring for Kamerplanter services"
requires-python = ">=3.14"
# sentry-sdk is deliberately NOT a dependency of this package: the module imports
# it lazily and degrades to a no-op when it is absent, so a service that has not
# adopted error tracking yet still imports this package cleanly. Each consuming
# service declares the SDK in its own dependency set.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "sentry-sdk>=2.20.0",
]

[tool.setuptools.packages.find]
include = ["kp_errortracking*"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]

# Mirrors the kp_vectordb baseline (SCR-001): non-strict, but the bodies of
# untyped functions are still checked so type-shape defects surface.
[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["sentry_sdk.*"]
ignore_missing_imports = true

[tool.uv]
# The lock toolchain (NFR-009 section 2.3), pinned EXACT to the same value as
# src/backend/pyproject.toml: Renovate's pep621 processor resolves the uv it
# relocks with from here, and CI installs `uv==<same>` through
# `astral-sh/setup-uv` with `version-file:`. renovate.json5 groups all references
# into one `uv toolchain` pull request, so the reading and the relocking side
# never age apart (#1296 class). This library ships no image of its own, so the
# Dockerfile leg the four service pins have is simply absent here (#1464).
required-version = "==0.12.19"

[tool.pytest.ini_options]
testpaths = ["tests"]

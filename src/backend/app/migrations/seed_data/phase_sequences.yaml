      - phase_name: dormancy
        sequence_order: 0
        override_duration_days: 90
        is_terminal: false
        allows_harvest: false
        is_recurring: true
      - phase_name: flowering
        sequence_order: 1
        override_duration_days: 60
        is_terminal: false
        allows_harvest: false

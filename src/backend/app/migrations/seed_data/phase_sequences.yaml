        allows_harvest: false
      - phase_name: ripening
        sequence_order: 3
        override_duration_days: 30
        is_terminal: false
        allows_harvest: true
      - phase_name: senescence
        sequence_order: 4
        override_duration_days: 14
        is_terminal: true
        allows_harvest: false

  # -- 8. Full Fruit Cycle Perennial --
  - name: perennial_full_fruit
    display_name: Full Fruit Cycle Perennial
    display_name_de: Voller Fruchtzyklus (mehrjährig)
    description: Multi-season fruit cycle with all phases including ripening
    description_de: Mehrsaisonaler Fruchtzyklus mit allen Phasen inkl. Reife
    cycle_type: perennial
    is_repeating: true
    cycle_restart_entry_order: 0
    tags: [perennial, outdoor, fruit, full-cycle]
    is_system: true
    entries:
      - phase_name: dormancy
        sequence_order: 0
        is_terminal: false
        allows_harvest: false
        is_recurring: true
      - phase_name: sprouting
        sequence_order: 1
        is_terminal: false
        allows_harvest: false
        is_recurring: true
      - phase_name: vegetative
        sequence_order: 2
        is_terminal: false
        allows_harvest: false
        is_recurring: true
      - phase_name: flowering
        sequence_order: 3
        is_terminal: false
        allows_harvest: false
        is_recurring: true
      - phase_name: fruiting
        sequence_order: 4
        is_terminal: false
        allows_harvest: false
        is_recurring: true
      - phase_name: ripening
        sequence_order: 5
        is_terminal: false
        allows_harvest: true
        is_recurring: true
      - phase_name: senescence
        sequence_order: 6
        is_terminal: true
        allows_harvest: false
        is_recurring: true

  # -- 9. Biennial with Vernalization --
  - name: biennial_vernalization
    display_name: Biennial with Vernalization
    display_name_de: Zweijährige mit Vernalisation
    description: Biennial crop requiring cold period before flowering
    description_de: Zweijährige Pflanze die Kälteperiode vor der Blüte benötigt
    cycle_type: biennial
    is_repeating: false
    tags: [biennial, outdoor, vernalization]
    is_system: true
    entries:
      - phase_name: germination
        sequence_order: 0
        is_terminal: false
        allows_harvest: false
      - phase_name: seedling
        sequence_order: 1
        is_terminal: false
        allows_harvest: false
      - phase_name: vegetative
        sequence_order: 2
        is_terminal: false
        allows_harvest: false
      - phase_name: dormancy
        sequence_order: 3
        override_duration_days: 90
        is_terminal: false
        allows_harvest: false
      - phase_name: flowering
        sequence_order: 4
        is_terminal: false
        allows_harvest: false
      - phase_name: ripening
        sequence_order: 5
        is_terminal: true
        allows_harvest: true

  # -- 10. Early-Harvest Perennial --
  - name: perennial_early_harvest
    display_name: Early-Harvest Perennial

  # -- 12. Runner-Propagated Perennial (E4) --
  # Generic cyclic template for vegetatively propagated stauden (strawberry is the
  # flagship). establishment (once) → sprouting → vegetative → flowering → fruiting →
  # ripening → dormancy(terminal). The cycle RESTARTS at ``sprouting`` (entry_order 1),
  # NOT at the once-only establishment (entry_order 0) — ADR-006 E4: the annual
  # re-entry of a runner-propagated staude is dormancy → sprouting → vegetative, never
  # "germination". ``dormancy`` is terminal, so the perennial cycle-restart path fires
  # from it back to sprouting.
  - name: perennial_runner
    display_name: Runner-Propagated Perennial
    display_name_de: Ausläufer-vermehrte Staude
    description: Vegetatively (runner/division) propagated perennial with a once-only establishment and a yearly sprouting restart (strawberry)
    description_de: Vegetativ (Ausläufer/Teilung) vermehrte Staude mit einmaliger Etablierung und jährlichem Austrieb-Neustart (Erdbeere)
    cycle_type: perennial
    is_repeating: true
    cycle_restart_entry_order: 1
    dormancy_required: true
    photoperiod_type: day_neutral
    tags: [perennial, runner, fruit, cyclic]
    is_system: true
    entries:
      - phase_name: establishment
        sequence_order: 0
        override_duration_days: 45
        is_terminal: false
        allows_harvest: false
        is_recurring: false
      - phase_name: sprouting
        sequence_order: 1
        override_duration_days: 21
        is_terminal: false
        allows_harvest: false
        is_recurring: true
      - phase_name: vegetative
        sequence_order: 2
        override_duration_days: 45
        is_terminal: false
        allows_harvest: false
        is_recurring: true
      - phase_name: flowering
        sequence_order: 3
        override_duration_days: 25
        is_terminal: false
        allows_harvest: false
        is_recurring: true
      - phase_name: fruiting
        sequence_order: 4
        override_duration_days: 35
        is_terminal: false
        allows_harvest: false
        is_recurring: true
      - phase_name: ripening
        sequence_order: 5
        override_duration_days: 20
        is_terminal: false
        allows_harvest: true
        is_recurring: true
      - phase_name: dormancy
        sequence_order: 6
        override_duration_days: 120
        is_terminal: true
        allows_harvest: false
        is_recurring: true

  # -- 13. Evergreen Foliage Perennial (audit #576 — largest indoor perennial cohort) --
  # Tropical foliage houseplants (Araceae, Ficus, Marantaceae, …) with continuous
  # growth, no true dormancy and only an occasional bloom. Restarts at ``active_growth``
  # (entry_order 1) after the once-only establishment; ``maintenance`` is terminal so the
  # cycle loops instead of terminating on the annual indoor_default like before.
  - name: evergreen_foliage_perennial
    display_name: Evergreen Foliage Perennial
    display_name_de: Immergrüne Blattschmuck-Staude
    description: Tropical foliage houseplants with continuous growth, no dormancy, occasional bloom
    description_de: Tropische Blattschmuckpflanzen mit Dauerwachstum, ohne Ruhe, seltener Blüte
    cycle_type: perennial
    is_repeating: true
    cycle_restart_entry_order: 1
    dormancy_required: false
    photoperiod_type: day_neutral
    tags: [indoor, foliage, evergreen, perennial, cyclic]
    is_system: true
    entries:
      - phase_name: establishment
        sequence_order: 0
        override_duration_days: 60
        is_terminal: false
        allows_harvest: false
        is_recurring: false
      - phase_name: active_growth
        sequence_order: 1
        override_duration_days: 180
        is_terminal: false
        allows_harvest: false
        is_recurring: true
      - phase_name: flowering
        sequence_order: 2
        override_duration_days: 30
        is_terminal: false
        allows_harvest: false
        is_recurring: true
      - phase_name: maintenance
        sequence_order: 3
        override_duration_days: 180
        is_terminal: true
        allows_harvest: false
        is_recurring: true

  # -- 14. Evergreen Woody Subshrub with Winter Rest (WP-8, #565) --
  # Hardy Mediterranean/temperate evergreen subshrubs (lavender, rosemary, sage,
  # thyme, boxwood) that keep their foliage through winter but enter a genuine
  # winter dormancy (growth arrest at low temperature) — distinct from the
  # tropical ``evergreen_foliage_perennial`` (no dormancy) and from the deciduous
  # ``perennial_standard`` (leaf-fall senescence). No senescence entry: evergreens
  # do not drop their canopy. Restarts at ``dormancy`` (entry_order 0).
  - name: evergreen_subshrub_rest
    display_name: Evergreen Subshrub (Winter Rest)
    display_name_de: Immergrüner Halbstrauch (Winterruhe)
    description: Evergreen woody subshrubs with a true winter dormancy but no leaf-fall senescence (lavender, rosemary, sage, thyme, boxwood)
    description_de: Immergrüne verholzende Halbsträucher mit echter Winterruhe, aber ohne Blattfall-Seneszenz (Lavendel, Rosmarin, Salbei, Thymian, Buchsbaum)
    cycle_type: perennial
    is_repeating: true
    cycle_restart_entry_order: 0
    dormancy_required: true
    photoperiod_type: day_neutral
    tags: [perennial, outdoor, evergreen, subshrub, rest]
    is_system: true
    entries:
      - phase_name: dormancy
        sequence_order: 0
        override_duration_days: 120
        is_terminal: false
        allows_harvest: false
        is_recurring: true
      - phase_name: vegetative
        sequence_order: 1
        override_duration_days: 150
        is_terminal: false
        allows_harvest: true
        is_recurring: true
      - phase_name: flowering
        sequence_order: 2
        override_duration_days: 60
        is_terminal: true
        allows_harvest: true
        is_recurring: true


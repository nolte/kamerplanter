# yaml-language-server: $schema=./schemas/phase_sequences.schema.yaml
# Phase definitions and reusable phase sequences.
# 13 unique phase types, 13 sequence patterns (10 outdoor + 1 indoor default
# + 2 cyclic perennial templates: perennial_runner, evergreen_foliage_perennial).

phase_definitions:
  - name: germination
    display_name: Germination
    display_name_de: Keimung
    description: Seed germination and initial root emergence
    description_de: Samenkeimung und erste Wurzelbildung
    typical_duration_days: 7
    stress_tolerance: low
    watering_interval_days: 1
    illustration: brand/illustrations/phases/timeline-kami-phase-germination.svg
    tags: [seed, annual]
    is_system: true

  - name: seedling
    display_name: Seedling
    display_name_de: Jungpflanze
    description: Young plant establishment after germination
    description_de: Jungpflanzenentwicklung nach der Keimung
    typical_duration_days: 14
    stress_tolerance: low
    watering_interval_days: 2
    illustration: brand/illustrations/phases/timeline-kami-phase-seedling.svg
    tags: [young, establishment]
    is_system: true

  - name: vegetative
    display_name: Vegetative
    display_name_de: Vegetative Phase
    description: Active leaf and stem growth
    description_de: Aktives Blatt- und Triebwachstum
    typical_duration_days: 45
    stress_tolerance: medium
    watering_interval_days: 3
    illustration: brand/illustrations/phases/timeline-kami-phase-vegetative.svg
    tags: [growth, main]
    is_system: true

  - name: flowering
    display_name: Flowering
    display_name_de: Blüte
    description: Flower development and pollination
    description_de: Blütenentwicklung und Bestäubung
    typical_duration_days: 30
    stress_tolerance: medium
    watering_interval_days: 2
    illustration: brand/illustrations/phases/timeline-kami-phase-flowering.svg
    tags: [bloom, reproductive]
    is_system: true

  - name: fruiting
    display_name: Fruiting
    display_name_de: Fruchtentwicklung
    description: Fruit development after pollination
    description_de: Fruchtentwicklung nach Bestäubung
    typical_duration_days: 75
    stress_tolerance: medium
    watering_interval_days: 2
    illustration: brand/illustrations/phases/timeline-kami-phase-harvest.svg
    tags: [fruit, reproductive]
    is_system: true

  - name: ripening
    display_name: Ripening
    display_name_de: Reife
    description: Final maturation before harvest
    description_de: Endreife vor der Ernte
    typical_duration_days: 14
    stress_tolerance: high
    watering_interval_days: 2
    illustration: brand/illustrations/phases/timeline-kami-phase-ripening.svg
    tags: [mature, pre-harvest]
    is_system: true

  - name: dormancy
    display_name: Dormancy
    display_name_de: Winterruhe
    description: Winter rest period for perennial plants
    description_de: Winterruheperiode für mehrjährige Pflanzen
    typical_duration_days: 120
    stress_tolerance: high
    watering_interval_days: 14
    illustration: brand/illustrations/phases/timeline-kami-phase-dormancy.svg
    tags: [rest, winter, perennial]
    is_system: true

  - name: sprouting
    display_name: Sprouting
    display_name_de: Austrieb
    description: New growth emergence after dormancy
    description_de: Neuaustrieb nach der Ruhephase
    typical_duration_days: 21
    stress_tolerance: low
    watering_interval_days: 3
    illustration: brand/illustrations/phases/timeline-kami-phase-seedling.svg
    tags: [spring, emergence, perennial]
    is_system: true

  - name: senescence
    display_name: Senescence
    display_name_de: Blattfall
    description: Leaf fall and preparation for dormancy
    description_de: Blattfall und Vorbereitung auf die Ruhephase
    typical_duration_days: 21
    stress_tolerance: high
    watering_interval_days: 7
    illustration: brand/illustrations/phases/timeline-kami-phase-senescence.svg
    tags: [autumn, decline, terminal]
    is_system: true

  - name: flushing
    display_name: Flushing
    display_name_de: Spülung
    description: Pre-harvest flush with plain water
    description_de: Vorerntesspülung mit klarem Wasser
    typical_duration_days: 14
    stress_tolerance: high
    watering_interval_days: 1
    illustration: brand/illustrations/phases/timeline-kami-phase-flushing.svg
    tags: [pre-harvest, indoor]
    is_system: true

  # -- E4: split of germination into once-only establishment + cyclic sprouting --
  # ``establishment`` is the ONE-TIME rooting/anchoring of a vegetatively propagated
  # perennial (strawberry runner, division, cutting); it is never revisited on a
  # seasonal restart (``is_recurring: false``). The yearly re-entry is ``sprouting``
  # (ADR-006 E4). This makes "germination" botanically correct for runner-propagated
  # stauden — the annual cycle restarts at sprouting/vegetative, not germination.
  - name: establishment
    display_name: Establishment
    display_name_de: Etablierung
    description: One-time rooting/establishment of a vegetatively propagated perennial (runner, division, cutting)
    description_de: Einmalige Bewurzelung/Etablierung einer vegetativ vermehrten Staude (Ausläufer, Teilung, Steckling)
    typical_duration_days: 45
    stress_tolerance: low
    watering_interval_days: 4
    illustration: brand/illustrations/phases/timeline-kami-phase-seedling.svg
    tags: [establishment, perennial, vegetative-propagation]
    is_system: true

  - name: active_growth
    display_name: Active Growth
    display_name_de: Aktivwachstum
    description: Main active growth window of an evergreen/foliage perennial between flushes
    description_de: Hauptwachstumsfenster einer immergrünen Blattschmuck-Staude zwischen den Schüben
    typical_duration_days: 180
    stress_tolerance: medium
    watering_interval_days: 5
    illustration: brand/illustrations/phases/timeline-kami-phase-vegetative.svg
    tags: [growth, perennial, evergreen]
    is_system: true

  - name: maintenance
    display_name: Maintenance Growth
    display_name_de: Erhaltungswachstum
    description: Steady-state maintenance growth of an evergreen foliage plant between flushes
    description_de: Stationäres Erhaltungswachstum einer immergrünen Blattschmuckpflanze zwischen den Schüben
    typical_duration_days: 180
    stress_tolerance: medium
    watering_interval_days: 5
    illustration: brand/illustrations/phases/timeline-kami-phase-vegetative.svg
    tags: [indoor, foliage, maintenance, perennial]
    is_system: true

  # ── Fine-typing phases (REQ-003 D9–D12, audit #576 / #616) ──────────────
  # CAM/succulent rest, clonal-monocarp (Kindel), photoperiodic-ornamental
  # induction and palm/fern/geophyte phases. ``active_growth``, ``establishment``
  # and ``maintenance`` are reused from above (not redefined here).

  # -- CAM / succulent rest phases (D9) --
  - name: winter_rest
    display_name: Winter Rest
    display_name_de: Winterruhe (kühl-trocken)
    description: Cool, dry winter rest for CAM succulents; biologically distinct from woody dormancy
    description_de: Kühl-trockene Winterruhe der CAM-Sukkulenten; biologisch verschieden von Gehölz-Dormanz
    typical_duration_days: 120
    stress_tolerance: high
    watering_interval_days: 30
    tags: [cam, succulent, rest, winter]
    is_system: true

  - name: summer_rest
    display_name: Summer Rest
    display_name_de: Sommerruhe
    description: Aestivation rest for summer-dormant geophytes and mesembs
    description_de: Sommerruhe sommerruhender Geophyten und Mittagsblumengewächse
    typical_duration_days: 90
    stress_tolerance: high
    watering_interval_days: 30
    tags: [succulent, rest, summer]
    is_system: true

  - name: winter_hull_change
    display_name: Hull Change
    display_name_de: Hüllblattwechsel
    description: Lithops leaf-pair renewal during rest; watering must stop
    description_de: Blattpaar-Erneuerung bei Lithops während der Ruhe; Gießen muss ruhen
    typical_duration_days: 60
    stress_tolerance: high
    watering_interval_days: 45
    tags: [lithops, mesemb, rest]
    is_system: true

  # -- Clonal monocarp phases (D10) --
  - name: juvenile
    display_name: Juvenile
    display_name_de: Jugendphase
    description: Pre-reproductive vegetative maturation of monocarpic rosette plants
    description_de: Vorreproduktive vegetative Reifung monokarper Rosettenpflanzen
    typical_duration_days: 365
    stress_tolerance: medium
    watering_interval_days: 7
    tags: [monocarp, juvenile]
    is_system: true

  - name: mature
    display_name: Mature
    display_name_de: Reife (blühfähig)
    description: Reproductively mature rosette ready for terminal flowering
    description_de: Reproduktiv reife Rosette, bereit zur terminalen Blüte
    typical_duration_days: 180
    stress_tolerance: medium
    watering_interval_days: 7
    tags: [monocarp, mature]
    is_system: true

  - name: pup_establishment
    display_name: Pup Establishment
    display_name_de: Kindel-Etablierung
    description: Clonal offset (pup) rooting after the mother rosette dies; new instance continuation
    description_de: Bewurzelung des klonalen Kindels nach Absterben der Mutterrosette; Fortführung als neue Instanz
    typical_duration_days: 90
    stress_tolerance: low
    watering_interval_days: 5
    tags: [monocarp, pup, clonal]
    is_system: true

  # -- Photoperiodic ornamental induction phases (D11) --
  - name: short_day_induction
    display_name: Short-Day Induction
    display_name_de: Kurztag-Induktion
    description: Photoperiodic flower induction under short days (< critical day length)
    description_de: Photoperiodische Blühinduktion unter Kurztag (< kritische Tageslänge)
    typical_duration_days: 42
    stress_tolerance: medium
    watering_interval_days: 4
    tags: [photoperiod, short-day, induction]
    is_system: true

  - name: bract_coloring
    display_name: Bract Coloring
    display_name_de: Hochblattfärbung
    description: Bract/inflorescence coloring following short-day induction (poinsettia, Kalanchoe)
    description_de: Hochblatt-/Blütenstandsfärbung nach Kurztag-Induktion (Weihnachtsstern, Kalanchoe)
    typical_duration_days: 35
    stress_tolerance: medium
    watering_interval_days: 4
    tags: [photoperiod, ornamental, bract]
    is_system: true

  # -- Palm / fern / fine geophyte phases (D12) --
  - name: young_palm
    display_name: Young Palm
    display_name_de: Jungpalme
    description: Juvenile palm stage before trunk formation
    description_de: Juveniles Palmenstadium vor der Stammbildung
    typical_duration_days: 365
    stress_tolerance: medium
    watering_interval_days: 6
    tags: [palm, juvenile]
    is_system: true

  - name: shaft_growth
    display_name: Shaft Growth
    display_name_de: Stammwachstum
    description: Ongoing frond and trunk growth of established evergreen palms
    description_de: Fortlaufendes Wedel- und Stammwachstum etablierter immergrüner Palmen
    typical_duration_days: 300
    stress_tolerance: medium
    watering_interval_days: 6
    tags: [palm, growth]
    is_system: true

  - name: leaf_phase
    display_name: Frond Phase
    display_name_de: Wedelphase
    description: Active frond growth of ferns (no flowering; spore-based reproduction)
    description_de: Aktives Wedelwachstum der Farne (keine Blüte; sporenbasierte Vermehrung)
    typical_duration_days: 210
    stress_tolerance: medium
    watering_interval_days: 3
    tags: [fern, frond]
    is_system: true

  - name: rest_phase
    display_name: Rest Phase
    display_name_de: Ruhephase
    description: Reduced-growth rest for ferns and evergreens over winter
    description_de: Wachstumsreduzierte Winterruhe für Farne und Immergrüne
    typical_duration_days: 90
    stress_tolerance: high
    watering_interval_days: 7
    tags: [fern, rest]
    is_system: true

  - name: sprout_formation
    display_name: Sprout Formation
    display_name_de: Austriebsbildung
    description: Bud/sprout formation of geophytes emerging from the storage organ
    description_de: Knospen-/Austriebsbildung der Geophyten aus dem Speicherorgan
    typical_duration_days: 21
    stress_tolerance: low
    watering_interval_days: 4
    tags: [geophyte, sprout]
    is_system: true

  - name: tuber_formation
    display_name: Tuber Formation
    display_name_de: Knollenbildung
    description: Storage-organ (tuber/corm/bulb) fill before senescence
    description_de: Auffüllung des Speicherorgans (Knolle/Korm/Zwiebel) vor der Seneszenz
    typical_duration_days: 45
    stress_tolerance: medium
    watering_interval_days: 5
    tags: [geophyte, storage]
    is_system: true

  - name: dry_storage
    display_name: Dry Storage
    display_name_de: Trockenlager
    description: Dormant dry storage of the geophyte storage organ (lifted or in situ)
    description_de: Trockene Ruhelagerung des Geophyten-Speicherorgans (ausgegraben oder in situ)
    typical_duration_days: 120
    stress_tolerance: high
    watering_interval_days: 45
    tags: [geophyte, storage, dormancy]
    is_system: true

phase_sequences:

  # -- 1. Standard Perennial --
  - name: perennial_standard
    display_name: Standard Perennial
    display_name_de: Standard Staude
    description: Standard perennial cycle with dormancy, sprouting, growth, bloom, and leaf fall
    description_de: Standard-Staudenzyklus mit Winterruhe, Austrieb, Wachstum, Blüte und Blattfall
    cycle_type: perennial
    is_repeating: true
    cycle_restart_entry_order: 0
    tags: [perennial, outdoor, standard]
    is_system: true
    entries:
      - phase_name: dormancy
        sequence_order: 0
        override_duration_days: 120
        is_terminal: false
        allows_harvest: false
        is_recurring: true
      - phase_name: sprouting
        sequence_order: 1
        is_terminal: false
        allows_harvest: false
        is_recurring: true
      - phase_name: vegetative
        sequence_order: 2
        override_duration_days: 60
        is_terminal: false
        allows_harvest: false
        is_recurring: true
      - phase_name: flowering
        sequence_order: 3
        is_terminal: false
        allows_harvest: false
        is_recurring: true
      - phase_name: senescence
        sequence_order: 4
        override_duration_days: 30
        is_terminal: true
        allows_harvest: false
        is_recurring: true


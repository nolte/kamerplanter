      - phase_name: dormancy
        sequence_order: 0
        override_duration_days: 120
        is_terminal: false
        allows_harvest: false
        is_recurring: true
      - phase_name: sprouting
        sequence_order: 1
        is_terminal: false
        allows_harvest: false
        is_recurring: true
      - phase_name: vegetative
        sequence_order: 2
        override_duration_days: 45
        is_terminal: false
        allows_harvest: false
        is_recurring: true
      - phase_name: flowering
        sequence_order: 3
        is_terminal: false
        allows_harvest: false
        is_recurring: true
      - phase_name: ripening
        sequence_order: 4
        override_duration_days: 30
        is_terminal: false
        allows_harvest: true
        is_recurring: true
      - phase_name: senescence
        sequence_order: 5
        override_duration_days: 21
        is_terminal: true
        allows_harvest: false
        is_recurring: true

  # -- 6. Winter-Flowering Perennial --
  - name: perennial_winter_flower
    display_name: Winter-Flowering Perennial
    display_name_de: Winterblühende Staude
    description: Plants that flower during or right after dormancy (Helleborus)
    description_de: Pflanzen die während oder direkt nach der Ruhezeit blühen (Christrose)
    cycle_type: perennial
    is_repeating: true
    cycle_restart_entry_order: 0
    tags: [perennial, outdoor, winter-flower]
    is_system: true

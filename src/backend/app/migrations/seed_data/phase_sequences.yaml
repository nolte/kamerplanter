    display_name_de: Einjährige Erntepflanze
    description: Annual crops grown for leaf/root harvest (lettuce, herbs)
    description_de: Einjährige Nutzpflanzen für Blatt-/Wurzelernte (Salat, Kräuter)
    cycle_type: annual
    is_repeating: false
    tags: [annual, outdoor, harvest, vegetable]
    is_system: true
    entries:
      - phase_name: germination
        sequence_order: 0
        is_terminal: false
        allows_harvest: false
      - phase_name: seedling
        sequence_order: 1
        is_terminal: false
        allows_harvest: false
      - phase_name: vegetative
        sequence_order: 2

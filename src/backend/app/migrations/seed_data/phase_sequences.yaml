        is_terminal: false
        allows_harvest: false
        is_recurring: true
      - phase_name: sprouting
        sequence_order: 1
        is_terminal: false
        allows_harvest: false
        is_recurring: true
      - phase_name: flowering
        sequence_order: 2
        is_terminal: false
        allows_harvest: false
        is_recurring: true
      - phase_name: fruiting
        sequence_order: 3
        override_duration_days: 90
        is_terminal: false
        allows_harvest: false
        is_recurring: true
      - phase_name: ripening
        sequence_order: 4
        override_duration_days: 30
        is_terminal: false
        allows_harvest: true
        is_recurring: true
      - phase_name: senescence
        sequence_order: 5
        override_duration_days: 21
        is_terminal: true
        allows_harvest: false
        is_recurring: true

  # -- 4. Annual Flower / Green Manure --
  - name: annual_flower
    display_name: Annual Flower / Green Manure
    display_name_de: Einjährige Blume / Gründüngung
    description: Annual plants grown for flowers or soil improvement
    description_de: Einjährige Pflanzen für Blumen oder Bodenverbesserung
    cycle_type: annual
    is_repeating: false
    tags: [annual, outdoor, flower]
    is_system: true
    entries:
      - phase_name: germination
        sequence_order: 0
        is_terminal: false
        allows_harvest: false
      - phase_name: seedling
        sequence_order: 1
        is_terminal: false
        allows_harvest: false
      - phase_name: vegetative
        sequence_order: 2
        override_duration_days: 30
        is_terminal: false
        allows_harvest: false
      - phase_name: flowering
        sequence_order: 3
        is_terminal: false
        allows_harvest: false
      - phase_name: senescence
        sequence_order: 4
        override_duration_days: 14
        is_terminal: true
        allows_harvest: false

  # -- 5. Perennial with Harvest Phase --
  - name: perennial_harvest_veg
    display_name: Perennial with Harvest Phase
    display_name_de: Staude mit Erntephase
    description: Perennials with a dedicated harvest window (asparagus, rhubarb)
    description_de: Stauden mit definierter Ernteperiode (Spargel, Rhabarber)
    cycle_type: perennial
    is_repeating: true
    cycle_restart_entry_order: 0
    tags: [perennial, outdoor, harvest, vegetable]
    is_system: true

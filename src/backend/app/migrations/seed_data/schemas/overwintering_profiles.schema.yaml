# JSON Schema for overwintering_profiles.yaml (REQ-022 §OverwinteringProfile)
# Species-level overwintering *templates* extracted from the plant Steckbriefe
# (spec/knowledge/plants/*.md §4.3). Generated by
# scripts/extract_overwintering_templates.py — mirrors OverwinteringProfileTemplate.
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "overwintering_profiles.schema.yaml"
title: "Overwintering Profile Templates Seed Data"
description: "Per-species overwintering knowledge (hardiness rating, winter/spring actions, winter-quarter conditions, tuber storage) used to seed instance profiles with species-accurate defaults."
type: object
additionalProperties: false

properties:
  overwintering_profiles:
    type: array
    items:
      $ref: "#/$defs/overwintering_profile_template"

$defs:
  overwintering_profile_template:
    type: object
    additionalProperties: false
    required:
      - _key
      - species_scientific_name
      - hardiness_rating
      - winter_action
    properties:
      _key:
        type: string
        description: "Species slug (matches the Steckbrief filename stem)."
        pattern: "^[a-z0-9_]+$"
      species_scientific_name:
        type: string
      species_key:
        type: [string, "null"]
        description: "Resolved at seed time from the species collection; null when unresolved."
      hardiness_zone_min:
        type: [string, "null"]
      hardiness_rating:
        type: string
        enum: [hardy, needs_protection, frost_free, dig_and_store]
      winter_action:
        type: string
        enum: [none, mulch, fleece, earth_up, move_indoors, dig_store, wrap]
      winter_action_month:
        type: [integer, "null"]
        minimum: 1
        maximum: 12
      spring_action:
        type: [string, "null"]
        enum: [uncover, move_outdoors, replant, prune, harden_off, null]
      spring_action_month:
        type: [integer, "null"]
        minimum: 1
        maximum: 12
      winter_quarter_temp_min:
        type: [number, "null"]
      winter_quarter_temp_max:
        type: [number, "null"]
      winter_quarter_light:
        type: [string, "null"]
        enum: [bright, semi_bright, dark, null]
      winter_watering:
        type: [string, "null"]
        enum: [none, minimal, reduced, normal, null]
      storage_medium:
        type: [string, "null"]
      storage_check_interval_days:
        type: [integer, "null"]
        minimum: 1
        maximum: 365
      tuber_status:
        type: [string, "null"]
        enum: [planted, growing, dig_pending, drying, stored, pre_sprouting, null]
      notes:
        type: [string, "null"]
      source:
        type: string

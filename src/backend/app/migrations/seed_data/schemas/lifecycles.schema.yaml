# JSON Schema for lifecycles_outdoor.yaml
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "lifecycles.schema.yaml"
title: "Lifecycle Seed Data"
description: "Schema for species lifecycle and growth phase definitions"
type: object

properties:
  lifecycles:
    type: array
    items:
      $ref: "#/$defs/lifecycle"

required: [lifecycles]
additionalProperties: false

$defs:
  lifecycle:
    type: object
    properties:
      scientific_name:
        type: string
        description: "Scientific name of the species (resolved to key at seed time)"
      cycle_type:
        type: string
        enum: [annual, biennial, perennial]
      typical_lifespan_years:
        type: [integer, "null"]
        minimum: 1
      dormancy_required:
        type: boolean
      vernalization_required:
        type: boolean
      vernalization_min_days:
        type: integer
        minimum: 1
      cycle_restart_phase_order:
        type: integer
        minimum: 1
      photoperiod_type:
        type: string
        enum: [short_day, long_day, day_neutral]
      critical_day_length_hours:
        type: number
        minimum: 0
        maximum: 24
      phase_sequence:
        type: string
        description: "Reference to a PhaseSequence by name"
      phases:
        type: array
        items:
          $ref: "#/$defs/growth_phase"
        minItems: 1
      # Optional explicit branching transitions between this lifecycle's phases
      # (referenced by phase name). Used e.g. for a stress-induced premature
      # vegetative -> bolting transition (REQ-003 E6).
      transition_rules:
        type: array
        items:
          $ref: "#/$defs/transition_rule"
    required: [scientific_name, cycle_type, dormancy_required, vernalization_required,
               photoperiod_type, phases]
    additionalProperties: false

  transition_rule:
    type: object
    properties:
      from_phase:
        $ref: "_defs.schema.yaml#/$defs/phase_name"
      to_phase:
        $ref: "_defs.schema.yaml#/$defs/phase_name"
      trigger_type:
        $ref: "_defs.schema.yaml#/$defs/transition_trigger_type"
      auto_transition_after_days:
        type: integer
        minimum: 1
      notification_before_days:
        type: integer
        minimum: 0
      priority:
        type: integer
      is_reversion:
        type: boolean
        description: "E3: controlled backward transition without cycle-restart semantics."
      is_premature:
        type: boolean
        description: "E6: stress-induced premature transition ending the harvest window early."
    required: [from_phase, to_phase]
    additionalProperties: false

  growth_phase:
    type: object
    properties:
      name:
        $ref: "_defs.schema.yaml#/$defs/phase_name"
      display_name:
        type: string
        description: "German display name"
      typical_duration_days:
        type: integer
        minimum: 1
      sequence_order:
        type: integer
        minimum: 1
      stress_tolerance:
        type: string
        enum: [low, medium, high]
      allows_harvest:
        type: boolean
      is_terminal:
        type: boolean
        description: "True if this is the last phase before cycle restart"
      is_recurring:
        type: boolean
        description: "True if this phase repeats in perennial cycles"
      # Optional environment targets
      vpd_target_min:
        type: number
        minimum: 0
      vpd_target_max:
        type: number
        minimum: 0
      temp_target_min:
        type: number
      temp_target_max:
        type: number
      humidity_target_min:
        type: number
        minimum: 0
        maximum: 100
      humidity_target_max:
        type: number
        minimum: 0
        maximum: 100
      ppfd_target:
        type: integer
        minimum: 0
      photoperiod_hours:
        type: number
        minimum: 0
        maximum: 24
    required: [name, display_name, typical_duration_days, sequence_order,
               stress_tolerance, allows_harvest, is_terminal]
    additionalProperties: false

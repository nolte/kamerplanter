# JSON Schema for plans.yaml (REQ-056 §13.2, #2142)
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "plans.schema.yaml"
title: "Plan Catalogue Seed Data"
description: "Seeded plans; a null limit means the instance setting, 0 means unlimited (storage, photos) or budget off (AI); maxima mirror LIMIT_MAXIMA in app/domain/models/plan.py"
type: object

properties:
  plans:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/plan"

required: [plans]
additionalProperties: false

$defs:
  plan:
    type: object
    properties:
      key:
        type: string
        pattern: "^[a-z][a-z0-9_-]{1,39}$"
      name:
        type: string
        minLength: 1
        maxLength: 100
      description:
        type: ["string", "null"]
        maxLength: 500
      is_default:
        type: boolean
      limits:
        type: object
        properties:
          members:
            type: ["integer", "null"]
            minimum: 1
            maximum: 1000000
          service_accounts:
            type: ["integer", "null"]
            minimum: 1
            maximum: 100000
          storage_mb:
            type: ["integer", "null"]
            minimum: 0
            maximum: 10000000
          photos_per_instance:
            type: ["integer", "null"]
            minimum: 0
            maximum: 100000
          ai_calls_per_user_day:
            type: ["integer", "null"]
            minimum: 0
            maximum: 10000000
          ai_calls_per_tenant_day:
            type: ["integer", "null"]
            minimum: 0
            maximum: 100000000
          ai_tokens_per_tenant_day:
            type: ["integer", "null"]
            minimum: 0
            maximum: 1000000000000
        additionalProperties: false
    required: [key, name, description, is_default, limits]
    additionalProperties: false

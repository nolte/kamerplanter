# JSON Schema for plant_info*.yaml and adventskalender.yaml (composite plant data)
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "plant_info.schema.yaml"
title: "Plant Info Seed Data"
description: "Composite schema for plant info documents that enrich species, add cultivars, growth phases, companion planting, and IPM data"
type: object

properties:
  new_families:
    type: array
    items:
      $ref: "#/$defs/botanical_family"
  new_species_family_map:
    type: object
    description: "Map of scientific_name -> family_name for new species"
    additionalProperties:
      type: string
  new_species:
    type: array
    items:
      $ref: "#/$defs/species"
  species_enrichment:
    type: object
    description: "Dictionary of scientific_name -> patch fields for existing species"
    additionalProperties:
      $ref: "#/$defs/species_enrichment"
  cultivars:
    type: object
    description: "Dictionary of species_name -> list of cultivar objects"
    additionalProperties:
      type: array
      items:
        $ref: "#/$defs/cultivar"
  growth_phases:
    type: object
    description: "Dictionary of species_name -> list of phase objects"
    additionalProperties:
      type: array
      items:
        $ref: "#/$defs/phase_entry"
  lifecycle_configs:
    type: object
    description: "Dictionary of species_name -> lifecycle configuration"
    additionalProperties:
      $ref: "#/$defs/lifecycle_config"
  companion_planting:
    $ref: "#/$defs/companion_planting_data"
  new_pests:
    type: array
    items:
      $ref: "#/$defs/pest"
  new_diseases:
    type: array
    items:
      $ref: "#/$defs/disease"
  new_treatments:
    type: array
    items:
      $ref: "#/$defs/treatment"
  pest_species_edges:
    oneOf:
      - type: array
        description: "Flat [pest, species] pairs."
        items:
          type: array
          prefixItems:
            - type: string
              description: "Pest scientific/common name"
            - type: string
              description: "Species scientific name"
          minItems: 2
          maxItems: 2
      - type: object
        description: "Species-keyed map → list of pest objects."
        additionalProperties:
          type: array
          items: { type: object }
  disease_species_edges:
    oneOf:
      - type: array
        description: "Flat [disease, species] pairs."
        items:
          type: array
          prefixItems:
            - type: string
              description: "Disease name"
            - type: string
              description: "Species scientific name"
          minItems: 2
          maxItems: 2
      - type: object
        description: "Species-keyed map → list of disease objects."
        additionalProperties:
          type: array
          items: { type: object }
  treatment_pest_edges:
    type: array
    items:
      type: array
      prefixItems:
        - type: string
          description: "Treatment name"
        - type: string
          description: "Pest scientific/common name"
      minItems: 2
      maxItems: 2
  treatment_disease_edges:
    type: array
    items:
      type: array
      prefixItems:
        - type: string
          description: "Treatment name"
        - type: string
          description: "Disease name"
      minItems: 2
      maxItems: 2

additionalProperties: false

$defs:
  botanical_family:
    type: object
    properties:
      name: { type: string }
      common_name_de: { type: string }
      common_name_en: { type: string }
      order: { type: string }
      typical_nutrient_demand:
        type: string
        enum: [heavy, medium, light]
      frost_tolerance:
        type: string
        enum: [sensitive, moderate, hardy, very_hardy]
      typical_root_depth:
        type: string
        enum: [shallow, medium, deep]
      typical_growth_forms:
        type: array
        items:
          type: string
          enum: [herb, shrub, subshrub, tree, vine, groundcover, grass, succulent, bulb_geophyte, fern, aquatic, epiphyte]
      common_pests:
        type: array
        items: { type: string }
      common_diseases:
        type: array
        items: { type: string }
      pollination_type:
        type: array
        items:
          type: string
          enum: [insect, wind, self]
      soil_ph_preference:
        type: object
        properties:
          min_ph: { type: number, minimum: 0, maximum: 14 }
          max_ph: { type: number, minimum: 0, maximum: 14 }
        required: [min_ph, max_ph]
      description: { type: string }
      rotation_category:
        type: string
        enum: [fruit, root, leaf, legume, allium, herb, fiber, ornamental, green_manure, cereal,
               brassica, composite, cucurbit, grain, permanent, vegetable]
    required: [name, common_name_de, common_name_en, order, typical_nutrient_demand,
               frost_tolerance, typical_root_depth, typical_growth_forms,
               pollination_type, soil_ph_preference, description, rotation_category]
    additionalProperties: false

  species:
    type: object
    properties:
      scientific_name: { type: string }
      common_names:
        type: array
        items: { type: string }
        minItems: 1
      genus: { type: string }
      growth_habit:
        type: string
        enum: [herb, shrub, subshrub, tree, vine, groundcover, grass, succulent, bulb_geophyte, fern, aquatic, epiphyte]
      root_type:
        type: string
        enum: [fibrous, taproot, tuberous, bulbous, corm]
      hardiness_zones:
        type: array
        items:
          type: string
          pattern: "^\\d{1,2}[ab]?$"
      native_habitat: { type: string }
      allelopathy_score:
        type: number
        minimum: -1
        maximum: 1
      base_temp:
        type: number
        minimum: 0
        maximum: 40
      frost_sensitivity:
        type: string
        enum: [sensitive, moderate, hardy, very_hardy]
      allows_harvest: { type: boolean }
      # ── Ernteverhalten (REQ-007, Plan WP-6) ──
      harvest_pattern:
        type: [string, "null"]
        enum: [single, continuous, perennial, null]
        description: "Lifetime harvest pattern — distinct from the per-event HarvestType."
      harvested_part:
        type: [string, "null"]
        enum: [fruit, seed, leaf, root, tuber, bulb, flower_bud, flower, stem, whole_plant, null]
        description: "Harvested plant part. Orthogonal to harvest_pattern."
      climacteric:
        type: [string, "null"]
        enum: [climacteric, non_climacteric, atypical, null]
        description: "Post-harvest ripening behaviour of fruit (third value for genuine borderline cases)."
      sowing_indoor_weeks_before_last_frost:
        type: [integer, "null"]
      sowing_outdoor_after_last_frost_days:
        type: [integer, "null"]
      direct_sow_months:
        type: array
        items: { type: integer, minimum: 1, maximum: 12 }
      harvest_months:
        type: array
        items: { type: integer, minimum: 1, maximum: 12 }
      bloom_months:
        type: array
        items: { type: integer, minimum: 1, maximum: 12 }
      container_suitable:
        type: string
        enum: ["yes", limited, "no"]
      recommended_container_volume_l: { type: string }
      min_container_depth_cm: { type: integer, minimum: 0 }
      mature_height_cm: { type: string }
      mature_width_cm: { type: string }
      spacing_cm: { type: [string, "null"] }
      indoor_suitable:
        type: string
        enum: ["yes", limited, "no"]
      balcony_suitable:
        type: string
        enum: ["yes", limited, "no"]
      greenhouse_recommended: { type: boolean }
      support_required: { type: boolean }
      nutrient_demand_level:
        type: string
        enum: [heavy_feeder, medium_feeder, light_feeder, nitrogen_fixer]
      plant_category:
        type: string
        enum: [indoor_houseplant, outdoor_ornamental, outdoor_vegetable, balcony_plant,
               succulent_cactus, tropical_foliage, orchid, herb, bulb_tuber]
        description: "Broad category for UI grouping"
      # ── Vermehrung (REQ-017) — preferred: structured per-method configs ──
      propagation_configs:
        type: array
        description: "Structured per-method propagation (REQ-017). Preferred over the flat propagation_* fields; timing/notes attach to the method, not the species."
        items:
          type: object
          properties:
            method:
              type: string
              enum: [seed, cutting, leaf_cutting, division, rhizome_division, bulb, bulbil,
                     tuber, offset, runner, grafting, layering, air_layering,
                     water_propagation, tissue_culture, spore, self_seeding]
            months:
              type: array
              items: { type: integer, minimum: 1, maximum: 12 }
            wood_stage:
              type: [string, "null"]
              enum: [softwood, semi_hardwood, hardwood, herbaceous, null]
            difficulty:
              type: [string, "null"]
              enum: [easy, moderate, difficult, null]
            notes:
              type: [string, "null"]
          required: [method]
      # ── Legacy flat propagation fields — still accepted, adapted on import ──
      propagation_methods:
        type: array
        description: "DEPRECATED flat list — use propagation_configs. Adapted on import (one config per method)."
        items:
          type: string
          enum: [seed, cutting, leaf_cutting, division, rhizome_division, bulb, bulbil,
                 tuber, offset, runner, grafting, layering, air_layering,
                 water_propagation, tissue_culture, spore, self_seeding]
      propagation_months:
        type: array
        description: "DEPRECATED flat timing — use propagation_configs[].months. Months (1–12) shared across methods on import."
        items: { type: integer, minimum: 1, maximum: 12 }
      propagation_notes:
        type: [string, "null"]
        description: "DEPRECATED flat notes — use propagation_configs[].notes. Attached to the first method on import."
      # ── Umgebungs-Physiologie (REQ-001 v4.2) ──
      photosynthesis_type:
        type: [string, "null"]
        enum: [c3, c4, cam, null]
        description: "Photosynthesis pathway as WUE/transpiration modifier ('cam' = inverted nocturnal stomata)."
      light_compensation_point_ppfd_min:
        type: [integer, "null"]
        minimum: 0
        description: "Lower LCP bound in µmol/m²/s (shade-adapted)."
      light_compensation_point_ppfd_max:
        type: [integer, "null"]
        minimum: 0
        description: "Upper LCP bound in µmol/m²/s (sun-adapted)."
      shade_tolerance:
        type: [string, "null"]
        enum: [deep_shade, shade, partial_shade, full_sun, null]
        description: "Qualitative shade/sun exposure for placement."
      effective_root_depth_cm:
        type: [integer, "null"]
        minimum: 0
        maximum: 500
        description: "Typical effective rooting depth for irrigation depth / crop steering."
      waterlogging_tolerance:
        type: [string, "null"]
        enum: [sensitive, moderate, tolerant, null]
        description: "Root-zone waterlogging/anoxia tolerance."
      salt_tolerance_class:
        type: [string, "null"]
        enum: [sensitive, moderately_sensitive, moderately_tolerant, tolerant, null]
        description: "Qualitative Maas-Hoffman salt tolerance class (S/MS/MT/T)."
      salt_tolerance_ece_threshold_ds_m:
        type: [number, "null"]
        minimum: 0
        description: "Maas-Hoffman threshold ECe in dS/m (= mS/cm), parameter 'a'."
      salt_tolerance_slope_pct:
        type: [number, "null"]
        minimum: 0
        description: "Maas-Hoffman yield-loss slope in %/dS/m, parameter 'b'."
      soil_ph_preference:
        type: object
        description: "Species-specific pH preference override of the BotanicalFamily default (REQ-004 micronutrient gating)."
        properties:
          min_ph: { type: number, minimum: 3, maximum: 9 }
          max_ph: { type: number, minimum: 3, maximum: 9 }
        required: [min_ph, max_ph]
      # ── Pflege & Gründüngung (REQ-001) ──
      green_manure_suitable:
        type: boolean
        description: "Whether the species is suitable as green manure / cover crop."
      pruning_type:
        type: [string, "null"]
        description: "Pruning strategy keyword (e.g. none, deadheading, rejuvenation)."
      pruning_months:
        type: array
        items: { type: integer, minimum: 1, maximum: 12 }
        description: "Recommended pruning months (1–12)."
      # ── Toxizität & Allergene (REQ-001) ──
      toxicity:
        $ref: "#/$defs/toxicity"
      allergen_info:
        $ref: "#/$defs/allergen_info"
      toxicity_severity:
        type: [string, "null"]
        description: "Flat legacy toxicity severity (low/moderate/high) — a DIFFERENT scale from
          toxicity.severity. Kept as an un-mapped passthrough; do not conflate with toxicity.severity."
      # ── Saatgut / Keimung (REQ-001, REQ-006) ──
      seed_profile:
        $ref: "#/$defs/seed_profile"
    required: [scientific_name, common_names, genus, growth_habit, root_type]
    additionalProperties: true

  species_enrichment:
    type: object
    description: "Partial species update — scientific_name is the key, all other fields are optional overrides"
    properties:
      scientific_name: { type: string, description: "Optional — normally supplied as the map key." }
      propagation_configs:
        type: array
        description: "Structured per-method propagation (REQ-017). Preferred over the flat propagation_* fields."
        items:
          type: object
          properties:
            method:
              type: string
              enum: [seed, cutting, leaf_cutting, division, rhizome_division, bulb, bulbil,
                     tuber, offset, runner, grafting, layering, air_layering,
                     water_propagation, tissue_culture, spore, self_seeding]
            months:
              type: array
              items: { type: integer, minimum: 1, maximum: 12 }
            wood_stage:
              type: [string, "null"]
              enum: [softwood, semi_hardwood, hardwood, herbaceous, null]
            difficulty:
              type: [string, "null"]
              enum: [easy, moderate, difficult, null]
            notes:
              type: [string, "null"]
          required: [method]
      propagation_methods:
        type: array
        description: "DEPRECATED flat list — use propagation_configs. Adapted on import."
        items:
          type: string
          enum: [seed, cutting, leaf_cutting, division, rhizome_division, bulb, bulbil,
                 tuber, offset, runner, grafting, layering, air_layering,
                 water_propagation, tissue_culture, spore, self_seeding]
      propagation_months:
        type: array
        description: "DEPRECATED flat timing — use propagation_configs[].months."
        items: { type: integer, minimum: 1, maximum: 12 }
      propagation_notes:
        type: [string, "null"]
        description: "DEPRECATED flat notes — use propagation_configs[].notes."
      toxicity:
        $ref: "#/$defs/toxicity"
      allergen_info:
        $ref: "#/$defs/allergen_info"
      toxicity_severity:
        type: [string, "null"]
        description: "Flat legacy toxicity severity passthrough (low/moderate/high)."
      seed_profile:
        $ref: "#/$defs/seed_profile"
    additionalProperties: true

  cultivar:
    type: object
    properties:
      # ── Fields mirrored 1:1 onto the Cultivar domain model (app/domain/models/species.py).
      #    Kept field-consistent with the model by test_cultivar_schema_model_field_consistency.
      #    NOTE: species_name is the seed-format map key; it resolves to the model's species_key. ──
      name: { type: string }
      species_name:
        type: string
        description: "Scientific name of the parent species (resolves to the model's species_key)."
      breeder: { type: [string, "null"] }
      breeding_year: { type: [integer, "null"] }
      patent_status: { type: string }
      traits:
        type: array
        description: >-
          Open-vocabulary cultivar descriptors (agronomic + ornamental, e.g.
          disease_resistant, compact, miniature, pink_flowers). Free-form by
          design — not a closed enum.
        items:
          type: string
      seed_type:
        type: string
        enum: [open_pollinated, f1_hybrid, clone, cultivar]
        description: "Reproduction/propagation type of the cultivar"
      days_to_maturity:
        type: [integer, "null"]
        minimum: 0
      dtm_reference:
        type: [string, "null"]
        enum: [direct_seed, transplant, null]
        description: "Reference point for days_to_maturity (REQ-007, WP-6)."
      bearing_start_year_min:
        type: [integer, "null"]
        minimum: 1
        maximum: 20
      bearing_start_year_max:
        type: [integer, "null"]
        minimum: 1
        maximum: 20
      disease_resistances:
        type: array
        description: "Mirrors Cultivar.disease_resistances (previously the drifted key 'resistance_to')."
        items: { type: string }
      watering_guide_override:
        type: [object, "null"]
        description: "Per-cultivar WateringGuide override; validated structurally by the Pydantic model on import."
      phase_watering_overrides:
        type: [object, "null"]
        description: "Per-phase watering interval overrides (phase_name → interval_days)."
        additionalProperties: { type: integer }
      # ── Free-form descriptive fields — intentionally NOT on the model (tolerated by additionalProperties). ──
      description: { type: string }
      cycle_type:
        type: string
        enum: [annual, biennial, perennial]
      photoperiod_type:
        type: string
        enum: [short_day, long_day, day_neutral]
      typical_yield: { type: string }
      flavor_profile: { type: string }
      flower_color: { type: string }
      fruit_color: { type: string }
      notes: { type: string }
      tags:
        type: array
        items: { type: string }
    required: [name]
    additionalProperties: true

  lifecycle_config:
    type: object
    properties:
      cycle_type:
        type: string
        enum: [annual, biennial, perennial]
      photoperiod_type:
        type: string
        enum: [short_day, long_day, day_neutral]
      typical_lifespan_years:
        type: [integer, "null"]
      dormancy_required: { type: boolean }
      vernalization_required: { type: boolean }
      vernalization_min_days:
        type: [integer, "null"]
      critical_day_length_hours:
        type: [number, "null"]
    required: [cycle_type, photoperiod_type]
    additionalProperties: false

  phase_entry:
    type: object
    properties:
      name:
        $ref: "_defs.schema.yaml#/$defs/phase_name"
      display_name: { type: string }
      duration_days: { type: integer, minimum: 1 }
      duration_days_min: { type: integer, minimum: 1 }
      duration_days_max: { type: integer, minimum: 1 }
      sequence_order: { type: integer, minimum: 1 }
      stress_tolerance:
        type: string
        enum: [low, medium, high]
      allows_harvest: { type: boolean }
      is_terminal: { type: boolean }
      requirement_profile:
        type: object
        additionalProperties: true
      nutrient_profile:
        type: object
        additionalProperties: true
    required: [name, sequence_order,
               stress_tolerance, allows_harvest, is_terminal]
    additionalProperties: false

  companion_planting_data:
    type: object
    properties:
      compatible:
        type: array
        items:
          oneOf:
            - type: array
              prefixItems:
                - type: string
                - type: string
                - type: number
                  minimum: 0
                  maximum: 1
              minItems: 3
              maxItems: 3
            - type: object
              properties:
                species_a: { type: string }
                species_b: { type: string }
                score: { type: number, minimum: 0, maximum: 1 }
                reason: { type: string }
              required: [species_a, species_b, score]
            - type: object
              properties:
                source: { type: string }
                target: { type: string }
                score: { type: number, minimum: 0, maximum: 1 }
                reason: { type: string }
              required: [source, target, score]
      incompatible:
        type: array
        items:
          oneOf:
            - type: object
              properties:
                species_a: { type: string }
                species_b: { type: string }
                reason: { type: string }
              required: [species_a, species_b, reason]
            - type: object
              properties:
                source: { type: string }
                target: { type: string }
                reason: { type: string }
                severity: { type: [string, number] }
              required: [source, target, reason]
    additionalProperties: false

  pest:
    type: object
    properties:
      scientific_name: { type: string }
      common_name: { type: string }
      pest_type:
        type: string
        enum: [insect, arachnid, gastropod, nematode, mammal]
      lifecycle_days: { type: integer, minimum: 1 }
      optimal_temp_min: { type: number }
      optimal_temp_max: { type: number }
      detection_difficulty:
        type: string
        enum: [easy, medium, hard]
      description: { type: string }
    required: [scientific_name, pest_type]
    additionalProperties: true

  disease:
    type: object
    properties:
      name: { type: string }
      scientific_name: { type: string }
      common_name: { type: string }
      pathogen_type:
        type: string
        enum: [fungal, bacterial, viral, physiological, oomycete, protist]
      symptoms:
        type: [array, string]
        items: { type: string }
      affected_parts:
        type: array
        items:
          type: string
          enum: [leaf, stem, root, flower, fruit]
      optimal_temp_min: { type: number }
      optimal_temp_max: { type: number }
      optimal_humidity_min: { type: number }
      optimal_humidity_max: { type: number }
    required: [pathogen_type]
    anyOf:
      - required: [name]
      - required: [scientific_name]
    additionalProperties: true

  treatment:
    type: object
    properties:
      name: { type: string }
      treatment_type:
        type: string
        enum: [cultural, biological, chemical, mechanical]
      active_ingredient: { type: [string, "null"] }
      application_method:
        type: string
        enum: [spray, drench, granular, release, cultural]
      safety_interval_days: { type: integer, minimum: 0 }
      notes: { type: string }
    required: [name, treatment_type]
    additionalProperties: true

  # Canonical toxicity object (REQ-001). Distinct from the flat toxicity_severity passthrough.
  toxicity:
    type: object
    properties:
      is_toxic_cats: { type: boolean }
      is_toxic_dogs: { type: boolean }
      is_toxic_children: { type: boolean }
      toxic_parts:
        type: array
        items: { type: string }
      toxic_compounds:
        type: array
        items: { type: string }
      severity:
        type: [string, "null"]
        enum: [none, mild, moderate, severe, null]
    additionalProperties: false

  allergen_info:
    type: object
    properties:
      contact_allergen: { type: boolean }
      pollen_allergen: { type: boolean }
    additionalProperties: false

  # Sowing / germination metadata (REQ-001, REQ-006). All fields optional.
  seed_profile:
    type: object
    properties:
      germination_temp_min_c: { type: [number, "null"] }
      germination_temp_max_c: { type: [number, "null"] }
      sowing_depth_cm: { type: [number, "null"], minimum: 0 }
      days_to_germination: { type: [integer, "null"], minimum: 0 }
      seed_viability_years: { type: [integer, "null"], minimum: 0 }
      light_germination:
        type: [string, "null"]
        enum: [light, dark, indifferent, null]
      pretreatment:
        type: array
        items:
          type: string
          enum: [cold_stratification, warm_stratification, scarification, presoak]
      thousand_seed_weight_g: { type: [number, "null"], minimum: 0 }
      sowing_density_per_m2: { type: [number, "null"], minimum: 0 }
    additionalProperties: false

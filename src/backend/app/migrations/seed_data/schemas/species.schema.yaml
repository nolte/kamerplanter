# JSON Schema for species.yaml
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "species.schema.yaml"
title: "Species Seed Data"
description: "Schema for species definitions"
type: object

properties:
  species:
    type: array
    items:
      $ref: "#/$defs/species"
  photosensitive_species:
    type: array
    items:
      type: string
  default_phase_sequence:
    type: string
    description: "Reference to a PhaseSequence by name for indoor defaults"
  default_phases:
    type: array
    items:
      $ref: "#/$defs/default_phase"
  perennial_species:
    type: array
    description: "Scientific names created with a PERENNIAL cycle_type by seed_data.py."
    items:
      type: string
  lifecycle_overrides:
    type: object
    description: >-
      Per-species lifecycle overrides loaded by seed_data.py
      (_load_lifecycle_overrides). Authoritative source for cultivation_cycle_type
      and flowering_strategy — keyed by scientific_name.
    additionalProperties:
      type: object
      properties:
        cultivation_cycle_type:
          $ref: "_defs.schema.yaml#/$defs/cycle_type"
        flowering_strategy:
          $ref: "_defs.schema.yaml#/$defs/flowering_strategy"
      additionalProperties: false
  cultivars:
    type: object
    description: >-
      Cultivar definitions keyed by scientific_name; each value is a list of
      cultivar objects (validated elsewhere; permissive here).
    additionalProperties:
      type: array
      items:
        type: object

required: [species]
additionalProperties: false

$defs:
  species:
    type: object
    properties:
      scientific_name:
        type: string
        description: "Binomial name (e.g. Solanum lycopersicum)"
      common_names:
        type: array
        items:
          type: string
        minItems: 1
      family:
        type: string
        description: "Botanical family name (must match a families entry)"
      genus:
        type: string
      growth_habit:
        type: string
        enum: [herb, shrub, subshrub, tree, vine, groundcover, grass, succulent, bulb_geophyte, fern, aquatic, epiphyte]
      root_type:
        type: string
        enum: [fibrous, taproot, tuberous, bulbous, corm]
      base_temp:
        type: number
        description: "Base temperature for GDD calculation in Celsius"
        minimum: 0
        maximum: 40
      hardiness_zones:
        type: array
        items:
          type: string
          pattern: "^\\d{1,2}[ab]?$"
      native_habitat:
        type: string
      allelopathy_score:
        type: number
        minimum: -1
        maximum: 1
      # Outdoor sowing fields
      sowing_indoor_weeks_before_last_frost:
        type: [integer, "null"]
        minimum: 0
      sowing_outdoor_after_last_frost_days:
        type: [integer, "null"]
        minimum: 0
      direct_sow_months:
        type: array
        items:
          type: integer
          minimum: 1
          maximum: 12
      harvest_months:
        type: array
        items:
          type: integer
          minimum: 1
          maximum: 12
      bloom_months:
        type: array
        items:
          type: integer
          minimum: 1
          maximum: 12
      frost_sensitivity:
        type: string
        enum: [sensitive, moderate, hardy, very_hardy]
      allows_harvest:
        type: boolean
      # Container & placement
      container_suitable:
        type: string
        enum: ["yes", limited, "no"]
      recommended_container_volume_l:
        type: string
        description: "Range string, e.g. '10--20' or '5-15'"
      min_container_depth_cm:
        type: integer
        minimum: 0
      mature_height_cm:
        type: string
        description: "Range string, e.g. '50--200'"
      mature_width_cm:
        type: string
        description: "Range string, e.g. '40--60'"
      spacing_cm:
        type: string
        description: "Range string, e.g. '50--80'"
      indoor_suitable:
        type: string
        enum: ["yes", limited, "no"]
      balcony_suitable:
        type: string
        enum: ["yes", limited, "no"]
      greenhouse_recommended:
        type: boolean
      support_required:
        type: boolean
      # Nutrient demand
      nutrient_demand_level:
        type: string
        enum: [heavy_feeder, medium_feeder, light_feeder, nitrogen_fixer]
      green_manure_suitable:
        type: boolean
        description: "Whether the species is suitable as green manure / cover crop."
      green_manure:
        type: boolean
        description: "DEPRECATED — use green_manure_suitable. Retained for backward compatibility."
      # Pruning
      pruning_type:
        type: [string, "null"]
        description: "Pruning strategy keyword (e.g. none, deadheading, rejuvenation)."
      pruning_months:
        type: array
        items:
          type: integer
          minimum: 1
          maximum: 12
        description: "Recommended pruning months (1–12)."
      pruning:
        type: object
        description: "DEPRECATED — use pruning_type/pruning_months. Retained for backward compatibility."
        properties:
          pruning_required:
            type: boolean
          pruning_season:
            type: string
          pruning_notes:
            type: string
        additionalProperties: false
      hardiness_detail:
        type: string
      plant_category:
        type: string
        enum: [indoor_houseplant, outdoor_ornamental, outdoor_vegetable, balcony_plant,
               succulent_cactus, tropical_foliage, orchid, herb, bulb_tuber]
        description: "Broad category for UI grouping"
      # ── Ernteverhalten (REQ-007) ──
      harvest_pattern:
        type: [string, "null"]
        enum: [single, continuous, perennial, null]
        description: "Lifetime harvest pattern — distinct from the per-event HarvestType."
      harvested_part:
        type: [string, "null"]
        enum: [fruit, seed, leaf, root, tuber, bulb, flower_bud, flower, stem, whole_plant, null]
        description: "Harvested plant part. Orthogonal to harvest_pattern."
      climacteric:
        type: [string, "null"]
        enum: [climacteric, non_climacteric, atypical, null]
        description: "Post-harvest ripening behaviour of fruit (third value for genuine borderline cases)."
      # ── Toxizität & Allergene (REQ-001) ──
      toxicity:
        $ref: "#/$defs/toxicity"
      allergen_info:
        $ref: "#/$defs/allergen_info"
      toxicity_severity:
        type: [string, "null"]
        description: "Flat legacy toxicity severity (low/moderate/high) — a DIFFERENT scale from
          toxicity.severity. Kept as an un-mapped passthrough; do not conflate with toxicity.severity."
      # ── Saatgut / Keimung (REQ-001, REQ-006) ──
      seed_profile:
        $ref: "#/$defs/seed_profile"
    required: [scientific_name, common_names, family, genus, growth_habit, root_type]
    additionalProperties: true

  default_phase:
    type: object
    properties:
      name:
        type: string
      display_name:
        type: string
      typical_duration_days:
        type: integer
        minimum: 1
      sequence_order:
        type: integer
        minimum: 0
      is_terminal:
        type: boolean
      allows_harvest:
        type: boolean
      stress_tolerance:
        type: string
        enum: [low, medium, high]
      watering_interval_days:
        type: integer
        minimum: 1
      requirement_profile:
        $ref: "#/$defs/requirement_profile"
      nutrient_profile:
        $ref: "#/$defs/nutrient_profile"
    required: [name, display_name, typical_duration_days, sequence_order, is_terminal, allows_harvest, stress_tolerance]
    additionalProperties: false

  requirement_profile:
    type: object
    properties:
      light_ppfd_target:
        type: integer
        minimum: 0
      photoperiod_hours:
        type: number
        minimum: 0
        maximum: 24
      temperature_day_c:
        type: number
      temperature_night_c:
        type: number
      humidity_day_percent:
        type: integer
        minimum: 0
        maximum: 100
      humidity_night_percent:
        type: integer
        minimum: 0
        maximum: 100
      # ── VPD (REQ-003, review finding B6) ──
      # vpd_target_kpa is the canonical field used across the data (300×); vpd_range
      # is retained as an optional legacy alternative and no longer required.
      vpd_target_kpa:
        type: number
        minimum: 0
      vpd_threshold_kpa:
        type: [number, "null"]
        minimum: 0
      vpd_sensitivity:
        type: [string, "null"]
        enum: [low, medium, high, null]
      vpd_range:
        type: array
        items:
          type: number
        minItems: 2
        maxItems: 2
    required: [light_ppfd_target, photoperiod_hours, temperature_day_c, temperature_night_c,
               humidity_day_percent, humidity_night_percent]
    additionalProperties: false

  toxicity:
    type: object
    description: "Canonical toxicity object (REQ-001). Distinct from the flat toxicity_severity passthrough."
    properties:
      is_toxic_cats: { type: boolean }
      is_toxic_dogs: { type: boolean }
      is_toxic_children: { type: boolean }
      toxic_parts:
        type: array
        items: { type: string }
      toxic_compounds:
        type: array
        items: { type: string }
      severity:
        type: [string, "null"]
        enum: [none, mild, moderate, severe, null]
    additionalProperties: false

  allergen_info:
    type: object
    properties:
      contact_allergen: { type: boolean }
      pollen_allergen: { type: boolean }
    additionalProperties: false

  seed_profile:
    type: object
    description: "Sowing / germination metadata (REQ-001, REQ-006). All fields optional."
    properties:
      germination_temp_min_c: { type: [number, "null"] }
      germination_temp_max_c: { type: [number, "null"] }
      sowing_depth_cm: { type: [number, "null"], minimum: 0 }
      days_to_germination: { type: [integer, "null"], minimum: 0 }
      seed_viability_years: { type: [integer, "null"], minimum: 0 }
      light_germination:
        type: [string, "null"]
        enum: [light, dark, indifferent, null]
      pretreatment:
        type: array
        items:
          type: string
          enum: [cold_stratification, warm_stratification, scarification, presoak]
      thousand_seed_weight_g: { type: [number, "null"], minimum: 0 }
      sowing_density_per_m2: { type: [number, "null"], minimum: 0 }
    additionalProperties: false

  nutrient_profile:
    type: object
    properties:
      npk_ratio:
        type: array
        items:
          type: integer
        minItems: 3
        maxItems: 3
      target_ec_ms:
        type: number
        minimum: 0
      target_ph:
        type: number
        minimum: 0
        maximum: 14
    required: [npk_ratio, target_ec_ms, target_ph]
    additionalProperties: false

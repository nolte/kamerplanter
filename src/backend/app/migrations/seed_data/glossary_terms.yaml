# REQ-035 §2.3 — curated glossary skeleton (v1.0 mandatory set, >= 30 terms).
#
# Editorially maintained term list. The RAG answer text is produced on demand by
# the Knowledge Service; this file only carries the curated metadata plus an
# editorial `fallback_text` (used when the knowledge base has no hit, §4.1 step 6).
#
# `_key` equals `slug`. `rag_query_template` is German-only (the KS answers in the
# requested prompt_language, §7). Both `labels` and `fallback_text` carry de + en.
glossary_terms:
  # ── umwelt ────────────────────────────────────────────────────────
  - _key: vpd
    slug: vpd
    labels: { de: "VPD", en: "VPD" }
    long_labels:
      de: "Vapor Pressure Deficit (Wasserdampfdruck-Defizit)"
      en: "Vapor Pressure Deficit"
    aliases:
      de: ["Wasserdampfdruck-Defizit", "Saettigungsdefizit"]
      en: ["vapor pressure deficit", "saturation deficit"]
    category: umwelt
    default_expertise_level: beginner
    applicable_phases: ["seedling", "vegetative", "flowering"]
    related_term_slugs: ["blatttemperatur", "transpiration", "photoperiode"]
    fallback_text:
      de: "VPD steht fuer 'Wasserdampfdruck-Defizit' und beschreibt, wie 'durstig' die Luft ist. Es beeinflusst, wie schnell deine Pflanze ueber die Blaetter Wasser verliert. Niedrige VPD = feuchte Luft, hohe VPD = trockene Luft. Zielbereiche je Phase 0.8 - 1.5 kPa."
      en: "VPD stands for 'Vapor Pressure Deficit' and describes how 'thirsty' the air is, influencing how fast your plant transpires water through its leaves. Low VPD = humid air, high VPD = dry air. Target ranges per phase 0.8 - 1.5 kPa."
    rag_query_template: "Erklaere den Begriff '{label_de}' fuer einen {expertise_level} Pflanzenfreund. Gib eine 2-3 Satz Definition und einen praxisnahen Hinweis. Falls relevant: Wertebereiche pro Wachstumsphase."
  - _key: ppfd
    slug: ppfd
    labels: { de: "PPFD", en: "PPFD" }
    long_labels:
      de: "Photosynthetic Photon Flux Density (Photonenflussdichte)"
      en: "Photosynthetic Photon Flux Density"
    aliases:
      de: ["Photonenflussdichte", "Lichtintensitaet"]
      en: ["photon flux density", "light intensity"]
    category: umwelt
    default_expertise_level: beginner
    related_term_slugs: ["dli", "photoperiode"]
    fallback_text:
      de: "PPFD misst, wie viel nutzbares Licht pro Sekunde auf einer Flaeche ankommt (in umol/m2/s). Je hoeher der Wert, desto mehr 'Nahrung' bekommt die Pflanze ueber die Photosynthese - aber zu viel kann Blaetter verbrennen."
      en: "PPFD measures how much usable light reaches a surface per second (in umol/m2/s). Higher values feed more photosynthesis - but too much can scorch leaves."
    rag_query_template: "Erklaere den Begriff '{label_de}' fuer einen {expertise_level} Pflanzenfreund. Gib eine kurze Definition und einen praxisnahen Hinweis."
  - _key: dli
    slug: dli
    labels: { de: "DLI", en: "DLI" }
    long_labels:
      de: "Daily Light Integral (Tageslichtsumme)"
      en: "Daily Light Integral"
    aliases:
      de: ["Tageslichtsumme"]
      en: ["daily light integral"]
    category: umwelt
    default_expertise_level: intermediate
    related_term_slugs: ["ppfd", "photoperiode"]
    fallback_text:
      de: "DLI ist die gesamte Lichtmenge, die eine Pflanze ueber einen ganzen Tag bekommt (mol/m2/Tag). Sie fasst Lichtstaerke und Beleuchtungsdauer in einer Zahl zusammen."
      en: "DLI is the total amount of light a plant receives over a full day (mol/m2/day). It combines light intensity and duration into a single number."
    rag_query_template: "Erklaere den Begriff '{label_de}' fuer einen {expertise_level} Pflanzenfreund. Gib eine kurze Definition und einen praxisnahen Hinweis."
  - _key: photoperiode
    slug: photoperiode
    labels: { de: "Photoperiode", en: "Photoperiod" }
    long_labels:
      de: "Photoperiode (Belichtungsdauer)"
      en: "Photoperiod (lighting duration)"
    aliases:
      de: ["Belichtungsdauer", "Tageslaenge"]
      en: ["day length", "light cycle"]
    category: umwelt
    default_expertise_level: beginner
    related_term_slugs: ["dli", "stretch"]
    fallback_text:
      de: "Die Photoperiode ist die taegliche Beleuchtungsdauer. Viele Pflanzen steuern ueber sie, wann sie von Wachstum auf Bluete umschalten (z. B. 18/6 vegetativ, 12/12 Bluete)."
      en: "The photoperiod is the daily lighting duration. Many plants use it to switch from growth to flowering (e.g. 18/6 vegetative, 12/12 flowering)."
    rag_query_template: "Erklaere den Begriff '{label_de}' fuer einen {expertise_level} Pflanzenfreund. Gib eine kurze Definition und einen praxisnahen Hinweis."
  - _key: hysterese
    slug: hysterese
    labels: { de: "Hysterese", en: "Hysteresis" }
    long_labels:
      de: "Hysterese (Schaltschwellen-Abstand)"
      en: "Hysteresis (switching threshold gap)"
    aliases:
      de: ["Schalthysterese", "Totband"]
      en: ["deadband", "switching gap"]
    category: umwelt
    default_expertise_level: intermediate
    related_term_slugs: []
    fallback_text:
      de: "Hysterese ist der Abstand zwischen Ein- und Ausschaltpunkt einer Regelung. Er verhindert, dass ein Geraet (z. B. Luftbefeuchter) staendig flackernd an- und ausschaltet."
      en: "Hysteresis is the gap between the on and off point of a control loop. It stops a device (e.g. a humidifier) from rapidly cycling on and off."
    rag_query_template: "Erklaere den Begriff '{label_de}' fuer einen {expertise_level} Pflanzenfreund. Gib eine kurze Definition und einen praxisnahen Hinweis."
  - _key: blatttemperatur
    slug: blatttemperatur
    labels: { de: "Blatttemperatur", en: "Leaf temperature" }
    long_labels:
      de: "Blatttemperatur"
      en: "Leaf temperature"
    aliases:
      de: ["Blattoberflaechentemperatur"]
      en: ["leaf surface temperature"]
    category: umwelt
    default_expertise_level: intermediate
    related_term_slugs: ["vpd", "transpiration"]
    fallback_text:
      de: "Die Blatttemperatur liegt durch Verdunstung meist etwas unter der Lufttemperatur. Sie ist wichtig, weil VPD eigentlich an der Blattoberflaeche wirkt, nicht in der Raumluft."
      en: "Leaf temperature is usually a bit below air temperature due to evaporation. It matters because VPD really acts at the leaf surface, not in the room air."
    rag_query_template: "Erklaere den Begriff '{label_de}' fuer einen {expertise_level} Pflanzenfreund. Gib eine kurze Definition und einen praxisnahen Hinweis."
  - _key: transpiration
    slug: transpiration
    labels: { de: "Transpiration", en: "Transpiration" }
    long_labels:
      de: "Transpiration (Wasserabgabe der Pflanze)"
      en: "Transpiration (plant water loss)"
    aliases:
      de: ["Verdunstung"]
      en: ["plant water loss"]
    category: umwelt
    default_expertise_level: beginner
    related_term_slugs: ["vpd", "blatttemperatur"]
    fallback_text:
      de: "Transpiration ist die Wasserabgabe der Pflanze ueber die Blaetter. Sie kuehlt die Pflanze und transportiert Naehrstoffe von den Wurzeln nach oben."
      en: "Transpiration is the plant's water loss through its leaves. It cools the plant and moves nutrients up from the roots."
    rag_query_template: "Erklaere den Begriff '{label_de}' fuer einen {expertise_level} Pflanzenfreund. Gib eine kurze Definition und einen praxisnahen Hinweis."

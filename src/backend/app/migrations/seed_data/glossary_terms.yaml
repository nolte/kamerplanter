    fallback_text:
      de: "Der pH-Wert gibt an, wie sauer oder basisch das Wasser ist. Er steuert, welche Naehrstoffe die Wurzel aufnehmen kann. Erde ~6.0-6.8, Hydro ~5.5-6.2."
      en: "The pH value indicates how acidic or basic the water is. It controls which nutrients the roots can absorb. Soil ~6.0-6.8, hydro ~5.5-6.2."
    rag_query_template: "Erklaere den Begriff '{label_de}' fuer einen {expertise_level} Pflanzenfreund. Gib eine kurze Definition und einen praxisnahen Hinweis mit Zielbereichen."

    category: duengung
    default_expertise_level: beginner
    related_term_slugs: ["ph", "ro-wasser", "runoff"]
    fallback_text:
      de: "EC misst, wie viele geloeste Naehrstoffe im Wasser sind. Ein hoeherer EC-Wert bedeutet mehr Duenger. Typisch: vegetativ 1.0-1.4 mS/cm, Bluete 1.4-1.8 mS/cm - abhaengig vom Substrat."
      en: "EC measures how many dissolved nutrients are in the water. A higher EC means more fertiliser. Typical: vegetative 1.0-1.4 mS/cm, flowering 1.4-1.8 mS/cm - substrate dependent."
    rag_query_template: "Erklaere den Begriff '{label_de}' fuer einen {expertise_level} Pflanzenfreund. Gib eine 2-3 Satz Definition und einen praxisnahen Hinweis. Falls relevant: konkrete Wertebereiche pro Wachstumsphase und Substrat."

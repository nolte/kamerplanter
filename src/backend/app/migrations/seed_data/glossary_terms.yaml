      de: "NPK steht fuer die drei Hauptnaehrstoffe Stickstoff (N), Phosphor (P) und Kalium (K). N foerdert Blattwachstum, P Wurzeln und Blueten, K die allgemeine Robustheit."
      en: "NPK stands for the three main nutrients Nitrogen (N), Phosphorus (P) and Potassium (K). N drives leaf growth, P roots and flowers, K overall robustness."

# Per-species lifecycle overrides (Plan WP-3/WP-4): cultivation_cycle_type =
# the practised lifespan when it differs from the botanical cycle_type
# (tender perennials grown as annuals; vegetables grown as biennials for seed);
# flowering_strategy = monocarpic/polycarpic where informative.
lifecycle_overrides:
  # cultivation_cycle_type = practised lifespan when it differs from botanical cycle_type
  # cultivation_cycle_type + flowering_strategy
  #
  # cultivation_flexible (ADR-006 E6): capability flag "this species can genuinely be
  # grown EITHER as an annual OR as a perennial". Set true ONLY where the Steckbrief
  # (spec/knowledge/plants/*.md) documents that the standing plant can be overwintered
  # / kept multi-year as a real grower choice — never guessed. It gates the per-instance
  # cultivation-cycle choice in the plant-create flow (ADR-006 E1/#539). Applied to
  # Species.cultivation_flexible by the seed_cultivation_flexible pass; defaults false.
  # Per-species Steckbrief evidence is noted inline below.
  Apium graveolens: { cultivation_cycle_type: biennial, flowering_strategy: monocarpic }
  Brassica oleracea var. capitata: { cultivation_cycle_type: biennial, flowering_strategy: monocarpic }
  # Paprika: "nicht streng einjaehrig ... frostfrei im Haus ueberwintert werden kann" (capsicum_annuum.md §4.2)
  Capsicum annuum: { cultivation_cycle_type: annual, flowering_strategy: polycarpic, growth_determinacy: indeterminate, cultivation_flexible: true }
  Daucus carota: { cultivation_cycle_type: biennial, flowering_strategy: monocarpic }
  Foeniculum vulgare: { cultivation_cycle_type: annual, flowering_strategy: monocarpic }
  # Basilikum: "einjaehrig kultiviert ... oder ganzjaehrig auf der Fensterbank/im Gewaechshaus" (ocimum_basilicum.md §1.2)
  Ocimum basilicum: { cultivation_cycle_type: annual, flowering_strategy: polycarpic, cultivation_flexible: true }
  # Geranie: "koennen eingewintert werden (hell, 5-10C) oder werden jaehrlich neu gekauft" (pelargonium_zonale.md AB-003)
  Pelargonium zonale: { cultivation_cycle_type: annual, flowering_strategy: polycarpic, cultivation_flexible: true }
  Petroselinum crispum: { cultivation_cycle_type: biennial, flowering_strategy: monocarpic }
  # Petunie: "Ueberwinterung nur frostfrei (mind. +5C) als Stecklingspflanze oder in hellem Kalthaus moeglich" (petunia_x_hybrida.md §1.2)
  Petunia x hybrida: { cultivation_cycle_type: annual, flowering_strategy: polycarpic, cultivation_flexible: true }
  # Andenbeere: "als Einjaehrige kultiviert ODER im Fruehling als Kuebelpflanze hereingeholt" (physalis_peruviana.md §1.2)

default_phase_sequence: "indoor_default"

default_phases:
  - name: seedling
    display_name: Seedling
    typical_duration_days: 14
    sequence_order: 0
    is_terminal: false
    allows_harvest: false
    stress_tolerance: low
    watering_interval_days: 2
    requirement_profile:
      light_ppfd_target: 200
      photoperiod_hours: 18.0
      temperature_day_c: 24.0
      temperature_night_c: 20.0
      humidity_day_percent: 70
      humidity_night_percent: 75
      vpd_range: [0.4, 0.8]
    nutrient_profile:
      npk_ratio: [1, 1, 1]
      target_ec_ms: 0.8
      target_ph: 6.0

  - name: vegetative

  # frostfreie Ueberwinterung §4.3 (impatiens_walleriana.md §1.2/§4.3)
  Impatiens walleriana: { cultivation_cycle_type: annual, flowering_strategy: polycarpic, cultivation_flexible: true }
  # Kartoffel: NICHT flexible — die stehende Pflanze wird nicht ueberwintert; Fortfuehrung nur ueber
  # eingelagerte Knollen (dig_store, solanum_tuberosum.md §4.3), keine annual-ODER-perennial-Pflanzenwahl.
  Solanum tuberosum: { cultivation_cycle_type: annual, flowering_strategy: polycarpic }

  # ── WP-10 flowering_strategy / cultivation_cycle_type backfill (#453) ──
  # Convention (mirrors the existing corpus): flowering_strategy captures the
  # BOTANICAL reproductive strategy — monocarpic (flowers once, then the mother
  # plant dies: biennials + semelparous perennials) vs polycarpic (repeat-
  # flowering perennials / woody plants). True annuals and non-flowering ferns
  # are deliberately left unset (not applicable — same decision the steckbrief
  # auditor took for Citrullus/Cucumis/Pisum/Luffa and Nephrolepis). Tillandsia
  # usneoides stays unset (see the note above). cultivation_cycle_type records
  # the PRACTISED cycle when it differs from the botanical lifespan.

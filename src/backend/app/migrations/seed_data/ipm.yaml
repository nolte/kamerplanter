treatments:
  # Cultural (4) — existing
  - name: Crop Rotation
    name_de: Fruchtfolge
    treatment_type: cultural
    application_method: cultural
    description: "Rotate plant families to break pest/disease cycles"
    description_de: "Pflanzenfamilien im Beet wechseln, um Schädlings- und Krankheitszyklen zu unterbrechen."
    how_to_apply: >-
      Avoid growing the same plant family in the same bed for 3-4 years.
      Follow a heavy-feeder → medium-feeder → light-feeder → green-manure
      sequence and keep a written rotation plan per bed.
    how_to_apply_de: >-
      Dieselbe Pflanzenfamilie 3-4 Jahre nicht im selben Beet anbauen.
      Reihenfolge Starkzehrer → Mittelzehrer → Schwachzehrer → Gründüngung
      einhalten und je Beet einen Fruchtfolgeplan führen.
    mode_of_action: >-
      Soil-borne pests and pathogens that specialise on one plant family
      starve without their host, breaking their population build-up.
    mode_of_action_de: >-
      Bodenbürtige Schädlinge und Erreger, die auf eine Pflanzenfamilie
      spezialisiert sind, finden keinen Wirt mehr und ihre Populationen
      brechen zusammen.
    precautions: >-
      Group plants by botanical family, not by appearance — tomato and
      potato share a family. Combine with green manure to maintain soil
      health.
    precautions_de: >-
      Pflanzen nach botanischer Familie gruppieren, nicht nach Aussehen —
      Tomate und Kartoffel gehören zur selben Familie. Mit Gründüngung
      kombinieren, um die Bodengesundheit zu erhalten.

  - name: Sanitation
    name_de: Hygiene und Bestandspflege
    treatment_type: cultural
    application_method: cultural
    description: "Remove dead plant material and debris"
    description_de: "Abgestorbene Pflanzenteile und Ernterückstände entfernen, um Schädlingen und Erregern den Unterschlupf zu nehmen."
    how_to_apply: >-
      Regularly remove fallen leaves, dead foliage, diseased plant parts
      and fruit mummies. Dispose of infected material in household waste,
      not compost. Clean tools and pots between uses.
    how_to_apply_de: >-
      Laub, abgestorbene Blätter, kranke Pflanzenteile und Fruchtmumien
      regelmäßig entfernen. Befallenes Material in den Hausmüll geben, nicht
      kompostieren. Werkzeuge und Töpfe zwischendurch reinigen.
    mode_of_action: >-
      Removing infected debris eliminates the overwintering sites and
      reservoirs from which pests and spores re-infest healthy plants.
    mode_of_action_de: >-
      Das Entfernen befallener Rückstände beseitigt Überwinterungsorte und
      Erregerreservoire, von denen aus gesunde Pflanzen neu befallen werden.
    precautions: >-
      Never compost diseased material — many spores survive composting.
      Disinfect cutting tools with alcohol between infected plants to avoid
      spreading pathogens.
    precautions_de: >-
      Krankes Material nie kompostieren — viele Sporen überleben den
      Kompost. Schneidwerkzeuge zwischen befallenen Pflanzen mit Alkohol
      desinfizieren, um Erreger nicht zu verschleppen.

  - name: Resistant Varieties
    name_de: Resistente Sorten
    treatment_type: cultural
    application_method: cultural
    description: "Use disease-resistant cultivars"
    description_de: "Krankheitsresistente oder -tolerante Sorten verwenden, um Befall von vornherein zu vermeiden."
    how_to_apply: >-
      Select cultivars labelled resistant or tolerant to the diseases
      common in your area (e.g. late-blight-tolerant tomatoes, mildew-
      resistant cucumbers). Check seed catalogue resistance codes.
    how_to_apply_de: >-
      Sorten wählen, die als resistent oder tolerant gegen die bei dir
      verbreiteten Krankheiten ausgewiesen sind (z. B. krautfäuletolerante
      Tomaten, mehltauresistente Gurken). Resistenzcodes im Saatgutkatalog
      beachten.
    mode_of_action: >-
      Genetic resistance lets the plant block or limit pathogen infection,
      so disease pressure stays low without any spraying.
    mode_of_action_de: >-
      Genetische Resistenz erlaubt der Pflanze, den Erreger abzuwehren oder
      einzudämmen, sodass der Befallsdruck ohne Spritzung niedrig bleibt.
    precautions: >-
      Resistance is rarely absolute and can be overcome over time — combine
      with crop rotation and hygiene rather than relying on it alone.
    precautions_de: >-
      Resistenz ist selten vollständig und kann mit der Zeit überwunden
      werden — mit Fruchtfolge und Hygiene kombinieren, nicht allein darauf
      verlassen.

  - name: Environmental Control
    name_de: Klimasteuerung
    treatment_type: cultural
    application_method: cultural
    description: "Adjust temperature, humidity, and ventilation"
    description_de: "Temperatur, Luftfeuchte und Belüftung so steuern, dass Schädlinge und Pilze keine günstigen Bedingungen finden."
    how_to_apply: >-
      Increase ventilation and air circulation, avoid wetting foliage in
      the evening, keep humidity below disease-favouring levels and provide
      adequate plant spacing.
    how_to_apply_de: >-
      Belüftung und Luftzirkulation erhöhen, Blätter abends nicht benetzen,
      die Luftfeuchte unter krankheitsfördernden Werten halten und
      ausreichende Pflanzabstände einhalten.
    mode_of_action: >-
      Most fungal diseases need leaf wetness and high humidity to
      germinate; drier, well-ventilated conditions stop spore germination
      and slow pest reproduction.
    mode_of_action_de: >-
      Die meisten Pilzkrankheiten brauchen Blattnässe und hohe Luftfeuchte
      zum Keimen; trockenere, gut belüftete Bedingungen verhindern die
      Sporenkeimung und bremsen die Schädlingsvermehrung.
    precautions: >-
      Avoid cold draughts on sensitive tropical plants and do not let
      temperatures drop too low when reducing humidity.
    precautions_de: >-
      Kalte Zugluft an empfindlichen Tropenpflanzen vermeiden und die
      Temperatur beim Absenken der Luftfeuchte nicht zu stark abfallen
      lassen.

  # Biological (3) — existing
  - name: Phytoseiulus persimilis
    name_de: Raubmilbe (Phytoseiulus persimilis)
    treatment_type: biological
    application_method: release
    description: "Predatory mite for spider mite control"
    description_de: "Räuberische Milbe zur biologischen Bekämpfung von Spinnmilben."
    how_to_apply: >-
      Release onto affected plants at the first sign of spider mites,
      typically 5-20 mites per m² or per infested plant. Repeat after
      2-3 weeks if needed. Works best at 20-28°C and >60% humidity.
    how_to_apply_de: >-
      Bei den ersten Spinnmilben auf die befallenen Pflanzen ausbringen,
      meist 5-20 Raubmilben pro m² bzw. pro befallene Pflanze. Bei Bedarf
      nach 2-3 Wochen wiederholen. Optimal bei 20-28 °C und >60 % Luftfeuchte.
    mode_of_action: >-
      An obligate predator that actively hunts and consumes all spider mite
      stages (eggs, larvae, adults), collapsing the pest population.
    mode_of_action_de: >-
      Spezialisierter Räuber, der alle Spinnmilben-Stadien (Eier, Larven,
      adulte Tiere) aktiv jagt und frisst und so die Schädlingspopulation
      zusammenbrechen lässt.
    precautions: >-
      Do not combine with broad-spectrum insecticides, which kill the
      predatory mites. Once the prey is gone the predator dies out, so
      release before infestations get severe.
    precautions_de: >-
      Nicht mit Breitband-Insektiziden kombinieren, diese töten die
      Raubmilben. Ist die Beute aufgebraucht, stirbt der Räuber ab — daher
      vor starkem Befall ausbringen.

  - name: Encarsia formosa
    name_de: Schlupfwespe (Encarsia formosa)
    treatment_type: biological
    application_method: release
    description: "Parasitic wasp for whitefly control"
    description_de: "Parasitische Schlupfwespe zur biologischen Bekämpfung der Weißen Fliege."
    how_to_apply: >-
      Hang cards with parasitised whitefly pupae among the plants, 1-3
      wasps per m² every 1-2 weeks, starting preventively when first
      whiteflies appear. Best at >18°C with good light.
    how_to_apply_de: >-
      Kärtchen mit parasitierten Weiße-Fliege-Puppen zwischen die Pflanzen
      hängen, 1-3 Wespen pro m² alle 1-2 Wochen, vorbeugend ab den ersten
      Weißen Fliegen beginnen. Optimal bei >18 °C und gutem Licht.
    mode_of_action: >-
      The wasp lays its eggs inside whitefly larvae; the developing wasp
      consumes the host from within, turning the larva black before a new
      wasp emerges.
    mode_of_action_de: >-
      Die Wespe legt ihre Eier in die Larven der Weißen Fliege; die
      heranwachsende Wespe frisst den Wirt von innen auf, die Larve färbt
      sich schwarz, bevor eine neue Wespe schlüpft.
    precautions: >-
      Incompatible with broad-spectrum and many systemic insecticides.
      Yellow sticky traps used nearby will also catch the wasps — keep
      them out of release zones.
    precautions_de: >-
      Unverträglich mit Breitband- und vielen systemischen Insektiziden.
      Gelbtafeln in der Nähe fangen auch die Wespen — daher aus den
      Freilassungszonen fernhalten.

  - name: Bacillus thuringiensis (Bt)
    name_de: Bacillus thuringiensis (Bt)
    treatment_type: biological
    application_method: spray
    description: "Biological insecticide for caterpillar control"
    description_de: "Biologisches Insektizid auf Bakterienbasis zur Bekämpfung von Raupen."
    how_to_apply: >-
      Spray onto foliage so that young, actively feeding caterpillars
      ingest it. Apply in the evening (UV-sensitive) and repeat every
      7-10 days during egg hatch. Targets young larvae most effectively.
    how_to_apply_de: >-
      Auf das Blattwerk spritzen, sodass junge, fressende Raupen es
      aufnehmen. Abends ausbringen (UV-empfindlich) und während des
      Larvenschlupfs alle 7-10 Tage wiederholen. Wirkt am besten gegen
      junge Larven.
    mode_of_action: >-
      Bt produces protein crystals that, once eaten, destroy the
      caterpillar's gut lining; the larva stops feeding within hours and
      dies in 1-3 days.
    mode_of_action_de: >-
      Bt bildet Eiweißkristalle, die nach dem Fraß die Darmwand der Raupe
      zerstören; die Larve stellt binnen Stunden das Fressen ein und stirbt
      in 1-3 Tagen.
    precautions: >-
      Only works against caterpillars that ingest it — useless against
      sucking pests. Reapply after rain. Selective and harmless to bees and
      most beneficials; still avoid spraying open blossoms.
    precautions_de: >-
      Wirkt nur gegen Raupen, die es fressen — nutzlos gegen saugende
      Schädlinge. Nach Regen erneut ausbringen. Selektiv und schonend für
      Bienen und die meisten Nützlinge; offene Blüten trotzdem nicht
      bespritzen.

  # Mechanical (2) — existing
  - name: Sticky Traps
    name_de: Gelb- und Blautafeln (Leimtafeln)
    treatment_type: mechanical
    application_method: cultural
    description: "Yellow/blue sticky traps for flying insects"
    description_de: "Gelbe und blaue Leimtafeln zum Fang fliegender Insekten."
    how_to_apply: >-
      Hang yellow traps just above the canopy for whitefly, fungus gnats
      and aphids; blue traps for thrips. Use 1-4 traps per plant or per
      few m². Replace when the surface is full.
    how_to_apply_de: >-
      Gelbtafeln knapp über dem Bestand für Weiße Fliege, Trauermücken und
      Blattläuse aufhängen; Blautafeln für Thripse. 1-4 Tafeln je Pflanze
      bzw. je wenige m² verwenden. Bei voller Klebefläche austauschen.
    mode_of_action: >-
      The trap colour mimics flowers/foliage and attracts flying insects,
      which stick to the adhesive and die — reducing the breeding
      population.
    mode_of_action_de: >-
      Die Tafelfarbe ahmt Blüten bzw. Blattwerk nach und lockt fliegende
      Insekten an, die am Leim kleben bleiben und sterben — das reduziert
      die fortpflanzungsfähige Population.
    precautions: >-
      Mainly a monitoring and mass-trapping aid, not a stand-alone cure.
      Avoid hanging near beneficial-insect releases, as the traps catch
      them too.
    precautions_de: >-
      Vor allem Monitoring- und Massenfanghilfe, keine alleinige Lösung.
      Nicht in der Nähe von Nützlings-Freilassungen aufhängen, da die
      Tafeln auch diese fangen.

  - name: Hand Removal
    name_de: Absammeln von Hand
    treatment_type: mechanical
    application_method: cultural
    description: "Manual removal of pests"
    description_de: "Schädlinge wie Raupen, Käfer oder Schnecken von Hand absammeln und entfernen."
    how_to_apply: >-
      Inspect plants regularly, especially leaf undersides, and pick off
      caterpillars, beetles, snails or egg clusters by hand. Drop them in
      soapy water. Evening checks catch night-active slugs.
    how_to_apply_de: >-
      Pflanzen regelmäßig kontrollieren, besonders die Blattunterseiten,
      und Raupen, Käfer, Schnecken oder Eigelege von Hand absammeln. In
      Seifenwasser geben. Abendkontrollen erwischen nachtaktive Nacktschnecken.
    mode_of_action: >-
      Physically removing pests and egg clusters directly lowers the
      population and prevents the next generation from hatching.
    mode_of_action_de: >-
      Das mechanische Entfernen von Schädlingen und Eigelegen senkt die
      Population unmittelbar und verhindert das Schlüpfen der nächsten
      Generation.
    precautions: >-
      Wear gloves with stinging or irritant pests. Best for small plant
      counts and light infestations; impractical at large scale.
    precautions_de: >-
      Bei brennenden oder reizenden Schädlingen Handschuhe tragen. Eignet
      sich für wenige Pflanzen und leichten Befall; bei großen Beständen
      unpraktisch.

  # Chemical (3) — existing
  - name: Pyrethrin
    name_de: Pyrethrin
    treatment_type: chemical
    active_ingredient: pyrethrin
    application_method: spray
    safety_interval_days: 7
    dosage_per_liter: 1.0
    protective_equipment: [gloves, mask]
    description: "Fast-acting natural insecticide from chrysanthemum flowers against many sucking and chewing pests."
    description_de: "Schnell wirkendes natürliches Insektizid aus Chrysanthemenblüten gegen viele saugende und beißende Schädlinge."
    how_to_apply: >-
      Spray thoroughly onto pests including leaf undersides at 1 ml/L.
      Apply in the evening when bees are inactive. Repeat after 7-10 days
      as it has little residual effect.
    how_to_apply_de: >-
      Gründlich auf die Schädlinge sprühen, auch auf Blattunterseiten, mit
      1 ml/L. Abends ausbringen, wenn Bienen nicht fliegen. Da es kaum
      Dauerwirkung hat, nach 7-10 Tagen wiederholen.
    mode_of_action: >-
      A contact neurotoxin that overstimulates the insect nervous system,
      causing rapid paralysis ("knockdown") and death.
    mode_of_action_de: >-
      Ein Kontakt-Nervengift, das das Nervensystem der Insekten überreizt
      und zu rascher Lähmung ("Knockdown") und Tod führt.
    precautions: >-
      Highly toxic to bees and aquatic life — never spray flowering plants
      during bee flight. Broad-spectrum, so it also harms beneficials.
      Observe the 7-day pre-harvest interval (Karenzzeit).
    precautions_de: >-
      Hochgiftig für Bienen und Wasserorganismen — blühende Pflanzen nie
      während des Bienenflugs spritzen. Breitbandwirkung, schadet daher auch
      Nützlingen. Die Wartezeit (Karenzzeit) von 7 Tagen einhalten.

  - name: Neem Oil
    name_de: Niemöl (Neemöl)
    treatment_type: biological
    active_ingredient: azadirachtin
    application_method: spray
    safety_interval_days: 3
    dosage_per_liter: 5.0
    protective_equipment: [gloves]
    description: "Plant-based insecticide from the neem tree against aphids, whitefly, spider mites and thrips."
    description_de: "Pflanzliches Insektizid aus dem Niembaum gegen Blattläuse, Weiße Fliege, Spinnmilben und Thripse."
    how_to_apply: >-
      Mix 5 ml/L with a little soap as emulsifier and spray onto all plant
      surfaces, including leaf undersides. Apply in the evening every 7
      days until the infestation subsides.
    how_to_apply_de: >-
      5 ml/L mit etwas Seife als Emulgator mischen und auf alle
      Pflanzenflächen sprühen, auch Blattunterseiten. Abends alle 7 Tage
      anwenden, bis der Befall zurückgeht.
    mode_of_action: >-
      Azadirachtin acts as a feeding deterrent and disrupts moulting and
      reproduction; the oil also smothers soft-bodied pests on contact.
    mode_of_action_de: >-
      Azadirachtin wirkt fraßhemmend und stört Häutung und Fortpflanzung;
      das Öl erstickt zudem weichhäutige Schädlinge bei direktem Kontakt.
    precautions: >-
      Do not spray in strong sun or above 30°C (leaf burn). Mildly harmful
      to bees while wet — apply in the evening. Keep the 3-day pre-harvest
      interval.
    precautions_de: >-
      Nicht bei starker Sonne oder über 30 °C spritzen (Blattverbrennung).
      Solange feucht leicht bienengefährlich — abends anwenden. Die Wartezeit
      von 3 Tagen einhalten.

  - name: Spinosad
    name_de: Spinosad
    treatment_type: chemical
    active_ingredient: spinosad
    application_method: spray
    safety_interval_days: 14
    dosage_per_liter: 0.5
    protective_equipment: [gloves, mask, goggles]
    description: "Microbial-derived insecticide highly effective against thrips, caterpillars and leaf miners."
    description_de: "Aus Bodenbakterien gewonnenes Insektizid, hochwirksam gegen Thripse, Raupen und Minierfliegen."
    how_to_apply: >-
      Spray 0.5 ml/L evenly onto foliage, covering leaf undersides. Apply
      in the evening and limit to a few applications per cycle to slow
      resistance. Re-treat after 7-10 days if needed.
    how_to_apply_de: >-
      0,5 ml/L gleichmäßig auf das Laub sprühen, Blattunterseiten
      einbeziehen. Abends ausbringen und zur Resistenzvermeidung auf wenige
      Anwendungen je Kultur begrenzen. Bei Bedarf nach 7-10 Tagen wiederholen.
    mode_of_action: >-
      Acts on insect nerve receptors after contact and ingestion, causing
      paralysis and death within 1-2 days.
    mode_of_action_de: >-
      Wirkt nach Kontakt und Fraß auf die Nervenrezeptoren der Insekten und
      führt binnen 1-2 Tagen zu Lähmung und Tod.
    precautions: >-
      Toxic to bees while spray is wet — apply in the evening, never on
      open blossom. Rotate with other modes of action to prevent
      resistance. Observe the 14-day pre-harvest interval.
    precautions_de: >-
      Solange die Spritzbrühe feucht ist bienengiftig — abends anwenden, nie
      auf offene Blüten. Zur Resistenzvermeidung mit anderen Wirkmechanismen
      abwechseln. Die Wartezeit von 14 Tagen einhalten.

  - name: Phosphonate (Phosphorous Acid)
    name_de: Phosphonat (Phosphonsäure)
    treatment_type: chemical
    active_ingredient: phosphorous acid
    application_method: drench
    safety_interval_days: 21  # EU-Standard for food crops (21-28d depending on crop)
    dosage_per_liter: 3.0
    protective_equipment: [gloves, goggles]
    description: >-
      Oomycete-specific treatment effective against Pythium, Phytophthora
      and Peronospora. Disrupts oomycete phospholipid synthesis. Applied
      as root drench (3 ml/L) or foliar spray (1.5 ml/L). Not effective
      against true fungi.
    description_de: >-
      Gegen Oomyceten (Pythium, Phytophthora, Peronospora) wirksames
      Mittel. Stört die Phospholipid-Synthese der Oomyceten. Als
      Wurzelgießung (3 ml/L) oder Blattspritzung (1,5 ml/L). Gegen echte
      Pilze unwirksam.
    how_to_apply: >-
      Apply as a root drench at 3 ml/L or foliar spray at 1.5 ml/L,
      preventively or at first symptoms. The plant takes it up systemically;
      repeat per label, typically every 2-4 weeks.
    how_to_apply_de: >-
      Als Wurzelgießung mit 3 ml/L oder Blattspritzung mit 1,5 ml/L
      ausbringen, vorbeugend oder bei ersten Symptomen. Die Pflanze nimmt es
      systemisch auf; nach Etikett wiederholen, meist alle 2-4 Wochen.
    mode_of_action: >-
      Moves systemically in the plant (up and down), directly inhibiting
      oomycete phospholipid synthesis and boosting the plant's own defence
      response.
    mode_of_action_de: >-
      Wandert systemisch in der Pflanze (auf- und abwärts), hemmt direkt die
      Phospholipid-Synthese der Oomyceten und stärkt die pflanzeneigene
      Abwehr.
    precautions: >-
      Not effective against true fungi (e.g. powdery mildew, botrytis).
      Wear goggles when mixing the acidic concentrate. Observe the 21-day
      pre-harvest interval on food crops.
    precautions_de: >-
      Gegen echte Pilze (z. B. Echter Mehltau, Grauschimmel) unwirksam.
      Beim Ansetzen des sauren Konzentrats Schutzbrille tragen. Bei
      Nutzpflanzen die Wartezeit von 21 Tagen einhalten.

  - name: Steinernema feltiae (Nematodes)
    name_de: Nematoden (Steinernema feltiae)
    treatment_type: biological
    application_method: drench
    description: >-
      Beneficial nematodes for biological control of fungus gnat larvae
      (Bradysia spp.). Applied as drench at 250,000 nematodes per m2.
      Optimal soil temperature 12-25°C. Apply in the evening or on
      overcast days (UV-sensitive). Effective within 2-3 days.
    description_de: >-
      Nützliche Nematoden zur biologischen Bekämpfung von Trauermücken-
      Larven (Bradysia spp.). Als Gießung mit 250.000 Nematoden pro m².
      Optimale Bodentemperatur 12-25 °C. Abends oder an bewölkten Tagen
      ausbringen (UV-empfindlich). Wirkt innerhalb von 2-3 Tagen.
    how_to_apply: >-
      Dissolve in water and water onto moist substrate at 250,000 per m².
      Keep the soil moist for 1-2 weeks afterwards. Apply in the evening;
      repeat after 1-2 weeks if larvae persist.
    how_to_apply_de: >-
      In Wasser auflösen und mit 250.000 pro m² auf feuchtes Substrat
      gießen. Den Boden danach 1-2 Wochen feucht halten. Abends ausbringen;
      bei anhaltendem Larvenbefall nach 1-2 Wochen wiederholen.
    mode_of_action: >-
      The nematodes seek out fungus gnat larvae in the soil, enter them and
      release symbiotic bacteria that kill the larva within a few days.
    mode_of_action_de: >-
      Die Nematoden suchen Trauermücken-Larven im Boden, dringen in sie ein
      und setzen symbiotische Bakterien frei, die die Larve binnen weniger
      Tage töten.
    precautions: >-
      Use the living product promptly and never combine with hot water or
      chemical drenches. Avoid UV exposure and let soil temperature stay
      above 12°C. Harmless to people, pets and plants.
    precautions_de: >-
      Das lebende Produkt rasch verwenden und nie mit heißem Wasser oder
      chemischen Gießmitteln kombinieren. UV-Licht meiden und die
      Bodentemperatur über 12 °C halten. Unschädlich für Mensch, Haustier
      und Pflanze.

  - name: Insecticidal Soap (Potassium Salts)
    name_de: Kaliseife (Schmierseife)
    treatment_type: biological
    active_ingredient: potassium salts of fatty acids
    application_method: spray
    safety_interval_days: 1
    dosage_per_liter: 10.0
    protective_equipment: [gloves]
    description: >-
      Contact insecticide effective against soft-bodied insects (aphids,
      whitefly, mealybug, spider mites, thrips). Disrupts cell membranes
      on contact. No residual activity — must contact pest directly.
      Safe for beneficial insects once dry. Repeat every 5-7 days.
    description_de: >-
      Kontakt-Insektizid gegen weichhäutige Insekten (Blattläuse, Weiße
      Fliege, Wollläuse, Spinnmilben, Thripse). Zerstört bei Kontakt die
      Zellmembranen. Keine Dauerwirkung — muss den Schädling direkt treffen.
      Nach dem Antrocknen schonend für Nützlinge. Alle 5-7 Tage wiederholen.
    how_to_apply: >-
      Spray 10 ml/L so it directly wets the pests, especially leaf
      undersides. Coverage is everything — it only works on contact.
      Repeat every 5-7 days until the infestation clears.
    how_to_apply_de: >-
      10 ml/L so spritzen, dass die Schädlinge direkt benetzt werden, vor
      allem an den Blattunterseiten. Die Benetzung ist entscheidend — es
      wirkt nur bei Kontakt. Alle 5-7 Tage wiederholen, bis der Befall weg ist.
    mode_of_action: >-
      The fatty-acid salts dissolve the protective wax layer and disrupt the
      cell membranes of soft-bodied insects, causing dehydration and
      collapse.
    mode_of_action_de: >-
      Die Fettsäuresalze lösen die schützende Wachsschicht und zerstören die
      Zellmembranen weichhäutiger Insekten, was zu Austrocknung und Tod
      führt.
    precautions: >-
      Can scorch sensitive plants — test on a few leaves first and avoid
      strong sun. Safe for beneficials once dry. Keep the short 1-day
      pre-harvest interval.
    precautions_de: >-
      Kann empfindliche Pflanzen verbrennen — erst an wenigen Blättern testen
      und starke Sonne meiden. Nach dem Antrocknen nützlingsschonend. Die
      kurze Wartezeit von 1 Tag einhalten.

  # --- New treatments ---

  # Biological — beneficial organisms
  - name: Trichogramma spp. (Egg Parasitoids)
    name_de: Trichogramma-Schlupfwespen (Eiparasiten)
    treatment_type: biological
    application_method: release
    description: >-
      Trichogramma-Schlupfwespen — tiny parasitic wasps that lay eggs
      inside pest moth eggs (Pieris, Cydia, Ostrinia). Applied as
      cards with parasitized eggs, 3-5 releases at 7-day intervals.
      100,000-200,000 wasps per 1,000 m². Effective against cabbage
      white, codling moth, and corn borer.
    description_de: >-
      Trichogramma-Schlupfwespen — winzige Schlupfwespen, die ihre Eier in
      die Eier von Schadschmetterlingen (Pieris, Cydia, Ostrinia) legen. Als
      Kärtchen mit parasitierten Eiern, 3-5 Freilassungen im 7-Tage-Abstand,
      100.000-200.000 Wespen pro 1.000 m². Wirkt gegen Kohlweißling,
      Apfelwickler und Maiszünsler.
    how_to_apply: >-
      Hang or place the parasitised-egg cards in the crop at the start of
      the pest's egg-laying period, timed via pheromone traps. Make 3-5
      releases at weekly intervals.
    how_to_apply_de: >-
      Die Kärtchen mit parasitierten Eiern zu Beginn der Eiablage des
      Schädlings im Bestand aufhängen oder auslegen, zeitlich über
      Pheromonfallen abgestimmt. 3-5 Freilassungen im Wochenabstand.
    mode_of_action: >-
      The wasp lays its eggs inside the pest's eggs; the developing wasp
      consumes the egg contents, so the pest caterpillar never hatches.
    mode_of_action_de: >-
      Die Wespe legt ihre Eier in die Eier des Schädlings; die heranwachsende
      Wespe frisst den Eiinhalt auf, sodass die Schadraupe gar nicht erst
      schlüpft.
    precautions: >-
      Timing is critical — release at egg-laying, not after caterpillars
      hatch. Do not combine with insecticides, which kill the wasps.
    precautions_de: >-
      Der Zeitpunkt ist entscheidend — zur Eiablage freilassen, nicht erst
      nach dem Raupenschlupf. Nicht mit Insektiziden kombinieren, diese töten
      die Wespen.

  - name: Heterorhabditis bacteriophora (Nematodes)
    name_de: Nematoden (Heterorhabditis bacteriophora)
    treatment_type: biological
    application_method: drench
    description: >-
      Beneficial nematodes for biological control of black vine weevil
      larvae (Otiorhynchus sulcatus) and other soil-dwelling grubs.
      Applied as drench at 500,000 nematodes per m². Optimal soil
      temperature 12-25°C. Apply in evening or overcast conditions
      (UV-sensitive). Larvae die within 48-72 hours. Best applied
      Aug-Oct when larvae are actively feeding.
    description_de: >-
      Nützliche Nematoden zur biologischen Bekämpfung der Larven des
      Dickmaulrüsslers (Otiorhynchus sulcatus) und anderer bodenlebender
      Engerlinge. Als Gießung mit 500.000 Nematoden pro m². Optimale
      Bodentemperatur 12-25 °C. Abends oder bei Bewölkung ausbringen
      (UV-empfindlich). Larven sterben binnen 48-72 Stunden. Am besten von
      August bis Oktober, wenn die Larven aktiv fressen.
    how_to_apply: >-
      Dissolve in water and drench onto moist soil at 500,000 per m², ideally
      Aug-Oct. Keep the soil moist for 1-2 weeks. Apply in the evening to
      avoid UV.
    how_to_apply_de: >-
      In Wasser auflösen und mit 500.000 pro m² auf feuchten Boden gießen,
      idealerweise August bis Oktober. Den Boden 1-2 Wochen feucht halten.
      Abends ausbringen, um UV zu vermeiden.
    mode_of_action: >-
      The nematodes penetrate the weevil grubs and release symbiotic
      bacteria that kill the larva within 2-3 days.
    mode_of_action_de: >-
      Die Nematoden dringen in die Rüsslerlarven ein und setzen symbiotische
      Bakterien frei, die die Larve binnen 2-3 Tagen töten.
    precautions: >-
      Use the living product promptly, keep soil above 12°C and avoid mixing
      with chemicals. Harmless to people, pets and plants.
    precautions_de: >-
      Das lebende Produkt rasch verwenden, den Boden über 12 °C halten und
      nicht mit Chemikalien mischen. Unschädlich für Mensch, Haustier und
      Pflanze.

  - name: Amblyseius swirskii
    name_de: Raubmilbe (Amblyseius swirskii)
    treatment_type: biological
    application_method: release
    description: >-
      Predatory mite (Raubmilbe) effective against thrips larvae and
      whitefly eggs/larvae. Release rate: 50-100 per m². Optimal
      conditions: 20-28°C, >60% RH. Also feeds on pollen as
      alternative food source, allowing preventive establishment.
      Compatible with most biological control agents.
    description_de: >-
      Raubmilbe, wirksam gegen Thripslarven und Eier/Larven der Weißen
      Fliege. Ausbringrate 50-100 pro m². Optimal bei 20-28 °C und >60 %
      Luftfeuchte. Frisst auch Pollen als Ausweichnahrung, sodass eine
      vorbeugende Etablierung möglich ist. Verträglich mit den meisten
      anderen Nützlingen.
    how_to_apply: >-
      Sprinkle from sachets or bulk material onto the foliage, 50-100 per m²,
      preventively or at first thrips/whitefly signs. Slow-release sachets
      keep populations going for weeks.
    how_to_apply_de: >-
      Aus Tütchen oder als Streumaterial mit 50-100 pro m² auf das Laub
      ausbringen, vorbeugend oder bei ersten Thrips-/Weiße-Fliege-Anzeichen.
      Depot-Tütchen erhalten die Population über Wochen.
    mode_of_action: >-
      The predatory mite eats thrips larvae and whitefly eggs and young
      larvae; pollen as alternative food lets it persist even at low pest
      levels.
    mode_of_action_de: >-
      Die Raubmilbe frisst Thripslarven sowie Eier und Junglarven der Weißen
      Fliege; Pollen als Ausweichnahrung lässt sie auch bei geringem
      Schädlingsdruck überdauern.
    precautions: >-
      Needs warmth (>20°C) and humidity above 60% to thrive. Do not combine
      with broad-spectrum insecticides.
    precautions_de: >-
      Braucht Wärme (>20 °C) und über 60 % Luftfeuchte, um zu gedeihen. Nicht
      mit Breitband-Insektiziden kombinieren.

  - name: Chrysoperla carnea (Lacewing Larvae)
    name_de: Florfliegen-Larven (Chrysoperla carnea)
    treatment_type: biological
    application_method: release
    description: >-
      Florfliegen-Larven — voracious predators of aphids, also
      effective against small caterpillars, mealybugs, thrips, and
      spider mites. Each larva consumes 200-500 aphids during
      development. Release rate: 5-10 larvae per m². Larvae active
      for 2-3 weeks. Can be applied to specific hotspots.
    description_de: >-
      Florfliegen-Larven — gefräßige Räuber von Blattläusen, wirksam auch
      gegen kleine Raupen, Wollläuse, Thripse und Spinnmilben. Jede Larve
      frisst während ihrer Entwicklung 200-500 Blattläuse. Ausbringrate
      5-10 Larven pro m². Larven 2-3 Wochen aktiv. Gezielt an Befallsnestern
      einsetzbar.
    how_to_apply: >-
      Distribute the larvae directly onto aphid colonies, 5-10 per m². Best
      at 15-25°C. A single release usually suffices for a localised hotspot.
    how_to_apply_de: >-
      Die Larven direkt auf die Blattlauskolonien verteilen, 5-10 pro m².
      Optimal bei 15-25 °C. Für ein örtliches Befallsnest reicht meist eine
      Freilassung.
    mode_of_action: >-
      The predatory larvae seize aphids and other soft-bodied pests with
      their sickle-shaped jaws and suck them dry.
    mode_of_action_de: >-
      Die Räuberlarven packen Blattläuse und andere weichhäutige Schädlinge
      mit ihren sichelförmigen Zangen und saugen sie aus.
    precautions: >-
      Avoid ant activity, which protects aphids from the larvae. Do not use
      alongside insecticides.
    precautions_de: >-
      Ameisenaktivität meiden, da Ameisen die Blattläuse vor den Larven
      schützen. Nicht zusammen mit Insektiziden einsetzen.

  - name: Adalia bipunctata (Two-Spot Ladybird)
    name_de: Zweipunkt-Marienkäfer (Adalia bipunctata)
    treatment_type: biological
    application_method: release
    description: >-
      Marienkäfer — classic biological aphid control. Adults and
      larvae both consume aphids. One larva eats up to 400 aphids
      during development. Release rate: 5-20 per m² depending on
      infestation level. Adults may fly away in outdoor settings;
      larval releases are more reliable for targeted control.
    description_de: >-
      Marienkäfer — klassische biologische Blattlausbekämpfung. Sowohl
      adulte Tiere als auch Larven fressen Blattläuse. Eine Larve frisst
      während ihrer Entwicklung bis zu 400 Blattläuse. Ausbringrate je nach
      Befall 5-20 pro m². Adulte fliegen im Freiland oft ab;
      Larvenfreilassungen sind für die gezielte Bekämpfung zuverlässiger.
    how_to_apply: >-
      Release larvae directly onto aphid colonies, 5-20 per m². Larvae stay
      put and feed reliably; use larvae rather than adults for targeted
      control.
    how_to_apply_de: >-
      Larven direkt auf die Blattlauskolonien ausbringen, 5-20 pro m². Larven
      bleiben am Ort und fressen zuverlässig; für gezielte Bekämpfung Larven
      statt adulte Käfer verwenden.
    mode_of_action: >-
      Both larvae and adults are voracious aphid predators that rapidly
      reduce dense colonies.
    mode_of_action_de: >-
      Sowohl Larven als auch adulte Käfer sind gefräßige Blattlausräuber, die
      dichte Kolonien rasch reduzieren.
    precautions: >-
      Control ants first, as they defend aphids. Adults released outdoors
      often disperse — prefer larval releases. Do not combine with
      insecticides.
    precautions_de: >-
      Zuerst Ameisen eindämmen, da sie Blattläuse verteidigen. Im Freiland
      freigelassene Adulte fliegen oft ab — Larvenfreilassungen bevorzugen.
      Nicht mit Insektiziden kombinieren.

  - name: Bacillus subtilis
    name_de: Bacillus subtilis
    treatment_type: biological
    active_ingredient: bacillus subtilis
    application_method: spray
    safety_interval_days: 0
    dosage_per_liter: 2.0
    protective_equipment: [gloves]
    description: >-
      Biological fungicide effective against powdery mildew, botrytis,
      and various soil-borne pathogens. Colonizes plant surfaces and
      competes with pathogenic fungi. Preventive application most
      effective — spray every 7-10 days. Safe for beneficial insects.
      No harvest waiting period (Karenzzeit). Approved for organic
      farming.
    description_de: >-
      Biologisches Fungizid gegen Echten Mehltau, Grauschimmel und
      verschiedene bodenbürtige Erreger. Besiedelt die Pflanzenoberfläche
      und verdrängt Schadpilze. Vorbeugende Anwendung am wirksamsten — alle
      7-10 Tage spritzen. Nützlingsschonend. Keine Wartezeit (Karenzzeit).
      Für den ökologischen Anbau zugelassen.
    how_to_apply: >-
      Spray 2 ml/L (or per label) onto all surfaces preventively or at first
      symptoms, repeating every 7-10 days. Best applied before disease takes
      hold.
    how_to_apply_de: >-
      2 ml/L (oder nach Etikett) vorbeugend oder bei ersten Symptomen auf
      alle Flächen sprühen, alle 7-10 Tage wiederholen. Am besten anwenden,
      bevor die Krankheit Fuß fasst.
    mode_of_action: >-
      The beneficial bacterium colonises leaf and root surfaces, outcompeting
      pathogens for space and nutrients and producing antifungal compounds.
    mode_of_action_de: >-
      Das nützliche Bakterium besiedelt Blatt- und Wurzeloberflächen,
      verdrängt Erreger im Wettbewerb um Platz und Nährstoffe und bildet
      pilzhemmende Stoffe.
    precautions: >-
      Largely preventive — limited curative effect on established infections.
      Store cool and use before expiry to keep the bacteria viable. Safe for
      bees and beneficials; no pre-harvest interval.
    precautions_de: >-
      Überwiegend vorbeugend — begrenzte Heilwirkung bei bestehendem Befall.
      Kühl lagern und vor Ablauf verbrauchen, damit die Bakterien lebensfähig
      bleiben. Schonend für Bienen und Nützlinge; keine Wartezeit.

  - name: Trichoderma harzianum
    name_de: Trichoderma harzianum
    treatment_type: biological
    active_ingredient: trichoderma harzianum
    application_method: drench
    safety_interval_days: 0
    dosage_per_liter: 1.0
    protective_equipment: [gloves]
    description: >-
      Biological soil fungicide. Beneficial fungus that colonizes
      the rhizosphere and protects roots against Fusarium, Pythium,
      Rhizoctonia, and other soil pathogens. Apply as drench or mix
      into growing media. Preventive use most effective. Also promotes
      root growth. Approved for organic farming.
    description_de: >-
      Biologisches Boden-Fungizid. Nützlicher Pilz, der die Wurzelzone
      besiedelt und die Wurzeln gegen Fusarium, Pythium, Rhizoctonia und
      andere Bodenerreger schützt. Als Gießung anwenden oder ins Substrat
      mischen. Vorbeugend am wirksamsten. Fördert zudem das Wurzelwachstum.
      Für den ökologischen Anbau zugelassen.
    how_to_apply: >-
      Apply as a soil drench at 1 g/L or mix into the growing medium at
      potting/sowing. Use preventively; reapply every few weeks during the
      growing season.
    how_to_apply_de: >-
      Als Bodengießung mit 1 g/L anwenden oder beim Topfen/Aussäen ins
      Substrat mischen. Vorbeugend einsetzen; während der Saison alle paar
      Wochen wiederholen.
    mode_of_action: >-
      The beneficial fungus colonises the root zone, parasitises and
      outcompetes soil pathogens, and stimulates stronger root growth.
    mode_of_action_de: >-
      Der nützliche Pilz besiedelt die Wurzelzone, parasitiert und verdrängt
      Bodenerreger und regt ein kräftigeres Wurzelwachstum an.
    precautions: >-
      Preventive rather than curative. Do not combine with chemical
      fungicides, which kill the beneficial fungus. Store cool to keep spores
      viable.
    precautions_de: >-
      Eher vorbeugend als heilend. Nicht mit chemischen Fungiziden
      kombinieren, diese töten den Nützlingspilz. Kühl lagern, damit die
      Sporen lebensfähig bleiben.

  # Chemical — fungicides
  - name: Copper Fungicide (Bordeaux Mixture)
    name_de: Kupferpräparat (Bordeauxbrühe)
    treatment_type: chemical
    active_ingredient: copper sulfate + calcium hydroxide
    application_method: spray
    safety_interval_days: 21
    dosage_per_liter: 5.0
    protective_equipment: [gloves, mask, goggles]
    description: >-
      Kupferpräparat (Bordeauxbrühe) — broad-spectrum contact
      fungicide effective against downy mildew, late blight, fire
      blight, bacterial canker, and many other fungal/bacterial
      diseases. Preventive only — does not cure existing infections.
      IMPORTANT: Copper accumulates in soil; max 3 kg Cu/ha/year
      (EU organic limit). Do not apply above 25°C or in direct
      sunlight (phytotoxicity risk). Harmful to aquatic organisms.
    description_de: >-
      Kupferpräparat (Bordeauxbrühe) — breit wirkendes Kontakt-Fungizid
      gegen Falschen Mehltau, Kraut- und Knollenfäule, Feuerbrand,
      Bakterienkrebs und viele weitere Pilz- und Bakterienkrankheiten. Nur
      vorbeugend — heilt bestehenden Befall nicht. WICHTIG: Kupfer reichert
      sich im Boden an; max. 3 kg Cu/ha/Jahr (EU-Öko-Grenze). Nicht über
      25 °C oder bei direkter Sonne anwenden (Verbrennungsgefahr).
      Wassergefährdend.
    how_to_apply: >-
      Spray 5 g/L evenly onto dry foliage preventively, before infection
      periods (wet weather). Apply in cool conditions, not in direct sun,
      and reapply after rain.
    how_to_apply_de: >-
      5 g/L vorbeugend gleichmäßig auf trockenes Laub spritzen, vor
      Infektionsperioden (Nasswetter). Bei kühlen Bedingungen anwenden, nicht
      in direkter Sonne, und nach Regen erneuern.
    mode_of_action: >-
      Copper ions form a protective film on the surface and denature
      pathogen enzymes, stopping fungal and bacterial spores from
      germinating.
    mode_of_action_de: >-
      Kupferionen bilden einen Schutzfilm auf der Oberfläche und denaturieren
      Erreger-Enzyme, sodass Pilz- und Bakteriensporen nicht keimen können.
    precautions: >-
      Copper accumulates in soil and harms aquatic life — stay within the
      3 kg Cu/ha/year limit and keep away from water. Wear gloves, mask and
      goggles. Observe the 21-day pre-harvest interval.
    precautions_de: >-
      Kupfer reichert sich im Boden an und schadet Wasserorganismen — die
      Grenze von 3 kg Cu/ha/Jahr einhalten und von Gewässern fernhalten.
      Handschuhe, Maske und Schutzbrille tragen. Die Wartezeit von 21 Tagen
      einhalten.

  - name: Sulfur (Wettable)
    name_de: Netzschwefel
    treatment_type: chemical
    active_ingredient: elemental sulfur
    application_method: spray
    safety_interval_days: 7
    dosage_per_liter: 3.0
    protective_equipment: [gloves, mask]
    description: >-
      Netzschwefel — contact fungicide primarily for powdery mildew
      control. Also effective against rust, apple scab, and some
      mites. Apply preventively at 7-10 day intervals. Do NOT apply
      above 30°C (leaf burn risk) or within 14 days of oil-based
      sprays. Approved for organic farming. Harmful to predatory
      mites — maintain distance from biocontrol releases.
    description_de: >-
      Netzschwefel — Kontakt-Fungizid vor allem gegen Echten Mehltau. Wirkt
      auch gegen Rost, Apfelschorf und einige Milben. Vorbeugend im
      7-10-Tage-Abstand anwenden. NICHT über 30 °C (Verbrennungsgefahr) oder
      innerhalb von 14 Tagen nach ölhaltigen Spritzungen ausbringen. Für den
      ökologischen Anbau zugelassen. Schädlich für Raubmilben — Abstand zu
      Nützlings-Freilassungen halten.
    how_to_apply: >-
      Spray 3 g/L preventively every 7-10 days at temperatures below 30°C.
      Cover both leaf surfaces. Reapply after rain.
    how_to_apply_de: >-
      3 g/L vorbeugend alle 7-10 Tage bei Temperaturen unter 30 °C spritzen.
      Beide Blattseiten benetzen. Nach Regen erneuern.
    mode_of_action: >-
      Sulfur releases vapour that inhibits spore germination and fungal
      metabolism on the leaf surface.
    mode_of_action_de: >-
      Schwefel setzt Dampf frei, der die Sporenkeimung und den Pilzstoffwechsel
      auf der Blattoberfläche hemmt.
    precautions: >-
      Do not apply above 30°C or within 14 days of oil sprays (leaf burn).
      Harmful to predatory mites — keep away from biocontrol areas. Keep the
      7-day pre-harvest interval.
    precautions_de: >-
      Nicht über 30 °C oder innerhalb von 14 Tagen nach Ölspritzungen
      anwenden (Blattverbrennung). Schädlich für Raubmilben — von
      Nützlingsbereichen fernhalten. Die Wartezeit von 7 Tagen einhalten.

  - name: Potassium Bicarbonate
    name_de: Kaliumhydrogencarbonat
    treatment_type: biological
    active_ingredient: potassium bicarbonate
    application_method: spray
    safety_interval_days: 0
    dosage_per_liter: 5.0
    protective_equipment: [gloves]
    description: >-
      Kaliumhydrogencarbonat — mild fungicide effective against
      powdery mildew. Changes leaf surface pH to inhibit spore
      germination. Very low toxicity, no harvest waiting period.
      Apply every 7-10 days. Can cause leaf burn at high
      concentrations on sensitive plants. Approved for organic farming.
    description_de: >-
      Kaliumhydrogencarbonat — mildes Fungizid gegen Echten Mehltau. Ändert
      den pH-Wert der Blattoberfläche und hemmt so die Sporenkeimung. Sehr
      geringe Toxizität, keine Wartezeit. Alle 7-10 Tage anwenden. Kann bei
      empfindlichen Pflanzen in hoher Konzentration Blattverbrennungen
      verursachen. Für den ökologischen Anbau zugelassen.
    how_to_apply: >-
      Spray 5 g/L onto affected foliage at first signs of mildew, repeating
      every 7-10 days. Has some curative effect on early powdery mildew.
    how_to_apply_de: >-
      5 g/L bei ersten Mehltau-Anzeichen auf das befallene Laub sprühen, alle
      7-10 Tage wiederholen. Hat bei frühem Echtem Mehltau eine gewisse
      Heilwirkung.
    mode_of_action: >-
      Raises the pH on the leaf surface and dehydrates mildew spores,
      stopping germination and halting early colonies.
    mode_of_action_de: >-
      Erhöht den pH-Wert auf der Blattoberfläche und trocknet Mehltausporen
      aus, sodass die Keimung stoppt und frühe Kolonien zum Stillstand kommen.
    precautions: >-
      Can scorch sensitive plants at high doses — test first and avoid strong
      sun. Very low toxicity, safe for beneficials and no pre-harvest
      interval.
    precautions_de: >-
      Kann empfindliche Pflanzen bei hoher Dosis verbrennen — erst testen und
      starke Sonne meiden. Sehr geringe Toxizität, nützlingsschonend und ohne
      Wartezeit.

  # Mechanical — barriers and traps
  - name: Crop Protection Netting (0.8mm)
    name_de: Kulturschutznetz (0,8 mm)
    treatment_type: mechanical
    application_method: cultural
    description: >-
      Kulturschutznetz — fine mesh netting (0.8mm Maschenweite) as
      physical barrier against cabbage white butterfly, carrot rust
      fly, cabbage root fly, onion fly, leek moth, and flea beetles.
      Install immediately after sowing/transplanting. Edges must be
      buried or weighted to prevent entry. Remove for pollinator
      access on flowering crops. Reusable for multiple seasons.
    description_de: >-
      Kulturschutznetz — engmaschiges Netz (0,8 mm Maschenweite) als
      physische Barriere gegen Kohlweißling, Möhrenfliege, Kohlfliege,
      Zwiebelfliege, Lauchmotte und Erdflöhe. Direkt nach Aussaat/Pflanzung
      auflegen. Ränder eingraben oder beschweren, um das Eindringen zu
      verhindern. Bei Blühkulturen für Bestäuber abnehmen. Über mehrere
      Saisons wiederverwendbar.
    how_to_apply: >-
      Lay the net over hoops or directly on the crop right after sowing or
      planting, and bury or weight all edges so no insects can crawl under.
    how_to_apply_de: >-
      Das Netz direkt nach Aussaat oder Pflanzung über Bügel oder direkt auf
      die Kultur legen und alle Ränder eingraben oder beschweren, damit keine
      Insekten darunter kriechen.
    mode_of_action: >-
      A purely physical barrier — the mesh is too fine for the pest insects
      to pass, so they cannot reach the crop to feed or lay eggs.
    mode_of_action_de: >-
      Eine rein physische Barriere — die Maschen sind zu fein für die
      Schadinsekten, sodass diese die Kultur weder zum Fraß noch zur Eiablage
      erreichen.
    precautions: >-
      Remove during flowering of insect-pollinated crops so bees can reach
      the blossoms. Make sure no pests are trapped underneath before closing.
    precautions_de: >-
      Bei insektenbestäubten Kulturen während der Blüte abnehmen, damit Bienen
      an die Blüten gelangen. Vor dem Schließen sicherstellen, dass keine
      Schädlinge darunter eingeschlossen sind.

  - name: Pheromone Trap (Codling Moth)
    name_de: Pheromonfalle (Apfelwickler)
    treatment_type: mechanical
    application_method: cultural
    description: >-
      Pheromonfalle Apfelwickler — species-specific lure traps for
      monitoring and mass trapping of Cydia pomonella. Place 1 trap
      per 3-5 trees at head height (1.5-2m) from May to September.
      Replace pheromone lures every 6-8 weeks. Primarily a monitoring
      tool — combine with other methods for effective control.
    description_de: >-
      Pheromonfalle Apfelwickler — artspezifische Lockstofffalle zum
      Monitoring und Massenfang von Cydia pomonella. 1 Falle je 3-5 Bäume in
      Kopfhöhe (1,5-2 m) von Mai bis September aufhängen. Pheromon-Dispenser
      alle 6-8 Wochen erneuern. Vor allem Monitoring-Werkzeug — für wirksame
      Bekämpfung mit anderen Methoden kombinieren.
    how_to_apply: >-
      Hang one trap per 3-5 trees at 1.5-2 m from May to September. Replace
      the lure every 6-8 weeks and check weekly to time other measures.
    how_to_apply_de: >-
      Eine Falle je 3-5 Bäume in 1,5-2 m Höhe von Mai bis September aufhängen.
      Den Lockstoff alle 6-8 Wochen erneuern und wöchentlich kontrollieren, um
      weitere Maßnahmen zeitlich abzustimmen.
    mode_of_action: >-
      The synthetic female sex pheromone lures male moths onto the sticky
      surface, where they are caught — disrupting mating and signalling peak
      flight.
    mode_of_action_de: >-
      Das synthetische weibliche Sexualpheromon lockt männliche Falter auf die
      Klebefläche, wo sie gefangen werden — das stört die Paarung und zeigt
      den Flughöhepunkt an.
    precautions: >-
      Mainly for monitoring and timing, not full control on its own. Use the
      catch peak to time Bt or granulovirus sprays.
    precautions_de: >-
      Vor allem zur Überwachung und Terminierung, allein keine vollständige
      Bekämpfung. Den Fanghöhepunkt nutzen, um Bt- oder Granulovirus-
      Spritzungen zu terminieren.

  - name: Pheromone Trap (Cherry Fruit Fly)
    name_de: Pheromonfalle (Kirschfruchtfliege)
    treatment_type: mechanical
    application_method: cultural
    description: >-
      Pheromonfalle Kirschfruchtfliege — yellow sticky traps with
      ammonium attractant for Rhagoletis cerasi monitoring and mass
      trapping. Hang in tree canopy from mid-May. 4-6 traps per tree
      for mass trapping. Check weekly and replace when covered.
    description_de: >-
      Pheromonfalle Kirschfruchtfliege — gelbe Leimtafeln mit
      Ammonium-Lockstoff zum Monitoring und Massenfang von Rhagoletis cerasi.
      Ab Mitte Mai in die Baumkrone hängen. Für den Massenfang 4-6 Fallen je
      Baum. Wöchentlich kontrollieren und bei Belegung austauschen.
    how_to_apply: >-
      Hang yellow sticky traps with the ammonium lure in the sunny side of
      the canopy from mid-May, 4-6 per tree for mass trapping. Check weekly
      and replace when full.
    how_to_apply_de: >-
      Gelbe Leimtafeln mit Ammonium-Lockstoff ab Mitte Mai auf der Sonnenseite
      der Krone aufhängen, für den Massenfang 4-6 je Baum. Wöchentlich
      kontrollieren und bei Belegung austauschen.
    mode_of_action: >-
      The yellow colour and ammonium scent attract the flies onto the sticky
      surface before they lay eggs in the ripening cherries.
    mode_of_action_de: >-
      Die gelbe Farbe und der Ammonium-Duft locken die Fliegen auf die
      Klebefläche, bevor sie ihre Eier in die reifenden Kirschen ablegen.
    precautions: >-
      Most effective on early/mid-season cherries; combine with netting on
      heavily infested trees. Replace promptly once fully covered.
    precautions_de: >-
      Am wirksamsten bei früh und mittel reifenden Kirschen; bei starkem
      Befall mit Netzen kombinieren. Bei voller Belegung umgehend austauschen.

  - name: Slug Fence (Copper Barrier)
    name_de: Schneckenzaun (Kupferband)
    treatment_type: mechanical
    application_method: cultural
    description: >-
      Schneckenzaun (Kupferband) — copper barriers that deter slugs
      through galvanic reaction with slug slime. Install around raised
      beds or individual plant groups. Height minimum 5cm. Keep
      vegetation from bridging the barrier. Effective but requires
      ensuring no slugs are already inside the protected area.
    description_de: >-
      Schneckenzaun (Kupferband) — Kupferbarrieren, die Schnecken durch eine
      galvanische Reaktion mit dem Schneckenschleim abwehren. Um Hochbeete
      oder einzelne Pflanzengruppen anbringen. Mindesthöhe 5 cm. Keine
      Pflanzen über die Barriere hinwegwachsen lassen. Wirksam, erfordert aber
      sicherzustellen, dass keine Schnecken bereits im geschützten Bereich
      sind.
    how_to_apply: >-
      Fix the copper strip around the bed edge at least 5 cm high. Keep the
      top edge clean and stop leaves or stems from bridging it.
    how_to_apply_de: >-
      Das Kupferband mindestens 5 cm hoch um den Beetrand anbringen. Die
      Oberkante sauber halten und verhindern, dass Blätter oder Stängel sie
      überbrücken.
    mode_of_action: >-
      Contact between the copper and the slug's slime creates a small
      electric charge the slug avoids, keeping it out of the protected bed.
    mode_of_action_de: >-
      Der Kontakt zwischen Kupfer und Schneckenschleim erzeugt eine schwache
      elektrische Ladung, die die Schnecke meidet und so vom geschützten Beet
      fernhält.
    precautions: >-
      Make sure no slugs or eggs are already inside before fencing.
      Plants and weeds touching both sides create a bridge that defeats the
      barrier.
    precautions_de: >-
      Vor dem Einzäunen sicherstellen, dass innen keine Schnecken oder Eier
      sind. Pflanzen und Unkraut, die beide Seiten berühren, bilden eine
      Brücke und heben die Wirkung auf.

  - name: Slug Pellets (Ferric Phosphate)
    name_de: Schneckenkorn (Eisen-III-Phosphat)
    treatment_type: biological
    active_ingredient: iron(III) phosphate
    application_method: granular
    safety_interval_days: 0
    protective_equipment: [gloves]
    description: >-
      Schneckenkorn (Eisen-III-Phosphat) — slug and snail control
      approved for organic farming. Slugs stop feeding immediately
      after ingestion and die within 3-6 days. Apply 5 g/m² evenly.
      Safe for hedgehogs, pets, and soil organisms. Breaks down into
      iron and phosphate — natural soil components. Reapply after
      heavy rain.
    description_de: >-
      Schneckenkorn (Eisen-III-Phosphat) — für den ökologischen Anbau
      zugelassene Schneckenbekämpfung. Schnecken stellen nach der Aufnahme
      sofort das Fressen ein und sterben binnen 3-6 Tagen. 5 g/m² gleichmäßig
      ausbringen. Unschädlich für Igel, Haustiere und Bodenorganismen. Zerfällt
      zu Eisen und Phosphat — natürliche Bodenbestandteile. Nach starkem Regen
      erneuern.
    how_to_apply: >-
      Scatter 5 g/m² thinly and evenly over the soil around vulnerable plants
      in the evening, when slugs are active. Reapply after heavy rain.
    how_to_apply_de: >-
      5 g/m² abends, wenn Schnecken aktiv sind, dünn und gleichmäßig über den
      Boden um gefährdete Pflanzen streuen. Nach starkem Regen erneuern.
    mode_of_action: >-
      The ferric phosphate damages the slug's digestive cells after
      ingestion; the slug stops feeding at once and retreats to die,
      usually unseen.
    mode_of_action_de: >-
      Das Eisen-III-Phosphat schädigt nach der Aufnahme die Verdauungszellen
      der Schnecke; sie stellt sofort das Fressen ein und zieht sich zum
      Sterben zurück, meist unsichtbar.
    precautions: >-
      Safe for hedgehogs, pets and soil life, but do not over-apply — scatter
      thinly. Keep pellets off edible plant parts.
    precautions_de: >-
      Schonend für Igel, Haustiere und Bodenleben, aber nicht überdosieren —
      dünn ausstreuen. Korn nicht auf essbare Pflanzenteile bringen.

  - name: Granulovirus (CpGV)
    name_de: Apfelwickler-Granulovirus (CpGV)
    treatment_type: biological
    application_method: spray
    safety_interval_days: 0
    description: >-
      Apfelwickler-Granulovirus — highly specific biological
      insecticide against codling moth (Cydia pomonella) larvae.
      Larvae ingest virus particles on treated fruit surface and die
      within 3-5 days. Apply at egg hatching (monitor with pheromone
      traps). 3-4 applications at 8-day intervals. Harmless to all
      non-target organisms. Approved for organic farming.
    description_de: >-
      Apfelwickler-Granulovirus — hochspezifisches biologisches Insektizid
      gegen Larven des Apfelwicklers (Cydia pomonella). Die Larven nehmen die
      Viruspartikel auf der behandelten Fruchtoberfläche auf und sterben binnen
      3-5 Tagen. Zum Larvenschlupf anwenden (Monitoring mit Pheromonfallen).
      3-4 Anwendungen im 8-Tage-Abstand. Unschädlich für alle Nichtziel-
      Organismen. Für den ökologischen Anbau zugelassen.
    how_to_apply: >-
      Spray onto the fruit surface at egg hatch (timed with pheromone traps),
      preferably in the evening (UV-sensitive). Make 3-4 applications at
      8-day intervals.
    how_to_apply_de: >-
      Zum Larvenschlupf (über Pheromonfallen terminiert) auf die
      Fruchtoberfläche spritzen, möglichst abends (UV-empfindlich). 3-4
      Anwendungen im 8-Tage-Abstand.
    mode_of_action: >-
      The larva eats virus particles while biting into the fruit; the virus
      multiplies inside and kills it within 3-5 days, before it bores deep.
    mode_of_action_de: >-
      Die Larve nimmt beim Anbohren der Frucht Viruspartikel auf; das Virus
      vermehrt sich in ihr und tötet sie binnen 3-5 Tagen, bevor sie tief
      eindringt.
    precautions: >-
      Extremely specific and harmless to all non-target organisms. Apply in
      the evening and reapply after rain, as UV degrades the virus.
    precautions_de: >-
      Äußerst spezifisch und unschädlich für alle Nichtziel-Organismen. Abends
      anwenden und nach Regen erneuern, da UV-Licht das Virus abbaut.

  - name: Kaolin Clay (Surround)
    name_de: Kaolin-Tonerde
    treatment_type: mechanical
    application_method: spray
    description: >-
      Kaolin-Tonerde — particle film technology. Creates a white
      protective layer on fruit and leaves that deters pest feeding
      and egg-laying. Effective against codling moth, cherry fruit
      fly, apple sawfly, and many other pests. Also reduces sunburn
      on fruit. Apply before pest flight begins. Reapply after rain.
      Washes off at harvest. Approved for organic farming.
    description_de: >-
      Kaolin-Tonerde — Partikelfilm-Technologie. Bildet eine weiße Schutzschicht
      auf Früchten und Blättern, die Fraß und Eiablage der Schädlinge
      abschreckt. Wirkt gegen Apfelwickler, Kirschfruchtfliege, Apfelsägewespe
      und viele weitere Schädlinge. Reduziert zudem Sonnenbrand an Früchten. Vor
      Beginn des Schädlingsflugs anwenden. Nach Regen erneuern. Wird zur Ernte
      abgewaschen. Für den ökologischen Anbau zugelassen.
    how_to_apply: >-
      Spray a fine white film over fruit and leaves before pest flight begins,
      building up 2-3 coats. Reapply after rain and wash fruit at harvest.
    how_to_apply_de: >-
      Vor Beginn des Schädlingsflugs einen feinen weißen Film über Früchte und
      Blätter sprühen, in 2-3 Lagen aufbauen. Nach Regen erneuern und Früchte
      zur Ernte abwaschen.
    mode_of_action: >-
      The white mineral film irritates and disorients pests and masks the
      plant, so they avoid feeding and egg-laying on it.
    mode_of_action_de: >-
      Der weiße Mineralfilm irritiert und verwirrt die Schädlinge und tarnt die
      Pflanze, sodass sie Fraß und Eiablage darauf meiden.
    precautions: >-
      Purely physical and non-toxic, but the white coating is conspicuous —
      it washes off at harvest. Reapply after rain to keep coverage.
    precautions_de: >-
      Rein physisch und ungiftig, aber der weiße Belag ist auffällig — er wird
      zur Ernte abgewaschen. Nach Regen erneuern, um die Bedeckung zu erhalten.

  - name: Beer Trap (Slug)
    name_de: Bierfalle (Schnecken)
    treatment_type: mechanical
    application_method: cultural
    description: >-
      Bierfalle — simple slug trap using shallow containers sunk
      into the ground and filled with beer. Yeast scent attracts
      slugs. Empty and refill every 2-3 days. Note: also attracts
      slugs from surrounding area — use in combination with barriers,
      not as sole control method. Place at bed edges, not in the
      middle of plantings.
    description_de: >-
      Bierfalle — einfache Schneckenfalle aus flachen, in den Boden
      eingelassenen Behältern, die mit Bier gefüllt werden. Der Hefegeruch
      lockt Schnecken an. Alle 2-3 Tage leeren und neu füllen. Hinweis: Lockt
      auch Schnecken aus der Umgebung an — mit Barrieren kombinieren, nicht als
      alleinige Bekämpfung. An den Beeträndern aufstellen, nicht mitten in den
      Pflanzungen.
    how_to_apply: >-
      Sink a shallow container so its rim sits about 2 cm above ground, fill
      with beer and empty/refill every 2-3 days. Place at bed edges.
    how_to_apply_de: >-
      Einen flachen Behälter so eingraben, dass der Rand etwa 2 cm über dem
      Boden steht, mit Bier füllen und alle 2-3 Tage leeren/neu füllen. An den
      Beeträndern aufstellen.
    mode_of_action: >-
      The fermenting yeast scent lures slugs in; they fall into the liquid
      and drown.
    mode_of_action_de: >-
      Der gärende Hefegeruch lockt die Schnecken an; sie fallen in die
      Flüssigkeit und ertrinken.
    precautions: >-
      The rim above ground level prevents ground beetles (slug predators)
      from falling in. As it also draws slugs from outside, pair with
      barriers and place at bed edges, not among plants.
    precautions_de: >-
      Der über den Boden ragende Rand verhindert, dass Laufkäfer (Schnecken-
      Fressfeinde) hineinfallen. Da sie auch Schnecken von außen anlockt, mit
      Barrieren kombinieren und an den Beeträndern aufstellen, nicht zwischen
      den Pflanzen.

  - name: Horticultural Oil (Mineral Oil)
    name_de: Weißöl (Paraffinöl)
    treatment_type: chemical
    active_ingredient: paraffin oil
    application_method: spray
    safety_interval_days: 7
    dosage_per_liter: 15.0
    protective_equipment: [gloves]
    description: >-
      Paraffinöl — suffocating contact insecticide/acaricide effective
      against scale insects, mealybug, whitefly eggs, and overwintering
      pest stages. Winter application (dormant season) at 2-3% on
      fruit trees against overwintering eggs. Summer application at
      1-1.5% with caution (phytotoxicity risk above 25°C). Do NOT
      combine with sulfur sprays (14-day gap minimum).
    description_de: >-
      Paraffinöl — erstickendes Kontakt-Insektizid/Akarizid gegen
      Schildläuse, Wollläuse, Eier der Weißen Fliege und überwinternde
      Schädlingsstadien. Winteranwendung (Ruhephase) mit 2-3 % an Obstbäumen
      gegen überwinternde Eier. Sommeranwendung mit 1-1,5 % unter Vorsicht
      (Verbrennungsgefahr über 25 °C). NICHT mit Schwefelspritzungen
      kombinieren (mindestens 14 Tage Abstand).
    how_to_apply: >-
      Spray to fully coat pests, leaf undersides and bark. Use 2-3% on
      dormant fruit trees in winter, 1-1.5% in summer below 25°C. Repeat
      after 10-14 days if needed.
    how_to_apply_de: >-
      So spritzen, dass Schädlinge, Blattunterseiten und Rinde vollständig
      benetzt sind. Im Winter 2-3 % an ruhenden Obstbäumen, im Sommer 1-1,5 %
      unter 25 °C. Bei Bedarf nach 10-14 Tagen wiederholen.
    mode_of_action: >-
      The oil film coats and blocks the pests' breathing pores (spiracles),
      smothering scale, mealybug and overwintering eggs.
    mode_of_action_de: >-
      Der Ölfilm überzieht und verschließt die Atemöffnungen (Stigmen) der
      Schädlinge und erstickt so Schild- und Wollläuse sowie überwinternde
      Eier.
    precautions: >-
      Do not apply above 25°C or in strong sun (leaf burn), and keep at least
      14 days from sulfur sprays. Observe the 7-day pre-harvest interval.
    precautions_de: >-
      Nicht über 25 °C oder bei starker Sonne anwenden (Blattverbrennung) und
      mindestens 14 Tage Abstand zu Schwefelspritzungen halten. Die Wartezeit
      von 7 Tagen einhalten.

  - name: Diatomaceous Earth
    name_de: Kieselgur (Diatomeenerde)
    treatment_type: mechanical
    application_method: granular
    description: >-
      Kieselgur — fossilized diatom powder that damages insect
      exoskeletons through abrasion, causing dehydration. Effective
      against crawling insects: flea beetles, ants, slugs (partial),
      and various stored-product pests. Apply as dust around plant
      bases or on leaves. Loses effectiveness when wet — reapply
      after rain. Wear mask during application (respiratory irritant).
      Approved for organic farming.
    description_de: >-
      Kieselgur — Pulver aus fossilen Kieselalgen, das den Chitinpanzer von
      Insekten durch Abrieb beschädigt und sie austrocknet. Wirkt gegen
      kriechende Insekten: Erdflöhe, Ameisen, Schnecken (teilweise) und
      diverse Vorratsschädlinge. Als Staub um die Pflanzenbasis oder auf die
      Blätter geben. Verliert nass die Wirkung — nach Regen erneuern. Bei der
      Anwendung Maske tragen (reizt die Atemwege). Für den ökologischen Anbau
      zugelassen.
    how_to_apply: >-
      Dust a thin dry layer around plant bases or onto foliage where crawling
      pests travel. Apply in dry weather; reapply after rain or watering.
    how_to_apply_de: >-
      Eine dünne trockene Schicht um die Pflanzenbasis oder auf das Laub
      stäuben, wo kriechende Schädlinge entlangwandern. Bei trockenem Wetter
      anwenden; nach Regen oder Gießen erneuern.
    mode_of_action: >-
      The microscopically sharp particles abrade the insect's waxy cuticle so
      it loses water and dries out.
    mode_of_action_de: >-
      Die mikroskopisch scharfen Partikel reiben die wächserne Außenhaut der
      Insekten auf, sodass diese Wasser verlieren und austrocknen.
    precautions: >-
      Wear a dust mask — the fine powder irritates airways. Apply targeted
      and sparingly, as it can also harm beneficial ground insects. Only
      works while dry.
    precautions_de: >-
      Eine Staubmaske tragen — das feine Pulver reizt die Atemwege. Gezielt und
      sparsam anwenden, da es auch nützliche Bodeninsekten schädigen kann.
      Wirkt nur im trockenen Zustand.

  # --- Dracaena / indoor treatments ---

  - name: Rubbing Alcohol Swab (70%)
    name_de: Spiritus-Betupfen (70 %)
    treatment_type: mechanical
    application_method: cultural
    description: >-
      Dab 70% isopropyl alcohol directly on mealybugs and scale insects
      with cotton swab. Dissolves the waxy coating and kills on contact.
      Test on a small leaf area first to check for phytotoxicity. No
      safety interval (ornamental use only).
    description_de: >-
      70%igen Isopropylalkohol mit einem Wattestäbchen direkt auf Wollläuse
      und Schildläuse tupfen. Löst die Wachsschicht und tötet bei Kontakt.
      Vorab an einer kleinen Blattstelle auf Verträglichkeit testen. Keine
      Wartezeit (nur für Zierpflanzen).
    how_to_apply: >-
      Dip a cotton swab in 70% isopropyl alcohol and dab each mealybug or
      scale directly. Repeat weekly until no new pests appear; ideal for a
      few houseplants.
    how_to_apply_de: >-
      Ein Wattestäbchen in 70%igen Isopropylalkohol tauchen und jede Woll-
      oder Schildlaus direkt betupfen. Wöchentlich wiederholen, bis keine
      neuen Schädlinge mehr auftreten; ideal für wenige Zimmerpflanzen.
    mode_of_action: >-
      The alcohol dissolves the protective waxy coating and dries out the
      soft-bodied pest on contact.
    mode_of_action_de: >-
      Der Alkohol löst die schützende Wachsschicht und trocknet den
      weichhäutigen Schädling bei Kontakt aus.
    precautions: >-
      Test on one leaf first — alcohol can damage sensitive foliage.
      Ornamental use only, not on plants intended for eating.
    precautions_de: >-
      Erst an einem Blatt testen — Alkohol kann empfindliches Laub schädigen.
      Nur für Zierpflanzen, nicht für zum Verzehr bestimmte Pflanzen.

  - name: Bacillus thuringiensis israelensis (Bti)
    name_de: Bacillus thuringiensis israelensis (Bti)
    treatment_type: biological
    active_ingredient: Bti toxin
    application_method: drench
    safety_interval_days: 0
    description: >-
      Biological control of fungus gnat larvae (Bradysia spp.). Applied
      via irrigation water. Bti produces protein crystals toxic to
      Diptera larvae but harmless to plants, pets, and beneficial
      insects. Products: Gnatrol WDG, Solbac. Apply 2-3 times at
      weekly intervals for best results.
    description_de: >-
      Biologische Bekämpfung von Trauermücken-Larven (Bradysia spp.). Über
      das Gießwasser ausgebracht. Bti bildet Eiweißkristalle, die für
      Zweiflügler-Larven giftig, für Pflanzen, Haustiere und Nützlinge aber
      unschädlich sind. Produkte: Gnatrol WDG, Solbac. Für beste Ergebnisse
      2-3 Mal im Wochenabstand anwenden.
    how_to_apply: >-
      Mix into the irrigation water and water the substrate so larvae in the
      soil ingest it. Apply 2-3 times at weekly intervals to cover the
      hatching cycle.
    how_to_apply_de: >-
      Ins Gießwasser mischen und das Substrat gießen, sodass die Larven im
      Boden es aufnehmen. 2-3 Mal im Wochenabstand anwenden, um den
      Schlupfzyklus abzudecken.
    mode_of_action: >-
      Bti protein crystals destroy the gut lining of fungus gnat larvae after
      ingestion, killing them within a couple of days.
    mode_of_action_de: >-
      Die Bti-Eiweißkristalle zerstören nach der Aufnahme die Darmwand der
      Trauermücken-Larven und töten sie binnen weniger Tage.
    precautions: >-
      Specific to Diptera larvae and harmless to plants, pets and
      beneficials. Use the living product before expiry; no pre-harvest
      interval.
    precautions_de: >-
      Spezifisch für Zweiflügler-Larven und unschädlich für Pflanzen,
      Haustiere und Nützlinge. Das lebende Produkt vor Ablauf verwenden; keine
      Wartezeit.

  # --- Aquatic treatments (Nymphaea) ---

  - name: Submerge Leaves (Aphid Removal)
    name_de: Blätter untertauchen (Blattlaus-Entfernung)
    treatment_type: mechanical
    application_method: cultural
    description: >-
      Push infested water lily leaves briefly underwater (10-15 sec).
      Aphids fall off and are eaten by fish. Fully aquatic-safe, no
      chemicals involved. Repeat weekly during infestation.
    description_de: >-
      Befallene Seerosenblätter kurz untertauchen (10-15 Sek.). Die
      Blattläuse werden abgespült und von den Fischen gefressen. Vollständig
      gewässerverträglich, ohne Chemie. Bei Befall wöchentlich wiederholen.
    how_to_apply: >-
      Gently hold the infested floating leaves under the water surface for
      10-15 seconds with your hand or a stick. Repeat weekly while aphids
      persist.
    how_to_apply_de: >-
      Die befallenen Schwimmblätter mit der Hand oder einem Stock vorsichtig
      10-15 Sekunden unter die Wasseroberfläche drücken. Bei anhaltendem
      Befall wöchentlich wiederholen.
    mode_of_action: >-
      Submerging washes the aphids off the leaf; in a stocked pond the fish
      then eat them.
    mode_of_action_de: >-
      Das Untertauchen spült die Blattläuse vom Blatt; in einem besetzten
      Teich fressen die Fische sie anschließend.
    precautions: >-
      Fully water-safe with no chemicals. Do not submerge for long, to avoid
      damaging the leaves.
    precautions_de: >-
      Völlig gewässerverträglich und chemiefrei. Nicht zu lange untertauchen,
      um die Blätter nicht zu schädigen.

  - name: Remove Infested Leaves (Aquatic)
    name_de: Befallene Blätter entfernen (Wasserpflanzen)
    treatment_type: cultural
    application_method: cultural
    description: >-
      Cut heavily infested or diseased water plant leaves at the stalk
      and dispose in household waste (not compost). Reduces pest and
      pathogen reservoir. Fully aquatic-safe. The primary treatment
      method for pond plants where chemical treatments are prohibited.
    description_de: >-
      Stark befallene oder kranke Wasserpflanzenblätter am Stiel abschneiden
      und im Hausmüll entsorgen (nicht kompostieren). Verringert das
      Schädlings- und Erregerreservoir. Vollständig gewässerverträglich. Die
      wichtigste Maßnahme bei Teichpflanzen, wo chemische Mittel verboten sind.
    how_to_apply: >-
      Cut off heavily infested or diseased leaves at the base of the stalk
      and remove them from the pond. Dispose in household waste, never compost.
    how_to_apply_de: >-
      Stark befallene oder kranke Blätter am Stielansatz abschneiden und aus
      dem Teich entfernen. Im Hausmüll entsorgen, nie kompostieren.
    mode_of_action: >-
      Removing affected foliage directly cuts the pest and pathogen population
      and stops it spreading to healthy growth.
    mode_of_action_de: >-
      Das Entfernen befallener Blätter senkt die Schädlings- und
      Erregerpopulation unmittelbar und verhindert die Ausbreitung auf
      gesunde Triebe.
    precautions: >-
      Do not remove too many leaves at once, as water plants need foliage to
      stay healthy. Keep cut material out of the water and compost.
    precautions_de: >-
      Nicht zu viele Blätter auf einmal entfernen, da Wasserpflanzen Laub zum
      Gesundbleiben brauchen. Schnittgut aus dem Wasser und vom Kompost
      fernhalten.

  - name: Yellow Sticky Traps (Pond Edge)
    name_de: Gelbtafeln (Teichrand)
    treatment_type: mechanical
    application_method: cultural
    description: >-
      Place yellow sticky traps 30-50 cm above water surface at pond
      edge. Catches flying water lily aphids and beetles. Do NOT place
      directly over water (risk of trapping beneficial insects and
      birds). Monitoring and mass-trapping function.
    description_de: >-
      Gelbtafeln 30-50 cm über der Wasseroberfläche am Teichrand anbringen.
      Fängt fliegende Seerosen-Blattläuse und Käfer. NICHT direkt über dem
      Wasser platzieren (Gefahr, Nützlinge und Vögel zu fangen).
      Monitoring- und Massenfangfunktion.
    how_to_apply: >-
      Mount yellow sticky traps 30-50 cm above the water at the pond edge,
      not over open water. Check weekly and replace when covered.
    how_to_apply_de: >-
      Gelbtafeln 30-50 cm über dem Wasser am Teichrand anbringen, nicht über
      offenem Wasser. Wöchentlich kontrollieren und bei Belegung austauschen.
    mode_of_action: >-
      The yellow colour attracts flying aphids and beetles onto the sticky
      surface, where they are caught.
    mode_of_action_de: >-
      Die gelbe Farbe lockt fliegende Blattläuse und Käfer auf die
      Klebefläche, wo sie gefangen werden.
    precautions: >-
      Keep traps away from open water to avoid catching beneficial insects
      and birds. A monitoring and mass-trapping aid, not a stand-alone cure.
    precautions_de: >-
      Tafeln vom offenen Wasser fernhalten, um Nützlinge und Vögel nicht zu
      fangen. Monitoring- und Massenfanghilfe, keine alleinige Lösung.


      max_ph: 7.3

  - scientific_name: "Echeveria elegans"
    propagation_methods: [leaf_cutting, offset]
    propagation_notes: "Gesunde Blaetter sauber am Ansatz abdrehen (nicht abschneiden) und die Schnittstelle 2-3 Tage antrocknen lassen, bevor sie flach auf trockenes Substrat gelegt werden. Erst nach sichtbarer Wurzel- und Rosettchenbildung sparsam feuchten - zu fruehe Naesse fuehrt zu Faeulnis. Ableger (Kindel) einfach vom Mutterstamm loesen und direkt einpflanzen."
    propagation_months: [5, 6, 7]

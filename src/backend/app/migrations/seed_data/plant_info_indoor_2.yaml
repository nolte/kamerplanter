    harvest_months: []
    bloom_months: []
    container_suitable: "yes"
    recommended_container_volume_l: "10-30"
    min_container_depth_cm: 30
    mature_height_cm: "150-250"
    mature_width_cm: "100-200"
    spacing_cm: null
    indoor_suitable: "yes"

      water_quality_hint: null
      practical_tip: "NIEMALS auf Blaetter giessen — Farina zerstoeren und Faeulnis. Substrat komplett austrocknen lassen. Flache Toepfe mit exzellenter Drainage."
      seasonal_adjustments:
        - label: "Winter (Nov-Feb)"
          months: [11, 12, 1, 2]
          interval_days: 31
          volume_ml_min: 15
          volume_ml_max: 50

  "Epipremnum aureum":
    propagation_methods: [cutting, layering]
    propagation_notes: "Kopfstecklinge oder Stammstecklinge mit mindestens einem Nodium schneiden und direkt ins Wasser oder in feuchtes Substrat stellen - Efeutute bewurzelt sich nahezu von selbst in 1-3 Wochen. Im Wasserglas sieht man gut, wann die Wurzeln stark genug zum Einpflanzen sind. Abmoosen langer Ranken moeglich. Variegierte Sorten (z.B. 'Marble Queen') bewurzeln langsamer und brauchen mehr Licht."
    propagation_months: [4, 5, 6]
    # Enrichment fields from removed new_species entry (species exists in species.yaml)
    frost_sensitivity: sensitive
    allows_harvest: false
    native_habitat: "Suedostasien (Mo'orea, Gesellschaftsinseln)"
    bloom_months: []
    watering_guide:
      interval_days: 7
      volume_ml_min: 100
      volume_ml_max: 300
      watering_method: top_water
      water_quality_hint: null
      practical_tip: "Obere 2-3 cm abtrocknen lassen (Fingerprobe). Gelbe Blaetter = Ueberwaesserung, braune Spitzen = Unterwaesserung. Sehr anspruchslos."
      seasonal_adjustments:
        - label: "Winter (Nov-Feb)"
          months: [11, 12, 1, 2]
          interval_days: 12
          volume_ml_min: 60
          volume_ml_max: 150


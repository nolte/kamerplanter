new_species:
  - scientific_name: "Dracaena trifasciata"
    propagation_methods: [division, leaf_cutting]
    propagation_notes: "Blattstecklinge (5-8 cm) quer schneiden und mit der Schnittseite nach unten in sandiges Substrat stecken. Wichtig: Polaritaet beachten - der untere Schnitt gehoert in die Erde. Teilung beim Umtopfen im Fruehjahr moglich, dabei sollte jedes Stueck mindestens 2-3 Blaetter haben. Bei 22-25 deg C bewurzeln die Stecklinge in 4-6 Wochen."
    propagation_months: [4, 5, 6]
    common_names: [Bogenhanf, Schwiegermutterzunge, Snake Plant, Mother-in-Law's Tongue]
    genus: Dracaena
    plant_category: succulent_cactus
    growth_habit: succulent
    root_type: fibrous
    hardiness_zones: [9b, 10a, 10b, 11a, 11b]
    native_habitat: "Westafrika (Nigeria bis Kongo)"
    allelopathy_score: 0.0
    base_temp: 10.0
    frost_sensitivity: sensitive
    allows_harvest: false
    sowing_indoor_weeks_before_last_frost: null
    sowing_outdoor_after_last_frost_days: null
    direct_sow_months: []
    harvest_months: []
    bloom_months: [3, 4, 5]
    container_suitable: "yes"
    recommended_container_volume_l: "2-15"
    min_container_depth_cm: 15
    mature_height_cm: "30-120"
    mature_width_cm: "20-60"
    spacing_cm: null
    indoor_suitable: "yes"
    balcony_suitable: limited
    greenhouse_recommended: false
    support_required: false

  - scientific_name: "Dypsis lutescens"
    propagation_methods: [seed, division]
    propagation_notes: "Samen benoetigen frische Reife und keimen bei 25-30 deg C in 4-8 Wochen; Keimung unter Folie mit hoher Luftfeuchte beschleunigen. Teilung ausgewachsener Exemplare beim Umtopfen im Fruehjahr: Seitentriebe mit eigenen Wurzeln abtrennen und einzeln einpflanzen. Grosse Teilstuecke ohne ausreichende Eigenwurzeln schlagen meist nicht an."
    propagation_months: [4, 5, 6]
    common_names: [Goldfruchtpalme, Areca-Palme, Areca Palm, Butterfly Palm, Golden Cane Palm]
    genus: Dypsis
    plant_category: tropical_foliage

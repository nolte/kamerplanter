  - scientific_name: "Hosta spp."
    propagation_methods: [division]
    propagation_notes: "Teilung im frühen Frühjahr, wenn die Triebe 5–10 cm hoch sind; zu diesem Zeitpunkt sind die Knospen noch klar sichtbar. Scharfes Messer oder Spaten verwenden; jede Teilpflanze braucht mindestens 2–3 Augen. Direkt wieder einpflanzen und ausreichend wässern. Im Sommer geteilte Pflanzen brauchen Schattierung und intensive Bewässerung."

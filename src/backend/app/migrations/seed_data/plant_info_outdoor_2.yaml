new_species:
  # ---------- Ornamental shrubs / trees ----------

  - scientific_name: "Forsythia x intermedia"
    propagation_methods: [cutting, layering]
    propagation_notes: "Halbverholzte Stecklinge im Frühsommer (Juni/Juli) von diesjährigen Trieben schneiden, ca. 10–15 cm lang. Untere Blätter entfernen, in feuchtem Sand-Torf-Gemisch bewurzeln. Absenker durch Einscharren langer Triebe bis Herbst; einfachste Methode für Hobbygärtner."
    propagation_months: [6, 7]
    common_names: [Forsythie, Goldgloeckchen, Forsythia]
    genus: Forsythia
    plant_category: outdoor_ornamental
    growth_habit: shrub
    root_type: fibrous
    hardiness_zones: [4a, 4b, 5a, 5b, 6a, 6b, 7a, 7b, 8a, 8b]
    native_habitat: "Hybride (F. suspensa x F. viridissima); Ostasien"
    allelopathy_score: 0.0
    frost_sensitivity: hardy
    allows_harvest: false
    bloom_months: [3, 4]
    container_suitable: limited
    recommended_container_volume_l: "40-60"
    min_container_depth_cm: 40
    mature_height_cm: "200-300"
    mature_width_cm: "200-300"
    spacing_cm: "150-200"
    indoor_suitable: "no"
    balcony_suitable: "no"
    greenhouse_recommended: false
    support_required: false
    nutrient_demand_level: light_feeder
    green_manure_suitable: false
    pruning_type: after_harvest
    pruning_months: [4, 5]
    photosynthesis_type: c3
    shade_tolerance: partial_shade
    effective_root_depth_cm: 60
    waterlogging_tolerance: sensitive
    salt_tolerance_class: moderately_tolerant
    soil_ph_preference:
      min_ph: 6
      max_ph: 8

  - scientific_name: "Geranium sanguineum"
    propagation_methods: [division, seed]
    propagation_notes: "Teilung etablierter Horste im Frühjahr (März/April) beim Austrieb; Wurzelballen mit Spaten teilen und sofort einpflanzen. Aussaat von frisch geerntetem Samen im Herbst direkt ins Freiland oder kühl stratifiziert; Keimung im Frühjahr. Samen sind Kaltkeimer und benötigen Frosteinwirkung."
    propagation_months: [3, 4]
    common_names: [Blut-Storchschnabel, Bloody Cranesbill]
    genus: Geranium
    plant_category: outdoor_ornamental
    growth_habit: herb
    root_type: fibrous
    hardiness_zones: [4a, 4b, 5a, 5b, 6a, 6b, 7a, 7b, 8a, 8b]
    native_habitat: "Europa, Westasien"
    allelopathy_score: 0.1
    frost_sensitivity: hardy
    allows_harvest: false
    sowing_indoor_weeks_before_last_frost: 7
    sowing_outdoor_after_last_frost_days: 0
    direct_sow_months: [4, 5]
    bloom_months: [5, 6, 7, 8, 9]
    container_suitable: "yes"
    recommended_container_volume_l: "5-10"
    min_container_depth_cm: 20
    mature_height_cm: "15-40"
    mature_width_cm: "30-60"
    spacing_cm: "30-40"
    indoor_suitable: "no"
    balcony_suitable: "yes"
    greenhouse_recommended: false
    support_required: false
    nutrient_demand_level: light_feeder
    green_manure_suitable: false
    pruning_type: after_harvest
    pruning_months: [7, 8]
    photosynthesis_type: c3
    shade_tolerance: partial_shade
    waterlogging_tolerance: sensitive
    soil_ph_preference:
      min_ph: 5.5
      max_ph: 8

  - scientific_name: "Helleborus niger"
    propagation_methods: [division, seed]
    propagation_notes: "Teilung nur nach der Blüte im Frühjahr; ältere Wurzelballen mit scharfem Messer teilen. Samen sofort nach der Reife im Sommer aussäen – Doppelkeimer, die zwei Kältephasen benötigen. Keimung erst nach 12–18 Monaten; bis zur Blüte dauert es weitere 2–3 Jahre. Handschuhe tragen: alle Pflanzenteile sind hochgiftig."
    propagation_months: [4, 5]
    common_names: [Christrose, Schneerose, Christmas Rose]
    genus: Helleborus
    plant_category: outdoor_ornamental
    growth_habit: herb
    root_type: fibrous

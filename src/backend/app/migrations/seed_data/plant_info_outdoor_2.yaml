    propagation_methods: [cutting, layering]
    propagation_notes: "Weiche bis halbverholzte Stecklinge im Frühsommer (Juni/Juli) ohne Blütenknospe; 2–3 Blattetagen stehen lassen, untere Blätter entfernen. In luftig-feuchtem Substrat unter Folie bei 18–20 °C bewurzeln. Absenker durch Eingraben langer Triebe ohne Abtrennen; Wasser-pH unter 6,5 halten für optimale Bewurzelung."

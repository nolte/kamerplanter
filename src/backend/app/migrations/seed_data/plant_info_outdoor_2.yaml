    waterlogging_tolerance: sensitive
    soil_ph_preference:
      min_ph: 6
      max_ph: 8

  - scientific_name: "Hemerocallis spp."
    propagation_methods: [division]
    propagation_notes: "Horste alle 3–5 Jahre im Frühjahr beim ersten Austrieb teilen; Wurzelballen mit zwei Grabgabeln auseinanderhebeln. Jedes Teilstück sollte 3–5 Triebe besitzen. Sofort replantieren und gut wässern. Geteilte Pflanzen blühen im ersten Jahr oft schwächer – spätestens ab dem zweiten Jahr volle Blütenleistung."
    propagation_months: [3, 4]
    common_names: [Taglilie, Daylily]
    genus: Hemerocallis
    plant_category: outdoor_ornamental
    growth_habit: herb
    root_type: tuberous

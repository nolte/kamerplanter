    # preserves their ratios exactly (0.70 : 0.15 : 0.10) and closes the vector at
    # 1.0 again; no new information was introduced.
    composition:
      torf: 0.74
      perlit: 0.16
      fasern: 0.10
    additives:
      - kalk
    buffer_capacity: medium
    reusable: false

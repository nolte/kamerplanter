    # `kalk: 0.05` was a bulk fraction, i.e. five percent lime by volume (#1152 §C).
    # Lime goes into a growing medium at single-digit kg/m³ — under one percent —
    # so it cannot sit in a normalised volume vector next to peat and perlite. It
    # moved to `additives`, which names it and asserts no quantity, because no
    # sourced dose rate exists for this product and this file's header forbids

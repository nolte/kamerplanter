    name_de: "Steinwollmatte"
    name_en: "Rockwool Slab"
    ph_base: 7.5
    ec_base_ms: 0.0
    water_retention: medium
    # 40.0 was dry total porosity carried into a container-capacity field: with
    # water_holding 80 it summed to 120 % of one pore space (#1152 §A). At
    # container capacity a slab holds ~80 % water and 10–15 % air.
    air_porosity_percent: 12.0
    composition:
      steinwolle: 1.0
    buffer_capacity: low
    reusable: false
    max_reuse_cycles: 1
    water_holding_capacity_percent: 80.0
    easily_available_water_percent: 40.0
    cec_meq_per_100cm3: 0.3
    bulk_density_g_per_l: 80.0
    irrigation_strategy: frequent

  - type: rockwool_plug
    brand: ""
    name_de: "Steinwollwürfel (Anzucht)"
    name_en: "Rockwool Plug (Propagation)"
    ph_base: 7.5
    ec_base_ms: 0.0
    water_retention: medium
    # Same correction as the slab above (#1152 §A): 35.0 with water_holding 85
    # summed to 120 %. A propagation plug is denser and holds more water than a
    # slab, so it takes the lower end of the 10–15 % container-capacity air band.
    air_porosity_percent: 10.0
    composition:
      steinwolle: 1.0
    buffer_capacity: low
    reusable: false
    max_reuse_cycles: 1
    water_holding_capacity_percent: 85.0
    easily_available_water_percent: 45.0

  # ── BioBizz Substrates ─────────────────────────────────────────────

  - type: soil
    brand: "BioBizz"
    name_de: "BioBizz Light·Mix"
    name_en: "BioBizz Light Mix"
    ph_base: 6.2
    ec_base_ms: 1.2
    water_retention: medium
    air_porosity_percent: 30.0
    # `kalk: 0.10` and `spurenelemente: 0.05` were bulk fractions (#1152 §C): ten
    # percent lime would put the medium far above the `ph_base: 6.2` two lines up,
    # and trace elements are ppm by definition. Both moved to `additives` — named,
    # unquantified — and the two real bulk components were rescaled over 0.85,
    # preserving their 0.55 : 0.30 ratio exactly.
    composition:
      torf: 0.65
      perlit: 0.35
    additives:
      - kalk
      - spurenelemente
    buffer_capacity: medium
    reusable: false
    max_reuse_cycles: 1
    water_holding_capacity_percent: 45.0
    easily_available_water_percent: 22.0
    cec_meq_per_100cm3: 12.0
    particle_size_mm: 3.0
    bulk_density_g_per_l: 400.0

    name_en: "BioBizz All-Mix"
    ph_base: 6.6
    ec_base_ms: 2.4
    water_retention: high
    air_porosity_percent: 22.0
    # Same correction as Light·Mix (#1152 §C): `kalk: 0.05` left the bulk vector for
    # `additives`, the remaining four components rescaled over 0.95 with their
    # ratios intact. `pre_mix` stays a bulk component — it is a fifteen-percent
    # share of a real product, not a kg/m³ amendment.
    composition:
      torf: 0.42
      wurmhumus: 0.21
      perlit: 0.21

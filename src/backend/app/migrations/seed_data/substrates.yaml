  - type: peat
    brand: "BioBizz"
    name_de: "BioBizz Pre·Mix (Bodenverbesserer)"
    name_en: "BioBizz Pre-Mix (Soil Conditioner)"
    ph_base: 6.5
    ec_base_ms: 1.8
    water_retention: medium
    air_porosity_percent: 20.0
    # A soil conditioner, not a growing medium (#1152 §E): 30 % peat and the rest
    # bone meal, blood meal, guano, dolomite, seaweed and leonardite. Nothing is
    # planted in it. `type` stays `peat` — that is the material family, and the
    # per-type tables in the engines answer questions about medium physics that an
    # `soil_amendment` member would have made them answer with a silent default.
    # What was wrong is that it was selectable as a medium, and that is what this
    # flag gates. Its `dolomit: 0.10` therefore stays in `composition`: in a
    # concentrate a tenth really is a tenth, which is why the additive rule is
    # scoped to media.
    is_amendment: true
    composition:
      torf: 0.30
      seetang: 0.20
      knochenmehl: 0.15
      blutmehl: 0.10
      fledermausguano: 0.10
      dolomit: 0.10
      leonardit: 0.05
    buffer_capacity: high
    reusable: false
    max_reuse_cycles: 1
    water_holding_capacity_percent: 50.0
    easily_available_water_percent: 22.0
    cec_meq_per_100cm3: 25.0
    particle_size_mm: 2.0
    bulk_density_g_per_l: 520.0
    irrigation_strategy: moderate

  # ── Hydro Solution ────────────────────────────────────────────────

  - type: hydro_solution
    brand: ""
    name_de: "Hydrokultur (kein Substrat)"
    name_en: "Hydroponics (No Substrate)"
    ph_base: 6.0
    ec_base_ms: 0.0
    water_retention: low
    # Was `100.0` — "not applicable" written as a number (#1152 §E). A nutrient
    # solution has no pore space, so there is no air-filled fraction of it to
    # state, and no consumer could tell the placeholder from a measurement: it was
    # volume-weighted into every mix containing this entry, reported over MCP as a
    # physical property and rendered as "100.0 %". The empty `composition` on the
    # next line was already allowed to say "there is nothing here".
    air_porosity_percent: null
    composition: {}
    buffer_capacity: low
    reusable: true
    max_reuse_cycles: 99
    irrigation_strategy: continuous

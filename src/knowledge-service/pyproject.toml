[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kamerplanter-knowledge-service"
version = "1.0.0"
description = "RAG-based plant knowledge assistant for Kamerplanter"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0",
    "structlog>=24.0.0",
    # #777 — optional error tracking; no-op without SENTRY_DSN. It was installed
    # into both images through requirements.txt while being absent from this
    # table (#1374 measured the drift); with the lock generated from here, the
    # declaration is the only way it reaches the image.
    "sentry-sdk[fastapi]>=2.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

# Dockerfile build-stage inputs, locked with everything else (#1374). The `dev`
# group carries the hot-reload watcher the `dev` image target installs; it is a
# PEP 735 dependency group rather than an entry in the `dev` extra above so the
# dev image does not also drag pytest/ruff/mypy in. `uv sync --no-dev` in the
# prod stage leaves it out.
[dependency-groups]
dev = [
    "watchfiles",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Non-strict mypy baseline (SCR-001). The backend runs mypy strict=true; this
# service starts non-strict but still checks the bodies of untyped functions,
# so type-shape defects surface. strict adoption is a recorded follow-up.
[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_configs = true

# Runtime dependencies ship inline types and are checked for real locally; the
# isolated pre-commit venv (mypy only) does not install them, so their imports
# are ignored there rather than reported as missing. ``yaml`` (PyYAML) ships no
# type stubs, so it is ignored in every environment.
[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "httpx.*",
    "psycopg.*",
    "psycopg_pool.*",
    "pydantic.*",
    "pydantic_settings.*",
    "structlog.*",
    "sentry_sdk.*",
    "yaml.*",
]
ignore_missing_imports = true

[tool.uv]
# The lock toolchain (NFR-009 section 2.3), pinned EXACT to the same value as
# src/backend/pyproject.toml: Renovate's pep621 processor resolves the uv it
# relocks with from here, the Dockerfile copies `ghcr.io/astral-sh/uv:<same>`
# and CI installs `uv==<same>`. renovate.json5 groups all references into one
# `uv toolchain` pull request, so the reading and the relocking side never age
# apart (#1296 class).
required-version = "==0.12.19"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kamerplanter-knowledge-service"
version = "1.0.0"
description = "RAG-based plant knowledge assistant for Kamerplanter"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Non-strict mypy baseline (SCR-001). The backend runs mypy strict=true; this
# service starts non-strict but still checks the bodies of untyped functions,
# so type-shape defects surface. strict adoption is a recorded follow-up.
[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_configs = true

# Runtime dependencies ship inline types and are checked for real locally; the
# isolated pre-commit venv (mypy only) does not install them, so their imports
# are ignored there rather than reported as missing. ``yaml`` (PyYAML) ships no
# type stubs, so it is ignored in every environment.
[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "httpx.*",
    "psycopg.*",
    "psycopg_pool.*",
    "pydantic.*",
    "pydantic_settings.*",
    "structlog.*",
    "yaml.*",
]
ignore_missing_imports = true

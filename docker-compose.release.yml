##
## Kamerplanter – Docker Compose (pre-built images)
##
## Quick start:
##   cp .env.example .env        # copy & edit passwords!
##   docker-compose -f docker-compose.release.yml up -d
##
## All credentials are read from .env (not hardcoded here).
## See .env.example for required variables.
##
## Web UI:  http://localhost:8080
## API:     http://localhost:8000/api/v1/docs
##
## Network exposure (#1750): every published port binds to 127.0.0.1, so
## only this machine reaches it. To open the web UI (8080) and the API
## (8000) to other devices, set KAMERPLANTER_BIND_ADDRESS=0.0.0.0 in .env.
## The databases, Valkey and Ollama always stay on 127.0.0.1.
##
version: "3.8"

services:
  # ── ArangoDB ──────────────────────────────────────────────
  arangodb:
    image: arangodb:3.12@sha256:f8e1590646f0600da50d4c8a03d0596e1a70453c24c145e54d80c792de247a43
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_ROOT_PASSWORD}
    # Loopback only (#1750): tools on this machine reach it, other hosts do not.
    ports:
      - "127.0.0.1:8529:8529"
    volumes:
      - arangodb_data:/var/lib/arangodb3
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8529/_api/version"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Valkey (Redis-compatible) ────────────────────────────
  valkey:
    image: valkey/valkey:9-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── VectorDB (optional — PostgreSQL + pgvector for AI/RAG) ──
  vectordb:
    build:
      context: ./docker/vectordb
    profiles: ["vectordb"]
    environment:
      POSTGRES_DB: ${VECTORDB_DATABASE:-kamerplanter_vectors}
      POSTGRES_USER: ${VECTORDB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${VECTORDB_PASSWORD:-changeme}
    # Loopback only (#1750): tools on this machine reach it, other hosts do not.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - vectordb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VECTORDB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Ollama (optional — local LLM inference for AI assistant) ──
  ollama:
    image: ollama/ollama:latest@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
    profiles: ["ollama"]
    environment:
      OLLAMA_MODELS: /models
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    # Loopback only (#1750): tools on this machine reach it, other hosts do not.
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/models
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── TimescaleDB (optional) ─────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:2.30.1-pg16@sha256:f495f2bc25ca7596ca8e1606c6241ca250ccc56a0c082b9f2ec0d290e0126cd9
    profiles: ["timescaledb"]
    environment:
      POSTGRES_DB: ${TIMESCALEDB_DATABASE:-kamerplanter_sensors}
      POSTGRES_USER: ${TIMESCALEDB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${TIMESCALEDB_PASSWORD:-changeme}
    # Loopback only (#1750): tools on this machine reach it, other hosts do not.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALEDB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Backend (FastAPI) ─────────────────────────────────────
  backend:
    image: ghcr.io/nolte/kamerplanter-backend:__VERSION__
    environment:
      ARANGODB_HOST: arangodb
      ARANGODB_PORT: "8529"
      ARANGODB_DATABASE: ${ARANGODB_DATABASE}
      ARANGODB_USERNAME: ${ARANGODB_USERNAME}
      ARANGODB_PASSWORD: ${ARANGODB_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DEBUG: ${DEBUG}
      # NFR-011 §4: >= 32 chars; the API refuses to start without it when DEBUG
      # is false. MUST equal the celery-worker's value.
      ERASURE_TOMBSTONE_SALT: ${ERASURE_TOMBSTONE_SALT:-}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION}
      KAMERPLANTER_MODE: light
      TIMESCALEDB_ENABLED: ${TIMESCALEDB_ENABLED:-false}
      TIMESCALEDB_HOST: timescaledb
      TIMESCALEDB_PORT: "5432"
      TIMESCALEDB_DATABASE: ${TIMESCALEDB_DATABASE:-kamerplanter_sensors}
      TIMESCALEDB_USERNAME: ${TIMESCALEDB_USERNAME:-postgres}
      TIMESCALEDB_PASSWORD: ${TIMESCALEDB_PASSWORD:-changeme}
      VECTORDB_ENABLED: ${VECTORDB_ENABLED:-false}
      VECTORDB_HOST: vectordb
      VECTORDB_PORT: "5432"
      VECTORDB_DATABASE: ${VECTORDB_DATABASE:-kamerplanter_vectors}
      VECTORDB_USERNAME: ${VECTORDB_USERNAME:-postgres}
      VECTORDB_PASSWORD: ${VECTORDB_PASSWORD:-changeme}
    volumes:
      - ./spec/knowledge/rag:/app/knowledge:ro
    # LOOPBACK BY DEFAULT (#1750). The API is one of the two front doors:
    # set KAMERPLANTER_BIND_ADDRESS=0.0.0.0 in .env to reach it from other
    # devices (a Home Assistant host addresses this port). The data stores
    # never follow that variable. Allow-listed, with this reason, in
    # src/backend/tests/unit/guards/test_published_ports_bind_loopback.py.
    ports:
      - "${KAMERPLANTER_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    depends_on:
      - arangodb
      - valkey
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Celery Worker ────────────────────────────────────────
  celery-worker:
    image: ghcr.io/nolte/kamerplanter-backend:__VERSION__
    environment:
      ARANGODB_HOST: arangodb
      ARANGODB_PORT: "8529"
      ARANGODB_DATABASE: ${ARANGODB_DATABASE}
      ARANGODB_USERNAME: ${ARANGODB_USERNAME}
      ARANGODB_PASSWORD: ${ARANGODB_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      KAMERPLANTER_MODE: light
      # #1781 — same DEBUG and salt as the backend: the worker refuses to start
      # without a >= 32-char ERASURE_TOMBSTONE_SALT when DEBUG is false, like
      # the API does, and pseudonymises log subjects with the same salt.
      DEBUG: ${DEBUG}
      ERASURE_TOMBSTONE_SALT: ${ERASURE_TOMBSTONE_SALT:-}
      TIMESCALEDB_ENABLED: ${TIMESCALEDB_ENABLED:-false}
      TIMESCALEDB_HOST: timescaledb
      TIMESCALEDB_PORT: "5432"
      TIMESCALEDB_DATABASE: ${TIMESCALEDB_DATABASE:-kamerplanter_sensors}
      TIMESCALEDB_USERNAME: ${TIMESCALEDB_USERNAME:-postgres}
      TIMESCALEDB_PASSWORD: ${TIMESCALEDB_PASSWORD:-changeme}
      VECTORDB_ENABLED: ${VECTORDB_ENABLED:-false}
      VECTORDB_HOST: vectordb
      VECTORDB_PORT: "5432"
      VECTORDB_DATABASE: ${VECTORDB_DATABASE:-kamerplanter_vectors}
      VECTORDB_USERNAME: ${VECTORDB_USERNAME:-postgres}
      VECTORDB_PASSWORD: ${VECTORDB_PASSWORD:-changeme}
    volumes:
      - ./spec/knowledge/rag:/app/knowledge:ro
    depends_on:
      - arangodb
      - valkey
    command: celery -A app.tasks worker --loglevel=info
    restart: unless-stopped

  # ── Celery Beat (periodic tasks) ─────────────────────────
  celery-beat:
    image: ghcr.io/nolte/kamerplanter-backend:__VERSION__
    environment:
      ARANGODB_HOST: arangodb
      ARANGODB_PORT: "8529"
      ARANGODB_DATABASE: ${ARANGODB_DATABASE}
      ARANGODB_USERNAME: ${ARANGODB_USERNAME}
      ARANGODB_PASSWORD: ${ARANGODB_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      KAMERPLANTER_MODE: light
      TIMESCALEDB_ENABLED: ${TIMESCALEDB_ENABLED:-false}
      TIMESCALEDB_HOST: timescaledb
      TIMESCALEDB_PORT: "5432"
      TIMESCALEDB_DATABASE: ${TIMESCALEDB_DATABASE:-kamerplanter_sensors}
      TIMESCALEDB_USERNAME: ${TIMESCALEDB_USERNAME:-postgres}
      TIMESCALEDB_PASSWORD: ${TIMESCALEDB_PASSWORD:-changeme}
      VECTORDB_ENABLED: ${VECTORDB_ENABLED:-false}
      VECTORDB_HOST: vectordb
      VECTORDB_PORT: "5432"
      VECTORDB_DATABASE: ${VECTORDB_DATABASE:-kamerplanter_vectors}
      VECTORDB_USERNAME: ${VECTORDB_USERNAME:-postgres}
      VECTORDB_PASSWORD: ${VECTORDB_PASSWORD:-changeme}
    depends_on:
      - arangodb
      - valkey
    command: celery -A app.tasks beat --loglevel=info
    restart: unless-stopped

  # ── Frontend (React + nginx) ──────────────────────────────
  frontend:
    image: ghcr.io/nolte/kamerplanter-frontend:__VERSION__
    environment:
      KAMERPLANTER_MODE: light
    # LOOPBACK BY DEFAULT (#1750). The web UI is one of the two front doors:
    # set KAMERPLANTER_BIND_ADDRESS=0.0.0.0 in .env to reach it from other
    # devices (phones and tablets on the home network). The data stores
    # never follow that variable. Allow-listed, with this reason, in
    # src/backend/tests/unit/guards/test_published_ports_bind_loopback.py.
    ports:
      - "${KAMERPLANTER_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  arangodb_data:
  valkey_data:
  timescaledb_data:
  vectordb_data:
  ollama_models:

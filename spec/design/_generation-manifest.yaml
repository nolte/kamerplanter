  #                 (opaque #f5f5f5 background, mascot at 80% maskable safe-zone)
  #   - App logo  : brand/logo@2x.png (vectorise via nolte-media:png-to-transparent-svg
  #                 when an SVG deliverable is needed)
  # See scripts/kami/README.md > 'Logo & app-icons come from brand/, not FLUX'.


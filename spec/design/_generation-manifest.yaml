  # --- G-01/G-02 PWA app-icons + logo: SOURCED FROM brand/ (NOT FLUX) ---
  # The app icon and logo are hand-crafted brand marks that already exist as
  # brand/icon@2x.png and brand/logo@2x.png (512x512, transparent, face-on-pot).
  # A text-to-image model cannot reproduce a pixel-exact brand mark, so these are
  # derived deterministically instead of being FLUX render jobs:

# KAMI image-generation manifest — machine SSOT for the render + review pipeline.
#
# Purpose: drive `scripts/kami/render.py` (which calls the nolte-media
# `image-generate` script, FLUX.1-schnell via Cloudflare by default) and gate
# every generated PNG through the `kami-image-reviewer` agent against
# `spec/design/KAMI-CHARACTER-REFERENCE.md`. Rejected jobs are regenerated with
# a fresh seed until approved or `max_attempts` is hit.
#
# This manifest — NOT the prose prompt-docs — is the generation source of truth.
# The prompt-docs under spec/design/ remain the human design rationale (audit
# traceability, verbatim §4.2 emotion fragments, post-processing checklists);
# each `gap:` + `doc:` here reconciles a job back to its doc and audit gap.
#
# Why inline prompts instead of extracting from the docs: the docs were authored
# for Gemini (narrative + a trailing "Avoid:" negative clause). FLUX has NO
# negative-prompt channel — a literal "Avoid: text, numbers…" makes FLUX MORE
# likely to render text. The inline prompts here are FLUX-normalised: the scene
# is front-loaded, the avoidance is expressed as positive phrasing, and each
# Light/Dark block is fully self-contained (the docs' Dark sections are only an
# outline-line diff and are not directly generatable).
#
# NOTE ON SIZE: the Cloudflare/FLUX backend ignores width/height and always
# returns a ~1024x1024 square. `width`/`height` below are honoured only by the
# pollinations provider; for cloudflare, non-square aspect ratios (4:3 heroes)
# are achieved by cropping in post-processing. `size:` records the final asset
# target for the reviewer's legibility judgement, not the generation size.

defaults:
  provider: cloudflare            # FLUX.1-schnell (@cf/black-forest-labs/flux-1-schnell), free tier
  base_seed: 4200                 # attempt N uses seed base_seed+N -> real variety on regen
  max_attempts: 3                 # after N rejects a job goes to `blocked` (needs a human)
  render_dir: .render/kami        # PNGs + render-state.json land here (gitignored)

# ---------------------------------------------------------------------------
# Batch 1 — the 8 new #593 single/small-motif docs, fully FLUX-normalised.
# ---------------------------------------------------------------------------
jobs:
  # --- G-12 generic empty-state (illustration-kami-empty-state.md) ----------
  - id: empty-state-light
    gap: G-12
    doc: spec/design/illustration-kami-empty-state.md
    variant: light
    emotion: "Neugierig/Suchend (§4.2)"
    pose: "Blaetter leicht nach vorn geneigt, ein Arm am Kinn oder Lupe haltend; Fragezeichen ueber einem Blatt"
    size: "<=180px"
    out: src/frontend/src/assets/brand/illustrations/states/state-kami-empty.svg
    prompt: |
      A cute comic-style mascot illustration for a plant management app, square 1:1 format.

      Scene: A small anthropomorphic green seedling character (Kami) in a terracotta flower pot,
      centered, looking around inquisitively as if searching an empty list. Kami has a
      Curious/Searching expression: leaves tilted slightly forward and sideways, one eye slightly
      larger than the other with curiosity, small "oh" mouth or gentle smile. One arm at chin or
      holding a small magnifying glass. A small simple question mark shape floats above one leaf.

      Kami: leaves #66bb6a (highlight #98ee99, shadow #2e7d32), stem #43a047,
      pot #8d6e63 (stripe #a1887f, shadow #6d4c41), soil #795548. Eyes black with white
      highlight glints, mouth #1b5e20. Magnifying glass: gray handle #9e9e9e, clear glass circle.

      Outlines: dark green #1b5e20, 2.5px outer, 1.5px inner, rounded line caps.

      Style: flat vector illustration, cute cartoon, professional. Flat solid colors, subtle soft
      inner shading 10-15% darker near form edges. Minimal detail, clean shapes suitable for SVG
      conversion, every element at least 3px. Centered on a plain flat empty background, square
      1:1 with 14% padding, character only, no lettering or numerals anywhere, no watermark.


# Kind cluster configuration for Kamerplanter local development
# Usage: kind create cluster --config kind-config.yaml --name kamerplanter
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # Only ingress ports are published by kind. App access (backend 8000,
    # frontend 3000, arangodb 8529, …) goes through Skaffold's portForward —
    # publishing the same host ports here collided with it and forced Skaffold
    # onto 8001/3001/8530. The services are ClusterIP (no NodePort), so these
    # mappings pointed at non-existent NodePorts anyway.
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker

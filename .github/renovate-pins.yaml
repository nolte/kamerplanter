# Pinned external dependencies tracked by Renovate's custom managers.
# Each entry carries a datasource comment so renovate.json5 can resolve the
# upstream and PR an update: `# datasource=… depName=…` immediately above a
# single version key, or `# renovate: datasource=… depName=…` above a
# digest-plus-label pair. The two forms are distinct on purpose — they are read
# by two different matchStrings, and a block must be matched by exactly one of
# them or Renovate would raise the same dependency twice.
#
# Spec: spec/nfr/NFR-014_Nuclei-Security-Scanning.md §3.3
#
# Consumed by .github/workflows/security-nuclei-*.yml — keep the YAML key
# names stable; the workflows look them up via `yq`.

# THE COMMUNITY TEMPLATE SET — the DIGEST is the pin, the tag is its label.
#
# `nuclei_templates_commit` is what every scan lane fetches and checks out.
# `nuclei_templates_version` is prose: the tag that commit carried when Renovate
# proposed it, kept so a human reading this file or a run log can tell which
# release is in force. Nothing resolves a tag at scan time any more — which is
# what NFR-014 §3.3 has asked for since its 1.1 revision.
#
# WHY A DIGEST. A tag is not immutable, not even from a trusted publisher — the
# March 2025 tj-actions compromise moved existing tags to malicious code, and
# digest-pinned consumers were the ones unaffected. Pinning the tag alone would
# leave the template set silently replaceable underneath a scan that reports on
# it.
#
# WHY THE TAG STOPPED BEING THE OPERATIVE PIN (#1543). The previous shape pinned
# the tag and asserted, at scan time, that it still resolved to a commit a human
# had recorded here. Renovate's custom manager could only move the tag — the
# commit sat thirty-odd lines of prose below the datasource comment and was
# therefore unmanaged by construction — so a bump shipped a pair whose halves
# disagreed. That happened three times: #1280 (merged with the halves apart; the
# nightly scan then failed to start for two nights until #1312 recorded the right
# commit) and #1454 (caught before the merge). The pair is gone; there is one
# value to move, and Renovate moves it.
#
# THE LABEL IS BOUND TO NOTHING, and that is worth knowing before you trust it.
# Nothing verifies that `nuclei_templates_version` is the tag `nuclei_templates_commit`
# actually carries: the scan lanes only check that the label is present, and the
# guard only that it looks like a version. Renovate keeps the two honest as long
# as IT does the moving — it writes both in one match — but a human who bumps the
# digest alone leaves the log saying "labelled v10.4.9" forever, and the log is
# the label's only purpose (NFR-014 §3.3). Move both lines together, or move
# neither. A dereferencing check was considered and rejected: it would put a tag
# lookup back into the one lane this change removed it from, for a value no scan
# consumes.
#
# KEEP THE TWO KEYS ADJACENT, and keep prose out from between them and the
# comment above: the custom manager matches the `# renovate:` comment followed by
# the digest line followed by the label line, so anything inserted in the middle
# would leave this pin unwatched — a stale pin and a floating reference fail the
# same reproducibility goal from opposite directions. That is exactly how the
# commit became unmanaged in the first place.
#
# WHAT STILL CHECKS THIS. `scripts/check_workflow_gate_integrity.py` keeps the
# wiring honest: a workflow that reads this file while its `paths:` filter
# excludes it fails the required `static` lane (#1313). And
# `security-nuclei-templates.yml`, the one nuclei lane with a `pull_request`
# trigger, asks on the pull request that edits this file whether the pinned digest
# exists upstream at all — a typo here would otherwise break every scan lane, at
# night, after the merge. There is deliberately NO tag-resolution assertion any
# more: under a digest pin an upstream tag move cannot change what the scan reads,
# so such an assertion could only produce a false alarm.
# renovate: datasource=github-tags depName=projectdiscovery/nuclei-templates
nuclei_templates_commit: 893122ffce8ebf8e264f15d2cd3960cb1dd36d6c
nuclei_templates_version: v10.4.9

# The nuclei BINARY, pinned for the validator and every scan lane alike (#1177).
#
# `nuclei-action` defaults to `version: latest`, and it was left at that. The
# consequence is not the one #1177 assumed — validator and scanners were never on
# *different* versions, they were all on whatever "latest" meant that morning.
# The consequence is that the gate's meaning changed under it without a commit:
#
#   2026-08-01, nuclei v3.11.0 — validated 6 templates, GREEN
#   2026-08-15, nuclei v3.11.1 — the same jwt-leak matcher FAILS to compile
#
# `kamerplanter-jwt-leak.yaml` carried a negative lookahead since #122. Go's
# regexp is RE2 and has never supported lookaheads, so that template could never
# run — yet the validator called it fine for two weeks, because v3.11.0's
# `-validate` did not compile matchers and v3.11.1's does. Nothing in this
# repository changed; the tool did.
#
# Pinning turns that into a Renovate pull request, where the new binary meets the
# whole template set and a human sees the result — instead of a silent change of
# what "validated" means.
#
# The datasource comment sits directly above the key on purpose: the custom
# manager in renovate.json5 matches `datasource=… depName=…` followed by the key
# on the *next* line, so prose between the two would leave this pin unwatched —
# a stale pin and a floating reference fail the same reproducibility goal from
# opposite directions.
# datasource=github-releases depName=projectdiscovery/nuclei
nuclei_version: v3.11.1

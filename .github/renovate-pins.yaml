# Pinned external dependencies tracked by Renovate's custom manager.
# Each entry carries a `# datasource=… depName=…` comment so renovate.json5
# can resolve the upstream and PR an update.
#
# Spec: spec/nfr/NFR-014_Nuclei-Security-Scanning.md §3.3
#
# Consumed by .github/workflows/security-nuclei-*.yml — keep the YAML key
# names stable; the workflows look them up via `yq`.

# datasource=github-tags depName=projectdiscovery/nuclei-templates
nuclei_templates_version: v10.4.8

# The commit the tag above pointed at when it was reviewed. The workflows fetch
# the TAG and then assert it still resolves here.
#
# A tag is not immutable, not even from a trusted publisher — the March 2025
# tj-actions compromise moved existing tags to malicious code, and digest-pinned
# consumers were the ones unaffected. Pinning the tag alone would leave the
# template set silently replaceable underneath a scan that reports on it.
#
# Deliberately kept ALONGSIDE the tag rather than replacing it: Renovate's
# custom manager tracks the tag, so the human-readable version stays updatable.
#
# WHERE THE ASSERTION ACTUALLY RUNS (#1302). Until 2026-09-01 this comment
# claimed that "when Renovate bumps the tag, this assertion fails until the
# commit is updated in the same pull request". It did not. The assertion lived
# only in `security-nuclei-nightly.yml` and `security-nuclei-postmerge.yml`,
# both of which run after the merge, and the one nuclei lane with a
# `pull_request` trigger did not list this file in its path filter. #1280
# changed exactly this file, ran no nuclei check at all, merged green, and the
# nightly scan then failed to start for two nights (#1312).
#
# Three lanes assert it now, and only the first of them can act before a merge:
#
#   * `security-nuclei-templates.yml` — pull request, triggered by a change to
#     THIS FILE, resolves the tag with `git ls-remote` in seconds. This is the
#     check that goes red on a bumped tag with a stale commit.
#   * `security-nuclei-postmerge.yml` — after the merge, from the full clone.
#   * `security-nuclei-nightly.yml` — nightly, likewise from the full clone.
#
# All three are advisory: `.github/settings.yml` requires only
# `static / Static CI Tests` and `lint-test-build (22)`. The pull-request lane
# therefore reports the mismatch rather than blocking on it — but it reports it
# on the pull request that caused it, which is the review the pin exists to
# force and which nothing performed before.
#
# `scripts/check_workflow_gate_integrity.py` keeps the wiring honest: a workflow
# that reads this file while its `paths:` filter excludes it fails the required
# `static` lane (#1313).
nuclei_templates_commit: e5f19e6144135e107962bb943231413796fd7fe7

# The nuclei BINARY, pinned for the validator and every scan lane alike (#1177).
#
# `nuclei-action` defaults to `version: latest`, and it was left at that. The
# consequence is not the one #1177 assumed — validator and scanners were never on
# *different* versions, they were all on whatever "latest" meant that morning.
# The consequence is that the gate's meaning changed under it without a commit:
#
#   2026-08-01, nuclei v3.11.0 — validated 6 templates, GREEN
#   2026-08-15, nuclei v3.11.1 — the same jwt-leak matcher FAILS to compile
#
# `kamerplanter-jwt-leak.yaml` carried a negative lookahead since #122. Go's
# regexp is RE2 and has never supported lookaheads, so that template could never
# run — yet the validator called it fine for two weeks, because v3.11.0's
# `-validate` did not compile matchers and v3.11.1's does. Nothing in this
# repository changed; the tool did.
#
# Pinning turns that into a Renovate pull request, where the new binary meets the
# whole template set and a human sees the result — instead of a silent change of
# what "validated" means.
#
# The datasource comment sits directly above the key on purpose: the custom
# manager in renovate.json5 matches `datasource=… depName=…` followed by the key
# on the *next* line, so prose between the two would leave this pin unwatched —
# a stale pin and a floating reference fail the same reproducibility goal from
# opposite directions.
# datasource=github-releases depName=projectdiscovery/nuclei
nuclei_version: v3.11.1

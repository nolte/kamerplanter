name: Static CI Tests

on:
  push:

# Least privilege at workflow level; the two jobs that need more declare it
# themselves below. `static` needs nothing beyond reading the checkout.
permissions:
  contents: read

# This workflow triggers on EVERY push to EVERY branch — deliberately, because
# `static / Static CI Tests` is the required check and a path- or branch-filtered
# required check never reports. The cost is that a branch pushed three times in a
# minute used to run it three times to completion, and `strict: true` multiplies
# that across the merge train. Superseding the older run keeps the guarantee and
# drops the waste.
concurrency:
  group: static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WHEN `static` GOES RED WITH A DOCKER HUB ERROR, THAT IS `infra`, NOT A
  # DEFECT IN THE PULL REQUEST (#1311). Classify it before looking at the diff.
  #
  # #1300 wired `actionlint` and `shellcheck` in as the repository's first
  # `language: docker_image` pre-commit hooks, so this job now pulls
  # `docker.io/rhysd/actionlint` and `docker.io/koalaman/shellcheck`
  # ANONYMOUSLY from Docker Hub on every push to every branch. Measured
  # 2026-09-01 against Docker Hub's own rate-limit headers: both repositories
  # answer `ratelimit-limit: 100;w=3600` with a `pull_limit_interval` of 21600 s
  # and no publisher exemption — the same limit the reference
  # `ratelimitpreview/test` image reports. A rate limit or a Hub outage
  # therefore turns a REQUIRED check red for a cause no commit introduced.
  #
  # It is not cached and cannot be. Measured in pre-commit's own
  # `languages/docker_image.py`: `ENVIRONMENT_DIR = None` and
  # `install_environment = lang_base.no_install`, so the image lives only in the
  # daemon's image store and never under `~/.cache/pre-commit` — the
  # `actions/cache` inside `pre-commit/action` cannot hold it. Every run on a
  # fresh runner pulls both images.
  #
  # Until 2026-09-13 this could not be prevented from this repository: the job is
  # a reusable workflow owned by `nolte/gh-plumbing`, and `uses:` admits no
  # injected `docker/login-action` step. gh-plumbing#417 (merged, in v2.1.0)
  # added `inputs.dockerhub-username` + `secrets.dockerhub-token` with a
  # fail-soft fallback: with both set the pulls are authenticated (200/6h
  # instead of 100/6h per IP, and not shared with every other tenant of the
  # runner's egress); with either absent the lane behaves exactly as before.
  # First real hit observed 2026-09-13 (run 34743611429, exit 125,
  # `auth.docker.io` connection reset) on a pull request that touched no shell.
  # #1321 tracks it; the credential is a repository variable + secret the
  # operator supplies. A GHCR mirror was rejected: it would move the image tag
  # out of `rev:` in .pre-commit-config.yaml, which Renovate's pre-commit
  # manager owns.
  #
  # `task check:workflow-shell-lint` classifies the same failure locally.
  static:
    permissions:
      contents: read
    uses: nolte/gh-plumbing/.github/workflows/reusable-pre-commit.yaml@80cb5ebb91a3b49126729de31b1037f11c34b5cd # v2.2.0
    with:
      # Empty when the variable is unset — the reusable workflow then skips the
      # login (`if: inputs.dockerhub-username != ''`) and pulls anonymously.
      dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
    secrets:
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  security:
    uses: nolte/gh-plumbing/.github/workflows/reusable-trivy.yaml@80cb5ebb91a3b49126729de31b1037f11c34b5cd # v2.2.0
    permissions:
      contents: read
      security-events: write
      actions: read

  chain-bench:
    uses: nolte/gh-plumbing/.github/workflows/reusable-chain-bench.yaml@80cb5ebb91a3b49126729de31b1037f11c34b5cd # v2.2.0
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

name: Docker Lint & Build

on:
  pull_request:
    branches: [develop]
    paths:
      - 'src/backend/Dockerfile'
      - 'src/backend/Dockerfile.*'
      - 'src/backend/**'
      - 'src/frontend/Dockerfile'
      - 'src/frontend/Dockerfile.*'
      - 'src/frontend/**'
      - 'docker/**'
      - 'spec/knowledge/rag/**'

permissions:
  contents: read

concurrency:
  group: docker-lint-build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      vectordb: ${{ steps.filter.outputs.vectordb }}
      knowledge: ${{ steps.filter.outputs.knowledge }}
      embedding-service: ${{ steps.filter.outputs.embedding-service }}
      reranker-service: ${{ steps.filter.outputs.reranker-service }}
      knowledge-service: ${{ steps.filter.outputs.knowledge-service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            backend:
              - 'src/backend/Dockerfile'
              - 'src/backend/Dockerfile.*'
              - 'src/backend/**'
            frontend:
              - 'src/frontend/Dockerfile'
              - 'src/frontend/Dockerfile.*'
              - 'src/frontend/**'
            vectordb:
              - 'docker/vectordb/**'
            knowledge:
              - 'docker/knowledge/**'
              - 'spec/knowledge/rag/**'
            embedding-service:
              - 'docker/embedding-service/**'
            reranker-service:
              - 'docker/reranker-service/**'
            knowledge-service:
              - 'src/knowledge-service/**'

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: src/backend/Dockerfile

      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: src/frontend/Dockerfile

      - name: Lint vectordb Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: docker/vectordb/Dockerfile

      - name: Lint knowledge Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: docker/knowledge/Dockerfile

      - name: Lint embedding-service Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: docker/embedding-service/Dockerfile

      - name: Lint reranker-service Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: docker/reranker-service/Dockerfile

      - name: Lint knowledge-service Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: src/knowledge-service/Dockerfile

  build-backend:
    needs: [changes, hadolint]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build backend image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src/backend
          file: src/backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    needs: [changes, hadolint]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build frontend image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src/frontend
          file: src/frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-vectordb:
    needs: [changes, hadolint]
    if: needs.changes.outputs.vectordb == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build vectordb image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/vectordb
          file: docker/vectordb/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-knowledge:
    needs: [changes, hadolint]
    if: needs.changes.outputs.knowledge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build knowledge image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/knowledge/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-embedding-service:
    needs: [changes, hadolint]
    if: needs.changes.outputs.embedding-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build embedding-service image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/embedding-service
          file: docker/embedding-service/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-reranker-service:
    needs: [changes, hadolint]
    if: needs.changes.outputs.reranker-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build reranker-service image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/reranker-service
          file: docker/reranker-service/Dockerfile
          target: bge-reranker-v2-m3
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-knowledge-service:
    needs: [changes, hadolint]
    if: needs.changes.outputs.knowledge-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build knowledge-service image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src/knowledge-service
          file: src/knowledge-service/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

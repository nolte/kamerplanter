##
## E2E nightly — full Selenium suite across all compose profiles.
##
## Scheduled offset from security-nuclei-nightly (00:00 UTC) so the two
## long-running nightlies don't compete for runners
## (project/requirements/e2e-ci-selenium.md, R3).
##
## A failing night deliberately does NOT open a GitHub issue any more: the
## auto-filed issues carried no information the run page doesn't already show
## and accumulated faster than they were triaged (supersedes R6). Failures are
## reported through the run status, the per-profile "E2E nightly — <profile>"
## check runs, and the uploaded report artifacts.
##
name: e2e-nightly

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Compose profile to run (all = full matrix)."
        type: choice
        default: all
        options:
          - all
          - light
          - full
          - mobile
          - tablet
          - full-mobile

permissions:
  contents: read
  # dorny/test-reporter publishes each profile's JUnit XML as a check run.
  # No `issues: write` (no auto-filed failure issues) and no
  # `pull-requests: write` (the action posts no PR comments).
  checks: write

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  matrix:
    name: Resolve profile matrix
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ steps.resolve.outputs.profiles }}
    steps:
      - id: resolve
        env:
          PROFILE_INPUT: ${{ inputs.profile || 'all' }}
        run: |
          if [ "$PROFILE_INPUT" = "all" ]; then
            echo 'profiles=["light","full","mobile","tablet","full-mobile"]' >> "$GITHUB_OUTPUT"
          else
            echo "profiles=[\"$PROFILE_INPUT\"]" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: E2E (${{ matrix.profile }})
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.matrix.outputs.profiles) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Layer caching: compose delegates builds to buildx bake (COMPOSE_BAKE)
      # on a container builder, so the gha cache backend declared in the
      # docker-compose.e2e.ci.yml overlay can import/export layers.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Expose Actions runtime for the gha cache backend
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Run E2E suite (${{ matrix.profile }})
        env:
          COMPOSE_BAKE: "true"
          E2E_COMPOSE_OVERLAYS: docker-compose.e2e.ci.yml
        run: ./scripts/run-e2e.sh --profile "${{ matrix.profile }}"

      # Render this profile's JUnit XML into a per-profile check run + job
      # summary so concrete per-test failure messages (assertion text + a short
      # traceback) are visible. This is the single place the run's totals and
      # failed test names are reported — the "Job summary" step below must not
      # restate them. The check-run name carries the profile so a red night can
      # be traced to the failing profile without opening the logs.
      - name: Render E2E test report
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: E2E nightly — ${{ matrix.profile }}
          path: test-reports/e2e/**/junit-*.xml
          reporter: java-junit
          list-tests: failed
          list-suites: failed
          fail-on-error: false
          fail-on-empty: false
          use-actions-summary: true

      # The rendered report above already carries this profile's totals and the
      # concrete per-test failure messages. This step therefore adds only what
      # the reporter cannot know — where the raw evidence lives — instead of
      # restating the same numbers and test names from `protokoll.md`.
      - name: Job summary
        if: always()
        run: |
          {
            # `-print -quit` instead of piping into `grep -q`: under a shell
            # with `pipefail` (which `shell: bash` would add) an early `grep`
            # exit can leave `find` killed by SIGPIPE, flipping this test to
            # false and printing "no report" under a perfectly green run.
            if [ -n "$(find test-reports/e2e -name 'junit-*.xml' -print -quit 2>/dev/null)" ]; then
              echo "**E2E nightly (${{ matrix.profile }})** — full protocol, screenshots and container logs:"
              echo "see the run's \`e2e-nightly-reports-${{ matrix.profile }}\` artifact."
            else
              echo "## E2E nightly (${{ matrix.profile }})"
              echo ""
              echo "No JUnit report was generated (the run failed before pytest)."
              echo "See the job log and the \`e2e-nightly-reports-${{ matrix.profile }}\` artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-nightly-reports-${{ matrix.profile }}
          path: test-reports/e2e/
          retention-days: 14
          if-no-files-found: warn

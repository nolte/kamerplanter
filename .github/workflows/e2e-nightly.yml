##
## E2E nightly — full Selenium suite across all compose profiles.
##
## Scheduled offset from security-nuclei-nightly (00:00 UTC) so the two
## long-running nightlies don't compete for runners
## (project/requirements/e2e-ci-selenium.md, R3).
##
## A failing night deliberately does NOT open a GitHub issue any more: the
## auto-filed issues carried no information the run page doesn't already show
## and accumulated faster than they were triaged (supersedes R6). Failures are
## reported through the run status, the per-profile "E2E nightly — <profile>"
## check runs, and the uploaded report artifacts.
##
## Covered set (`profile: all`): every profile `scripts/run-e2e.sh` accepts,
## minus `smoke`. The list is NOT restated here — the `matrix` job parses it
## out of that script and a drift guard fails the run if the two disagree
## (see the job for the derivation rationale and the guard's three checks).
##
## Why `smoke` is excluded from the nightly matrix: it is a marker subset of
## the light suite that already runs on every pull request and on every push
## to develop as the required `E2E smoke (compose, light)` check
## (.github/workflows/e2e-smoke.yml, project/requirements/e2e-smoke-merge-gate.md).
## Re-running it nightly would buy no coverage the light profile does not
## already give. It stays selectable via workflow_dispatch for a one-off
## re-run of just that subset.
##
name: e2e-nightly

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Compose profile to run (all = full matrix, minus smoke)."
        type: choice
        default: all
        # Drift-guard anchor. GitHub requires `type: choice` options to be
        # static YAML, so this is the one place the profile names must be
        # restated. The `matrix` job parses this flat list back out and fails
        # the run unless it equals scripts/run-e2e.sh's registry — keep every
        # entry a plain "- <profile>" line with no inline comments.
        options:
          - all
          - light
          - smoke
          - mobile
          - tablet
          - full
          - full-mobile
          - full-tablet

permissions:
  contents: read
  # dorny/test-reporter publishes each profile's JUnit XML as a check run.
  # No `issues: write` (no auto-filed failure issues) and no
  # `pull-requests: write` (the action posts no PR comments).
  checks: write

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  matrix:
    name: Resolve profile matrix
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ steps.resolve.outputs.profiles }}
    env:
      REGISTRY_FILE: scripts/run-e2e.sh
      COMPOSE_FILE: docker-compose.e2e.yml
      WORKFLOW_FILE: .github/workflows/e2e-nightly.yml
      # Registry profiles that `profile: all` deliberately skips. See the
      # file header for the reasoning; the guard below asserts each entry is
      # a real registry profile, so a rename cannot turn the skip into a
      # silent no-op that quietly adds a 35-50 min job to every night.
      NIGHTLY_EXCLUDE: smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      ##
      ## Derivation source: scripts/run-e2e.sh, not docker-compose.e2e.yml.
      ##
      ## Every matrix cell is literally an argument to
      ## `./scripts/run-e2e.sh --profile <cell>`, so that script's
      ## `case "$PROFILE" in` block — the set of arguments it accepts — is the
      ## registry, and reading it makes the matrix and the runner incapable of
      ## disagreeing about what a profile name means.
      ##
      ## The compose file cannot play that role: `docker compose -f
      ## docker-compose.e2e.yml config --profiles` reports core-crud, full,
      ## full-mobile, full-tablet, mobile, smoke, tablet, timescaledb. It omits
      ## `light` (that profile's runner, service `e2e-tests`, carries no
      ## `profiles:` key and is a default service) and adds three names that
      ## are not `--profile` values. Deriving from it would need a hard-coded
      ## add plus a hard-coded subtract — exactly the restated literal this
      ## step exists to remove. Compose is cross-checked in the guard instead.
      ##
      - name: Read profile registry from the run script
        id: registry
        run: |
          set -euo pipefail

          # "[$]" matches a literal dollar sign; it keeps the pattern free of
          # anything shellcheck or a shell could read as an expansion.
          anchors=$(grep -cE '^case "[$]PROFILE" in$' "$REGISTRY_FILE" || true)
          if [ "$anchors" != "1" ]; then
            echo "::error file=$REGISTRY_FILE::Expected exactly one 'case \"\$PROFILE\" in' block, found $anchors. The nightly matrix is derived from it — adjust this parse before changing that block." >&2
            exit 1
          fi

          # Case patterns are the indented "<profile>)" tokens inside that
          # block. The default branch ("*)") does not match, and body lines
          # (echo/exit/;;) have no ")" directly after their first word.
          profiles=$(
            sed -n '/^case "[$]PROFILE" in$/,/^esac$/p' "$REGISTRY_FILE" \
              | grep -oE '^[[:space:]]+[a-z][a-z0-9|-]*\)' \
              | tr -d ' )' \
              | tr '|' '\n'
          )

          if [ -z "$profiles" ]; then
            echo "::error file=$REGISTRY_FILE::Parsed no profiles out of the 'case \"\$PROFILE\" in' block." >&2
            exit 1
          fi
          if printf '%s\n' "$profiles" | grep -vqE '^[a-z][a-z0-9-]*$'; then
            echo "::error file=$REGISTRY_FILE::Parsed an implausible profile name:" >&2
            printf '%s\n' "$profiles" >&2
            exit 1
          fi

          registry=$(printf '%s\n' "$profiles" | tr '\n' ' ' | sed 's/ *$//')
          echo "profiles=$registry" >> "$GITHUB_OUTPUT"
          echo "Registry (scripts/run-e2e.sh): $registry"

      ##
      ## Drift guard — declared scope vs. what actually runs.
      ##
      ## Issue #794: full-tablet was in the compose file and in the run script
      ## but in neither the matrix nor the dispatch list, so a whole profile
      ## silently never ran in CI. Deriving the matrix (above) closes the
      ## matrix half; these three checks close the rest, and they run before
      ## the matrix fans out so a mismatch costs one runner-minute, not six
      ## jobs. The options check doubles as a parse-integrity check: if the
      ## `case` parse ever silently drops an entry, the two sets diverge and
      ## this step goes red instead of the night quietly losing coverage.
      ##
      - name: Guard against profile-registry drift
        env:
          REGISTRY: ${{ steps.registry.outputs.profiles }}
          # `light` is the only registry profile with no compose profile of
          # the same name: its runner is a default compose service.
          COMPOSE_EXEMPT: light
          # Compose profiles that are deliberately not run-e2e.sh --profile
          # values: `timescaledb` is an infrastructure add-on with no test
          # runner, `core-crud` is a pytest-marker subset of the light suite
          # kept for local use.
          COMPOSE_IGNORE: core-crud timescaledb
        run: |
          set -euo pipefail

          registry=$(printf '%s\n' "$REGISTRY" | tr ' ' '\n' | sort)
          failed=0

          # (1) workflow_dispatch choice list == registry.
          option_anchors=$(grep -cE '^[[:space:]]*options:[[:space:]]*$' "$WORKFLOW_FILE" || true)
          if [ "$option_anchors" != "1" ]; then
            echo "::error file=$WORKFLOW_FILE::Expected exactly one 'options:' list, found $option_anchors." >&2
            exit 1
          fi
          options=$(
            awk '
              /^[[:space:]]*options:[[:space:]]*$/ { inlist = 1; next }
              inlist && /^[[:space:]]*-[[:space:]]+[^[:space:]]+[[:space:]]*$/ {
                sub(/^[[:space:]]*-[[:space:]]+/, ""); sub(/[[:space:]]*$/, ""); print; next
              }
              inlist { exit }
            ' "$WORKFLOW_FILE" | grep -vxF all | sort || true
          )
          if [ "$options" != "$registry" ]; then
            echo "::error file=$WORKFLOW_FILE::The workflow_dispatch choice list and $REGISTRY_FILE disagree. Left = dispatch options, right = registry:" >&2
            diff -y <(printf '%s\n' "$options") <(printf '%s\n' "$registry") >&2 || true
            failed=1
          fi

          # (2) Every registry profile is backed by a compose profile, so a
          #     matrix cell cannot resolve to a stack that does not exist.
          compose=$(docker compose -f "$COMPOSE_FILE" config --profiles | sort)
          for profile in $registry; do
            if printf '%s\n' "$COMPOSE_EXEMPT" | tr ' ' '\n' | grep -qxF "$profile"; then
              continue
            fi
            if ! printf '%s\n' "$compose" | grep -qxF "$profile"; then
              echo "::error file=$COMPOSE_FILE::Profile '$profile' is a $REGISTRY_FILE profile but no compose profile of that name exists." >&2
              failed=1
            fi
          done

          # (3) Every compose profile is reachable through the run script —
          #     this is the direction that hid #794's sibling defects: a new
          #     viewport profile added to compose alone would never run.
          for profile in $compose; do
            if printf '%s\n' "$COMPOSE_IGNORE" | tr ' ' '\n' | grep -qxF "$profile"; then
              continue
            fi
            if ! printf '%s\n' "$registry" | grep -qxF "$profile"; then
              echo "::error file=$REGISTRY_FILE::Compose profile '$profile' has no '--profile $profile' branch, so nothing in CI can run it. Add it to the run script, or to this job's COMPOSE_IGNORE with a reason." >&2
              failed=1
            fi
          done

          # (4) The nightly exclusions name real profiles.
          for profile in $NIGHTLY_EXCLUDE; do
            if ! printf '%s\n' "$registry" | grep -qxF "$profile"; then
              echo "::error file=$WORKFLOW_FILE::NIGHTLY_EXCLUDE lists '$profile', which is not a $REGISTRY_FILE profile." >&2
              failed=1
            fi
          done

          if [ "$failed" != "0" ]; then
            exit 1
          fi
          echo "No drift: matrix, $REGISTRY_FILE and $COMPOSE_FILE agree."

      - name: Resolve matrix
        id: resolve
        env:
          PROFILE_INPUT: ${{ inputs.profile || 'all' }}
          REGISTRY: ${{ steps.registry.outputs.profiles }}
        run: |
          set -euo pipefail

          registry=$(printf '%s\n' "$REGISTRY" | tr ' ' '\n')

          if [ "$PROFILE_INPUT" = "all" ]; then
            selected="$registry"
            read -ra excluded <<< "$NIGHTLY_EXCLUDE"
            for profile in "${excluded[@]}"; do
              selected=$(printf '%s\n' "$selected" | grep -vxF "$profile" || true)
            done
          else
            if ! printf '%s\n' "$registry" | grep -qxF "$PROFILE_INPUT"; then
              echo "::error::Unknown profile '$PROFILE_INPUT'. Known profiles: $REGISTRY" >&2
              exit 1
            fi
            selected="$PROFILE_INPUT"
          fi

          if [ -z "$selected" ]; then
            echo "::error::Resolved an empty profile matrix for input '$PROFILE_INPUT'." >&2
            exit 1
          fi

          matrix=$(printf '%s\n' "$selected" | jq -Rc . | jq -sc .)
          echo "profiles=$matrix" >> "$GITHUB_OUTPUT"
          echo "Input '$PROFILE_INPUT' resolved to $matrix" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: E2E (${{ matrix.profile }})
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.matrix.outputs.profiles) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Layer caching: compose delegates builds to buildx bake (COMPOSE_BAKE)
      # on a container builder, so the gha cache backend declared in the
      # docker-compose.e2e.ci.yml overlay can import/export layers.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Expose Actions runtime for the gha cache backend
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Run E2E suite (${{ matrix.profile }})
        env:
          COMPOSE_BAKE: "true"
          E2E_COMPOSE_OVERLAYS: docker-compose.e2e.ci.yml
        run: ./scripts/run-e2e.sh --profile "${{ matrix.profile }}"

      # Render this profile's JUnit XML into a per-profile check run + job
      # summary so concrete per-test failure messages (assertion text + a short
      # traceback) are visible. This is the single place the run's totals and
      # failed test names are reported — the "Job summary" step below must not
      # restate them. The check-run name carries the profile so a red night can
      # be traced to the failing profile without opening the logs.
      - name: Render E2E test report
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: E2E nightly — ${{ matrix.profile }}
          path: test-reports/e2e/**/junit-*.xml
          reporter: java-junit
          list-tests: failed
          list-suites: failed
          fail-on-error: false
          fail-on-empty: false
          use-actions-summary: true

      # The rendered report above already carries this profile's totals and the
      # concrete per-test failure messages. This step therefore adds only what
      # the reporter cannot know — where the raw evidence lives — instead of
      # restating the same numbers and test names from `protokoll.md`.
      - name: Job summary
        if: always()
        run: |
          {
            # `-print -quit` instead of piping into `grep -q`: under a shell
            # with `pipefail` (which `shell: bash` would add) an early `grep`
            # exit can leave `find` killed by SIGPIPE, flipping this test to
            # false and printing "no report" under a perfectly green run.
            if [ -n "$(find test-reports/e2e -name 'junit-*.xml' -print -quit 2>/dev/null)" ]; then
              echo "**E2E nightly (${{ matrix.profile }})** — full protocol, screenshots and container logs:"
              echo "see the run's \`e2e-nightly-reports-${{ matrix.profile }}\` artifact."
            else
              echo "## E2E nightly (${{ matrix.profile }})"
              echo ""
              echo "No JUnit report was generated (the run failed before pytest)."
              echo "See the job log and the \`e2e-nightly-reports-${{ matrix.profile }}\` artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-nightly-reports-${{ matrix.profile }}
          path: test-reports/e2e/
          retention-days: 14
          if-no-files-found: warn

# Side-service test suites (#1058)
#
# Three Python components ship their own pytest suites but ran in NO workflow
# until this file — only the image-build lanes touched their paths, and a build
# does not execute a test. The suites are:
#
#   * src/knowledge-service/tests/  (5 files) — RAG assistant, all fakes
#   * src/inference-service/tests/  (10 files) — DINOv2/pgvector, all fakes:
#     the embedder is a deterministic FakeEmbedder, the repository is in-memory
#     and the FastAPI singletons are patched, so NO ONNX model, GPU, network or
#     PostgreSQL is touched. onnxruntime/numpy install from PyPI; the ML `cv`
#     extra (plantcv/OpenCV) stays OUT and is exercised only through its
#     graceful-degradation path (test_missing_plantcv_degrades_gracefully).
#   * src/libs/kp_vectordb/tests/   (3 files) — shared pgvector pool, fakes.
#
# ADVISORY START (NFR-018 §4). These three jobs begin as ADVISORY lanes: they
# are NOT in the branch-protection required set and MUST NOT be added to it here.
# `develop` requires only `static / Static CI Tests` and `lint-test-build (22)`.
# Promotion to required is a decision made on measured stability per NFR-018 §4,
# not by editing this comment. This workflow does not touch branch protection.
#
# One job per service, each with its own `paths:` filter, mirroring backend.yml's
# shape: a change under a service's tree runs only that service's suite. The
# suites are invoked through Taskfile targets (task test:knowledge-service /
# test:inference-service / test:kp-vectordb) so the pipeline and a contributor
# run the identical command (continuous-integration §E). Each of those targets
# carries the fail-on-empty-collection guard (NFR-018 §2): pytest exit code 5
# (no tests collected) is turned into a hard failure, so a mis-pathed or emptied
# suite goes RED here instead of passing green having measured nothing.

on:
  push:
    branches: [develop]
    paths:
      - 'src/knowledge-service/**'
      - 'src/inference-service/**'
      - 'src/libs/kp_vectordb/**'
      - '.github/workflows/side-services.yml'
      # The Taskfile now holds the install and test invocations this workflow
      # runs (`task deps:sync:<service>`, `task test:<service>`), the same shape
      # backend.yml records for `.taskfiles/backend.yaml`. Without these entries
      # a pull request that changes `uv sync --locked --extra dev` into
      # something weaker, or that rewires the include, triggers no job here at
      # all — the gate's own definition would be the one input the gate does not
      # watch.
      - '.taskfiles/libs.yaml'
      - 'Taskfile.yaml'
  pull_request:
    branches: [develop]
    paths:
      - 'src/knowledge-service/**'
      - 'src/inference-service/**'
      - 'src/libs/kp_vectordb/**'
      - '.github/workflows/side-services.yml'
      # The Taskfile now holds the install and test invocations this workflow
      # runs (`task deps:sync:<service>`, `task test:<service>`), the same shape
      # backend.yml records for `.taskfiles/backend.yaml`. Without these entries
      # a pull request that changes `uv sync --locked --extra dev` into
      # something weaker, or that rewires the include, triggers no job here at
      # all — the gate's own definition would be the one input the gate does not
      # watch.
      - '.taskfiles/libs.yaml'
      - 'Taskfile.yaml'

# Least privilege: these jobs only read the checkout. No packages, no PRs, no
# checks are written (github-actions-best-practices).
permissions:
  contents: read

# One cancel-in-progress group per ref: a new push to the same branch/PR
# supersedes an in-flight run. Pre-merge workflow, so cancelling stale work is
# correct — nothing here publishes.
concurrency:
  group: side-services-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub Actions has no native per-job `paths:` (paths lives at workflow level,
  # like backend.yml). The workflow triggers when any of the three service trees
  # change; all three jobs then run. That is deliberate and matches backend.yml's
  # shape: every suite here is fake-only and finishes in ~1s of pytest, so a job
  # for an unchanged service costs a checkout + a fast install, not a real run.
  knowledge-service:
    name: knowledge-service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        # One pin, read from `[tool.uv].required-version` — see the long note on
        # the same step in backend.yml's `lint-test` job (#1383).
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version-file: src/knowledge-service/pyproject.toml
          enable-cache: true
          cache-dependency-glob: src/knowledge-service/uv.lock

      - name: Install knowledge-service (with dev extra)
        # From the hash-verified lock (#1383), like every other Python install in
        # this repository. The test toolchain lives in the pyproject's
        # [project.optional-dependencies].dev EXTRA, not in the uv.lock `dev`
        # dependency GROUP (#1374) — that group carries only the image's
        # hot-reload watcher, which `uv sync` adds as well because it is a default
        # group. Both are in the lock, so `--locked` verifies both.
        # `uv sync` installs the project itself editable, so the suite imports the
        # working tree. httpx is a runtime dependency here, so the TestClient tier
        # works out of the box. The environment goes on PATH because the Taskfile
        # target below calls a bare `python -m pytest`.
        # Through the Taskfile, so this lane and `task deps:sync:knowledge-service`
        # are one invocation rather than two that can drift. Only the PATH export
        # stays here — it is a runner fact, not part of the install.
        working-directory: src/knowledge-service
        run: |
          task deps:sync:knowledge-service
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run knowledge-service suite
        # task target carries the fail-on-empty-collection guard (NFR-018 §2) and
        # is the exact command a contributor runs locally.
        run: task test:knowledge-service

  inference-service:
    name: inference-service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        # One pin, read from `[tool.uv].required-version` — see the long note on
        # the same step in backend.yml's `lint-test` job (#1383).
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version-file: src/inference-service/pyproject.toml
          enable-cache: true
          cache-dependency-glob: src/inference-service/uv.lock

      - name: Install inference-service (with dev extra)
        # From the hash-verified lock (#1383): onnxruntime + numpy + pillow (the
        # base runtime) plus the dev extra, every artifact checked against the
        # hash uv.lock records. The optional `cv` extra (plantcv/OpenCV, REQ-038)
        # is deliberately NOT installed: the whole suite runs on fakes and
        # exercises PlantCV only through its absence path. Neither is the `build`
        # dependency group (torch/onnx, the model-export toolchain) — it is not a
        # default group, so `uv sync` leaves it out and this job does not pay for
        # a torch download. httpx is in the dev extra (added for this suite — the
        # tests drive the FastAPI app through Starlette's TestClient, which needs
        # an httpx transport; it is not a runtime dep of the service itself). The
        # environment goes on PATH because the Taskfile target below calls a bare
        # `python -m pytest`.
        # Through the Taskfile, so this lane and `task deps:sync:inference-service`
        # are one invocation rather than two that can drift. Only the PATH export
        # stays here — it is a runner fact, not part of the install.
        working-directory: src/inference-service
        run: |
          task deps:sync:inference-service
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run inference-service suite
        run: task test:inference-service

  libs:
    name: kp_vectordb tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        # One pin, read from `[tool.uv].required-version` — see the long note on
        # the same step in backend.yml's `lint-test` job (#1383).
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version-file: src/libs/kp_vectordb/pyproject.toml
          enable-cache: true
          cache-dependency-glob: src/libs/kp_vectordb/uv.lock

      - name: Install kp_vectordb (with dev extra)
        # Light package: psycopg + psycopg-pool + structlog. The suite uses fakes,
        # so no real PostgreSQL is required.
        #
        # From the hash-verified lock (#1464), like every other PEP 621 tree in
        # this repository — the boundary is named rather than rounded up to "every
        # Python install" (#1491 review). #1509 then decided the three requirement
        # lists that sat outside it: `tests/e2e/` was locked the same way,
        # `docs/requirements.txt` is compiled with `--generate-hashes`, and
        # `tools/rag-eval/requirements.txt` is the one argued exception (a local
        # analysis tool no lane installs). The sweep in
        # scripts/ci/check_renovate_dashboard.py reddens on anything else.
        # Until then this was the ONE `pip install -e` left, and
        # the reason given was that a shared library has no image and therefore
        # no lock to sync from — true about images, not about hashes: NFR-009 §2.3
        # is a property of the INSTALL, and this one runs on a runner exactly like
        # the four that were locked in #1374. `src/libs/kp_vectordb/uv.lock` now
        # exists and `LOCKLESS_PYTHON_PROJECTS` in
        # scripts/ci/check_renovate_dashboard.py is empty, so a new lockless
        # Python tree is a finding rather than an allowance.
        #
        # Through the Taskfile, so this lane and `task deps:sync:kp-vectordb` are
        # one invocation rather than two that can drift. Only the PATH export
        # stays here — it is a runner fact, not part of the install.
        working-directory: src/libs/kp_vectordb
        run: |
          task deps:sync:kp-vectordb
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run kp_vectordb suite
        run: task test:kp-vectordb

name: Security — ZAP Post-Merge Scans

##
## NFR-015 §4.1 + §4.2 — Baseline (passive + AjaxSpider) and OpenAPI-driven API
## scan against an ephemeral stack. As of 2026-08-08 (issue #1013) this runs
## ONCE PER MERGED COMMIT on `develop`, not per push on every pull request.
##
## WHY THIS IS NO LONGER A PER-PUSH PULL-REQUEST LANE.
##
## Measured over the 100 most recent runs of the old per-pull-request lane:
## cancelled 42 · success 53 · failure 3 · running 2. Unlike the Nuclei lane that
## moved in #1010 (0 of its last 20 completed) this lane completes a MAJORITY of
## its runs, so the move is a different trade, argued on ZAP's own terms:
##
##   1. The 42% that cancel are the NFR-018 §1 vacuous-signal class: on nearly
##      every second code pull request a security check sits green-adjacent,
##      indistinguishable from one that did not need to run.
##   2. Two causes cancel it, neither fixable by the concurrency setting: a
##      follow-up push / the `strict: true` rebase superseded the run (the
##      `cancel-in-progress: true` this file used to carry), AND the pull request
##      is merged by the `automerge` label as soon as the two REQUIRED contexts
##      report (`static / Static CI Tests`, `lint-test-build (22)`), which closing
##      the pull request cancels. `cancel-in-progress: false` alone removes the
##      first but NOT the second: the scan still loses to the merge of its own PR.
##   3. This lane runs ONLY pre-merge and never re-runs, so a cancelled commit
##      has its OpenAPI API surface (§4.2) scanned NEVER — the nightly does not
##      cover it (it spiders the frontend rather than reading the OpenAPI doc).
##      `push: [develop]` scans every merged commit exactly once and closes it.
##
## Both scans here are UNAUTHENTICATED. The authenticated depth that is the whole
## point of NFR-015 — cross-tenant negative tests (§3.3), the auth-bypass
## two-pass (§4.2) for REQ-024 — lives ENTIRELY in `security-zap-nightly.yml`.
## So the move sacrifices only the PRE-MERGE ATTRIBUTION of anonymous findings:
## they now surface AFTER the merge (one squash commit each, plus an auto-opened
## issue on the push lane). A deliberate, recorded reduction in pull-request
## coverage per NFR-018 §4 — see NFR-015 §4.1 — not a repair; the check was never
## required and a cancelled run blocked nothing.
##
## PRE-MERGE SCANNING STAYS ON DEMAND — THROUGH `workflow_dispatch`, NOT A LABEL
## (#1607, 2026-09-20). This paragraph used to read "label a pull request
## `security-scan`". Two things were wrong with that sentence at once, which is
## why it is the NFR-018 §1 shape rather than a typo:
##
##   1. The label did not exist. `gh label list` returned 30 labels and not one
##      of them matched `scan`, so anyone following the instruction invoked
##      nothing — the lane had never run.
##   2. `pull_request: types: [labeled]` cannot be filtered by label NAME at the
##      `on:` level, so the selection had to sit in the job's `if:` — which is
##      evaluated AFTER the run is queued. Every label on every pull request
##      therefore queued a run here that immediately skipped. Measured over
##      2026-09-13T05:54Z .. 2026-09-20T16:39Z: 300 `pull_request` runs of this
##      workflow, 278 skipped + 22 cancelled, 0 executed. The cost unit is the
##      one fe8714e38 (#1583) was about — a job, not a CPU-second.
##
## The trigger is now a `workflow_dispatch` carrying the pull-request number. It
## costs zero runs per label and still scans the pre-merge code, because the
## checkout step below resolves `refs/pull/<n>/merge`:
##
##     gh workflow run security-zap-postmerge.yml --ref develop \
##       -f pull_request=<number>
##
## The `security-scan` label now exists and is declared in `.github/settings.yml`,
## but it is a TRIAGE MARKER ONLY: it records that a pull request was scanned or
## wants scanning, and it triggers nothing. Deliberately so — applying a label
## needs only triage permission, while this job checks out pull-request code, so
## the invocation belongs behind `actions: write` (see #1607's closing note).
##
## PRECONDITION (as for the Nuclei lane): a push to `develop` must trigger
## workflows. A GITHUB_TOKEN-authored squash-merge does NOT; `automerge.yaml`
## mints a GitHub-App token so it does. If `vars.PORTFOLIO_APP_ID` is ever unset,
## this lane stops firing SILENTLY.
##
## No "no results -> fail" guard is added: `scripts/security/zap_gate.py` already
## exits non-zero on a missing or unparseable report, so an empty scan fails loud.
##
## Why ZAP runs through `docker run` rather than `zaproxy/action-baseline`,
## which §4.1 names:
##
##   * **Networking.** `docker-compose.security.override.yml` binds the stack to
##     127.0.0.1 only, deliberately — "so a CI runner does not advertise the
##     internal stack to the wider network". A container cannot reach the host's
##     loopback, and the ZAP actions expose no network option. The alternatives
##     were to weaken that binding to 0.0.0.0 or to attach ZAP to the compose
##     network. Attaching is strictly safer and needs no change to the override.
##   * **Scripts.** §3.2 and §3.3 require loading an HttpSender script and a
##     passive-rule script into ZAP. The wrapper actions offer no path for that,
##     so the nightly profile would need `docker run` regardless; using one
##     mechanism for both keeps the two profiles comparable.
##
## The deviation is recorded in NFR-015 §4.1 rather than left implicit.
##
## The ZAP image is pinned by digest (NFR-018 §3), and since #1563 the pin
## lives ONCE in the job's `env:` as `ZAP_IMAGE`, with the `# renovate:` marker
## the custom manager reads; the `docker run` lines below reference `$ZAP_IMAGE`.
## The tag on it is `20260629-stable`, measured against the GHCR manifest list
## as the tag that digest actually carries — an earlier note here called it "the
## `stable` tag as of 2026-08-01", which was the same image described by a tag
## that has since moved on to a different digest. That is why the tag now sits
## in the value rather than in prose: a note ages without anything noticing, a
## pin a manager reads does not.
##
## The note stays HERE and never on the `docker run` line: inside a `run:` block
## a `#` is shell, not YAML, so an inline comment swallows the rest of the line
## INCLUDING its trailing backslash — the continuation is lost and the next line
## runs as its own command. That exact mistake produced
## `zap-baseline.py: command not found` on the first real run. The `env:`
## indirection is what makes both true at once: the marker comment sits in YAML,
## where a `#` is a comment, and the execution line carries only `$ZAP_IMAGE`.
##
## Both scans run with `-I` (do not fail on warnings). The verdict belongs to
## `scripts/security/zap_gate.py`, which implements the §5.1 severity matrix and
## the §5.2 confidence filter — ZAP's own exit codes know neither.
##

on:
  push:
    branches: [develop]
    paths:
      - "src/backend/**"
      - "src/frontend/**"
      - "helm/**"
      - "docker-compose.e2e.yml"
      - "docker-compose.security.override.yml"
      - "tests/security/zap-**"
      # The gate script imports from its own directory, which Python enumerates to resolve
      # imports (measured 2026-09-23, #1596) — the directory, not one file, is the input;
      # security-nuclei-postmerge.yml already lists it that way.
      - "scripts/security/**"
      - ".github/actions/ephemeral-stack/**"
      - ".github/workflows/security-zap-postmerge.yml"
  # On-demand pre-merge scan. No `paths:` filter — the dispatch IS the
  # selection. See the header for why this is not a `labeled` trigger.
  workflow_dispatch:
    inputs:
      pull_request:
        description: >-
          Pull-request number to scan before it merges. Leave empty to scan the
          ref this dispatch was started from.
        required: false
        type: string

# Read-only floor; the job declares what it actually needs.
permissions:
  contents: read

concurrency:
  # Keyed per merged commit, or per pull request when a dispatch names one.
  # NEVER cancel-in-progress: superseding is one of the two causes this move
  # fixes. Read through `github.event.inputs.*` rather than the `inputs`
  # context: `github` is available in every workflow key, `inputs` is documented
  # for `jobs.*`, and a workflow-level key is not the place to find that out.
  group: security-zap-${{ github.event.inputs.pull_request || github.sha }}
  cancel-in-progress: false

jobs:
  zap-scan:
    name: ZAP Scan (baseline + API)
    # No `if:` any more. It existed to undo `types: [labeled]` firing for ANY
    # label; with the trigger gone every remaining event — a push to `develop`
    # or an explicit dispatch — is one this job should run for, and a condition
    # that can never be false is a gate that cannot fail (NFR-018 §2).
    runs-on: ubuntu-latest
    # NO WRITE SCOPE HERE — AND THAT IS THE POINT (#1614).
    # This job checks out `refs/pull/<n>/merge` on a dispatch, which is
    # untrusted code, and it used to hold `issues: write` while doing so. The
    # only issue-writing step was gated `if: always() && github.event_name ==
    # 'push'`, so no escalation was reachable — but a single `if:` on a single
    # step was the whole distance between the untrusted tree and a writable
    # token. The write now lives in `report-findings` below, which never
    # checks out pull-request code, so the permission and the tree no longer
    # share a runner at all.
    permissions:
      contents: read
    outputs:
      # The report job downloads this run's artefact by name; the name is
      # derived from the COMMIT THAT WAS SCANNED, not from `github.sha`.
      label: ${{ steps.target.outputs.label }}
    # §5.3 budgets Baseline < 20 min and API < 15 min PER SCAN. This 45 is a JOB
    # timeout wrapping the ephemeral-stack build + BOTH scans — a distinct ceiling
    # that protects the runner, not the per-scan budget.
    timeout-minutes: 45
    env:
      # THE SCANNER IS A DEPENDENCY, AND UNTIL #1563 NO MANAGER READ IT.
      # These pins used to sit inline in the `run:` blocks below as a BARE
      # DIGEST with no tag. That looks more correct than a floating tag and
      # ages just as silently: the built-in github-actions manager reads
      # `uses:` and `container:`, not an image string a step hands to
      # `docker run`, and the custom regex manager in renovate.json5 (#898)
      # needs both a `# renovate:` marker and a `TAG@sha256:` shape. Measured
      # on 2026-09-19 with `LOG_LEVEL=debug task renovate:dry-run`:
      # `grep -c zaproxy <log>` was 0 — not one extraction, not one lookup.
      #
      # That matters most here of all places. ZAP ships new passive and active
      # rules with every release, so a frozen scanner keeps reporting green
      # against an ageing rule set and nobody sees the gate's meaning change
      # (the #1177 class, NFR-014/NFR-015).
      #
      # The tag is the one the digest actually carries — measured against the
      # GHCR manifest list, not guessed — so this commit changes which manager
      # reads the pin and nothing about which image runs.
      # renovate: datasource=docker depName=ghcr.io/zaproxy/zaproxy
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:20260807-stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
      # Same class, found by the class sweep of #1563 rather than by the
      # issue: a tag AND a digest look managed, but the marker is what the
      # regex manager matches on, so `grep -c curlimages <log>` was 0 too.
      # renovate: datasource=docker depName=curlimages/curl
      CURL_IMAGE: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A dispatch that names a pull request scans THAT pull request's merge
          # result, not the ref the dispatch was started from. Without this the
          # input would be accepted and silently ignored — #1607's own shape,
          # one level down. `''` is checkout's own default for `ref`.
          ref: ${{ github.event.inputs.pull_request && format('refs/pull/{0}/merge', github.event.inputs.pull_request) || '' }}
          # checkout's default is `true`, which writes the job token into
          # `.git/config` as an `http.extraheader` — inside the tree this job
          # then runs as a Docker workload. Measured before removing it: the
          # only `git` call in this job is `git rev-parse HEAD` below, and no
          # step here reaches the GitHub API through the checkout — the issue
          # is filed from `report-findings`, which has its own token.
          persist-credentials: false

      - name: Record the scan target
        id: target
        env:
          PR_NUMBER: ${{ github.event.inputs.pull_request }}
        # The artefact used to be named after `github.sha`, which on a dispatch
        # is the tip of the ref the dispatch started from — NOT the commit that
        # was scanned. Resolve it from the checkout instead.
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "label=${PR_NUMBER:+pr${PR_NUMBER}-}${sha}" >> "$GITHUB_OUTPUT"
          echo "Scanning ${PR_NUMBER:+pull request #${PR_NUMBER} at }${sha}"

      - name: Bring up ephemeral stack
        uses: ./.github/actions/ephemeral-stack

      - name: Resolve the compose network
        id: net
        # Read the network off the running container rather than assuming
        # "<project>_default": compose's naming has changed between versions, and
        # a wrong guess would surface as an unreachable target, which ZAP reports
        # as "no alerts" — a green scan of nothing.
        run: |
          set -euo pipefail
          cid="$(docker compose -p kamerplanter-security ps -aq backend)"
          net="$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$cid")"
          if [[ -z "$net" ]]; then
            echo "::error::Could not resolve the compose network for the backend container." >&2
            exit 1
          fi
          echo "name=$net" >> "$GITHUB_OUTPUT"
          echo "Compose network: $net"

      - name: Verify the targets are reachable FROM the scanner's network
        env:
          NET: ${{ steps.net.outputs.name }}
        # The readiness probe in the composite action polls 127.0.0.1 from the
        # runner. That says nothing about what a container on the compose network
        # can reach, and an unreachable target makes ZAP report zero alerts and
        # exit 0. Prove reachability from the same vantage point the scanner will
        # have, before the scanner runs.
        run: |
          set -euo pipefail
          docker run --rm --network "$NET" "$CURL_IMAGE" \
            -fsS -o /dev/null http://backend:8000/api/v1/health/live
          docker run --rm --network "$NET" "$CURL_IMAGE" \
            -fsS -o /dev/null http://frontend:8080/
          echo "Both targets answer from inside $NET."

      - name: Prepare the ZAP working directory
        run: |
          set -euo pipefail
          mkdir -p zapwork
          # The rule files are NOT copied in: they are the gate's input, not the
          # scanner's. See the scan steps below.
          # The ZAP image runs as uid 1000; the bind mount has to be writable by
          # it or every report write fails silently late in the scan.
          chmod -R a+rwX zapwork

      - name: Fetch the OpenAPI document and point it at the scanner's target
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8000/api/v1/openapi.json -o zapwork/openapi-raw.json
          # FastAPI omits `servers` unless a root_path is configured, and ZAP
          # needs one to know where to send the requests it derives. Inside the
          # compose network that is `backend:8000`, not the loopback address the
          # runner uses.
          jq '.servers = [{"url": "http://backend:8000"}]' \
            zapwork/openapi-raw.json > zapwork/openapi.json
          jq -r '"OpenAPI \(.openapi), \(.paths | length) paths, servers \(.servers | tojson)"' \
            zapwork/openapi.json

      - name: ZAP Baseline scan (passive + AjaxSpider)
        env:
          NET: ${{ steps.net.outputs.name }}
        # -j  AjaxSpider, required by §2.1 for the React SPA: a plain spider sees
        #     one HTML shell and none of the client-rendered routes.
        # -a  include alpha passive rules.
        # -I  do not fail on warnings; the verdict is zap_gate.py's.
        # NO `-c <rules>.tsv` HERE, though for a weaker reason than on the
        # API scan below: `zap-baseline.py` runs no active scan, so a config file
        # could not swap its policy. It is omitted so that suppression has ONE
        # implementation across all three profiles — `zap_gate.py --rules` — rather
        # than a scanner-side mechanism on two of them and a gate-side one on the
        # third, which is the drift this repository keeps paying for.
        run: |
          set -euo pipefail
          docker run --rm --network "$NET" \
            -v "$PWD/zapwork:/zap/wrk:rw" \
            "$ZAP_IMAGE" \
            zap-baseline.py \
              -t http://frontend:8080 \
              -J baseline-report.json \
              -r baseline-report.html \
              -a -j -I \
            || echo "zap-baseline exited $? — the verdict is applied below."

      - name: ZAP API scan (OpenAPI-driven)
        env:
          NET: ${{ steps.net.outputs.name }}
        # NO `-c <rules>.tsv` HERE. `zap-api-scan.py` picks its active scan policy
        # from whether that config produced any entries — `scan_policy =
        # 'API-Minimal'; if config_dict: scan_policy = 'Default Policy';
        # enable_all_scanners(...)` — so the first suppression would silently swap
        # a 23-rule minimal policy for the full active rule set under a 45-minute
        # job timeout, and the only shape it can express is "off everywhere".
        # Suppression lives in `zap_gate.py --rules`, which drops matching
        # INSTANCES by URL and leaves the scanner alone. Same omission on the
        # baseline for one mechanism rather than two.
        run: |
          set -euo pipefail
          docker run --rm --network "$NET" \
            -v "$PWD/zapwork:/zap/wrk:rw" \
            "$ZAP_IMAGE" \
            zap-api-scan.py \
              -t openapi.json \
              -f openapi \
              -J api-report.json \
              -r api-report.html \
              -I \
            || echo "zap-api-scan exited $? — the verdict is applied below."

      - name: Apply the NFR-015 severity policy
        # Runs for both reports even if one scan died, so a partial run still
        # reports what it found. A MISSING report is a failure inside the gate,
        # not a silent pass — see zap_gate.py.
        run: |
          set -euo pipefail
          status=0
          python3 scripts/security/zap_gate.py zapwork/baseline-report.json \
            --profile baseline --rules tests/security/zap-rules.tsv \
            --emit-blocking zapwork/blocking-baseline.json || status=1
          python3 scripts/security/zap_gate.py zapwork/api-report.json \
            --profile api --rules tests/security/zap-api-rules.tsv \
            --emit-blocking zapwork/blocking-api.json || status=1
          exit "$status"

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-scan-reports-${{ steps.target.outputs.label }}
          path: |
            zapwork/*-report.json
            zapwork/*-report.html
            zapwork/blocking-*.json
            zapwork/openapi.json
          retention-days: 90
          if-no-files-found: error

      - name: Tear down ephemeral stack
        if: always()
        env:
          COMPOSE_PROJECT_NAME: kamerplanter-security
        run: |
          docker compose \
            -f docker-compose.e2e.yml \
            -f docker-compose.security.override.yml \
            down -v --remove-orphans

  # ── The write lives here, and nothing untrusted does (#1614) ───────────
  # This job holds `issues: write`. It has no `actions/checkout` at all, so
  # the pull-request tree the scan job resolved never exists on this runner.
  # The verdicts reach it the way every other consumer reaches them: through
  # the artefact `zap-scan` already uploaded.
  #
  # `continue-on-error` on the download is load-bearing and is NOT a way of
  # ignoring a failure. The script below distinguishes three states — verdict
  # present, verdict absent (a failure, never a clean result), verdict empty
  # (a real clean result) — and that distinction is the step's whole point. A
  # hard-failing download would collapse "absent" into an infrastructure error
  # before the script could say so.
  #
  # gate-integrity-ok: the verdict this job carries is the issue, not a pass/fail
  # for the scan — that one stays in `zap-scan`, whose failure reddens the run on
  # its own. And a failed dependency cannot make THIS job green either: with no
  # artefact to download, `zapwork/blocking-*.json` is absent and the script
  # below calls `core.setFailed` for exactly that case. `needs.zap-scan.result`
  # is deliberately absent from the `if:` — the job must run when the scan
  # failed, because a partial scan is when a finding most needs its channel.
  report-findings:
    name: Open issue for blocking findings
    needs: zap-scan
    # Same gate as the step carried before the split, unchanged: only the
    # post-merge (push) lane files issues. On a dispatch the failing scan job
    # IS the channel.
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download the ZAP verdicts
        # gate-integrity-ok: an absent verdict is judged by the script below,
        # which fails the job for it. Failing here instead would collapse
        # "the scan produced nothing" into "the download broke".
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zap-scan-reports-${{ needs.zap-scan.outputs.label }}
          path: zapwork

      # The consumer of the post-merge signal. Without this, the only channel for
      # a post-merge finding is a red run in the Actions tab — the alarm that went
      # unnoticed for the nightly for months. Push lane only: on a dispatched
      # pre-merge scan the failing job IS the channel, and an issue would be noise.
      - name: Open issue for new blocking findings
        if: always() && github.event_name == 'push'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Read through process.env, never interpolated into the script body: a
          # ${{ }} inside script: is textual substitution into JavaScript.
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const fs = require('fs');
            // The verdict has ONE owner: zap_gate.py, which applies the §5.1/§5.2
            // matrix AND the rule-file suppressions, then writes what it decided.
            // This step used to re-derive `riskcode >= 3 && confidence >= 2` from
            // the raw report — a second copy of the policy that knew nothing about
            // suppressions, so a suppressed finding was filed as an issue anyway.
            // A missing file means that profile was never judged; that is a failure,
            // never a clean result. An empty file means it ran and found nothing.
            // Both halves matter and neither may swallow the other: the run fails
            // for the profile that produced nothing, AND the issue still opens for
            // the profile that did. Returning early on a missing verdict would cost
            // the completed scan its only channel — this workflow's header calls a
            // red run in the Actions tab "the alarm that went unnoticed for the
            // nightly for months", which is the reason this step exists.
            const expected = ['zapwork/blocking-baseline.json', 'zapwork/blocking-api.json'];
            const missing = expected.filter(f => !fs.existsSync(f));
            if (missing.length > 0) {
              core.setFailed(`zap_gate.py produced no verdict for ${missing.join(', ')} — that scan or the gate did not run. This is a failure, not a clean result.`);
            }
            const verdicts = expected.filter(f => fs.existsSync(f));
            if (verdicts.length === 0) {
              return;
            }
            const blocking = [];
            for (const f of verdicts) {
              let data;
              try { data = JSON.parse(fs.readFileSync(f, 'utf8')); }
              catch (e) { core.setFailed(`ZAP verdict ${f} is not valid JSON: ${e}`); return; }
              blocking.push(...data);
            }
            if (blocking.length === 0) {
              core.notice(missing.length > 0
                ? `No blocking findings in ${verdicts.join(', ')} — no issue opened. ${missing.join(', ')} produced no verdict and the run is failed above.`
                : 'No blocking ZAP findings — no issue opened.');
              return;
            }
            const summary = blocking.slice(0, 20).map(h =>
              `- \`${h.plugin}\` — ${h.name} (${h.count} instance(s)) on ${h.site}`
            ).join('\n');
            const more = blocking.length > 20 ? `\n…and ${blocking.length - 20} more.` : '';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[zap-postmerge] ${blocking.length} blocking findings on ${process.env.COMMIT_SHA.slice(0, 8)}`,
              body: [
                `Post-merge ZAP scan of \`${process.env.COMMIT_SHA}\` raised **${blocking.length}** blocking findings (High risk, confidence >= Medium — NFR-015 §5.1/§5.2).`,
                '',
                `Run: ${process.env.RUN_URL}`,
                '',
                'This commit is already on `develop`. The scan runs after the merge by design',
                '(NFR-015 §4.1) — see the header of `security-zap-postmerge.yml` for why.',
                '',
                '## Findings (truncated to 20)',
                '',
                summary + more,
              ].join('\n'),
              labels: ['security', 'zap'],
            });

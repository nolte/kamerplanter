name: Release Drafter

on:
  push:
    branches: [develop]
  # Manual fallback: automerge squash-merges into develop are authored by
  # GITHUB_TOKEN, and GitHub does not trigger downstream workflows for
  # GITHUB_TOKEN-authored pushes (loop guard). Without this, the draft is
  # never (re)generated after a bot merge. workflow_dispatch lets an operator
  # run the drafter by hand (`gh workflow run release-drafter.yml --ref develop`).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update_release_draft:
    # Pass the portfolio App so the draft is written under the App identity
    # (consistent audit trail with release-publish). When `vars.PORTFOLIO_APP_ID`
    # is unset, the reusable falls back to `secrets.token` (GITHUB_TOKEN).
    uses: nolte/gh-plumbing/.github/workflows/reusable-release-drafter.yml@d51e51ec3ec17ceea09fe9eb40ac00857b6fa1be # v2.0.0
    with:
      app-id: ${{ vars.PORTFOLIO_APP_ID }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      app-private-key: ${{ secrets.PORTFOLIO_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      pull-requests: write

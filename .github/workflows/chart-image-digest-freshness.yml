name: Chart Image Digest Freshness

# Issue #1026 — the missing half of #987/#1024.
#
# #1024 moved deployment onto digest-pinned first-party images kept current by
# Renovate's `kamerplanter images` write-back. The honest trade it recorded: if
# Renovate stalls, deploys stop SILENTLY — the chart keeps pinning older, still-
# pullable digests and nothing in the repo can see the pin is out of date.
# scripts/check_chart_image_digests.py (the required `static` gate) checks a
# digest is PRESENT, WELL-FORMED and CONSISTENT, and says in its own header that
# it deliberately cannot check whether the digest is CURRENT — "the answer lives
# in the registry […] closed by a scheduled job that compares these digests
# against :latest in GHCR and reports drift". This is that job.
#
# It is SCHEDULED, not a pull-request gate, on purpose: "current" is a registry
# fact that changes with no commit, so a PR gate can never observe it.
#
# Fail-loud contract (NFR-018 §2): a registry/parse error makes THIS RUN RED and
# opens NO issue — an undetermined check is not a clean check, and a transient
# blip must not spam an alert. A determined result (drift or none) writes
# freshness-report.json and exits 0; the alert then lives in a single, deduped
# issue, not in the run status.

on:
  schedule:
    # 06:00 UTC daily — offset from the 00:00 Nuclei nightly so the two alerting
    # jobs do not cluster. Daily is the right cadence: the drift window this job
    # guards is measured in days (see DRIFT_THRESHOLD_DAYS), so sampling more
    # often only adds noise, and less often widens the blind spot it closes.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      threshold_days:
        description: "Override the drift grace window in days (default 3)."
        required: false
        type: string

# Least privilege. Read the checkout, read packages for the pull-token exchange
# (anonymous suffices for public packages today), write issues for the single
# deduped alert. No id-token, no contents:write.
permissions:
  contents: read
  packages: read
  issues: write

# An alerting job: serialise a scheduled run against a manual one so two runs
# cannot both act on the alert issue, and never cancel — a cancelled run could
# leave the issue half-updated. Fixed group (not github.ref) because this only
# ever runs on the default branch; there are no branches to keep apart.
concurrency:
  group: chart-image-digest-freshness
  cancel-in-progress: false

jobs:
  check-freshness:
    name: Compare pinned chart digests against GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Extract the owned image pins with the SAME owned-glob the pin script and
      # the digest guard use, so the three see the same set. `yq`'s `==` supports
      # `*` wildcards (mikefarah), exactly as scripts/ci/pin_chart_image_digests.sh
      # relies on. Refuse to continue on an empty set — a freshness check that
      # examined nothing must not report clean (NFR-018 §2).
      - name: Extract Kamerplanter image pins from the chart
        run: |
          set -euo pipefail
          yq -o=json '[.. | select(has("repository"))
            | select(.repository == "*ghcr.io/nolte/kamerplanter-*")
            | {"repository": .repository, "tag": .tag}]' \
            helm/kamerplanter/values.yaml > pins.json
          count=$(yq -o=json 'length' pins.json)
          if [[ "$count" -eq 0 ]]; then
            echo "::error::No Kamerplanter image pins found in helm/kamerplanter/values.yaml — refusing to report a clean freshness check against nothing." >&2
            exit 1
          fi
          echo "Extracted $count image pin(s)."

      - name: Compare pinned digests against the registry
        id: check
        env:
          # Anonymous reads work for the public packages today; the token is used
          # only for the GHCR pull-token exchange so this keeps working if a
          # package is ever made private — same mechanism as
          # scripts/ci/pin_chart_image_digests.sh.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIFT_THRESHOLD_DAYS: ${{ inputs.threshold_days || '3' }}
        # Hard errors exit non-zero here => the run goes red and the issue step
        # below no-ops (no freshness-report.json). A determined result writes the
        # report and exits 0.
        run: python3 scripts/ci/check_digest_freshness.py pins.json

      - name: Open, update or close the drift alert issue
        # Runs only when the check DETERMINED a result (report exists). On a hard
        # error the report is absent, this step is skipped, and the red run is the
        # signal — deliberately NOT an issue, so a transient registry blip cannot
        # spam the tracker.
        if: always() && hashFiles('freshness-report.json') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Read via process.env, never interpolated into the script body.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('freshness-report.json', 'utf8'));
            const LABEL = 'digest-freshness';
            const TITLE = 'Chart image digests are stale — Renovate write-back may have stalled (#1026)';
            const runUrl = process.env.RUN_URL;

            // Dedup anchor: the single open issue carrying our label. A good
            // alerting job updates one issue; it does not open a new one daily.
            const open = (await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: LABEL,
            })).data.filter(i => !i.pull_request);
            const existing = open[0];

            const drift = report.drift || [];

            if (drift.length === 0) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `Resolved: every chart image pin matches the registry again as of ${runUrl}. Closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, state: 'closed',
                });
                core.notice(`Drift cleared — closed alert issue #${existing.number}.`);
              } else {
                core.notice('All chart image digests are current — nothing to report.');
              }
              return;
            }

            // The wording tracks what the script measures. The registry cannot
            // say WHEN a channel tag moved, so the divergence is reported as an
            // interval: at most since the pinned build was created (age_days,
            // the value the grace window is applied to), at least since the
            // build now serving the channel was created (current_age_days).
            // Claiming a single figure here would assert more than #1210's fix
            // can measure — see the script's module docstring.
            const rows = drift.map(d =>
              `- \`${d.repository}:${d.channel}\`\n` +
              `  - pinned:   \`${d.pinned}\` — built ${d.age_days} day(s) ago\n` +
              `  - registry: \`${d.current}\` — built ${d.current_age_days} day(s) ago\n` +
              `  - the pin has been out of date for **at most ${d.age_days} day(s)**, at least ${d.current_age_days} (grace window: ${report.threshold_days})`
            ).join('\n');

            const body = [
              `The scheduled freshness check found **${drift.length}** chart image pin(s) that are no longer what GHCR serves for their channel, and whose pinned build is older than the ${report.threshold_days}-day grace window.`,
              '',
              'This is the signal #1026 exists to surface. `helm/kamerplanter/values.yaml` pins immutable digests kept current by Renovate’s `kamerplanter images` write-back (#987/#1024). When those pins age past the grace window, a published build has NOT been carried into the chart: deploys are pinned to older, still-pullable digests and are therefore **stalled, not broken** — `scripts/check_chart_image_digests.py` stays green because the pins are present and well-formed.',
              '',
              '## Drifted images',
              '',
              rows,
              '',
              `Run: ${runUrl}`,
              '',
              '## Triage',
              '',
              '1. Look for an open Renovate PR grouped as **the Kamerplanter images** (labels `dependencies`, `deployment`). If one exists, Renovate is running but the PR is **stuck** (red CI / automerge blocked) — fix that PR. This job cannot see an open-but-unmerged PR; it only sees the divergence.',
              '2. If there is no such PR, Renovate is not running or not detecting the digests — check the Renovate app / its logs.',
              '3. A divergence can also mean a channel tag was re-pushed onto a different build (supply-chain), not a stall. This job reports the divergence; triage decides which case it is.',
              '4. If the registry build above is only hours old and the pinned one is old merely because nothing was published for a while, the pin may have been superseded very recently: the window is applied to the **pinned build’s age**, which is an upper bound on the divergence (the registry exposes no tag-update time). That over-reports by at most one publish interval, and never under-reports — the failure this replaced was an alert that could never fire (#1210).',
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still drifting as of ${runUrl} (${drift.length} image(s)).`,
              });
              core.notice(`Updated existing alert issue #${existing.number}.`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: TITLE, body, labels: [LABEL, 'deployment'],
              });
              core.notice(`Opened alert issue #${created.data.number}.`);
            }

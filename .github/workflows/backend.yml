name: Backend CI

on:
  # The scripts are listed beside src/backend/** because their unit tests live
  # in this suite (tests/unit/test_*_ratchet.py, test_boundary_*.py,
  # test_layer_imports_check.py, test_tenant_body_field_check.py,
  # test_workflow_gate_integrity_check.py, test_seed_catalogue_page_size_check.py,
  # test_seed_harvest_integrity_check.py) — a change to a script alone would
  # otherwise run neither its own tests nor the tree assertions they carry.
  #
  # spec/knowledge/plants/** is listed because the "Steckbrief ↔ seed
  # consistency" step below reads it: the seed side lives under src/backend and
  # was covered, the Steckbrief side was not, so a documentation-only edit that
  # introduced a drift did not reach this job at all. (It was never entirely
  # unguarded — the same validator runs always_run in the required `static`
  # lane — but a check whose two inputs hang off different triggers is one
  # rebase away from being read as covered when it is not.)
  #
  # src/backend/app/migrations/seed_data/** needs no entry: it is inside
  # src/backend/**. Said out loud because the 2026-08-08 audit listed the seed
  # files as a CI blind spot, and the blind spot was the knowledge side.
  #
  # The entries after '.gitignore' come from the CI recording of this workflow's
  # unit suite (.github/lane-inputs/backend--lint-test.yaml, #1683): tests
  # OUTSIDE tests/unit/guards and tests/unit/api read them, so the required
  # unfiltered guards lane does not stand in for this one there. The TC
  # documents are read by test_e2e_tc_id_scope.py; scripts/check_*.py and the
  # other scripts by their own unit tests; the explain templates by
  # test_ai_explain_engine.py. Every other read of this suite outside the filter
  # is read by backend-guards.yml/guards too, and the manifest delegates it there
  # under accepted_gaps.
  #
  # src/frontend/** and tests/e2e/*.py are NOT here any more (#1741). From #1706
  # until #1741 they were, because a handful of tests in this suite read them —
  # and every frontend-only pull request therefore paid the whole backend suite
  # (~13 min) for about fifteen seconds of tests. Measured with an audit hook
  # over the suite on 2026-09-24, the readers are exactly:
  # test_seed_catalogue_page_size_check.py, tests/unit/entrypoints/,
  # test_route_role_guards_check.py, domain/services/test_oauth_auto_link_claim.py,
  # the four e2e-helper tests (test_e2e_a11y_helpers.py,
  # test_e2e_seed_log_redaction.py, test_e2e_tc_id_scope.py,
  # test_gherkin_line_classification.py), three contract tests
  # (test_plant_property_enum_sync.py, test_dashboard_widgets_contract.py,
  # test_notification_channels_contract.py) and tests/api/test_notification_act_role_gate.py.
  # The required `Write-route and tree guards` lane (backend-guards.yml, no
  # filter, `--max-skipped 0`) names each of them in its own invocation, so a
  # frontend change still runs them — in a required check, which this lane is
  # not. test_lane_filters_cover_measured_inputs.py holds each such read
  # against the guards lane's recorded manifest by path AND by reader (#1749):
  # the recorder attributes every read to the test module that made it
  # (`readers`), and a module reading a delegated path that the guards lane does
  # not run (`test_modules`) is a finding — also when another guards-lane test
  # reads the same file. A NEW such test still has to be added to the guards
  # invocation (or its path to this filter); the lane-inputs recording says so.
  push:
    branches: [develop]
    paths:
      - 'src/backend/**'
      - 'spec/knowledge/plants/**'
      - 'scripts/check_schema_examples.py'
      - 'scripts/check_boundary_validation.py'
      - 'scripts/check_seed_catalogue_page_size.py'
      - 'scripts/check_seed_harvest_integrity.py'
      # Loaded by path from tests/unit/migrations/test_seed_schema_conformance.py:
      # its NO_SCHEMA_DECLARED / SCHEMA_DEBT_CEILING registers live in the script
      # since #1406, so a change that only raises a ceiling must run that suite.
      - 'scripts/check_seed_schema.py'
      - 'scripts/check_layer_imports.py'
      - 'scripts/check_tenant_body_field.py'
      - 'scripts/check_workflow_gate_integrity.py'
      # The CI-alarm checks live in scripts/ci/ but their tests live in
      # src/backend/tests/unit/ (they run on a bare runner, so they are loaded
      # by path). Without these entries a pull request that touches only the
      # script or only its workflow's `github-script` body runs NONE of those
      # tests, and a skipped required check does not block a merge — the
      # closing rule could be rewritten with every guard green. (#1225)
      - 'scripts/ci/**'
      - '.github/workflows/delivery-run-alert.yml'
      - '.github/workflows/release-lag.yml'
      - '.github/workflows/release-assets-complete.yml'
      - '.github/workflows/backend.yml'
      # Same shape for the ZAP lane: tests/unit/guards/ asserts on files that live
      # nowhere near src/backend — the rule TSVs, the gate script, the nightly's
      # hook, and the two workflows' own flags. A pull request that only adds a
      # suppression row, only edits the gate, or only drops `-m`/`-T` from a scan
      # invocation ran none of those tests. These entries let the FULL suite see
      # such a change; what actually BLOCKS it is `backend-guards.yml`, which runs
      # tests/unit/guards/ unfiltered and is required — this lane is advisory, so
      # the entries alone would have widened the report and not the gate.
      # (#1376/#1389)
      - 'tests/security/**'
      - 'scripts/security/**'
      - '.github/workflows/security-zap-postmerge.yml'
      - '.github/workflows/security-zap-nightly.yml'
      # The Taskfile holds the lock-compiling invocation itself — the
      # `Lock staleness` job runs `task deps:check`, and every backend job
      # above runs `task lint:backend` / `task test:backend:*`. Without these
      # entries a pull request that changes the `uv lock` invocation in
      # `deps:compile` (it used to be two pip-compile lines whose flags moved
      # the lock, #903/#1296), or that rewires the include, triggers no backend
      # job at all: the gate's own definition was the one input the gate did
      # not watch.
      # `task` parses EVERY included Taskfile, not only the one that defines the target it runs
      # (measured 2026-09-23 with scripts/ci/lane_inputs.py, #1596): a parse error in any of them fails the lane.
      - '.taskfiles/**'
      - 'Taskfile.yaml'
      # `ruff check .` honours the root .gitignore (respect-gitignore is the default), so an
      # ignore rule decides which files the lint step sees — measured 2026-09-23 with
      # scripts/ci/lane_inputs.py (#1596): two opens of it per `task lint:backend`.
      - '.gitignore'
      - 'scripts/check_*.py'
      - 'scripts/extract_overwintering_templates.py'
      - 'scripts/kami/render.py'
      # The capability-reach observation helpers (#1715/#1723) are loaded by path from
      # tests/unit/test_reach_observation_helpers.py, which only this suite runs — the
      # guards lane lists the directory but reads none of its files (#1730).
      - 'scripts/reach/**'
      # The embedding sidecar's feed builder (#1724) is loaded by path from
      # tests/unit/test_embedding_service_feed.py, which only this suite runs; the
      # guards lane reads the sidecars' limits.py but not this file (lane-inputs).
      - 'docker/embedding-service/feed.py'
      # The reference-index seed's column set is held against the inference-service's
      # own INSERT by tests/unit/test_reach_storage_and_index_helpers.py (#1745), which
      # only this suite runs; the guards lane lists the directory but not this file.
      - 'src/inference-service/app/vectordb/repository.py'
      - 'scripts/route_consumer_exemptions.yaml'
      - 'spec/e2e-testcases/**'
      - 'spec/knowledge/explain-templates/**'
      # #1749: the lane-inputs recorder attributes every read to the test MODULE
      # that made it, and a read delegated to the guards lane counts as covered
      # only when that module runs there. The paths below are read by unit tests
      # the required guards lane does NOT run (measured, lane-inputs run
      # 36094119498) — the workflow, action and manifest checks
      # (test_workflow_gate_integrity_check.py, test_workflow_path_filter_coverage_check.py,
      # test_untrusted_checkout_permissions_check.py, test_lane_inputs_recorder.py,
      # test_delivery_run_alert_workflow.py, test_build_revision_wiring.py,
      # test_determine_chart_version.py), migrations/test_e2e_admin_env_containment.py
      # (the compose files, helm/, .env.example), test_route_consumers_check.py
      # (the frontend endpoint modules), test_embedding_service_feed.py, and three
      # modules that import from scripts/ (Python lists a sys.path directory).
      # Until #1749 each was held "covered" because some OTHER guards-lane test
      # read the same path — which judges that test, not these. Moving them into
      # the required lane instead would cost ~2 min on a lane whose rollback
      # trigger is a 200 s median (.github/settings.yml).
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/lane-inputs/**'
      - '.env.example'
      - 'docker-compose*.yml'
      - 'helm/**'
      - 'docker/embedding-service/**'
      - 'src/frontend/src/api/endpoints/**'
      - 'scripts/*'
  pull_request:
    branches: [develop]
    paths:
      - 'src/backend/**'
      - 'spec/knowledge/plants/**'
      - 'scripts/check_schema_examples.py'
      - 'scripts/check_boundary_validation.py'
      - 'scripts/check_seed_catalogue_page_size.py'
      - 'scripts/check_seed_harvest_integrity.py'
      # Loaded by path from tests/unit/migrations/test_seed_schema_conformance.py:
      # its NO_SCHEMA_DECLARED / SCHEMA_DEBT_CEILING registers live in the script
      # since #1406, so a change that only raises a ceiling must run that suite.
      - 'scripts/check_seed_schema.py'
      - 'scripts/check_layer_imports.py'
      - 'scripts/check_tenant_body_field.py'
      - 'scripts/check_workflow_gate_integrity.py'
      # The CI-alarm checks live in scripts/ci/ but their tests live in
      # src/backend/tests/unit/ (they run on a bare runner, so they are loaded
      # by path). Without these entries a pull request that touches only the
      # script or only its workflow's `github-script` body runs NONE of those
      # tests, and a skipped required check does not block a merge — the
      # closing rule could be rewritten with every guard green. (#1225)
      - 'scripts/ci/**'
      - '.github/workflows/delivery-run-alert.yml'
      - '.github/workflows/release-lag.yml'
      - '.github/workflows/release-assets-complete.yml'
      - '.github/workflows/backend.yml'
      # Same shape for the ZAP lane: tests/unit/guards/ asserts on files that live
      # nowhere near src/backend — the rule TSVs, the gate script, the nightly's
      # hook, and the two workflows' own flags. A pull request that only adds a
      # suppression row, only edits the gate, or only drops `-m`/`-T` from a scan
      # invocation ran none of those tests. These entries let the FULL suite see
      # such a change; what actually BLOCKS it is `backend-guards.yml`, which runs
      # tests/unit/guards/ unfiltered and is required — this lane is advisory, so
      # the entries alone would have widened the report and not the gate.
      # (#1376/#1389)
      - 'tests/security/**'
      - 'scripts/security/**'
      - '.github/workflows/security-zap-postmerge.yml'
      - '.github/workflows/security-zap-nightly.yml'
      # The Taskfile holds the lock-compiling invocation itself — the
      # `Lock staleness` job runs `task deps:check`, and every backend job
      # above runs `task lint:backend` / `task test:backend:*`. Without these
      # entries a pull request that changes the `uv lock` invocation in
      # `deps:compile` (it used to be two pip-compile lines whose flags moved
      # the lock, #903/#1296), or that rewires the include, triggers no backend
      # job at all: the gate's own definition was the one input the gate did
      # not watch.
      # `task` parses EVERY included Taskfile, not only the one that defines the target it runs
      # (measured 2026-09-23 with scripts/ci/lane_inputs.py, #1596): a parse error in any of them fails the lane.
      - '.taskfiles/**'
      - 'Taskfile.yaml'
      # `ruff check .` honours the root .gitignore (respect-gitignore is the default), so an
      # ignore rule decides which files the lint step sees — measured 2026-09-23 with
      # scripts/ci/lane_inputs.py (#1596): two opens of it per `task lint:backend`.
      - '.gitignore'
      - 'scripts/check_*.py'
      - 'scripts/extract_overwintering_templates.py'
      - 'scripts/kami/render.py'
      # The capability-reach observation helpers (#1715/#1723) are loaded by path from
      # tests/unit/test_reach_observation_helpers.py, which only this suite runs — the
      # guards lane lists the directory but reads none of its files (#1730).
      - 'scripts/reach/**'
      # The embedding sidecar's feed builder (#1724) is loaded by path from
      # tests/unit/test_embedding_service_feed.py, which only this suite runs; the
      # guards lane reads the sidecars' limits.py but not this file (lane-inputs).
      - 'docker/embedding-service/feed.py'
      # The reference-index seed's column set is held against the inference-service's
      # own INSERT by tests/unit/test_reach_storage_and_index_helpers.py (#1745), which
      # only this suite runs; the guards lane lists the directory but not this file.
      - 'src/inference-service/app/vectordb/repository.py'
      - 'scripts/route_consumer_exemptions.yaml'
      - 'spec/e2e-testcases/**'
      - 'spec/knowledge/explain-templates/**'
      # #1749: the lane-inputs recorder attributes every read to the test MODULE
      # that made it, and a read delegated to the guards lane counts as covered
      # only when that module runs there. The paths below are read by unit tests
      # the required guards lane does NOT run (measured, lane-inputs run
      # 36094119498) — the workflow, action and manifest checks
      # (test_workflow_gate_integrity_check.py, test_workflow_path_filter_coverage_check.py,
      # test_untrusted_checkout_permissions_check.py, test_lane_inputs_recorder.py,
      # test_delivery_run_alert_workflow.py, test_build_revision_wiring.py,
      # test_determine_chart_version.py), migrations/test_e2e_admin_env_containment.py
      # (the compose files, helm/, .env.example), test_route_consumers_check.py
      # (the frontend endpoint modules), test_embedding_service_feed.py, and three
      # modules that import from scripts/ (Python lists a sys.path directory).
      # Until #1749 each was held "covered" because some OTHER guards-lane test
      # read the same path — which judges that test, not these. Moving them into
      # the required lane instead would cost ~2 min on a lane whose rollback
      # trigger is a 200 s median (.github/settings.yml).
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/lane-inputs/**'
      - '.env.example'
      - 'docker-compose*.yml'
      - 'helm/**'
      - 'docker/embedding-service/**'
      - 'src/frontend/src/api/endpoints/**'
      - 'scripts/*'
  schedule:
    # Weekly dependency CVE audit (NFR-009 §4.1) — runs the pip-audit job below
    # even when no backend change lands. Mondays 05:17 UTC.
    - cron: '17 5 * * 1'
  # Manual runs. Added with the integration lane (#1432) so an operator could
  # dispatch a never-yet-run job before it was promoted to a required check.
  # That job now lives in `backend-guards.yml` (it had to: this workflow is
  # path-filtered, and a filtered required check never reports — see the note
  # in the `API tests` step below), and the dispatch trigger moved with it.
  # This one stays because the lanes here are worth re-running by hand too: the
  # weekly `pip-audit` and `pip-licenses` jobs are otherwise reachable only on
  # the Monday cron.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src/backend

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: tests/unit/test_audit_oauth_links.py asserts that the
          # audit cutoffs match the commits they name, and a shallow clone made it
          # skip on every CI run until the skip floor (#1434) surfaced that.
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        # THE uv pin (#1383). `version-file` makes the action read
        # `[tool.uv].required-version` out of src/backend/pyproject.toml, so the
        # uv this job runs cannot differ from the uv Renovate relocks with or the
        # one the Dockerfile copies. It replaces a `python -m pip install` line
        # carrying a literal uv version — the same value written out eight times
        # across four workflows, held together only by the `uv toolchain`
        # Renovate group.
        # That group is a promise, not a mechanism: a ninth copy added without it
        # would age unnoticed, which is the #1296 class (toolchain halves aging
        # apart). tests/unit/guards/test_uv_pin_is_single.py is the permanent
        # absence check that no such copy comes back.
        #
        # The cache key is src/backend/uv.lock rather than the action's default
        # `**/pyproject.toml` + `**/uv.lock` glob: since #1374 this repository has
        # five locks, and four of them have nothing to do with this job.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: src/backend/pyproject.toml
          enable-cache: true
          cache-dependency-glob: src/backend/uv.lock

      - name: Install dependencies
        # Through the Taskfile, like every other command in this job (#1383).
        # `task deps:sync` is `uv sync --locked --extra dev` and nothing else, so
        # this is not indirection for its own sake: the invocation now exists
        # ONCE, and a contributor running `task deps:sync` cannot end up with a
        # different environment than the gate. Inlining it is how the two drift.
        #
        # `uv sync --locked` (NFR-009 §2.3) refuses a lock that no longer
        # satisfies pyproject.toml and verifies every artifact against the hash
        # the lock records, then installs the app package itself editable.
        #
        # The PATH prepend stays even though the Taskfile targets now run through
        # `uv run --locked` and no longer need it: the steps below that are NOT
        # Taskfile targets — `python app/migrations/seed_steckbrief_consistency.py`
        # — still resolve a bare `python`, and removing the prepend would send
        # them to the runner's interpreter.
        run: |
          task deps:sync
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Invoked through the Taskfile so the pipeline and a contributor run the
      # identical thing (continuous-integration §E). Before this, `ruff format
      # --check` existed only here — there was no way to run the pipeline's
      # formatting gate locally at all.
      - name: Ruff lint
        run: task lint:backend

      - name: Ruff format check
        run: task format:backend

      - name: Steckbrief ↔ seed consistency (#680)
        # Fail the build on any non-allowlisted drift of a lifecycle-driving
        # attribute (growth_habit / photoperiod_type / photosynthesis_type /
        # flowering_strategy / growth_determinacy) between a Steckbrief
        # (spec/knowledge/plants/*.md) and the seed YAMLs. Seed = source of truth,
        # Steckbrief = documentation that must follow it (Issue #680, audit UR-2).
        # The validator walks up to the repo root itself, so the job's
        # src/backend working directory is fine. Also enforced on the required
        # `static` gate via a pre-commit hook.
        run: python app/migrations/seed_steckbrief_consistency.py --verbose

      - name: Unit tests
        # The tier targets invoked here carry their measured skip floor
        # (`--max-skipped N`, #1434): unit 1, contracts 0, api 0. The numbers live
        # in .taskfiles/backend.yaml, so this lane and a contributor's local run
        # enforce the identical contract — which is the reason these steps call
        # the target rather than inlining pytest.
        #
        # COVERAGE IS MEASURED HERE, NOT IN A SECOND RUN (#1741). Until #1741 a
        # separate `Coverage / Python Coverage` job (gh-plumbing's reusable
        # workflow) ran the same 12 579 tests a second time: measured on #1726,
        # 12m52 here and 13m20 there, 761 s instrumented against 733 s
        # uninstrumented (+4 %). It was also the WEAKER run of the two — a shallow
        # clone and no skip floor, so it reported 10 skips where this job allows
        # 1. `-rs` on a depth-1 clone names them: 4 in
        # test_applied_migration_sources_are_frozen.py (no vX.Y.Z tag in the
        # clone), 4 in test_model_field_renames_have_migrations.py (shallow
        # history), 1 in test_audit_oauth_links.py (the named commit is not in
        # the clone) — all nine history-dependent — plus the one skip this job
        # allows as well (test_e2e_admin_env_containment.py, the file that is
        # allowed to set the variables). With `fetch-depth: 0` the nine run.
        #
        # The three tiers each add to one `.coverage` data file (`--cov-append`
        # on the second and third), and the `Coverage floor` step below reports
        # and floors the union — the same number the old job measured, from a run
        # that also carries the skip floors.
        run: task test:backend:unit -- --cov=app --cov-report=

      - name: Contract tests
        # Enforce the plant-property contract gates that previously never ran in
        # CI: the 3-way enum single-source sync (enums.py ↔ _defs.schema.yaml ↔
        # frontend/src/api/types.ts) and the de/en i18n completeness of those
        # enums (tests/contracts/test_plant_property_enum_sync.py). These guard
        # exactly the drift class the plant-property data-model plan addresses.
        run: task test:backend:contracts -- --cov=app --cov-append --cov-report=

      - name: API tests
        # The router tier, which ran in no gate at all until 2026-08-05 although
        # it needs no service: it drives the FastAPI app through TestClient
        # against fakes. Measured with no ArangoDB, Valkey or S3 reachable: 480
        # passed, 0 skipped, ~60 s — and since #1434 the "0 skipped" half of that
        # sentence is enforced by the target's `--max-skipped 0` instead of being
        # prose nothing checked. It carries acceptance coverage nothing else
        # here does — among it the cross-tenant negative tests on the diary
        # endpoints (tests/api/test_plant_diary_router.py) and the MCP
        # error-envelope wire test. `tests/integration/` is NOT here — it needs a
        # real ArangoDB and has a job of its own, `Integration tests (ArangoDB)`
        # (#1432). That job is NOT in this workflow, and the reason is the whole
        # point: it is a REQUIRED context on `develop` since 2026-09-17, this
        # workflow is path-filtered, and a required check whose workflow the
        # filter skips never reports at all — measured on #1470, #1475 and #1410,
        # each permanently blocked on a context that could not arrive. It lives
        # in `.github/workflows/backend-guards.yml`, the unfiltered lane, which
        # exists for exactly this. `tests/unit/guards/test_required_contexts_are_unfiltered.py`
        # is the permanent guard that no required context moves back under a
        # filter. The integration tier used to be absent from CI entirely,
        # because without a server it self-skipped and would have reported green
        # having tested almost nothing. The Taskfile comment above these targets
        # carries the full tier map.
        run: task test:backend:api -- --cov=app --cov-append --cov-report=

      - name: Coverage summary
        # What `Coverage / Python Coverage` rendered into its job summary, from
        # the union of the three tiers above (#1741).
        run: |
          {
            echo "## Test coverage"
            echo
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage floor
        # The floor the retired coverage job enforced (`fail-under: 60`); the
        # measured total on #1726 was 83 %. Raising it is a separate decision on
        # measured history, not a side effect of moving the measurement (#1741).
        run: coverage report --fail-under=60

  dependency-gates:
    name: Lock, CVE and licence gates
    # ONE JOB, THREE GATES — `lock-staleness`, `pip-audit` and `pip-licenses`
    # until #1583.
    #
    # WHY. Measured 2026-09-19 over the last 300 pull-request runs: the three
    # ran 18 s, 37 s and 12 s and each waited a MEDIAN OF 21–23 MINUTES for a
    # runner slot. The concurrent-job allotment is account-wide across every
    # repository of the account, so a *job* — not a CPU-second — is what is
    # scarce here: 66 % of this repository's jobs finish under a minute and
    # carry 7 % of its total job-seconds. Three jobs also paid the identical
    # checkout + Python + uv preamble three times, and `uv sync --locked` twice.
    #
    # THE TRADE, STATED: what ran in parallel now runs in sequence, so the wall
    # clock of the work itself goes from max(18, 37, 12) to their sum. That is a
    # bad trade on an idle pool and an overwhelming win at a 21-minute queue. If
    # the pool ever stops being the constraint, re-measure — do not re-split by
    # reflex.
    #
    # WHY THESE THREE AND NOT THE ADVISORY LANES: all three are gates that are
    # GREEN when the repository is healthy. A permanently-red lane must never be
    # merged into a gate — it would carry its red into the gate's verdict and
    # destroy the signal. `frontend.yml`'s `deadcode` is exactly that case and
    # is deliberately left standing alone.
    #
    # Every step carries `if: ${{ !cancelled() }}`: a failing gate must not hide
    # the two behind it, which is the one thing three separate jobs did give.
    # The step names keep the old check names so `NFR-009` §4.1/§4.3 and
    # `project/requirements/renovate-config-rework.md` R1/R7 still name
    # something that exists.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Set up Task
        # Needed because this job now delegates to the Taskfile instead of
        # duplicating the compile invocation (see the next step).
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        # One pin, read from `[tool.uv].required-version` — see the long note on
        # the same step in backend.yml's `lint-test` job (#1383).
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: src/backend/pyproject.toml
          enable-cache: true
          cache-dependency-glob: src/backend/uv.lock
      - name: Lock staleness — check the lock against pyproject.toml
        if: ${{ !cancelled() }}
        # `task deps:check` is the first half of this gate: `uv lock --check`
        # fails when src/backend/uv.lock does not satisfy pyproject.toml,
        # without touching the file. The Taskfile is the only copy of the
        # invocation, so this job and `task deps:compile` cannot disagree.
        #
        # This used to recompile both pip-compile locks and diff them, which
        # made the gate a function of a whole pinned Python toolchain (pip,
        # pip-tools, click, setuptools — #929, #1296). uv resolves from the
        # lock's own recorded inputs, so the only version this job depends on
        # is uv's, pinned above.
        run: |
          if ! task deps:check; then
            echo "::error::src/backend/uv.lock is stale. Run 'task deps:compile' and commit the result." >&2
            exit 1
          fi
      - name: Lock staleness — verify every artifact hash the lock records
        if: ${{ !cancelled() }}
        # The second half. `uv lock --check` compares the lock against
        # pyproject.toml and nothing else — measured with uv 0.12.12: a lock
        # with every hash line altered still passes it. The old gate diffed a
        # recompiled lock against the committed one and therefore caught a
        # hand-edited hash or an in-range version swap; only an install does
        # that now. `--no-install-project` keeps it to the dependency set the
        # image ships, and `--locked` refuses to re-resolve.
        run: uv sync --locked --no-install-project

      - name: Lock staleness — falsify the hash claim this job just made
        if: ${{ !cancelled() }}
        # The step above verifies THIS lock. It cannot tell you whether the
        # verification works at all — a `uv sync` that stopped checking hashes
        # would keep exiting 0 here forever, and the first hash-tamper test
        # written for #1377 was itself vacuous (it altered an sdist hash for a
        # package the backend installs from its wheel, so nothing ever read the
        # line it changed). This runs the permanent falsifier: it tampers with a
        # COPY of the lock and requires `uv sync --locked` to refuse it, with a
        # positive control that asserts the tampered package really is among the
        # packages installed. It also pins down, as a measured fact, that
        # `uv lock --check` alone does NOT notice the same tamper — which is why
        # this job runs two commands instead of one.
        #
        # Here rather than only in the unit tier because this is the job that
        # makes the claim. The tier runs it too (`task test:backend:unit` covers
        # tests/unit/guards), so a defect in the falsifier itself is visible on
        # the backend lane as well.
        #
        # `uv run --locked` brings up the dev environment from the same lock; its
        # artifacts are already in the cache the steps above warmed, so this
        # costs seconds. Measured locally on 2026-09-16 with a warm cache: 1.9 s
        # for all six cases, of which 1.5 s is the positive control's full
        # install. GitHub sets $CI, so
        # `test_the_hash_falsifier_is_never_merely_skipped_in_ci` turns a skip
        # here into a RED run rather than a green one.
        #
        # Through the Taskfile, like `deps:check` above: one copy of the
        # invocation, so what CI runs and what a contributor runs locally
        # (`task deps:verify`) cannot drift apart.
        run: task deps:verify

      - name: Dependency CVE audit — install pip-audit
        if: ${{ !cancelled() }}
        # Pinned. An unpinned scanner is a floating input: the same commit can
        # pass today and fail tomorrow because the tool changed, which makes a
        # red run unattributable (continuous-integration §C). uv is pinned the
        # same way, one step above, via the version file.
        run: python -m pip install 'pip-audit==2.10.1'
      - name: Dependency CVE audit — export the locks in the format pip-audit reads
        if: ${{ !cancelled() }}
        # pip-audit has no uv.lock reader, so the lock is exported — versions and
        # hashes verbatim, the project itself omitted — into requirements files
        # that exist only for the length of this job. `--locked` refuses to
        # export from a lock that no longer satisfies pyproject.toml.
        run: |
          uv export --locked --no-emit-project --format requirements.txt -o /tmp/requirements.txt
          uv export --locked --no-emit-project --extra dev --format requirements.txt -o /tmp/requirements-dev.txt

      - name: Dependency CVE audit — audit pinned dependencies for known CVEs
        if: ${{ !cancelled() }}
        # Audits the exact committed lock that ships (NFR-009 §4.1). Runs on every
        # PR, every push to develop, and weekly via the schedule trigger above.
        # --strict fails (instead of silently skipping) if any package cannot be
        # audited; --desc prints each advisory description; --no-deps audits the
        # precise pinned versions of the full exported lock without re-resolving
        # from PyPI, so the audit matches what the image ships. PR-blocking.
        run: pip-audit --strict --desc --no-deps --requirement /tmp/requirements.txt

      - name: Dependency CVE audit — audit dev-tool dependencies for known CVEs (weekly)
        # `!cancelled()` composed with the step's own schedule gate — two `if:`
        # keys on one step is a duplicate mapping key, not two conditions.
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        # Dev tooling (pytest/mypy/moto/black/ruff and their transitive deps) is
        # never shipped but should still be scanned. This runs only on the weekly
        # schedule, so it never blocks a PR merge while still surfacing dev-tool
        # CVEs on the nightly/weekly signal (NFR-009 §4.1). No continue-on-error:
        # a scheduled run is not a PR check, so a real finding fails the scheduled
        # workflow (visible) without gating any pull request.
        run: pip-audit --strict --desc --no-deps --requirement /tmp/requirements-dev.txt

      - name: License allowlist gate — install dependencies and pip-licenses
        if: ${{ !cancelled() }}
        # The license scanner reads installed package metadata, so the pinned set
        # must be installed first (NFR-009 §4.3).
        run: |
          uv sync --locked --no-install-project
          uv pip install 'pip-licenses==5.5.5'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: License allowlist gate — enforce license allowlist
        if: ${{ !cancelled() }}
        # Fail the build on any dependency whose license is outside the allowlist
        # (NFR-009 §4.3). The allowlist enumerates the license strings actually
        # present in the current lock — all permissive or weak-copyleft (LGPL/MPL),
        # which are safe for a server-side, non-distributed application. A new
        # dependency under an unlisted license (e.g. strong-copyleft GPL/AGPL, or
        # a package with no license metadata reported as "UNKNOWN") is not in the
        # list and therefore fails the gate and must be reviewed before adoption.
        #
        # --ignore-packages excludes four already-reviewed dependencies whose PyPI
        # metadata carries multi-license strings that pip-licenses cannot match via
        # the ';'-separated allowlist, or a stray classifier:
        #   * python-dateutil — "Apache Software License; BSD License"  (dual permissive)
        #   * uvloop          — "Apache Software License; MIT License"  (dual permissive)
        #   * qrcode          — "BSD License; Other/Proprietary License" (project is BSD;
        #                        the proprietary classifier is a known metadata artifact)
        #   * pyphen          — GPLv2+ / LGPLv2+ / MPL-1.1 tri-license, used under the
        #                        permissive MPL-1.1 / LGPL option (weasyprint hyphenation)
        run: |
          pip-licenses \
            --from=mixed \
            --ignore-packages python-dateutil uvloop qrcode pyphen \
            --allow-only='MIT;MIT License;MIT-0;MIT-CMU;MIT OR Apache-2.0;BSD License;BSD-2-Clause;BSD-3-Clause;BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0;Apache License 2.0;Apache Software License;Apache-2.0;Apache-2.0 AND MIT;Apache-2.0 OR BSD-2-Clause;Apache-2.0 OR BSD-3-Clause;ISC License (ISCL);Python Software Foundation License;PSF-2.0;Mozilla Public License 2.0 (MPL 2.0);MPL-2.0;LGPL-2.1-or-later;LGPL-3.0-only;The Unlicense (Unlicense)'

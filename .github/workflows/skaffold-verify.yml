name: Skaffold Verify

on:
  pull_request:
    branches: [develop]
    paths:
      - "skaffold.yaml"
      - "helm/**"
      - "src/backend/Dockerfile*"
      - "src/frontend/Dockerfile*"
      - "src/inference-service/**"
      - ".github/workflows/skaffold-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check skaffold.yaml exists
        id: check
        run: |
          if [ -f skaffold.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::skaffold.yaml not found — skipping Skaffold steps"
          fi

      # The hiberbee/github-action-skaffold step below runs `skaffold build`,
      # which builds the inference-service image. Its `model-export` stage
      # installs torch + exports the DINOv2 ONNX model and exhausts the runner
      # disk, causing intermittent "Docker build ran into internal error"
      # (~25% of runs). Reclaim ~20 GB of preinstalled toolchains first.
      - name: Free disk space
        if: steps.check.outputs.exists == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Setup Helm
        if: steps.check.outputs.exists == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Setup Skaffold
        if: steps.check.outputs.exists == 'true'
        uses: hiberbee/github-action-skaffold@e3f5dd5659610cb792c6cf32daaa797ea6d89842 # 1.27.0
        with:
          skaffold-version: 2.17.2

      - name: Build chart dependencies
        if: steps.check.outputs.exists == 'true'
        run: |
          helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts/
          helm repo add ollama https://otwld.github.io/ollama-helm/
          helm dependency build helm/kamerplanter

      - name: Lint Helm chart
        if: steps.check.outputs.exists == 'true'
        run: helm lint helm/kamerplanter -f helm/kamerplanter/values-dev.yaml

      - name: Render Helm templates
        if: steps.check.outputs.exists == 'true'
        run: |
          helm template kamerplanter helm/kamerplanter/ \
            -f helm/kamerplanter/values-dev.yaml

      - name: Skaffold diagnose
        if: steps.check.outputs.exists == 'true'
        run: skaffold diagnose

      - name: Skaffold render
        if: steps.check.outputs.exists == 'true'
        run: |
          skaffold render --output rendered-manifests.yaml || true

      - name: Upload rendered manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.check.outputs.exists == 'true'
        with:
          name: rendered-manifests
          path: rendered-manifests.yaml
          retention-days: 5

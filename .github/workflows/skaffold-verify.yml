name: Skaffold Verify

##
## Renders the Helm chart and the Skaffold pipeline for a change that touches
## either, so a broken chart is caught before it reaches a cluster.
##
## Two constructions were removed here, both of the "reports success without
## measuring" family:
##
##   * A `Check skaffold.yaml exists` step gated every following step on
##     `steps.check.outputs.exists == 'true'`. skaffold.yaml is tracked in this
##     repository and is in this workflow's own path filter, so the false branch
##     was unreachable — but had it ever been taken, the job would have skipped
##     everything and reported green. A guard whose failure mode is a silent
##     pass is worse than no guard: the file's absence now fails the checkout
##     step loudly.
##   * `skaffold render ... || true` discarded the render's exit code, and the
##     upload step below runs under `if: always()`, so a failed render produced
##     a green job and an empty artifact. The render either works or the job is
##     red.
##
on:
  pull_request:
    branches: [develop]
    paths:
      - "skaffold.yaml"
      - "helm/**"
      - "src/backend/Dockerfile*"
      - "src/frontend/Dockerfile*"
      - "src/inference-service/**"
      - ".github/workflows/skaffold-verify.yml"

permissions:
  contents: read

concurrency:
  group: skaffold-verify-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The hiberbee/github-action-skaffold step below runs `skaffold build`,
      # which builds the inference-service image. Its `model-export` stage
      # installs torch + exports the DINOv2 ONNX model and exhausts the runner
      # disk, causing intermittent "Docker build ran into internal error"
      # (~25% of runs). Reclaim ~20 GB of preinstalled toolchains first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          # gate-integrity-ok: housekeeping, not a verdict. This job's verdict is
          # the render assertion below; a prune that finds nothing to remove
          # exits non-zero, and failing the build for a clean disk would be
          # noise, not a finding.
          sudo docker image prune --all --force || true
          df -h /

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Setup Skaffold
        uses: hiberbee/github-action-skaffold@e3f5dd5659610cb792c6cf32daaa797ea6d89842 # 1.27.0
        with:
          skaffold-version: 2.17.2

      - name: Build chart dependencies
        run: |
          helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts/
          helm repo add ollama https://otwld.github.io/ollama-helm/
          helm dependency build helm/kamerplanter

      - name: Lint Helm chart
        run: helm lint helm/kamerplanter -f helm/kamerplanter/values-dev.yaml

      - name: Render Helm templates
        run: |
          helm template kamerplanter helm/kamerplanter/ \
            -f helm/kamerplanter/values-dev.yaml

      - name: Skaffold diagnose
        run: skaffold diagnose

      - name: Skaffold render
        # `--digest-source=none` and `--offline=true` are what make this step
        # capable of passing at all.
        #
        # Removing `|| true` revealed that it had NEVER worked: plain
        # `skaffold render` defaults to `--digest-source=remote`, tries to
        # resolve `kamerplanter-backend:<sha>` in a registry, and fails with
        # "does the image exist remotely?" — this job builds and pushes nothing,
        # so that lookup can never succeed. Every run for the life of this
        # workflow produced that error, discarded it, and uploaded an empty
        # artifact.
        #
        # `none` takes the tags straight from the manifests, which is the right
        # source here: the point is to verify that skaffold's deploy
        # configuration and the chart wire together (including the
        # `setValueTemplates` overrides that `helm template` above does not
        # exercise), not to check that a particular image exists.
        # `--offline=true` drops the Kubernetes API lookup, which this runner
        # also does not have.
        #
        # Verified locally against this commit: 2465 lines, 40 resources.
        run: |
          skaffold render \
            --offline=true \
            --digest-source=none \
            --output rendered-manifests.yaml

      - name: Assert the render produced manifests
        # `--output` writing an empty or near-empty file would otherwise pass
        # silently, which is the same vacuous-success shape this pull request
        # exists to remove.
        run: |
          set -euo pipefail
          # gate-integrity-ok: the guard IS this count, and grep -c exits 1 when
          # it counts zero. Under `set -e` that would abort before the threshold
          # is compared — the swallowed status is what lets the assertion below
          # fail loudly on an empty render instead of never running.
          kinds=$(grep -c '^kind:' rendered-manifests.yaml || true)
          if [[ "$kinds" -lt 10 ]]; then
            echo "::error::Render produced only $kinds resources — expected the full chart." >&2
            exit 1
          fi
          echo "Rendered $kinds resources."

      - name: Upload rendered manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rendered-manifests
          path: rendered-manifests.yaml
          retention-days: 5

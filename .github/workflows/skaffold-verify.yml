name: Skaffold Verify

##
## Renders the Helm chart and the Skaffold pipeline for a change that touches
## either, so a broken chart is caught before it reaches a cluster.
##
## Two constructions were removed here, both of the "reports success without
## measuring" family:
##
##   * A `Check skaffold.yaml exists` step gated every following step on
##     `steps.check.outputs.exists == 'true'`. skaffold.yaml is tracked in this
##     repository and is in this workflow's own path filter, so the false branch
##     was unreachable — but had it ever been taken, the job would have skipped
##     everything and reported green. A guard whose failure mode is a silent
##     pass is worse than no guard: the file's absence now fails the checkout
##     step loudly.
##   * `skaffold render ... || true` discarded the render's exit code, and the
##     upload step below runs under `if: always()`, so a failed render produced
##     a green job and an empty artifact. The render either works or the job is
##     red.
##
on:
  pull_request:
    branches: [develop]
    paths:
      - "skaffold.yaml"
      - "helm/**"
      - "src/backend/Dockerfile*"
      - "src/frontend/Dockerfile*"
      - "src/inference-service/**"
      - ".github/workflows/skaffold-verify.yml"
      # The render and both assertions live in this script, so a change to it
      # is the change most able to break this job. Without this entry the one
      # edit that most needs the gate would be the one edit that never runs it
      # (#1313).
      - "scripts/ci/skaffold_render_verify.sh"
      - "scripts/ci/assert_rendered_manifests.sh"
      # WHAT THIS JOB READS, MEASURED (scripts/ci/lane_inputs.py, #1596; re-recorded
      # 2026-09-23 on the review round of #1682): 3 641 tracked paths. `skaffold
      # diagnose` resolves the dependencies of EVERY build artifact, and the
      # knowledge artifact's context is the checkout root (`context: .`), so the
      # walk enumerates every top-level directory and hashes what .dockerignore
      # keeps — 3 348 paths under src/, 100 under spec/, 51 under .github/, 34
      # under docs/, and a listing of each directory below. The filter above
      # named skaffold.yaml, helm/ and three Dockerfile globs; everything the job
      # reads beyond that is listed here, top-level entry by top-level entry, so
      # the guard (test_lane_filters_cover_measured_inputs.py) holds the filter
      # against the measurement. Root files the job does NOT read (README.md,
      # Taskfile.yaml, renovate.json5, the docker-compose files, mkdocs.yml, …)
      # stay outside on purpose: the list is the measurement, not `**`.
      - ".dockerignore"
      - ".gitignore"
      - ".audits/**"
      - ".claude/**"
      - ".github/**"
      - ".taskfiles/**"
      - ".vscode/**"
      - "brand/**"
      - "docker/**"
      - "docs/**"
      - "project/**"
      - "scripts/**"
      - "spec/**"
      - "src/**"
      - "test-reports/**"
      - "tests/**"
      - "tools/**"

permissions:
  contents: read

concurrency:
  group: skaffold-verify-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # NO IMAGE IS BUILT HERE, AND NO DISK IS FREED FOR ONE (#1741).
      #
      # Until #1741 the `hiberbee/github-action-skaffold` setup step ran an
      # unconditional `skaffold build` of all eight artifacts in skaffold.yaml (4m05 on
      # #1726; 4m16 on #1738, plus 1m52 for a `Free disk space` step that existed
      # only because the inference-service `model-export` stage filled the runner
      # disk). The result was never used: the render below takes its tags from
      # the manifests (`--digest-source=none`). The action is replaced by
      # ./.github/actions/setup-skaffold, which installs the binary and nothing
      # else, and the disk step is gone with the build it made room for.
      #
      # WHAT THAT DROPS, DECIDED: the one signal the build gave by accident —
      # that the Dockerfile targets only skaffold.yaml selects still build: the
      # `dev` stages of backend, frontend, knowledge-service and
      # inference-service, and the embedding service's `e5-large` model target.
      # Nothing asserted it; a broken one only failed this job as a side effect
      # of the setup step. It is NOT moved into docker-lint-build.yml, which
      # builds every one of these Dockerfiles for its production target: the dev
      # stages are thin layers over the same `base` stage (backend:
      # `uv sync --locked --extra dev`, which every backend CI job runs too;
      # frontend: COPY plus an entrypoint script; knowledge-service and
      # inference-service: `uv sync` plus COPY), `e5-large` differs from the
      # default target only in the model it downloads, they exist for
      # `skaffold dev` on a workstation, and a break there surfaces on the first
      # `skaffold dev` rather than in production. Paying ~6 runner-minutes on nearly every pull
      # request for that is the trade #1741 declined; re-open it with a measured
      # dev-stage breakage that reached develop, not by restoring the build.

      - name: Setup Helm
        # No `version:` input, so this installs helm `latest` — v4.3.0 as of
        # 2026-09-19. That floating version is coupled to the skaffold pin in
        # .github/actions/setup-skaffold; see the note there. No Renovate manager covers either, so
        # neither moves on a reviewed bump.
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Setup Skaffold
        # The pinned skaffold (2.24.0 — 2.17.2 cannot drive helm 4; the reason
        # and the checksum live in the action), installed WITHOUT the build the
        # previous setup action ran unconditionally (#1741).
        uses: ./.github/actions/setup-skaffold

      - name: Build chart dependencies
        run: |
          helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts/
          helm repo add ollama https://otwld.github.io/ollama-helm/
          helm dependency build helm/kamerplanter

      - name: Lint Helm chart
        run: helm lint helm/kamerplanter -f helm/kamerplanter/values-dev.yaml

      - name: Render Helm templates
        run: |
          helm template kamerplanter helm/kamerplanter/ \
            -f helm/kamerplanter/values-dev.yaml

      - name: Skaffold diagnose
        run: skaffold diagnose

      - name: Skaffold render and assert the manifests
        # `--digest-source=none` and `--offline=true` are what make this step
        # capable of passing at all.
        #
        # Removing `|| true` revealed that it had NEVER worked: plain
        # `skaffold render` defaults to `--digest-source=remote`, tries to
        # resolve `kamerplanter-backend:<sha>` in a registry, and fails with
        # "does the image exist remotely?" — this job pushes nothing (and, since
        # #1741, builds nothing either; before it the setup action built every
        # image locally and pushed none), so that lookup can never succeed. Every run for the life of this
        # workflow produced that error, discarded it, and uploaded an empty
        # artifact.
        #
        # `none` takes the tags straight from the manifests, which is the right
        # source here: the point is to verify that skaffold's deploy
        # configuration and the chart wire together (including the
        # `setValueTemplates` overrides that `helm template` above does not
        # exercise), not to check that a particular image exists.
        # `--offline=true` drops the Kubernetes API lookup, which this runner
        # also does not have.
        #
        # The render, the `--images` flags that keep it honest, and both
        # assertions live in scripts/ci/skaffold_render_verify.sh, so this job
        # and the `verify:skaffold` task cannot drift. Read that script's header
        # for why image references have to be supplied: without them every
        # `setValueTemplates` entry renders to Go's literal `<no value>`, which
        # bjw-s common 5.2.0 turned into `image: null` for ELEVEN of the fifteen
        # containers while this step reported "Rendered 40 resources" — and
        # which common 5.2.1 turns into invalid YAML, which is how the masking
        # was finally noticed.
        run: scripts/ci/skaffold_render_verify.sh rendered-manifests.yaml

      - name: Upload rendered manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rendered-manifests
          path: rendered-manifests.yaml
          retention-days: 5

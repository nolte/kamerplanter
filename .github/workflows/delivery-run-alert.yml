name: Delivery Run Alert

# Issue #1225 — the PROCESS watcher of the delivery lane, and the third member
# of a family whose division of labour is deliberate:
#
#   release-lag.yml             has a release been PUBLISHED at all?
#   release-assets-complete.yml does the published release CARRY its artefacts?
#   delivery-run-alert.yml      did the delivery RUN go red?      <- this file
#
# The other two watch outcomes on the release page. Neither can see a red run,
# and a red run is exactly what nobody saw.
#
# THE INCIDENT. `publish-helm-charts` in docker-publish.yml failed on
# 2026-08-13 (run 31729355999, tag v0.2.0), on 2026-08-16T15:16 (31955164085,
# develop) and again eight minutes later (31955579431, develop). Every one of
# those runs is RED in the Actions tab. Every one of them alerted nobody, and
# the cause was re-diagnosed from scratch five days later. Nothing in this
# repository observed it because nothing could: `grep -rl "workflow_run"
# .github/workflows/` returned NOTHING on origin/develop (re-measured
# 2026-08-19). A red run notifies the actor and no one else — and on a
# Renovate-authored push the actor is a bot.
#
# WHY THE LANE STILL LOOKED HEALTHY. `publish-helm-charts` runs only when
# `helm/**` changed, when the ref is a `v*` tag, or on workflow_dispatch. On
# every other push to `develop` it is SKIPPED, and a skipped job takes nothing
# down with it, so the run is green. The lane therefore reads green most of the
# time and the red runs look intermittent rather than systematic. They were not:
# every run that actually reached the chart job failed.
#
# That blindness is built into the closing rule below, which is why the rule has
# four parts rather than one. The alert issue carries a machine-readable list of
# ENTRIES, one per job that failed, and an entry is proven — and only then
# removed — by a green run that satisfies all of:
#
#   1. it RAN the job and the job passed (a skipped job proves nothing, and a
#      skipped job is how this lane reads green while it is broken);
#   2. it ran on the SAME HALF of the lane (`develop` or a `v*` tag). The halves
#      are not interchangeable: `publish-helm-charts`'s `Upload chart as release
#      asset` step runs only on a tag, so a green `develop` run executes the same
#      job NAME with a different set of steps and cannot speak for the tag path;
#   3. it STARTED AFTER the failure it is supposed to repair. Delivery runs
#      overlap routinely — a tag run and a `develop` push, a `--failed` re-run of
#      an older one — and a green run that started earlier proves nothing about a
#      later failure. A dispatch replaying a historical green run is the same
#      shape, deliberately;
#   4. it ran on the lane AT ALL. `docker-publish.yml`'s `workflow_dispatch:` is
#      unrestricted, so anybody can run the whole delivery lane on a feature
#      branch; such a run is on neither half and the observer ignores it.
#
# Entries are proven INDEPENDENTLY and the issue closes when none is left. That
# matters on `develop`, where most jobs are path-skipped on any given push: if
# two different jobs failed in two pushes, no single later push is likely to run
# both, and a rule demanding one run that proves everything would produce an
# alert nothing could ever close.
#
# WHY workflow_run AND NOT A PULL-REQUEST GATE. "The delivery run went red" is a
# fact about a run that only exists AFTER a merge: docker-publish.yml triggers on
# pushes to `develop` and on `v*` tags, never on a pull request. A PR gate cannot
# observe it at all, and re-running the eight image builds plus the chart publish
# per PR would be an expensive way to measure something else. `types: [completed]`
# is the only sensible window — an in-flight run has no verdict.
#
# FAIL-LOUD CONTRACT (NFR-018 §2). An unreachable API, an unparseable run or
# jobs payload, a run that is not `completed`, an empty run id or an unknown
# conclusion makes THIS RUN RED and opens NO issue: the check writes no report,
# the issue step below is skipped by its `hashFiles()` guard, and the red
# observer run is the signal. An undetermined check must never read as a clean
# one, and a transient API blip must not spam the tracker. A determined verdict
# — alert, resolved AND inconclusive alike — writes delivery-run-report.json and
# exits 0.
#
# THIS FILE CANNOT BE EXERCISED BY ITS OWN PULL REQUEST. `workflow_run` fires
# only from the workflow file on the DEFAULT branch, so nothing about the
# trigger runs until this is merged. Verification before merge is two unit
# modules, and they test different halves:
#
#   src/backend/tests/unit/test_delivery_run_check.py
#       replays the recorded runs (31729355999, 31955164085, 31955579431,
#       32259216513, 32157445903, 32188774721, 32188774700) through
#       scripts/ci/check_delivery_run.py and pins the verdicts and the report.
#   src/backend/tests/unit/test_delivery_run_alert_workflow.py
#       reads the `actions/github-script` body out of THIS file and executes it
#       verbatim under node against those reports, with the `github`, `context`
#       and `core` objects stubbed — so the decision below is tested as shipped,
#       not as transcribed.
#
# After merge, replay the measured red run:
#
#     gh workflow run delivery-run-alert.yml -f run_id=31729355999
#
# That WILL open the alert issue for a run from 2026-08-13; close it afterwards.

on:
  workflow_run:
    # The workflow's `name:`, not its file name — that is what this trigger
    # matches on. docker-publish.yml has no `pull_request` trigger, so every run
    # reaching this observer comes from a push to `develop`, a `v*` tag or a
    # dispatch; none of them is fork-controlled.
    workflows: ["Build & Publish Container Images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: >-
          Judge a specific historical run of the delivery lane instead of the one
          that just completed, e.g. 31729355999 (the measured v0.2.0 failure from
          2026-08-13). Replaying a RED run opens or updates the alert issue for
          it — close it afterwards. Replaying a GREEN run can also CLOSE entries
          on an open alert, but only entries whose failure happened before that
          run started and on the same half of the lane; a replay of an old green
          run therefore proves nothing, which is the intended behaviour rather
          than a limitation. A run id from a different workflow, or a run on
          neither half of the lane, is reported and then ignored.
        required: false
        type: string

# `actions: read` is REQUIRED, not a rate-limit comfort. The step below sets
# GITHUB_TOKEN, and `scripts/ci/check_delivery_run.py` attaches an
# `Authorization: Bearer` header whenever that variable is present — there is no
# anonymous fallback path in the script. A token without the `actions` scope is
# therefore not "a slower read": `GET /repos/{owner}/{repo}/actions/runs/{id}`
# and its `/jobs` sibling answer 403, the check raises, and the observer run
# goes red without ever judging the delivery run. Removing this scope disables
# the observer; it does not degrade it.
# `issues: write` opens and closes the single alert issue; `contents: read` is
# the checkout. Nothing here writes contents.
permissions:
  contents: read
  actions: read
  issues: write

# An alerting job: serialise a workflow_run-triggered run against a manual one so
# two runs cannot both act on the alert issue, and never cancel — a cancelled run
# could leave the issue half-updated. Fixed group (not github.ref) because the
# issue is a single shared resource: two delivery runs finishing seconds apart
# (31955164085 and 31955579431 were eight minutes apart) must not interleave a
# read of the issue with the other's write.
#
# A KNOWN GAP, NAMED RATHER THAN IMPLIED AWAY (NFR-018 §2). `cancel-in-progress:
# false` does not mean "everything queues". GitHub keeps at most ONE running and
# ONE pending run per concurrency group; when a third arrives, the run sitting in
# the pending slot is CANCELLED to make room — `cancel-in-progress: false` only
# protects the run that is already executing. So three delivery runs completing
# inside the same short window (say a `v*` tag, a `develop` push and a
# `gh run rerun --failed`, which is exactly the shape of a repair afternoon) can
# silently evict one observer run, and the verdict about that delivery run is
# then never rendered into the tracker. Nothing goes red: the evicted run reports
# as cancelled, and a cancelled observer looks like an operator act.
#
# The probability is low — this job finishes in roughly 30–60 seconds (two API
# reads plus one issue write), so the pending slot is occupied only briefly —
# and the consequence is bounded: a MISSED alert or a missed close, never a
# wrong one. It is not repaired by widening the group, which would let two runs
# write the same issue concurrently and trade a missed update for a corrupted
# one.
#
# The structural remedy is a SWEEP, not a concurrency setting: a scheduled job
# that lists the completed `docker-publish.yml` runs since its last sweep and
# judges any that no observer run covered. That is a separate work package on
# scripts/ci/check_delivery_run.py (it needs a run-list endpoint and a watermark,
# neither of which this observer has), and it is deliberately not built here.
# Until it exists, this gap is a documented limitation of the observer.
concurrency:
  group: delivery-run-alert
  cancel-in-progress: false

jobs:
  check-delivery-run:
    name: Judge the completed delivery run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Judge the run and its jobs
        id: check
        env:
          # Read-only API access; see the permissions block for why the token is
          # here at all on a public repository.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # The ONLY place an event field enters this workflow, and it enters as
          # an environment variable — never interpolated into `run:` or into the
          # script body (spec/project/github-actions-best-practices §untrusted
          # input). `inputs.run_id` is null outside a dispatch, so `||` selects
          # the triggering run; an empty value makes the script go red rather
          # than fetch `/actions/runs/`.
          DELIVERY_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        # Hard errors exit non-zero here => the run goes red and the issue step
        # below no-ops (no delivery-run-report.json). A determined verdict writes
        # the report and exits 0.
        run: python3 scripts/ci/check_delivery_run.py delivery-run-report.json

      - name: Open, update or close the delivery-run issue
        # Runs only when the check DETERMINED a verdict (report exists). On a hard
        # error the report is absent, this step is skipped, and the red run is the
        # signal — deliberately NOT an issue, so a transient API blip cannot spam
        # the tracker.
        if: always() && hashFiles('delivery-run-report.json') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Read via process.env, never interpolated into the script body.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('delivery-run-report.json', 'utf8'));
            const LABEL = 'delivery-run-failed';
            const TITLE = 'The delivery lane went red: Build & Publish Container Images failed (#1225)';
            const runUrl = process.env.RUN_URL;

            // Everything below reads the REPORT, never `github.event.workflow_run.*`.
            // The report's fields come from the REST API through the checked-in
            // script, so no attacker-influenced event field reaches this body —
            // and the commit subject (`display_title`), the most
            // attacker-influenced string in the payload, is deliberately not
            // rendered into the issue at all. It adds nothing the run URL does
            // not already give a reader.

            // ---------------------------------------------------------------
            // The marker: the alert's memory, and the only state this workflow
            // keeps. One ENTRY per job that failed:
            //
            //   { "job": "publish-helm-charts (kamerplanter)",
            //     "lane_ref": "tag",
            //     "since": "2026-08-13T18:09:50+00:00" }
            //
            // `job` is the FULL name, matrix suffix included. The base name
            // would join the executed and the skipped form of a job —
            // convenient, and wrong: it would also join two different matrix
            // legs, so one green leg could prove a leg that never re-ran.
            // `publish-helm-charts` has one leg today (docker-publish.yml,
            // `matrix.chart: [kamerplanter]`) and that is exactly the assumption
            // that would rot silently on the second one. Base names still do one
            // job here, and only one: recognising that an unproven job was
            // SKIPPED in the green run (its bare name) rather than gone from the
            // lane. That distinction goes into the notice, never the decision.
            //
            // `job: "*"` means "the run itself": a run that failed with no job
            // carrying a failing conclusion, including a `startup_failure` run
            // that never started a job at all (its jobs endpoint returns
            // `total_count: 0` — measured). Such an entry is proven by a later
            // green run of the same lane half, as a whole; without it that alert
            // could never close.
            // ---------------------------------------------------------------
            const MARKER = /<!-- kp:delivery-run-alert:v2=({.*?}) -->/;
            const RUN_ITSELF = '*';
            const renderMarker = (entries) =>
              `<!-- kp:delivery-run-alert:v2=${JSON.stringify({ entries })} -->`;
            const parseMarker = (text) => {
              const found = MARKER.exec(text || '');
              if (!found) { return null; }
              try {
                const parsed = JSON.parse(found[1]);
                const entries = parsed && parsed.entries;
                if (!Array.isArray(entries)) { return null; }
                const wellFormed = entries.every(e =>
                  e && typeof e.job === 'string' && e.job.length > 0 &&
                  typeof e.since === 'string' && !Number.isNaN(Date.parse(e.since)) &&
                  (e.lane_ref === 'develop' || e.lane_ref === 'tag'));
                return wellFormed ? entries : null;
              } catch (error) {
                return null;
              }
            };
            const entryKey = (entry) => `${entry.lane_ref} ${entry.job}`;
            const jobLabel = (job) => (job === RUN_ITSELF ? 'the run itself' : `\`${job}\``);
            const describe = (entry) =>
              `${jobLabel(entry.job)} on the ${entry.lane_ref} half (failing since ${entry.since})`;
            // Mirrors MATRIX_SUFFIX_PATTERN in scripts/ci/check_delivery_run.py.
            // Needed for a name read back out of the marker, which has no job
            // entry in THIS run to read `base_name` off.
            const baseNameOf = (name) => name.replace(/\s+\(.*\)$/, '');
            const baseNamesOf = (names) => {
              const wanted = new Set(names);
              return report.jobs.filter(j => wanted.has(j.name)).map(j => j.base_name);
            };
            const issueRef = { owner: context.repo.owner, repo: context.repo.repo };

            // A dispatch may hand over ANY run id, including one from another
            // workflow (`is_expected_workflow` is false then). Acting on it
            // would be wrong in both directions: a foreign red run would open an
            // issue blaming the delivery lane, and a foreign GREEN run would
            // close a genuine, still-unrepaired delivery alert. So: say what was
            // measured, touch nothing.
            if (!report.is_expected_workflow) {
              core.warning(
                `Run ${report.run_id} belongs to "${report.workflow_name}", not to the observed ` +
                `"${report.expected_workflow}" — reporting its verdict (${report.verdict}) and leaving ` +
                `the alert issue untouched.`
              );
              return;
            }

            // Dedup anchor: the single open issue carrying our label. A good
            // alerting job updates one issue; it does not open a new one per run.
            const open = (await github.rest.issues.listForRepo({
              ...issueRef,
              state: 'open',
              labels: LABEL,
            })).data.filter(i => !i.pull_request);
            const existing = open[0];

            // Neither alert nor resolution. `cancelled`, `neutral`, `skipped`,
            // `action_required` and `stale` are determined facts about the run
            // and say nothing about the lane's health — a cancelled run is an
            // operator act or a concurrency eviction. Closing on "did not fail"
            // would certify something nobody measured, which is the class this
            // whole PR exists to remove.
            if (report.verdict === 'inconclusive') {
              core.notice(
                `Run ${report.run_id} concluded ${report.conclusion} — neither a lane failure nor proof ` +
                `that the lane works. ` +
                (existing ? `Alert issue #${existing.number} is left OPEN.` : 'No alert issue is open.')
              );
              return;
            }

            // Not on the lane at all: `docker-publish.yml`'s `workflow_dispatch:`
            // is unrestricted, so this run may be the delivery lane executed on
            // somebody's feature branch. It opens nothing — the title "the
            // delivery lane went red" would be a claim about `develop` and the
            // release tags that this run does not support, and an entry recorded
            // against no half of the lane could never be proven, i.e. the alert
            // could never close. It closes nothing either, for the same reason
            // in reverse. The dispatcher sees their own run; a warning here says
            // the observer saw it and stayed out.
            if (report.lane_ref === null) {
              core.warning(
                `Run ${report.run_id} (${report.verdict}) ran \`${report.event}\` on ` +
                `\`${report.head_branch}\`, which is neither \`develop\` nor a \`v*\` tag — it is not the ` +
                `delivery lane, so no alert is opened or closed. ` +
                (existing ? `Alert issue #${existing.number} is untouched.` : 'No alert issue is open.')
              );
              return;
            }

            if (report.resolved) {
              if (!existing) {
                core.notice(`Delivery run ${report.run_id} is green and no alert issue is open.`);
                return;
              }

              const entries = parseMarker(existing.body);
              // Never dropped, never rebuilt from a green run: without the list
              // we do not know what has to be proven, and inventing an empty one
              // would close the issue on the spot. Notice only — this branch is
              // reached on EVERY green delivery run while such an issue is open
              // (several a day on `develop`), and a comment per run would bury
              // the issue it is meant to protect.
              if (entries === null || entries.length === 0) {
                core.notice(
                  `Delivery run ${report.run_id} is green, but alert issue #${existing.number} carries no ` +
                  `readable list of what has to be proven (marker missing, unparseable or empty). It stays ` +
                  `OPEN and the marker needs repairing by hand — see the comment history for the failing jobs.`
                );
                return;
              }

              // `succeeded_jobs` is the script's own bucket of jobs that RAN and
              // passed, under the SAME full names the marker records; re-deriving
              // it here from `conclusion === 'success'` would be a second
              // definition of the rule, free to drift from the one the unit
              // tests pin.
              const succeeded = new Set(report.succeeded_jobs);
              const skippedBases = new Set(baseNamesOf(report.skipped_jobs));
              const startedAt = Date.parse(report.run_started_at);
              const isProven = (entry) =>
                entry.lane_ref === report.lane_ref &&
                Date.parse(entry.since) < startedAt &&
                (entry.job === RUN_ITSELF || succeeded.has(entry.job));

              const proven = entries.filter(isProven);
              const remaining = entries.filter(e => !isProven(e));

              // Why an entry survived, in the order the conditions are checked.
              // The two job-level answers read very differently to a human:
              // SKIPPED means the lane still has the job and this run did not
              // reach it; ABSENT means no job of that name is in the run at all
              // — renamed, removed or moved — and that alert will never close on
              // its own.
              const reasonFor = (entry) => {
                if (entry.lane_ref !== report.lane_ref) {
                  return `${describe(entry)} [this run is on the ${report.lane_ref} half]`;
                }
                if (!(Date.parse(entry.since) < startedAt)) {
                  return `${describe(entry)} [this run started before that failure]`;
                }
                if (skippedBases.has(baseNameOf(entry.job))) {
                  return `${describe(entry)} [skipped in this run]`;
                }
                return `${describe(entry)} [absent from this run — renamed or removed?]`;
              };

              if (proven.length === 0) {
                core.notice(
                  `Delivery run ${report.run_id} is green but proves nothing on alert issue ` +
                  `#${existing.number}, which stays OPEN: ${remaining.map(reasonFor).join('; ')}.`
                );
                return;
              }

              const provenList = proven.map(e => jobLabel(e.job)).join(', ');
              if (remaining.length === 0) {
                await github.rest.issues.createComment({
                  ...issueRef,
                  issue_number: existing.number,
                  body: [
                    `Resolved: everything this alert was waiting for ran and succeeded in run ` +
                    `${report.run_id}.`,
                    '',
                    `- Proven now: ${provenList}`,
                    `- Delivery run: ${report.html_url} (${report.ref_kind} \`${report.head_branch}\`, ` +
                    `${report.lane_ref} half, started ${report.run_started_at})`,
                    `- Observer run: ${runUrl}`,
                    '',
                    'Closing.',
                  ].join('\n'),
                });
                await github.rest.issues.update({
                  ...issueRef, issue_number: existing.number, state: 'closed',
                });
                core.notice(`Delivery lane repaired — closed alert issue #${existing.number}.`);
                return;
              }

              // Partial repair: strike the proven entries off the list and say
              // so once. Only the marker is rewritten — the surrounding body is
              // the last red run's own account of itself and stays as it was.
              await github.rest.issues.update({
                ...issueRef,
                issue_number: existing.number,
                body: existing.body.replace(MARKER, () => renderMarker(remaining)),
              });
              await github.rest.issues.createComment({
                ...issueRef,
                issue_number: existing.number,
                body: [
                  `Proven in run ${report.run_id} (${report.html_url}): ${provenList}.`,
                  '',
                  `Still open: ${remaining.map(describe).join('; ')}.`,
                ].join('\n'),
              });
              core.notice(
                `Proved ${proven.length} of ${entries.length} entry(ies) on alert issue ` +
                `#${existing.number}; it stays OPEN for: ${remaining.map(reasonFor).join('; ')}.`
              );
              return;
            }

            // ---------------------------------------------------------------
            // report.alert
            // ---------------------------------------------------------------
            const fresh = (report.failed_jobs.length > 0 ? report.failed_jobs : [RUN_ITSELF])
              .map(job => ({ job, lane_ref: report.lane_ref, since: report.run_started_at }));
            const previous = existing ? parseMarker(existing.body) : null;
            // An existing issue whose marker cannot be read: its entries are
            // lost, and the new marker can only carry this run's. Said out loud
            // in the comment rather than papered over — a silently shortened
            // list would close the issue too early.
            const lostEntries = Boolean(existing) && previous === null;

            // Union by (lane half, job), keeping the LATER failure: two
            // different jobs can break in two consecutive runs, and an alert
            // that forgot the first one would be closed by a green run that only
            // repaired the second. A repeat failure of the same job moves its
            // `since` forward, so a green run between the two no longer proves it.
            const merged = new Map();
            for (const entry of (previous || [])) { merged.set(entryKey(entry), entry); }
            for (const entry of fresh) {
              const older = merged.get(entryKey(entry));
              merged.set(
                entryKey(entry),
                older && Date.parse(older.since) > Date.parse(entry.since) ? older : entry
              );
            }
            const entries = [...merged.values()].sort((a, b) =>
              entryKey(a).localeCompare(entryKey(b)));

            // Built by pushing rather than by filtering a sparse array: the
            // sibling job dropped every deliberate blank line that way and
            // collapsed the Markdown into one block.
            const measured = [];
            measured.push(`- Run: ${report.html_url} (attempt ${report.run_attempt}, ${report.duration_seconds}s)`);
            measured.push(
              `- Trigger: \`${report.event}\` on ${report.ref_kind} \`${report.head_branch}\` — ` +
              `the **${report.lane_ref}** half of the lane`
            );
            measured.push(`- Conclusion: **${report.conclusion}**`);
            measured.push(
              report.failed_jobs.length > 0
                ? `- Failed job(s): ${report.failed_jobs.map(n => `\`${n}\``).join(', ')}`
                : report.job_count === 0
                  ? '- Failed job(s): **the run started no job at all** — a `startup_failure` shape: the workflow file itself did not parse, or a job-level expression did not evaluate. Nothing in the lane ran.'
                  : '- Failed job(s): **none reports a failing conclusion** — the run itself failed. Open it and look for a workflow-level error, or a failure on an earlier attempt.'
            );
            measured.push(
              report.skipped_jobs.length > 0
                ? `- Skipped, therefore NOT proven by this run: ${report.skipped_jobs.map(n => `\`${n}\``).join(', ')}`
                : '- Nothing was skipped.'
            );
            measured.push(`- Ran and succeeded: ${report.succeeded_jobs.length} of ${report.job_count} job(s)`);

            // What is still outstanding, in the reader's words rather than the
            // marker's. This is the list the closing rule works from, so it is
            // shown rather than left implicit in an HTML comment.
            const outstanding = entries.map(e => `- ${describe(e)}`);

            // The chart-job story is the incident this observer was built for,
            // but it is NOT every alert. Bake it in unconditionally and every
            // future alert about an unrelated job arrives pre-loaded with a
            // wrong diagnosis. It is emitted only when the chart job is among
            // the jobs that failed.
            const chartJobFailed = report.failed_jobs.some(n => baseNameOf(n) === 'publish-helm-charts');
            const releaseAssetsAffected =
              report.failed_jobs.concat(report.skipped_jobs).some(n => baseNameOf(n) === 'update-release-assets');

            const whyMissed = [
              'A job that is **skipped** takes nothing down with it, so a run whose broken job simply did not execute reads green. That is why this issue is not closed by the next green run: an entry above is struck off only by a run on the same half of the lane that actually executed that job, after the failure it is about.',
            ];
            if (chartJobFailed) {
              whyMissed.push('');
              whyMissed.push('`publish-helm-charts` in particular runs only when `helm/**` changed, on a `v*` tag, or on dispatch — on every other push to `develop` it is skipped. The lane therefore reads green most of the time and its red runs look intermittent. They usually are not: in the incident this observer was built for (31729355999, 31955164085, 31955579431), every run that reached the job failed.');
            }

            const triage = [];
            triage.push('Open the delivery run above and read the failing job — not only the red one: a job that is *skipped* because its `needs` failed is a loss too, and it reports success.');
            if (report.job_count === 0) {
              triage.push('This run started **no job**, so there is nothing to read inside it. Look at `docker-publish.yml` itself: an unparseable workflow file or a job-level expression that did not evaluate produces exactly this shape.');
            }
            if (chartJobFailed) {
              triage.push('For `publish-helm-charts`, start at #1218 and #1224: the `Attest chart provenance` step reads `~/.docker/config.json` while the job used to log in only to Helm\'s own credential store. `scripts/check_attest_registry_credentials.py` is the gate that keeps that repaired.');
            }
            triage.push('Re-running the delivery workflow is the repair path: `gh run rerun <run-id> --failed`. The asset upload refuses to overwrite a *differing* published asset, so a re-run either fills the gap or tells you the bytes moved.');
            if (releaseAssetsAffected) {
              triage.push('`update-release-assets` did not complete, so a release page may be short of its chart, compose file, environment file and packages block. That outcome has its own watcher — `release-assets-complete.yml` (#1218) — and its own issue; repair the run, then let that check confirm the release.');
            }
            triage.push('If the lane is deliberately being left red, say so **in a comment on this issue** — not by editing the body, which is rewritten on the next red run — so the next reader does not re-diagnose it.');

            const body = [
              'A run of the delivery lane (`.github/workflows/docker-publish.yml`) went red. Until this observer existed, that was visible only in the Actions tab: three such runs (31729355999, 31955164085, 31955579431) went unnoticed for five days, and the cause was re-diagnosed from scratch (#1225).',
              '',
              '## Measured',
              '',
              ...measured,
              '',
              `Observer run: ${runUrl}`,
              '',
              '## Outstanding',
              '',
              ...outstanding,
              '',
              'Each entry is proven independently: a green run on the same half of the lane, started after the failure, that actually ran and passed the job strikes that entry off. The issue closes when none is left. (On `develop` most jobs are path-skipped on any given push, so two failures rarely clear in one run — which is why they are tracked separately rather than all-or-nothing.)',
              '',
              '## Why this is easy to miss',
              '',
              ...whyMissed,
              '',
              'The body above is **regenerated on every red run**, so edits to it are lost (and an edit that removes the marker comment at the end would stop this issue from ever closing automatically). Add anything you want to keep as a **comment** instead.',
              '',
              '## Triage',
              '',
              ...triage.map((text, index) => `${index + 1}. ${text}`),
              '',
              renderMarker(entries),
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({ ...issueRef, issue_number: existing.number, body });
              await github.rest.issues.createComment({
                ...issueRef,
                issue_number: existing.number,
                body: [
                  `Red again as of ${report.html_url} (\`${report.event}\` on ${report.ref_kind} ` +
                  `\`${report.head_branch}\`, ${report.lane_ref} half): ` +
                  `${report.failed_jobs.map(n => `\`${n}\``).join(', ') || '_no job reports a failing conclusion_'}.`,
                  ...(lostEntries
                    ? [
                        '',
                        '**The previous marker on this issue could not be read**, so the outstanding list was ' +
                        'rebuilt from this run alone — anything recorded earlier is lost. Check the comment ' +
                        'history above for failures that are still unrepaired.',
                      ]
                    : []),
                ].join('\n'),
              });
              core.notice(`Updated existing alert issue #${existing.number}.`);
            } else {
              const created = await github.rest.issues.create({
                ...issueRef, title: TITLE, body, labels: [LABEL, 'deployment'],
              });
              core.notice(`Opened alert issue #${created.data.number}.`);
            }

name: API Docs

# OpenAPI document gate (spec/project/api-documentation/):
#  - drift: the checked-in snapshot (src/backend/openapi.json) must match a
#    fresh export from the FastAPI app (code-first re-export diff);
#  - lint: spectral validates the snapshot against .spectral.yaml.
# Non-required lane (repo convention: `static` is the only required gate);
# treat failures here as documentation drift to fix with `task openapi:export`.

on:
  push:
    branches: [develop]
    paths:
      - 'src/backend/**'
      - '.spectral.yaml'
      - '.github/workflows/api-docs.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'src/backend/**'
      - '.spectral.yaml'
      - '.github/workflows/api-docs.yml'

defaults:
  run:
    working-directory: src/backend

jobs:
  openapi-drift:
    name: OpenAPI snapshot drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Install dependencies
        # Pinned, hash-verified lock — same install truth as backend.yml.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install --no-deps -e .

      - name: Check snapshot freshness
        run: python -m scripts.export_openapi --out openapi.json --check

  openapi-lint:
    name: OpenAPI spectral lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Spectral lint
        # ubuntu-latest ships Node; fail on error-severity findings only.
        run: npx --yes @stoplight/spectral-cli@6 lint --ruleset ../../.spectral.yaml --fail-severity error openapi.json

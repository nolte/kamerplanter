name: API Docs

# OpenAPI document gate (spec/project/api-documentation/): the document is a
# build artifact, never checked in. This lane re-exports it from the FastAPI
# app on every backend change, lints it with spectral (.spectral.yaml), and
# uploads it as a workflow artifact. The release build attaches the same
# export as a release asset (issue #765).
# Non-required lane (repo convention: `static` is the only required gate).

on:
  push:
    branches: [develop]
    paths:
      - 'src/backend/**'
      - '.spectral.yaml'
      - '.github/workflows/api-docs.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'src/backend/**'
      - '.spectral.yaml'
      - '.github/workflows/api-docs.yml'

permissions:
  contents: read

concurrency:
  group: api-docs-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src/backend

jobs:
  openapi-export-lint:
    name: OpenAPI export + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Install uv
        # One pin, read from `[tool.uv].required-version` — see the long note on
        # the same step in backend.yml's `lint-test` job (#1383).
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: src/backend/pyproject.toml
          enable-cache: true
          cache-dependency-glob: src/backend/uv.lock

      - name: Install dependencies
        # Pinned, hash-verified lock — same install truth as backend.yml.
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Export OpenAPI document
        run: python -m scripts.export_openapi --out openapi.json

      - name: Spectral lint
        # ubuntu-latest ships Node; fail on error-severity findings only.
        # Pinned to an exact version rather than the `@6` major: a floating
        # major means a new minor can add a rule and turn an unchanged document
        # red, so the same commit stops producing the same verdict.
        run: npx --yes @stoplight/spectral-cli@6.17.0 lint --ruleset ../../.spectral.yaml --fail-severity error openapi.json

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi
          path: src/backend/openapi.json
          if-no-files-found: error

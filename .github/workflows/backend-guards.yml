name: Backend Guards

# WHY THIS IS A SEPARATE WORKFLOW AND NOT A JOB IN `backend.yml` (#1404).
#
# #1404 asks for "a job in `.github/workflows/backend.yml` … with no `paths:`
# filter". That job cannot exist: `on:` is a WORKFLOW-level key, and a job
# cannot widen the triggers of the workflow that contains it. `backend.yml` is
# path-filtered to `src/backend/**` and a handful of scripts, so a job added
# there would not run at all for a change outside those paths — which is exactly
# the case the promotion exists to cover (a frontend-only pull request that also
# adds an ungated backend write route). The filter is the defect; a new file is
# the only way to drop it.
#
# WHAT RUNS HERE, AND WHY IT IS A DIRECTORY AND NOT A LIST.
#
# `src/backend/tests/unit/api/` — every write-route gate sweep lives there
# (`test_write_route_gates.py`, `test_recognition_write_gates.py`,
# `test_pest_detection_write_gates.py`,
# `test_generate_care_reminders_tenant_scope.py`). A hand-maintained list of
# test files would be an OPT-IN LIST, which is the defect class this lane exists
# to make blockable: a new gate test added outside the list is silently
# unenforced, exactly as a new seed file outside a `check-jsonschema` hook is
# silently unchecked (#1406) and a new write route outside the sweep's selectors
# is silently ungated (#1402). A directory is enumerated by the runner, so a new
# guard test placed beside its siblings is picked up without anyone remembering.
#
# `src/backend/tests/unit/guards/` — guards over CI configuration that lives
# outside the backend package: the ZAP rule TSVs and the gate that reads them,
# the nightly's scan budget, the workflow flags themselves (#1376/#1389). Added
# as a DIRECTORY for the same reason, not as three file names. They were in
# `tests/unit/` before, which meant only `backend.yml` ran them — path-filtered
# and advisory — so a pull request that added an expired suppression, or put `-c`
# back on the API scan (which silently swaps `API-Minimal` for the full active
# rule set), turned Backend CI red and merged regardless.
#
# WHY NOT THE WHOLE UNIT SUITE. The local per-directory figures that stood here
# — `tests/unit/api/` 271 tests 15 s, `tests/unit` 8345 tests 240 s, and "0.4 s"
# for the guards directory, all taken 2026-09-12 on a workstation — are removed
# rather than refreshed. They were contradicted by what the lane costs on a
# runner (#1597: on run 35447987294 the single `Mechanical guards` step took
# 2m29s of a 2m46s job), and a local figure for a lane that only ever runs in CI
# is the wrong instrument. The job-level measurement below is the one that binds.
#
# The argument those figures made still holds, and it is an ORDERING argument
# rather than an absolute one: `strict: true` on `develop` invalidates every open
# pull request's green after any other merges, so a required check's runtime is
# paid once per pull request per merge, not once per pull request. The full
# backend unit suite is an order of magnitude more work than these two
# directories and that gap has not closed, so it stays in `backend.yml`,
# path-filtered and advisory.
#
# THE MODE IS SET EXPLICITLY. `test_write_route_gates.py:225` asserts
# `settings.kamerplanter_mode == "full"` and says why: under `light` the auth,
# privacy and platform-admin routers are never mounted, so the sweep walks a
# surface roughly half the size and reports no offenders for what it cannot see.
# The settings default is already `full`, which is precisely why the assertion is
# there — a default is not a guarantee, and an environment that flips it would
# leave this lane green over half a route table.

on:
  # EVERY push to EVERY branch, no `paths:`. A path- or branch-filtered required
  # check never reports on a change it filtered out, and GitHub treats a check
  # that never reports as satisfied — the shape `build-static-tests.yaml`
  # documents at length for the same reason.
  #
  # `push` and NOT `pull_request`, matching `build-static-tests.yaml`, and the
  # consequence is stated here rather than inherited: a `push` event does not
  # fire in this repository for a branch that lives in a FORK, so a required
  # check triggered only by `push` never reports on a fork pull request and
  # branch protection blocks it permanently. That is already true of
  # `static / Static CI Tests`, so promoting a second context changes nothing
  # about who can contribute today — this is a single-maintainer repository and
  # every branch is local. It becomes a real cost the moment an outside
  # contributor opens a pull request, and at that point BOTH required workflows
  # need a `pull_request` trigger, not just this one. Written down so that
  # discovery is a lookup and not a re-derivation.
  push:
  # Manual runs. Moved here with the integration lane (#1432): a job that has
  # never run on a runner may not be made a required check on the strength of a
  # local green — the operator dispatches it three times first, and the outputs
  # go in the group's artifact. It stays available for a re-measurement after a
  # change to the service container or the tier's fixtures.
  workflow_dispatch:

permissions:
  contents: read

# A branch pushed three times in a minute should run this once. The guarantee is
# unchanged: the superseding run covers the newer head, and it is the head that
# branch protection reads.
concurrency:
  group: backend-guards-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src/backend

jobs:
  # WHY THIS JOB HAS NO RELEVANCE GATE, AND WHY THE ANSWER IS A MEASUREMENT
  # RATHER THAN A PREFERENCE (#1578).
  #
  # #1578 asks for a detection step here, the way `integration` below now has
  # one, because two minutes spent on a two-line Helm chart bump measure nothing
  # the diff could have changed. The premise is right for `integration` and
  # WRONG for this job, and the difference is the input set.
  #
  # MEASURED 2026-09-20 on this tree, by recording every file the tier opens
  # (a `sys.addaudithook` over `open`, around `pytest tests/unit/api
  # tests/unit/guards`). Outside `src/backend/` it opens, among others:
  #
  #   * 57 files under `src/frontend/src/api/endpoints/` — via
  #     `tests/unit/api/test_frontend_endpoints_are_served.py` and
  #     `scripts/check_frontend_calls_served.py`;
  #   * EVERY `.github/workflows/*.yml`, plus `.github/settings.yml`,
  #     `.github/renovate-pins.yaml` and `.github/actions/ephemeral-stack/action.yml`;
  #   * `renovate.json5` and `.pre-commit-config.yaml`;
  #   * eight `pyproject.toml`/`uv.lock` pairs outside this package —
  #     `docker/embedding-service/`, `docker/reranker-service/`,
  #     `src/libs/kp_vectordb/`, `src/libs/kp_errortracking/`,
  #     `src/knowledge-service/`, `src/inference-service/`, `tests/e2e/` —
  #     reached through `_REPO_ROOT.rglob("pyproject.toml")` in
  #     `test_uv_pin_manager_covers_every_pin.py`, which also means a NEW
  #     `pyproject.toml` anywhere in the tree changes this tier's verdict;
  #   * `docs/requirements.txt`, `tools/rag-eval/requirements.txt`,
  #     `tests/security/zap-*.tsv`, `tests/security/zap-setup/zap_hooks.py`,
  #     `scripts/check_frontend_calls_served.py`, `scripts/ci/check_renovate_dashboard.py`,
  #     `scripts/ci/assert_rendered_manifests.sh`, `scripts/security/zap_gate.py`;
  #   * `spec/nfr/NFR-006_API-Fehlerbehandlung.md`.
  #
  # And `test_model_field_renames_have_migrations.py` derives its population from
  # `git log` — its input is the HISTORY, which no path filter can express at all
  # (hence `fetch-depth: 0` below).
  #
  # So the narrowest exclusion the sibling lane uses — `!docs/**`, `!spec/**`,
  # `!.github/**` in `e2e-smoke.yml` — would be wrong here on all three counts,
  # and an allow list of `src/backend/**` would miss the frontend endpoint sweep
  # outright. A filter over this input set is the whole checkout with extra
  # steps, and the failure mode of getting it wrong is not a wasted run: it is a
  # REQUIRED gate reporting green over a change it never looked at.
  #
  # "No" is the finding, not a deferral. Re-open it only with a new measurement
  # of the input set, not with a new opinion about it.
  guards:
    name: Write-route and tree guards
    runs-on: ubuntu-latest
    # `timeout-minutes` is a HANG CEILING, not the expected runtime. Under
    # `strict: true` a wedged run on a REQUIRED lane blocks every open pull
    # request for GitHub's 360-minute default, and the stall has to be noticed by
    # a human watching the merge train. Ten minutes is loose enough that a slow
    # runner or a cold `uv` cache never trips it and tight enough that a hang
    # costs one lane rather than an afternoon. It is deliberately NOT the
    # rollback trigger — that lives in `.github/settings.yml` beside the context
    # it can take back, and is stated as a median, not as a per-run ceiling.
    #
    # WHAT THE LANE ACTUALLY COSTS. "The measured run is 41 s" stood here until
    # #1578 and was four times wrong; #1597 re-measured it and this line carries
    # the third measurement, taken 2026-09-20 for the threshold move in that
    # issue. Successful `Write-route and tree guards` jobs, window
    # 2026-09-19T18:16Z → 2026-09-20T16:37Z (22.4 h, n = 248 — the workflow fires
    # on every push to every branch, so the sample is dense rather than long):
    #
    #   median 166 s   p10 141 s   p90 187 s   p99 201 s   min 122 s   max 204 s
    #
    # Reproduce with:
    #   gh api repos/nolte/kamerplanter/actions/workflows/backend-guards.yml/runs\
    #     ?status=completed → per-run /jobs → completed_at - started_at,
    #   successful jobs only, grouped by job name.
    #
    # The window and n are part of the claim: a rate measured over a day is not a
    # property of the pipeline. If a future reader's own measurement disagrees
    # with the numbers above, theirs wins and this comment is the defect.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: tests/unit/guards/test_model_field_renames_have_migrations.py
          # derives the model fields that vanished since the migration baseline from
          # the history itself (#1468), and a shallow clone shows it none of them.
          # It fails rather than skips on a shallow checkout — a guard that sees an
          # empty population reports green while measuring nothing (NFR-018 §1) —
          # which is what surfaced this line. Same reason `backend.yml` sets it.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Install uv
        # One pin, read from `[tool.uv].required-version` — see the long note on
        # the same step in backend.yml's `lint-test` job (#1383).
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version-file: src/backend/pyproject.toml
          enable-cache: true
          cache-dependency-glob: src/backend/uv.lock

      - name: Install dependencies
        # Same install path as `backend.yml`: the hash-verified lock is the
        # single source of install truth (NFR-009 §2.3).
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Mechanical guards
        env:
          # Read by tests/unit/api only — see the header. tests/unit/guards reads
          # files off disk and is indifferent to the mode.
          KAMERPLANTER_MODE: full
        # `--max-skipped 0` is this lane's skip floor (#1434): both directories
        # measured 361 passed, 0 skipped on 2026-09-16, and a skipped test exits
        # like a passed one — without the floor a guard that stopped collecting
        # would leave the required lane green. The failure names every skip
        # reason; raising the number belongs in the commit that justifies it.
        run: pytest tests/unit/api tests/unit/guards -q --max-skipped 0

  # THE SECOND REQUIRED CHECK IN THIS LANE, AND WHY A 2–3-MINUTE JOB WITH A
  # SERVICE CONTAINER SITS IN THE "FAST" LANE (#1432).
  #
  # `Integration tests (ArangoDB)` became a required context on `develop` on
  # 2026-09-17. It was defined in `backend.yml`, which is path-filtered to
  # `src/backend/**` and a handful of scripts — so on a change outside those
  # paths the workflow does not run, the context is never reported, and GitHub
  # holds the pull request on "Expected — waiting for status to be reported"
  # forever. Measured the same day with `gh pr view <n> --json statusCheckRollup`
  # on three open pull requests, each of which listed every other required
  # context and not this one: #1470 (frontend only), #1475 (workflow only),
  # #1410 (documentation only). All three were permanently BLOCKED.
  #
  # A required check therefore has to live in a workflow with no `paths:`
  # filter, which is this one — the argument at the top of this file, applied a
  # second time. The job carries its own service container and its own `Set up
  # Task` step, so nothing it needs is inherited from the lane around it.
  #
  # THE COST IS REAL AND ACCEPTED. The header above argues this lane stays
  # cheap because `strict: true` makes a required check's runtime a per-merge
  # cost, and it is why the full unit suite stays out. Measured the same way and
  # over the same window as `guards` above (2026-09-19T18:16Z →
  # 2026-09-20T16:37Z, successful jobs only, n = 271): median 188 s, p10 156 s,
  # p90 197 s, p99 214 s, max 235 s. The "guards reports in well under a minute"
  # that stood here was the 41 s figure #1597 retired; `guards` now has a median
  # of 166 s, so the two jobs cost roughly the same. They run in PARALLEL — they
  # are separate jobs with no `needs:` between them — so the lane's wall clock is
  # the slower of the two rather than their sum, which is why adding the data
  # tier cost the merge train about twenty seconds, not three minutes.
  # The alternative is not "a cheaper lane": it is a required check that does
  # not report, which blocks every pull request outside `src/backend` outright.
  #
  # `concurrency` above cancels this job when the branch is pushed again. That
  # is correct here for the same reason it is correct for `guards`: branch
  # protection reads the head commit, and the superseding run covers it.
  integration:
    # The repository and AQL tier, against a REAL ArangoDB (#1432). It is a job
    # of its own, and not a step in `guards` above or in `backend.yml`'s
    # `lint-test`, because it is the only tier that needs a server: a service
    # container would slow down every other tier that does not use one.
    #
    # Until 2026-09-16 this tier ran in no gate at all. The comment that used to
    # stand in `backend.yml`'s `API tests` step said why, and it was true: each of its
    # nine connecting modules probed `localhost:8529` itself and skipped when
    # nothing answered, so on a runner it reported `7 passed, 136 skipped` with
    # exit code 0 — green, having tested almost nothing. What changed is not the
    # runner but the contract: `src/backend/tests/integration/conftest.py` makes
    # a missing database a FAILURE whenever `CI` is set (Actions always sets it),
    # and `task test:backend:integration` declares `--max-skipped 0`, so a
    # session that skipped anything at all is red here.
    name: Integration tests (ArangoDB)
    runs-on: ubuntu-latest
    services:
      arangodb:
        # The SAME digest as docker-compose.yml — the dev stack, the local run
        # and this lane must measure against one server version, or a query that
        # passes here can fail on a developer machine. Renovate keeps the two in
        # ONE pull request, and that is measured, not assumed: its built-in
        # github-actions manager extracts this line as
        # `depName: arangodb, datasource: docker, depType: service` (verified
        # 2026-09-16 with `renovate --platform=local --dry-run=extract`), and the
        # `{{depName}} image` group in renovate.json5 matches on package identity
        # alone, across managers — which is exactly why that group was rewritten
        # away from `matchManagers` on 2026-09-10. No `# renovate:` marker
        # comment here: that belongs to the custom regex manager for image
        # strings in workflow `env:` values, and adding one would claim a
        # mechanism that is not the one doing the work.
        image: arangodb:3.12@sha256:3ce7aa54ac9b0942a2b201cd47a397cb89c3d5ff5a087d701f3c785109d0dfb7
        env:
          # A throwaway root password for a container that lives for one job and
          # is reachable from nothing else. It matches the tier's default so the
          # lane and a local `docker run` are the same thing (NFR-009: no secret
          # here, because there is no secret here).
          ARANGO_ROOT_PASSWORD: rootpassword
        ports:
          - 8529:8529
        options: >-
          --health-cmd "arangosh --server.endpoint tcp://127.0.0.1:8529 --server.password rootpassword --javascript.execute-string 'db._version()'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s
    env:
      # `Settings`' own variable names (env_prefix: ""), read by
      # tests/support/arango_integration.py. Both routes into the database — a
      # real `Settings(...)` through `ArangoConnection`, and a bare
      # `ArangoClient` — therefore point at this service and not at a literal.
      ARANGODB_HOST: localhost
      ARANGODB_PORT: '8529'
      ARANGODB_USERNAME: root
      ARANGODB_PASSWORD: rootpassword
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # RELEVANCE, EXPRESSED AS A STEP AND NOT AS A JOB (#1578).
      #
      # #1578 proposes the shape `frontend.yml` and `e2e-smoke.yml` use: a
      # separate `changes` job, and the expensive job gated on it through
      # `needs.<job>.result`. That shape is NOT used here, and the reason is the
      # measurement #1583 landed on 2026-09-19 (PR #1587, over the last 300
      # pull-request runs / 556 jobs): the median job in this repository runs
      # 32 s and waits 20–26 MINUTES for a runner slot, because the
      # concurrent-job allotment is account-wide and the account peaked at 46
      # simultaneous jobs. A JOB, not a CPU-second, is what CI is short of.
      #
      # A `needs:`-linked detection job would therefore cost this REQUIRED lane a
      # second full slot wait — 20-odd minutes of queue to save 3 minutes of
      # runtime — which is precisely the cost #1587 removed by folding `hadolint`
      # into `changes` instead of adding a job. Detecting inside the job keeps
      # the lane at one slot and one queue wait.
      #
      # The checkout above is needed anyway and `dorny/paths-filter` requires it
      # on a `push` event; on a feature branch the action's `base` defaults to
      # the repository default branch (`develop`, verified), which is the diff a
      # pull request is judged on.
      #
      # WHAT THE ALLOW LIST IS, AND HOW IT WAS ARRIVED AT. Measured 2026-09-20 by
      # recording every file this tier opens (a `sys.addaudithook` over `open`,
      # around `pytest tests/integration`, 245 passed / 0 skipped against a real
      # ArangoDB): 1454 paths, EVERY ONE of them under `src/backend/`. Nothing
      # else in the checkout is read. The two entries beyond it are reasoned, not
      # measured, and are named as such — the audit hook cannot see them because
      # they are consumed by `task` outside the Python process:
      #   * `Taskfile.yaml` / `.taskfiles/**` — the invocation itself. The steps
      #     below run `task deps:sync` and `task test:backend:integration`, so a
      #     change to either definition changes what this job does, including the
      #     `--max-skipped 0` floor.
      #   * this workflow file — the job definition, the pinned ArangoDB digest
      #     and the service's health command.
      # An ALLOW list rather than a deny list, so the default for anything not
      # named is "irrelevant"; the counter-proofs in #1578's pull request run
      # both directions against it.
      #
      # WHAT THE MEASUREMENT CANNOT SEE, stated so "every one of them under
      # `src/backend/`" is read as what it is. The audit hook observes `open` in
      # the pytest PROCESS; a file read by a SUBPROCESS is invisible to it. This
      # tier has one: `test_v0048_backfill_missing_care_profiles.py:149` runs
      # `[sys.executable, "scripts/audit_care_profiles.py", "--json"]` with
      # `cwd=_BACKEND_ROOT`. Resolved by hand — the only way to resolve it —
      # that argv is `src/backend/scripts/audit_care_profiles.py`, which is
      # inside the allow list and whose imports are stdlib, `arango` and `app.*`
      # only, so it opens nothing beyond this package. No hole today; the blind
      # spot is written down because the next subprocess added here will not
      # announce itself in the numbers.
      - name: Detect whether this diff can reach the integration tier
        id: relevance
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # THE REFERENCE THE VERDICT IS TAKEN AGAINST, SPELLED OUT.
          #
          # Omitting `base:` makes the action inherit the REPOSITORY DEFAULT
          # BRANCH, and that value is not reviewable from this checkout: this
          # repository's `.github/settings.yml` does not set `default_branch`, it
          # inherits it through `_extends` from a file that does not live here.
          # An unversioned input deciding what a REQUIRED gate compares against
          # is the same defect class as an unversioned pin — an upstream change
          # or a branch rename would move the verdict's baseline silently. The
          # literal is therefore written here, where a diff can review it.
          #
          # It must stay equal to the branch pull requests target; the sibling
          # guard `test_required_contexts_are_unfiltered.py` already hard-codes
          # that same branch as `_TARGET_BRANCH`.
          base: develop
          # DEPTH. The checkout above is shallow (`fetch-depth: 1`), so the
          # action deepens the history itself to find the merge base
          # (`initial-fetch-depth: 100`, its default, doubling until it
          # succeeds). On a long-lived branch that is slow, and if it cannot
          # reach the merge base the step FAILS — which reds this lane rather
          # than skipping it, so the direction is fail-safe. Named rather than
          # pre-empted: `guards` above sets `fetch-depth: 0` for an unrelated
          # reason (a guard that reads `git log`), and paying a full clone here
          # to avoid a deepening that has not yet been observed to hurt would be
          # trading a measured cost for an imagined one. Raise
          # `initial-fetch-depth` here the first time a run reports the deepening
          # as the slow step.
          #
          # Raising the CHECKOUT's depth instead is the one change that is not
          # equivalent: it re-opens the dispatch hole the freeze step below
          # closes. That is measured and written out there; read it first.
          #
          # No `predicate-quantifier` here, deliberately, and it is not the
          # omission `e2e-smoke.yml` warns about: that warning is about a DENY
          # list, where the default `some` ORs a leading `'**'` against the
          # exclusions and makes the filter permanently true. This is an allow
          # list with no negation, and `some` — a file matches if it matches ANY
          # entry — is the intended reading. `every` would require a file to be
          # under `src/backend/**` AND be `Taskfile.yaml`, which nothing is.
          # `tests/unit/guards/test_paths_filter_quantifier.py` encodes exactly
          # that distinction, so this step is swept and passes on its merits.
          filters: |
            integration:
              - 'src/backend/**'
              - 'Taskfile.yaml'
              - '.taskfiles/**'
              - '.github/workflows/backend-guards.yml'

      # THE FAIL-SAFE, WRITTEN OUT ONCE SO NO STEP BELOW RESTATES IT.
      #
      # This job carries NO job-level `if:`. That is load-bearing and not an
      # oversight: `Integration tests (ArangoDB)` is a REQUIRED context, the job
      # must therefore always produce a check run, and the construction proven in
      # this repository under a required context is `frontend.yml`'s — the job
      # runs, only its steps are conditional. A job whose steps are all skipped
      # reports Success, which is what branch protection needs.
      #
      # `RUN_INTEGRATION` defaults to `true` and is narrowed to `false` only when
      # the detection step BOTH succeeded AND reported the diff as inert. That is
      # the same predicate `needs.changes.result != 'success' || …` expresses one
      # job over, evaluated here against `steps.relevance.outcome`. Without the
      # outcome clause a detection that returned an empty output would compare
      # false everywhere, every step would skip, and the required check would go
      # green having run no tests at all — fail-open by omission. The step has no
      # `continue-on-error`, so a failing detection reds the lane today; the
      # clause is what keeps that true if one is ever added.
      #
      # AND `workflow_dispatch` IS EXEMPT, WHICH IS NOT A CONVENIENCE.
      #
      # A `workflow_dispatch` payload carries no `before`, so the action cannot
      # diff at all when its `base` resolves to the ref being dispatched — which
      # is the case this workflow's own header reserves the trigger for ("a job
      # that has never run on a runner may not be made a required check on the
      # strength of a local green — the operator dispatches it three times
      # first"), because that dispatch happens on `develop`. It then falls back
      # to `git log --format= --no-renames --name-status -z -n 1`, i.e. to
      # WHATEVER THE LAST COMMIT HAPPENED TO TOUCH. A manual verification run
      # judged by the contents of the previous merge commit is not a
      # verification run.
      #
      # MEASURED 2026-09-20, because the mechanism is not what it looks like and
      # the answer flips on a setting three lines up. Under the shallow checkout
      # this job uses, that `git log` runs on a commit with no parent in the
      # local repository and therefore lists the ENTIRE TREE as added — measured
      # on a `--depth 1` clone of `develop`: 4508 paths, every one reported `A`.
      # Every filter is true, the tier runs, and a dispatch is accidentally safe.
      # Give the checkout a full history — which the sibling `guards` job above
      # already has, and which the `initial-fetch-depth` note below could
      # plausibly tempt someone into — and the fallback becomes a real
      # single-commit diff. Proven on a real dispatch, both directions, same
      # filter verdict, opposite outcome (#1578's pull request):
      #
      #   fetch-depth: 0, no override  -> Filter integration = false
      #                                -> "Integration tier SKIPPED", job green in 29 s
      #   fetch-depth: 0, with override-> Filter integration = false
      #                                -> "Integration tier RUNS", tier executed, 2m54s
      #
      # So the clause below is what makes the dispatch path correct BY ITSELF
      # rather than by coincidence of the clone depth. Do not remove it because
      # "a dispatch runs the tier anyway today"; that sentence is true and is a
      # property of `fetch-depth: 1`, not of this lane.
      - name: Freeze the run/skip decision
        env:
          DETECTION: ${{ steps.relevance.outcome }}
          RELEVANT: ${{ steps.relevance.outputs.integration }}
        run: |
          RUN=true
          if [ "$DETECTION" = "success" ] && [ "$RELEVANT" = "false" ]; then
            RUN=false
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # An operator asked for this run by hand. See the block above: the
            # filter has no diff to judge on a dispatch — its verdict there is
            # about the last commit, never about what the operator asked for.
            RUN=true
          fi
          echo "RUN_INTEGRATION=$RUN" >> "$GITHUB_ENV"
          if [ "$RUN" = "true" ]; then
            echo "::notice::Integration tier RUNS (event=$GITHUB_EVENT_NAME, detection outcome=$DETECTION, relevant=$RELEVANT)."
          else
            echo "::notice::Integration tier SKIPPED: no file in this diff can reach it."
          fi

      - name: Setup Python
        if: env.RUN_INTEGRATION == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Set up Task
        if: env.RUN_INTEGRATION == 'true'
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        if: env.RUN_INTEGRATION == 'true'
        # THE uv pin (#1383). `version-file` makes the action read
        # `[tool.uv].required-version` out of src/backend/pyproject.toml, so the
        # uv this job runs cannot differ from the uv Renovate relocks with or the
        # one the Dockerfile copies. It replaces a `python -m pip install` line
        # carrying a literal uv version — the same value written out eight times
        # across four workflows, held together only by the `uv toolchain`
        # Renovate group.
        # That group is a promise, not a mechanism: a ninth copy added without it
        # would age unnoticed, which is the #1296 class (toolchain halves aging
        # apart). tests/unit/guards/test_uv_pin_is_single.py is the permanent
        # absence check that no such copy comes back.
        #
        # The cache key is src/backend/uv.lock rather than the action's default
        # `**/pyproject.toml` + `**/uv.lock` glob: since #1374 this repository has
        # five locks, and four of them have nothing to do with this job.
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version-file: src/backend/pyproject.toml
          enable-cache: true
          cache-dependency-glob: src/backend/uv.lock

      - name: Install dependencies
        if: env.RUN_INTEGRATION == 'true'
        # Through the Taskfile, like every other command in this job (#1383).
        # `task deps:sync` is `uv sync --locked --extra dev` and nothing else, so
        # this is not indirection for its own sake: the invocation now exists
        # ONCE, and a contributor running `task deps:sync` cannot end up with a
        # different environment than the gate. Inlining it is how the two drift.
        #
        # `uv sync --locked` (NFR-009 §2.3) refuses a lock that no longer
        # satisfies pyproject.toml and verifies every artifact against the hash
        # the lock records, then installs the app package itself editable.
        #
        # The PATH prepend is belt and braces here: the only test step below runs
        # through `task test:backend:integration`, which resolves its own
        # interpreter via `uv run --locked`. It stays so that a step added later
        # that spells a bare `python` reaches this environment and not the
        # runner's interpreter — the shape `backend.yml`'s `lint-test` job needs
        # for its Steckbrief consistency step.
        run: |
          task deps:sync
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Wait for ArangoDB
        if: env.RUN_INTEGRATION == 'true'
        # The service healthcheck already gates the steps, so this normally
        # returns on the first poll. It exists to make the OTHER outcome legible:
        # if the container is up but not answering, the failure names that,
        # instead of surfacing as 136 identical connection errors inside pytest.
        # Authenticated on purpose: with ARANGO_ROOT_PASSWORD set the server answers
        # 401 to an anonymous /_api/version, and `-f` turns that into "not answering"
        # — measured on the pinned image (401 without, 200 with credentials).
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 -u "root:${ARANGO_ROOT_PASSWORD:-rootpassword}" "http://localhost:8529/_api/version" >/dev/null; then
              echo "ArangoDB answered after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::ArangoDB did not answer on localhost:8529 within 120 s."
          docker ps --filter "ancestor=arangodb" --format '{{.Names}} {{.Status}}'
          exit 1

      - name: Integration tests
        if: env.RUN_INTEGRATION == 'true'
        # Invoked through the Taskfile so the pipeline and a contributor run the
        # identical thing, including the `--max-skipped 0` floor (#1434).
        run: task test:backend:integration

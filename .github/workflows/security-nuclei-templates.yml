name: Security — Nuclei Template Validation

##
## Syntax gate for this project's own Nuclei templates (NFR-014 §3.2).
##
## Until this workflow existed, `nuclei -validate` ran NOWHERE in CI. The
## pre-commit hook that claimed to cover it opened with
## `command -v nuclei >/dev/null || exit 0` — "if the tool is absent, exit
## successfully" — and the reusable `static` job is a Python-only runner that
## never installs nuclei. So on the one required check of this repository the
## validation reported Passed for every template change while examining nothing,
## and a malformed template would have been silently ignored by every scan that
## consumed it.
##
## Deliberately its own workflow rather than a step inside `security-nuclei-pr`:
## a template syntax error is detectable in seconds, and burying it behind a
## 16-minute scan that first builds an entire stack contradicts the
## cheapest-broadest-first ordering. It also keeps this gate reporting on
## template changes that the scan's own path filter would not otherwise select.
##
## SINCE #1302 THIS IS ALSO THE PULL-REQUEST HOME OF THE TEMPLATE-PIN CHECK.
##
## `.github/renovate-pins.yaml` used to carry a pair — the community-templates
## tag and the commit that tag pointed at when it was reviewed — and its own
## comment claimed that "when Renovate bumps the tag, this assertion fails until
## the commit is updated in the same pull request". It could not. The assertion
## existed only in `security-nuclei-nightly.yml` and
## `security-nuclei-postmerge.yml`, both of which run AFTER the merge, and this
## workflow — the only nuclei lane with a `pull_request` trigger — did not even
## list the pins file in its filter. So #1280 changed exactly that one file, ran
## no nuclei check at all, merged green, and the nightly scan then failed to
## start for two nights (#1312).
##
## #1543 removed the pair rather than the drift: the digest is the pin now, the
## tag is its label, and every scan lane fetches the digest. The assertion this
## lane inherited is gone with the shape it asserted about — see the step below
## for why re-resolving a tag here could only produce a false alarm — and the
## step asks the question a digest pin does have instead: does this digest exist
## upstream? Still one network round trip, still no working copy, still seconds,
## and still on the pull request that edits the pin, which is the review the pin
## exists to force and which nothing performed before #1302.
##
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'tests/security/nuclei-templates/**'
      - 'scripts/security/nuclei_validate_hook.sh'
      - '.github/workflows/security-nuclei-templates.yml'
      # Both pins this workflow reads: the community-template digest checked
      # below (with its tag label), and the nuclei binary version every lane
      # installs.
      # Without this entry the pull request that changes a pin is the one pull
      # request that checks no pin (#1302).
      - '.github/renovate-pins.yaml'
  push:
    branches: [develop]
    paths:
      - 'tests/security/nuclei-templates/**'
  # A path filter alone cannot see the failure this gate actually had (#1177).
  #
  # `kamerplanter-jwt-leak.yaml` carried a negative lookahead from #122 onward.
  # Go's regexp is RE2 and has never supported one, so the template could never
  # run — not the header arm, not the body arm, not the headless localStorage
  # arm — and it is a *critical*-severity check. The gate reported success on it
  # on 2026-08-01 under nuclei v3.11.0, whose `-validate` did not compile
  # matchers, and would have kept reporting success indefinitely: the only way it
  # looks at a template is if somebody edits that directory, and nobody did for
  # two weeks. What broke the silence was v3.11.1 tightening `-validate` — an
  # upstream change, with no commit here to trigger on.
  #
  # So the trigger set needs a leg that does not depend on a repository change.
  # Daily, before the nightly scan lane, so a template the scanner will skip is
  # reported as broken rather than as absent findings.
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-nuclei-templates-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Nuclei templates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert the pinned community-template digest exists upstream
        # THE PULL-REQUEST HALF OF #1302, ASKING A DIFFERENT QUESTION SINCE #1543.
        #
        # It used to resolve the pinned TAG and assert it still pointed at a
        # commit recorded by hand in the same file. That assertion is gone from
        # every lane together with the pair it asserted about: the scan lanes now
        # fetch the digest directly, so an upstream tag move cannot change what
        # they read, and re-resolving a tag here could only raise a false alarm.
        # Do not reintroduce it in an "equivalent" form — anything that resolves a
        # tag at check time is asserting about a value no scan consumes.
        #
        # What replaces it is the failure a digest pin actually has: a digest that
        # does not exist upstream. One mistyped hex character fetches nothing, and
        # without this step the first thing to notice would be the nightly scan —
        # after the merge, at 00:00, the #1312 shape all over again.
        #
        # `https://api.github.com/repos/.../git/commits/<sha>` rather than a
        # fetch: one round trip, no working copy, no 250 MB of template tree, so
        # this lane stays in the seconds range it was split out to preserve. The
        # GIT DATABASE endpoint is deliberate — it takes a full 40-character
        # object id and nothing else, so a typo that happens to spell a branch or
        # tag name is a 404 here, whereas `/repos/.../commits/<ref>` would resolve
        # it and report success. The returned `sha` is compared against the pin as
        # well, so the check cannot pass on a response about some other object.
        #
        # WHAT THIS DOES NOT PROVE, said plainly because the retired assertion did
        # prove it. GitHub shares one object database across a fork network, so
        # this endpoint answers 200 for a commit that exists only in some fork and
        # never carried an upstream tag — the very property that makes
        # `git fetch origin "$COMMIT"` work in the scan lanes at all. The old
        # `ls-remote` assertion tied the pin to an upstream TAG; this check ties it
        # to an object being fetchable. That is a deliberate trade, not a strictly
        # better question: it answers what the scan lanes need (can this be
        # fetched?) and drops what they no longer consume (does a tag point here?).
        # A wrong-but-fetchable digest is caught by review of the Renovate pull
        # request, which is where the value comes from in the first place.
        #
        # This step reaches the network, so it can go red for a reason outside the
        # diff (the #1311 shape). Accepted here: this lane appears in NEITHER
        # required-check list in `.github/settings.yml` (the ruleset's and the
        # branch-protection block's — GitHub takes their union), so it reports
        # rather than blocks; and a pin check that refuses to ask upstream cannot
        # check anything at all. The lists are not copied here on purpose: an
        # earlier copy of one of them in this comment was already stale. A rate-limited or unreachable API is a
        # distinct message from a missing commit, so the two are not confused.
        env:
          UPSTREAM_API: https://api.github.com/repos/projectdiscovery/nuclei-templates/git/commits
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit=$(yq e '.nuclei_templates_commit' .github/renovate-pins.yaml)
          if [[ -z "$commit" || "$commit" == "null" ]]; then
            echo "::error::nuclei_templates_commit missing in .github/renovate-pins.yaml" >&2
            exit 1
          fi
          # Shape first, offline: a truncated or abbreviated digest would 404
          # below with a message pointing at upstream rather than at the pin.
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::nuclei_templates_commit is '$commit', which is not a 40-character lowercase commit digest." >&2
            exit 1
          fi
          # The label is echoed into an annotation below, and on a pull request
          # from a fork this file's content is attacker-controlled — so it is
          # shape-checked like the digest rather than passed through.
          version=$(yq e '.nuclei_templates_version' .github/renovate-pins.yaml)
          if [[ ! "$version" =~ ^v[0-9][0-9a-zA-Z.-]*$ ]]; then
            echo "::error::nuclei_templates_version is not a plain version label (expected vN…)." >&2
            exit 1
          fi

          # Into RUNNER_TEMP, not the checkout: this lane later counts the
          # YAML files under tests/security/nuclei-templates, and a stray
          # artefact in the working tree is how such a count starts lying.
          body="$RUNNER_TEMP/nuclei-templates-commit.json"
          # A stale body from an earlier step would be printed as if it were
          # this request's answer, so the file starts absent.
          rm -f "$body"
          # `|| echo 000` rather than letting `set -e` kill the step: a DNS or
          # TLS failure would otherwise end the run with curl's bare stderr and
          # no `::error::` annotation, which reads at triage like the pin being
          # wrong rather than the network being down.
          status=$(curl -sS --retry 2 --max-time 30 \
            -o "$body" -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$UPSTREAM_API/$commit" || echo "000")
          # `-w` writes one code PER ATTEMPT, so `--retry 2` on an unreachable
          # host yields `000000` and the `|| echo` above can append another.
          # Measured, not assumed — the first draft of this step reported
          # "HTTP 000000". Only the last attempt's verdict is the verdict.
          status="${status: -3}"

          if [[ "$status" == "404" ]]; then
            echo "::error::nuclei_templates_commit $commit does not exist in projectdiscovery/nuclei-templates ($version)." >&2
            echo "         Every nuclei scan lane fetches exactly this digest and would fail to start. Correct the pin." >&2
            exit 1
          fi
          if [[ "$status" != "200" ]]; then
            echo "::error::Could not check $commit upstream: the GitHub API answered HTTP $status (000 = the request never completed)." >&2
            if [[ -s "$body" ]]; then
              sed -n '1,20p' "$body" >&2
            fi
            exit 1
          fi

          actual=$(jq -r '.sha // empty' "$body")
          if [[ "$actual" != "$commit" ]]; then
            echo "::error::Upstream answered for '$actual' when asked about the pinned digest $commit." >&2
            exit 1
          fi
          echo "Templates pinned at $commit (labelled $version), present upstream."

      - name: Resolve the pinned Nuclei version
        id: nuclei_pin
        # Read once, here, so the validator and every scan lane install the same
        # binary. `nuclei-action` defaults to `version: latest`; leaving it there
        # is what let this gate change meaning between two runs with no commit
        # in between (#1177).
        run: |
          set -euo pipefail
          version=$(yq e '.nuclei_version' .github/renovate-pins.yaml)
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "::error::nuclei_version missing in .github/renovate-pins.yaml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Nuclei
        uses: projectdiscovery/nuclei-action@cc153d0541e1adf8a42bbe31c0a4fb2376147538 # v3.1.1
        with:
          install-only: true
          version: ${{ steps.nuclei_pin.outputs.version }}

      - name: Assert there are templates to validate
        # `nuclei -validate` over an empty or missing directory exits 0. Without
        # this, deleting the template set would turn this gate green rather than
        # red — the same vacuous-pass shape the workflow exists to remove.
        run: |
          set -euo pipefail
          count=$(find tests/security/nuclei-templates -name '*.yaml' -type f | wc -l)
          if [[ "$count" -eq 0 ]]; then
            echo "::error::No templates found under tests/security/nuclei-templates — refusing to report success." >&2
            exit 1
          fi
          echo "Validating $count template(s)."

      - name: Validate templates
        run: nuclei -validate -t tests/security/nuclei-templates/

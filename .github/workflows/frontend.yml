name: Frontend CI

on:
  push:
    branches: [develop]
    paths: ['src/frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    branches: [develop]
    paths: ['src/frontend/**', '.github/workflows/frontend.yml']

defaults:
  run:
    working-directory: src/frontend

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: src/frontend/dist/
          retention-days: 7

  coverage:
    name: Coverage
    uses: nolte/gh-plumbing/.github/workflows/reusable-nodejs-coverage.yaml@877fc02771e50d994343545fd92e187ac46984ce # v1.1.25
    with:
      node-version: '22'
      working-directory: src/frontend
      install-command: npm ci
      test-command: npm run test:coverage
      fail-under: 80

  # UI-NFR-003 R-013/R-014/R-015/R-028 — hard gate on the initial payload size.
  # Standalone job (does not touch the required `static` check) so a budget
  # breach fails visibly without deadlocking automerge.
  bundle-budget:
    name: Bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check bundle budget
        run: npm run bundle:check

      - name: Upload bundle analyzer report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-stats
          path: src/frontend/bundle-stats/stats.html
          retention-days: 7

  # UI-NFR-003 R-001..005 — Core Web Vitals measurement (mobile, 4G emulation).
  # Report-only job: assertions are warn-level in lighthouserc.json so the job
  # surfaces regressions without blocking merges (repo practice: only `static`
  # is required). Tighten to error-level once the baseline is stable.
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        run: npm run lhci

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report
          path: src/frontend/.lighthouseci/
          retention-days: 7

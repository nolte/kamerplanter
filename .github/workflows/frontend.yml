##
## Frontend CI.
##
## `lint-test-build (22)` is a REQUIRED check on `develop` (#828). Before that it
## gated nothing: a pull request whose entire vitest run was red could reach
## develop as long as the two required contexts passed, and #824 (jsdom 29 -> 30,
## 71 of 361 test files red) was stopped only because someone inspected the
## advisory checks by hand.
##
## The `pull_request` trigger therefore carries NO `paths:` filter, for the same
## reason `e2e-smoke.yml` does not: a required check whose workflow is skipped by
## path filtering never reports at all, and the pull request stays stuck on
## "Expected - waiting for status to be reported". A job skipped by a job-level
## `if:` reports a conclusion that branch protection accepts, which is why the
## selection lives in the `changes` job below. The `push` trigger keeps its paths
## filter: branch protection does not read it.
##
## `Coverage / Node.js Coverage` deliberately stays advisory. Measured over the
## same 30 develop runs it failed 3 times against `lint-test-build`'s 1, which
## matches its documented history as a wandering flake — and a flaky required
## check blocks every pull request in the repository, a worse failure mode than
## the gap being closed here.
##
name: Frontend CI

on:
  push:
    branches: [develop]
    paths: ['src/frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    branches: [develop]

defaults:
  run:
    working-directory: src/frontend

jobs:
  # Which pull requests actually need the frontend lane. Skipping here (rather
  # than at the trigger) keeps the required check reporting on every pull
  # request, including those that touch no frontend file.
  changes:
    name: Detect frontend changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            frontend:
              - 'src/frontend/**'
              - '.github/workflows/frontend.yml'

  lint-test-build:
    needs: changes
    # `always()` so a push to develop (where `changes` is skipped) still runs.
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: src/frontend/dist/
          retention-days: 7

  coverage:
    name: Coverage
    needs: changes
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true')
    uses: nolte/gh-plumbing/.github/workflows/reusable-nodejs-coverage.yaml@bab4f9d29740b56609bda43fe82d3a730e6b5899 # v1.1.26
    with:
      node-version: '22'
      working-directory: src/frontend
      install-command: npm ci
      test-command: npm run test:coverage
      fail-under: 80

  # UI-NFR-003 R-013/R-014/R-015/R-028 — hard gate on the initial payload size.
  # Standalone job (does not touch the required `static` check) so a budget
  # breach fails visibly without deadlocking automerge.
  bundle-budget:
    name: Bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check bundle budget
        run: npm run bundle:check

      - name: Upload bundle analyzer report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-stats
          path: src/frontend/bundle-stats/stats.html
          retention-days: 7

  # UI-NFR-003 R-001..005 — Core Web Vitals measurement (mobile, 4G emulation).
  # Report-only job: assertions are warn-level in lighthouserc.json so the job
  # surfaces regressions without blocking merges (repo practice: only `static`
  # is required). Tighten to error-level once the baseline is stable.
  lighthouse:
    name: Lighthouse CI
    needs: changes
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        run: npm run lhci

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report
          path: src/frontend/.lighthouseci/
          retention-days: 7

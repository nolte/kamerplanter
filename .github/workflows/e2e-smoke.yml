##
## E2E smoke gate — runs the existing Docker Compose smoke profile
## (scripts/run-e2e.sh --smoke) inside the runner.
##
## REQUIRED check on `develop` (ADR-011,
## project/requirements/e2e-smoke-merge-gate.md R1/R2/R4). This supersedes R2 of
## project/requirements/e2e-ci-selenium.md, which kept every E2E check advisory
## while their flake behaviour was unknown.
##
## The `pull_request` trigger deliberately carries NO `paths:` filter. A required
## check whose workflow is skipped by path filtering never reports and leaves the
## pull request stuck on "Expected — waiting for status to be reported"; GitHub
## documents that path filtering must not be used on a required workflow. A job
## skipped by a job-level `if:` reports Success instead, which is why the
## selection lives in the `changes` job below.
##
name: e2e-smoke

on:
  pull_request:
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "tests/e2e/**"
      - "docker-compose.e2e.yml"
      - "docker-compose.e2e.ci.yml"
      - "scripts/run-e2e.sh"
      - ".github/workflows/e2e-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  # dorny/test-reporter publishes the parsed JUnit XML as a check run.
  # No `pull-requests: write` is needed — the action does not post PR comments.
  checks: write

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deny-by-default selection: the suite is skipped only when EVERY changed file
  # is provably unable to affect the deployed application. The predicate is an
  # allowlist of inert paths, never a diff-size or complexity score — absolute
  # churn is not a usable risk signal (Nagappan & Ball, ICSE 2005), and the
  # repository has too little CI history to calibrate a learned selector.
  #
  # A missing allowlist entry only costs one unnecessary run (fail-safe); a
  # runtime path wrongly added to it silently disables the gate (fail-open).
  # Treat this list as security-relevant and re-check it whenever a new
  # top-level directory appears.
  #
  # Two filters rather than one: paths-filter evaluates a pattern set as
  # "matches at least one positive AND no negative", so a file excluded by
  # `!.github/**` cannot be re-included by a later positive pattern. The E2E
  # infrastructure workflows are therefore matched by their own filter.
  changes:
    name: Detect runtime-relevant changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.filter.outputs.runtime }}
      e2e_infra: ${{ steps.filter.outputs.e2e_infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            runtime:
              - '**'
              - '!docs/**'
              - '!spec/**'
              - '!project/**'
              - '!.audits/**'
              - '!.resume/**'
              - '!.claude/**'
              - '!styles/**'
              - '!.github/**'
              - '!**/*.md'
              - '!mkdocs.yml'
              - '!.vale.ini'
              - '!LICENSE'
              - '!.gitignore'
              - '!CODEOWNERS'
              - '!Taskfile.yaml'
              - '!.pre-commit-config.yaml'
            e2e_infra:
              - '.github/workflows/e2e-*.yml'

  smoke:
    name: E2E smoke (compose, light)
    needs: changes
    # `always()` keeps the gate fail-safe: if the `changes` job itself fails, the
    # suite runs rather than waving the pull request through. On non-pull_request
    # events `changes` is skipped and the suite always runs.
    if: >-
      always()
      && (github.event_name != 'pull_request'
          || needs.changes.outputs.runtime == 'true'
          || needs.changes.outputs.e2e_infra == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Layer caching: compose delegates builds to buildx bake (COMPOSE_BAKE)
      # on a container builder, so the gha cache backend declared in the
      # docker-compose.e2e.ci.yml overlay can import/export layers.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Expose Actions runtime for the gha cache backend
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Run E2E smoke suite
        env:
          COMPOSE_BAKE: "true"
          E2E_COMPOSE_OVERLAYS: docker-compose.e2e.ci.yml
        run: ./scripts/run-e2e.sh --smoke

      # Render the JUnit XML produced by the run into a check run + the job
      # summary, so concrete per-test failure messages (assertion text + a
      # short traceback) are visible without digging through raw logs.
      # `continue-on-error` keeps the (non-required) smoke job from turning red
      # solely because a fork PR's read-only GITHUB_TOKEN cannot create a check
      # run; the independent "Job summary" step still surfaces the protocol.
      - name: Render E2E test report
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: E2E smoke report
          path: test-reports/e2e/**/junit-*.xml
          reporter: java-junit
          list-tests: failed
          list-suites: failed
          fail-on-error: false
          fail-on-empty: false
          use-actions-summary: true

      - name: Job summary
        if: always()
        run: |
          {
            echo "## E2E smoke (light)"
            PROTOCOL=$(find test-reports/e2e -name protokoll.md | head -1)
            if [ -n "$PROTOCOL" ]; then
              # Surface the protocol's result overview (## Zusammenfassung) and,
              # if present, the failed-tests section headers.
              awk '/^## Zusammenfassung/{f=1; next} f && /^## /{exit} f{print}' "$PROTOCOL"
              awk '/^## Fehlgeschlagene Tests/{f=1} f && /^## Testergebnisse/{exit} f && /^###? /{print}' "$PROTOCOL"
              echo ""
              echo "Full protocol, screenshots and container logs: see the run's \`e2e-smoke-reports\` artifact."
            else
              echo "No test protocol was generated (run failed before pytest)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-smoke-reports
          path: test-reports/e2e/
          retention-days: 14
          if-no-files-found: warn

##
## E2E smoke gate — runs the existing Docker Compose smoke profile
## (scripts/run-e2e.sh --smoke) inside the runner.
##
## ADVISORY check on `develop` as of 2026-07-29. It was required from ADR-011
## until then; the context was dropped from `.github/settings.yml` over merge
## latency (~11 min per run, multiplied by `strict: true`) via the rollback path
## in project/requirements/e2e-smoke-merge-gate.md R7. See the 2026-07-29
## addendum in docs/de/adr/011-e2e-smoke-merge-gate.md. The job still runs and
## still reports on every pull request — it just no longer blocks; the nightly
## 5-profile matrix in `e2e-nightly.yml` carries the coverage.
##
## The `pull_request` trigger still carries NO `paths:` filter, and the run/skip
## selection stays in the `changes` job below (R1/R2/R4). That construction is
## kept deliberately: a required check whose workflow is skipped by path
## filtering never reports and leaves the pull request stuck on "Expected —
## waiting for status to be reported", so GitHub documents that path filtering
## must not be used on a required workflow. A job skipped by a job-level `if:`
## reports Success instead. Keeping it means re-arming the gate is a one-line
## change in `.github/settings.yml` rather than a workflow rebuild.
##
name: e2e-smoke

on:
  pull_request:
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "tests/e2e/**"
      - "docker-compose.e2e.yml"
      - "docker-compose.e2e.ci.yml"
      - "scripts/run-e2e.sh"
      - ".github/workflows/e2e-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  # dorny/test-reporter publishes the parsed JUnit XML as a check run.
  # No `pull-requests: write` is needed — the action does not post PR comments.
  checks: write

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deny-by-default selection: the suite is skipped only when EVERY changed file
  # is provably unable to affect the deployed application. The predicate is an
  # allowlist of inert paths, never a diff-size or complexity score — absolute
  # churn is not a usable risk signal (Nagappan & Ball, ICSE 2005), and the
  # repository has too little CI history to calibrate a learned selector.
  #
  # A missing allowlist entry only costs one unnecessary run (fail-safe); a
  # runtime path wrongly added to it silently disables the gate (fail-open).
  # Treat this list as security-relevant and re-check it whenever a new
  # top-level directory appears.
  #
  # Two filters rather than one: under `predicate-quantifier: every` a file must
  # satisfy ALL patterns of a filter, so a file excluded by `!.github/**` cannot
  # be re-included by adding a positive pattern to the same filter. The E2E
  # infrastructure workflows are therefore matched by their own filter, and the
  # `smoke` job below ORs the two results.
  changes:
    name: Detect runtime-relevant changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.filter.outputs.runtime }}
      e2e_infra: ${{ steps.filter.outputs.e2e_infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # `every` is load-bearing. The default is `some`, which ORs a filter's
          # patterns together — under it the leading `'**'` matches every file
          # and the `!` entries subtract nothing, so `runtime` is permanently
          # true and the suite runs on every pull request. Learned the hard way:
          # PR #795 changed only .github/settings.yml and still ran the suite.
          # With `every`, a file must satisfy ALL patterns of a filter, which is
          # what turns the `!` entries into actual exclusions.
          predicate-quantifier: 'every'
          filters: |
            runtime:
              - '**'
              - '!docs/**'
              - '!spec/**'
              - '!project/**'
              - '!.audits/**'
              - '!.resume/**'
              - '!.claude/**'
              - '!styles/**'
              - '!.github/**'
              - '!**/*.md'
              - '!mkdocs.yml'
              - '!.vale.ini'
              - '!LICENSE'
              - '!.gitignore'
              - '!CODEOWNERS'
              - '!Taskfile.yaml'
              - '!.taskfiles/**'
              - '!.pre-commit-config.yaml'
            e2e_infra:
              - '.github/workflows/e2e-*.yml'

  smoke:
    name: E2E smoke (compose, light)
    needs: changes
    # Fail-safe by construction: the suite is skipped ONLY when `changes`
    # succeeded AND reported the diff as inert. Anything else runs it.
    #
    # `needs.changes.result` is load-bearing and must not be dropped. `always()`
    # only makes this expression evaluate when the dependency did not succeed —
    # it does not make it true. Without the `result` clause a FAILED `changes`
    # job would leave both outputs as empty strings, every comparison would be
    # false, the job would be skipped, and a skipped job reports the required
    # check as Success: the gate would go green without the suite ever running.
    # `result` covers failure, cancelled and skipped, which also makes a separate
    # event-name clause unnecessary — on non-pull_request events `changes` is
    # skipped and the suite runs.
    if: >-
      always()
      && (needs.changes.result != 'success'
          || needs.changes.outputs.runtime == 'true'
          || needs.changes.outputs.e2e_infra == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Layer caching: compose delegates builds to buildx bake (COMPOSE_BAKE)
      # on a container builder, so the gha cache backend declared in the
      # docker-compose.e2e.ci.yml overlay can import/export layers.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Expose Actions runtime for the gha cache backend
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Run E2E smoke suite
        env:
          COMPOSE_BAKE: "true"
          E2E_COMPOSE_OVERLAYS: docker-compose.e2e.ci.yml
        run: ./scripts/run-e2e.sh --smoke

      # Render the JUnit XML produced by the run into a check run + the job
      # summary, so concrete per-test failure messages (assertion text + a
      # short traceback) are visible without digging through raw logs.
      # `continue-on-error` keeps this required job from turning red solely
      # because a fork PR's read-only GITHUB_TOKEN cannot create a check run.
      # The `id` is load-bearing: the "Job summary" step below reads
      # `steps.report.outcome` to decide whether the results are already
      # rendered, or whether it has to surface them from the protocol itself.
      - name: Render E2E test report
        id: report
        if: always()
        # gate-integrity-ok: a reporter, not a measurement — the reason is the
        # comment block above. The suite's verdict is the "Run E2E smoke suite"
        # step, and the "Job summary" step reads `steps.report.outcome`, so a
        # failure here is observed rather than discarded.
        continue-on-error: true
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: E2E smoke report
          path: test-reports/e2e/**/junit-*.xml
          reporter: java-junit
          list-tests: failed
          list-suites: failed
          fail-on-error: false
          fail-on-empty: false
          use-actions-summary: true

      # When the step above rendered the report, it already carries the totals
      # and the concrete per-test failure messages — restating them from
      # `protokoll.md` printed every result twice. The protocol excerpt is
      # therefore only produced when the rendering did NOT happen, which is
      # exactly the fork-PR case: a read-only GITHUB_TOKEN cannot create the
      # check run, and this step stays the only place the results show up.
      - name: Job summary
        if: always()
        env:
          REPORT_RENDERED: ${{ steps.report.outcome == 'success' }}
        run: |
          # Two independent signals decide below, and both must hold.
          # `steps.report.outcome` is only a proxy: it says the action did not
          # error, not that a table was actually written. Whether the summary
          # already has content observes that directly — the file starts empty
          # and no earlier step writes to it. Sampled here, BEFORE the block is
          # redirected into that very file (reading and appending in one
          # pipeline is what shellcheck flags as SC2094).
          SUMMARY_PREFILLED=no
          if [ -s "$GITHUB_STEP_SUMMARY" ]; then SUMMARY_PREFILLED=yes; fi
          {
            PROTOCOL=$(find test-reports/e2e -name protokoll.md -print -quit 2>/dev/null)
            JUNIT=$(find test-reports/e2e -name 'junit-*.xml' -print -quit 2>/dev/null)
            # Whenever either signal is missing, the excerpt below is produced,
            # so a fork PR loses the artifact pointer at worst, never the
            # results themselves.
            if [ "$REPORT_RENDERED" = "true" ] && [ "$SUMMARY_PREFILLED" = "yes" ] && [ -n "$JUNIT" ]; then
              echo "**E2E smoke (light)** — full protocol, screenshots and container logs:"
              echo "see the run's \`e2e-smoke-reports\` artifact."
            elif [ -n "$PROTOCOL" ]; then
              # No rendered report (typically a fork PR): surface the protocol's
              # result overview (## Zusammenfassung) and the failed-tests headers.
              echo "## E2E smoke (light)"
              awk '/^## Zusammenfassung/{f=1; next} f && /^## /{exit} f{print}' "$PROTOCOL"
              awk '/^## Fehlgeschlagene Tests/{f=1} f && /^## Testergebnisse/{exit} f && /^###? /{print}' "$PROTOCOL"
              echo ""
              echo "Full protocol, screenshots and container logs: see the run's \`e2e-smoke-reports\` artifact."
            else
              echo "## E2E smoke (light)"
              echo ""
              echo "No test protocol was generated (the run failed before pytest)."
              echo "See the job log and the \`e2e-smoke-reports\` artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-smoke-reports
          path: test-reports/e2e/
          retention-days: 14
          if-no-files-found: warn

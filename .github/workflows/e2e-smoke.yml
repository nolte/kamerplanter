##
## E2E smoke gate — runs the existing Docker Compose smoke profile
## (scripts/run-e2e.sh --smoke) inside the runner.
##
## ADVISORY check on `develop` as of 2026-07-29. It was required from ADR-011
## until then; the context was dropped from `.github/settings.yml` over merge
## latency (~11 min per run, multiplied by `strict: true`) via the rollback path
## in project/requirements/e2e-smoke-merge-gate.md R7. See the 2026-07-29
## addendum in docs/de/adr/011-e2e-smoke-merge-gate.md. The job still runs and
## still reports on every pull request — it just no longer blocks; the nightly
## 5-profile matrix in `e2e-nightly.yml` carries the coverage.
##
## The `pull_request` trigger still carries NO `paths:` filter, and the run/skip
## selection stays in the `changes` job below (R1/R2/R4). That construction is
## kept deliberately: a required check whose workflow is skipped by path
## filtering never reports and leaves the pull request stuck on "Expected —
## waiting for status to be reported", so GitHub documents that path filtering
## must not be used on a required workflow. A job skipped by a job-level `if:`
## reports Success instead. Keeping it means re-arming the gate is a one-line
## change in `.github/settings.yml` rather than a workflow rebuild.
##
name: e2e-smoke

on:
  pull_request:
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "tests/e2e/**"
      - "docker-compose.e2e.yml"
      - "docker-compose.e2e.ci.yml"
      - "scripts/run-e2e.sh"
      - "scripts/e2e_fernet_key.py"
      - ".github/workflows/e2e-smoke.yml"
  workflow_dispatch:

# WORKFLOW-LEVEL FLOOR IS READ-ONLY, AND THE WRITE IS DECLARED WHERE IT IS
# USED (#1614). `checks: write` used to sit here, which handed it to BOTH jobs
# — including `changes`, which only runs a paths filter and writes nothing.
# `changes` and `smoke` check out pull-request code, so an inherited write
# scope is a write scope sharing a runner with untrusted code for no reason
# anyone wrote down. Since #1644 the one write this workflow needs sits on the
# `report` job, which checks nothing out.
# `scripts/check_untrusted_checkout_permissions.py` enumerates the class.
permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deny-by-default selection: the suite is skipped only when EVERY changed file
  # is provably unable to affect the deployed application. The predicate is an
  # allowlist of inert paths, never a diff-size or complexity score — absolute
  # churn is not a usable risk signal (Nagappan & Ball, ICSE 2005), and the
  # repository has too little CI history to calibrate a learned selector.
  #
  # A missing allowlist entry only costs one unnecessary run (fail-safe); a
  # runtime path wrongly added to it silently disables the gate (fail-open).
  # Treat this list as security-relevant and re-check it whenever a new
  # top-level directory appears.
  #
  # Two filters rather than one: under `predicate-quantifier: every` a file must
  # satisfy ALL patterns of a filter, so a file excluded by `!.github/**` cannot
  # be re-included by adding a positive pattern to the same filter. The E2E
  # infrastructure workflows are therefore matched by their own filter, and the
  # `smoke` job below ORs the two results.
  changes:
    name: Detect runtime-relevant changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Reads a diff, writes nothing.
    permissions:
      contents: read
    outputs:
      runtime: ${{ steps.filter.outputs.runtime }}
      e2e_infra: ${{ steps.filter.outputs.e2e_infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # `every` is load-bearing. The default is `some`, which ORs a filter's
          # patterns together — under it the leading `'**'` matches every file
          # and the `!` entries subtract nothing, so `runtime` is permanently
          # true and the suite runs on every pull request. Learned the hard way:
          # PR #795 changed only .github/settings.yml and still ran the suite.
          # With `every`, a file must satisfy ALL patterns of a filter, which is
          # what turns the `!` entries into actual exclusions.
          predicate-quantifier: 'every'
          filters: |
            runtime:
              - '**'
              - '!docs/**'
              - '!spec/**'
              - '!project/**'
              - '!.audits/**'
              - '!.resume/**'
              - '!.claude/**'
              - '!styles/**'
              - '!.github/**'
              - '!**/*.md'
              - '!mkdocs.yml'
              - '!.vale.ini'
              - '!LICENSE'
              - '!.gitignore'
              - '!CODEOWNERS'
              - '!Taskfile.yaml'
              - '!.taskfiles/**'
              - '!.pre-commit-config.yaml'
              # The Kubernetes deployment surface, excluded for a STRUCTURAL
              # reason rather than a judgement call (#1577): this suite brings up
              # a COMPOSE stack — `scripts/run-e2e.sh` runs
              # `docker compose -f docker-compose.e2e.yml` plus the
              # `E2E_COMPOSE_OVERLAYS` overlay and nothing else. It never renders
              # or installs the chart, so a change under `helm/**` cannot alter
              # what this job measures. Measured 2026-09-20 on this tree:
              # `git grep -in 'helm\|skaffold' -- docker-compose.e2e*.yml
              # scripts/run-e2e.sh` returns ONE hit, a prose comment; the compose
              # build contexts are `src/backend`, `src/frontend` and `tests/e2e`.
              # The chart's `values*.yaml` all live under `helm/` (measured: no
              # `values*.y*ml` is tracked outside it), so they need no entry of
              # their own. `skaffold.yaml` is the same argument — it drives the
              # kind/Helm dev loop; the two Dockerfiles mention it only in prose.
              #
              # `kind-config.yaml` is equally inert and deliberately NOT listed:
              # it carries no pinned image and changed twice this year, so it
              # produces no traffic to save, and every entry in a fail-open deny
              # list is a liability. `helm/**` by contrast saw 54 commits since
              # 2026-06-01, most of them Renovate chart bumps (#1547).
              - '!helm/**'
              - '!skaffold.yaml'
            e2e_infra:
              - '.github/workflows/e2e-*.yml'

  smoke:
    name: E2E smoke (compose, light)
    needs: changes
    # Fail-safe by construction: the suite is skipped ONLY when `changes`
    # succeeded AND reported the diff as inert. Anything else runs it.
    #
    # `needs.changes.result` is load-bearing and must not be dropped. `always()`
    # only makes this expression evaluate when the dependency did not succeed —
    # it does not make it true. Without the `result` clause a FAILED `changes`
    # job would leave both outputs as empty strings, every comparison would be
    # false, the job would be skipped, and a skipped job reports the required
    # check as Success: the gate would go green without the suite ever running.
    # `result` covers failure, cancelled and skipped, which also makes a separate
    # event-name clause unnecessary — on non-pull_request events `changes` is
    # skipped and the suite runs.
    if: >-
      always()
      && (needs.changes.result != 'success'
          || needs.changes.outputs.runtime == 'true'
          || needs.changes.outputs.e2e_infra == 'true')
    runs-on: ubuntu-latest
    # READ-ONLY, because this job checks out pull-request code (#1644). The
    # check run that renders the JUnit XML needs `checks: write`; that write
    # lives in the `report` job below, which never has pull-request code on its
    # runner — the reports reach it as the `e2e-smoke-reports` artifact.
    # `scripts/check_untrusted_checkout_permissions.py` enumerates the class.
    permissions:
      contents: read
    timeout-minutes: 30
    # The `report` job is gated on this output: an empty id means no artifact
    # was uploaded (the run failed before pytest wrote anything, or the upload
    # itself failed), so there is nothing to publish and the summary step below
    # carries the result on its own.
    outputs:
      report_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Layer caching: compose delegates builds to buildx bake (COMPOSE_BAKE)
      # on a container builder, so the gha cache backend declared in the
      # docker-compose.e2e.ci.yml overlay can import/export layers.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Expose Actions runtime for the gha cache backend
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Run E2E smoke suite
        env:
          COMPOSE_BAKE: "true"
          E2E_COMPOSE_OVERLAYS: docker-compose.e2e.ci.yml
        run: ./scripts/run-e2e.sh --smoke

      # The `id` is load-bearing: its `artifact-id` output is the job output
      # the `report` job is gated on, and the summary step below reads it.
      - name: Upload E2E reports
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-smoke-reports
          path: test-reports/e2e/
          retention-days: 14
          if-no-files-found: warn

      # This job no longer renders the report, so it must not claim to. With an
      # artifact, the `report` job runs and owns the rendered results; this
      # summary only points there. Without one, the `report` job is skipped and
      # this step is the only place the results show up.
      - name: Job summary
        if: always()
        env:
          REPORT_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          {
            PROTOCOL=$(find test-reports/e2e -name protokoll.md -print -quit 2>/dev/null)
            if [ -n "$REPORT_ARTIFACT_ID" ]; then
              echo "**E2E smoke (light)** — the results are published by this run's"
              echo "\`Publish E2E smoke report\` job; full protocol, screenshots and"
              echo "container logs are in the \`e2e-smoke-reports\` artifact."
            elif [ -n "$PROTOCOL" ]; then
              # A protocol exists but no artifact carries it (the upload
              # failed): surface the result overview here.
              echo "## E2E smoke (light)"
              awk '/^## Zusammenfassung/{f=1; next} f && /^## /{exit} f{print}' "$PROTOCOL"
              awk '/^## Fehlgeschlagene Tests/{f=1} f && /^## Testergebnisse/{exit} f && /^###? /{print}' "$PROTOCOL"
              echo ""
              echo "The report artifact could not be uploaded; see the job log."
            else
              echo "## E2E smoke (light)"
              echo ""
              echo "No test protocol was generated (the run failed before pytest)."
              echo "See the job log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishes the smoke results as a check run. It holds `checks: write` and
  # therefore NEVER checks out pull-request code (#1644): the JUnit XML reaches
  # it as the artifact `smoke` uploaded, read by the reporter's `artifact:`
  # input. The XML is data the pull request's code produced — it is parsed and
  # rendered, never executed.
  #
  # `always()` makes it run when the suite FAILED, which is when the report
  # matters most; the artifact-id clause skips it when there is nothing to
  # publish (and when `smoke` itself was skipped as inert), instead of letting
  # it fail on a missing download.
  #
  # Fork pull requests: their GITHUB_TOKEN is read-only whatever this block
  # declares, so the check run cannot be created. The reporter step is
  # `continue-on-error` and the summary step falls back to the protocol
  # excerpt — the same behaviour the combined job had before the split.
  #
  # gate-integrity-ok: a publisher, not a verdict — the suite's result is the
  # `smoke` check itself, which this job neither replaces nor masks; the
  # output clause only skips publishing when no artifact exists.
  report:
    name: Publish E2E smoke report
    needs: smoke
    if: always() && needs.smoke.outputs.report_artifact_id != ''
    runs-on: ubuntu-latest
    # `actions: read` lists and downloads this run's artifacts;
    # `contents: read` lets the reporter list the commit's tracked files for
    # annotations; `checks: write` creates the check run. No
    # `pull-requests: write` — the action posts no comments.
    permissions:
      actions: read
      contents: read
      checks: write
    timeout-minutes: 10
    steps:
      # Only for the protocol-excerpt fallback in the summary step; the
      # reporter fetches the artifact itself.
      - name: Download E2E reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.smoke.outputs.report_artifact_id }}
          path: e2e-smoke-reports

      # Render the JUnit XML into a check run + the job summary, so concrete
      # per-test failure messages (assertion text + a short traceback) are
      # visible without digging through raw logs. `path` is matched against
      # the entries INSIDE the artifact, whose root is `test-reports/e2e/`.
      # The `id` is load-bearing: the "Job summary" step below reads
      # `steps.report.outcome` to decide whether the results are already
      # rendered, or whether it has to surface them from the protocol itself.
      - name: Render E2E test report
        id: report
        # gate-integrity-ok: a reporter, not a measurement — the suite's
        # verdict is the `smoke` job, and the "Job summary" step reads
        # `steps.report.outcome`, so a failure here (typically a fork PR's
        # read-only token) is observed rather than discarded.
        continue-on-error: true
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          artifact: e2e-smoke-reports
          name: E2E smoke report
          path: "**/junit-*.xml"
          reporter: java-junit
          list-tests: failed
          list-suites: failed
          fail-on-error: false
          fail-on-empty: false
          use-actions-summary: true

      # When the step above rendered the report, it already carries the totals
      # and the concrete per-test failure messages — restating them from
      # `protokoll.md` printed every result twice. The protocol excerpt is
      # therefore only produced when the rendering did NOT happen, which is
      # exactly the fork-PR case: a read-only GITHUB_TOKEN cannot create the
      # check run, and this step stays the only place the results show up.
      - name: Job summary
        if: always()
        env:
          REPORT_RENDERED: ${{ steps.report.outcome == 'success' }}
        run: |
          # Two independent signals decide below, and both must hold.
          # `steps.report.outcome` is only a proxy: it says the action did not
          # error, not that a table was actually written. Whether the summary
          # already has content observes that directly — the file starts empty
          # and no earlier step writes to it. Sampled here, BEFORE the block is
          # redirected into that very file (reading and appending in one
          # pipeline is what shellcheck flags as SC2094).
          SUMMARY_PREFILLED=no
          if [ -s "$GITHUB_STEP_SUMMARY" ]; then SUMMARY_PREFILLED=yes; fi
          {
            PROTOCOL=$(find e2e-smoke-reports -name protokoll.md -print -quit 2>/dev/null)
            JUNIT=$(find e2e-smoke-reports -name 'junit-*.xml' -print -quit 2>/dev/null)
            # Whenever either signal is missing, the excerpt below is produced,
            # so a fork PR loses the artifact pointer at worst, never the
            # results themselves.
            if [ "$REPORT_RENDERED" = "true" ] && [ "$SUMMARY_PREFILLED" = "yes" ] && [ -n "$JUNIT" ]; then
              echo "**E2E smoke (light)** — full protocol, screenshots and container logs:"
              echo "see the run's \`e2e-smoke-reports\` artifact."
            elif [ -n "$PROTOCOL" ]; then
              # No rendered report (typically a fork PR): surface the protocol's
              # result overview (## Zusammenfassung) and the failed-tests headers.
              echo "## E2E smoke (light)"
              awk '/^## Zusammenfassung/{f=1; next} f && /^## /{exit} f{print}' "$PROTOCOL"
              awk '/^## Fehlgeschlagene Tests/{f=1} f && /^## Testergebnisse/{exit} f && /^###? /{print}' "$PROTOCOL"
              echo ""
              echo "Full protocol, screenshots and container logs: see the run's \`e2e-smoke-reports\` artifact."
            else
              echo "## E2E smoke (light)"
              echo ""
              echo "The artifact carries no test protocol (the run failed before pytest)."
              echo "See the \`E2E smoke (compose, light)\` job log and the \`e2e-smoke-reports\` artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

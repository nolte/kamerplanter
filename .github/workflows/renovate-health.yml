name: Renovate Health

# Issue #1383, point 1 — nothing in this repository read Renovate's own output.
#
# THE INCIDENT. From 2026-08-02 to 2026-09-10 Renovate's `pip-compile` manager
# extracted NOTHING here: it rejects lock-header options outside its allowlist,
# and both locks needed `--no-strip-extras` and `--no-build-isolation` (#906,
# #1303). For six weeks the backend locks aged untouched while every lane stayed
# green, because a manager that extracts nothing opens no pull requests and
# breaks no build — it is indistinguishable from "nothing to update". The only
# signal was a `⚠️ WARN: pip-compile error` line in the Dependency Dashboard
# issue (#12), which nobody reads on a schedule. In the same window the `poetry`
# manager quietly picked up the two side-service pyproject.toml files and opened
# source-only pull requests that left their locks stale (#1371).
#
# Nothing would notice the identical thing happening to `pep621` tomorrow. This
# lane is that notice.
#
# WHY SCHEDULED AND NOT A PULL-REQUEST GATE, for the same reason release-lag.yml
# is: manager drift is a fact that changes with NO COMMIT here. Renovate re-scans
# on its own cadence, and a manager can start failing because Renovate shipped a
# new version, or because a transitive config preset moved — neither is a push to
# this repository, so a PR gate could never observe it. What a PR gate CAN see —
# "does renovate.json5 still parse and produce the expected inventory" — is
# `task renovate:dry-run`, which is the other half of this issue.
#
# FAIL-LOUD CONTRACT (NFR-018 §2): an unreachable API, an empty issue body or an
# unparseable dashboard makes THIS RUN RED and opens NO issue — an undetermined
# check is not a clean check, and a transient blip must not spam the tracker. A
# determined result (drift or none) writes renovate-health-report.json and exits
# 0; the alert then lives in a single deduplicated issue, not in the run status.
# That deduplication is a deliberate operator decision (2026-09-16), not an
# accident of shape: a red scheduled run is invisible after a week of red
# scheduled runs, while an issue carries the history and can be answered.
#
# SECOND JOB, issue #3060 — `stale-image-upstreams`. The same blind spot one
# level down: Renovate asks "is there a newer tag in THIS repository?" and
# cannot ask "does this repository still receive tags?". `nginxinc/
# nginx-unprivileged` stopped receiving pushes on 2026-10-19 when upstream moved
# to `nginx/nginx-unprivileged`; the pin looked up to date for a month and ten
# security fixes were never offered (#3040, repaired by #3061). The job lives
# HERE rather than in a workflow of its own because it is the same question
# ("is the green Renovate picture true?"), on the same trigger (a fact that
# changes with no commit in this repository), with the same contract. It is a
# separate JOB because it shares nothing with the dashboard read: neither may
# take the other down, and its alert is a separate issue with its own label.

on:
  schedule:
    # 09:20 UTC daily — twenty minutes after release-lag.yml, so the two alerting
    # jobs do not contend for the same API window, and clear of the 00:00 Nuclei
    # nightly and the 01:00/01:17/01:30 security+E2E block. Daily is the right
    # cadence: Renovate itself runs hourly at most, and the drift this observes
    # (a manager falling silent) persists until someone fixes it — sampling more
    # often only adds noise.
    - cron: "20 9 * * *"
  workflow_dispatch:
    inputs:
      dashboard_issue:
        description: "Dependency Dashboard issue number to read (default 12)."
        required: false
        type: string

# Workflow-level default is READ-ONLY, and the write scope is granted per job —
# the house pattern release-lag.yml follows. It costs nothing today, when there
# is one job, and is the difference between "the second job someone adds here
# inherits issue-write" and "it does not".
permissions:
  contents: read

# An alerting job: serialise a scheduled run against a manual one so two runs
# cannot both act on the alert issue, and never cancel — a cancelled run could
# leave the issue half-updated. Fixed group (not github.ref) because this only
# ever runs on the default branch.
concurrency:
  group: renovate-health
  cancel-in-progress: false

jobs:
  check-dashboard:
    name: Read the Dependency Dashboard and compare the manager inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `issues: write` opens and updates the alert issue; it is granted HERE and
    # not at workflow level. `contents: read` is enough for the checkout: unlike
    # release-lag.yml this job reads no draft releases, so it does NOT need
    # `contents: write`.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          allow-prereleases: true

      - name: Fetch the Dependency Dashboard body
        id: dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DASHBOARD_ISSUE: ${{ inputs.dashboard_issue || '12' }}
          # Via env, never interpolated into the shell body — a `${{ }}` inside a
          # `run:` is a template substitution, not a shell variable, and is the
          # standard expression-injection surface.
          REPOSITORY: ${{ github.repository }}
        # Written to a FILE, not to $GITHUB_OUTPUT: the body is ~900 lines of
        # Markdown containing backticks, `<details>` tags and Renovate's own
        # `<!-- -->` control comments. Round-tripping that through a step output
        # invites a quoting accident that silently truncates the very section
        # being measured. `--jq .body` fails loudly on a missing issue.
        run: |
          # `dashboard_issue` is a free-text workflow_dispatch input. It reaches
          # `gh api` as part of a URL path, so it is validated to be a bare
          # decimal issue number BEFORE it is used: anything else is a typo or a
          # path-traversal attempt, and either way the run must say so rather
          # than silently query some other endpoint and then report on it.
          if ! [[ "$DASHBOARD_ISSUE" =~ ^[0-9]+$ ]]; then
            echo "::error::dashboard_issue must be a bare issue number, got '${DASHBOARD_ISSUE}'"
            exit 1
          fi
          gh api "repos/${REPOSITORY}/issues/${DASHBOARD_ISSUE}" --jq .body > dashboard-body.md
          echo "bytes=$(wc -c < dashboard-body.md)" >> "$GITHUB_OUTPUT"

      - name: Compare the manager inventory against the expectation
        # Hard errors exit non-zero here => the run goes red and the issue step
        # below no-ops (no report file). A determined result writes the report
        # and exits 0, whether or not it found drift.
        #
        # `--body-file`, not an environment variable. The body is ~900 lines and
        # grows with the repository; handing it over as a single argv/env string
        # puts it under `MAX_ARG_STRLEN` (128 KiB on Linux for one argument, and
        # the whole environment shares `ARG_MAX`), so the lane would start
        # failing with E2BIG on a day nothing in this repository changed. Reading
        # the file has no such ceiling. The env var stays supported in the script
        # as a fallback for ad-hoc local runs.
        #
        # `$GITHUB_WORKSPACE` is a default variable on every runner; the script
        # reads it for the checkout root and it is deliberately NOT re-declared
        # here — a re-declaration is a second place that can drift from the one
        # that matters.
        run: |
          python3 scripts/ci/check_renovate_dashboard.py \
            --body-file dashboard-body.md renovate-health-report.json

      - name: Open, update or close the Renovate-health issue
        # Runs only when the check DETERMINED a result (report exists). On a hard
        # error the report is absent, this step is skipped, and the red run is
        # the signal — deliberately NOT an issue.
        # `!cancelled()`, not `always()`: a cancelled run must not act on the
        # alert issue at all (the concurrency block above says the same thing
        # about half-updated issues). `always()` would keep this step running
        # through a cancellation.
        if: ${{ !cancelled() && hashFiles('renovate-health-report.json') != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Read via process.env, never interpolated into the script body.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DASHBOARD_ISSUE: ${{ inputs.dashboard_issue || '12' }}
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('renovate-health-report.json', 'utf8'));
            // The label need not pre-exist: GitHub creates an unknown label on
            // `issues.create`, which is how `release-lag` came into being. The
            // listForRepo lookup BELOW simply returns [] until then, so the first
            // alert opens an issue and every later one updates it.
            const LABEL = 'renovate-health';
            const TITLE = 'Renovate manager inventory drifted or the dashboard reports a problem (#1383)';
            const runUrl = process.env.RUN_URL;
            const dashboardIssue = process.env.DASHBOARD_ISSUE;

            // Dedup anchor: the single open issue carrying our label. A good
            // alerting job updates one issue; it does not open a new one daily.
            const open = (await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: LABEL,
            })).data.filter(i => !i.pull_request);
            const existing = open[0];

            if (!report.alert) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `Resolved: the dashboard reports no repository problems and \`pep621\` extracts from all ${report.expected_pep621_files.length} locked trees again, as of ${runUrl}. Closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, state: 'closed',
                });
                core.notice(`Renovate health restored — closed alert issue #${existing.number}.`);
              } else {
                core.notice(`Renovate dashboard healthy (managers: ${report.managers.join(', ')}).`);
              }
              return;
            }

            // Built by pushing, not by filtering a sparse array — the same
            // mistake release-lag.yml records: a `.filter(l => l !== '')` drops
            // the deliberate blank lines and collapses the Markdown.
            const measured = [];
            for (const finding of report.findings) {
              measured.push(`- ${finding}`);
            }

            const body = [
              `The scheduled Renovate-health check found **${report.findings.length}** problem(s) while reading the Dependency Dashboard (#${dashboardIssue}).`,
              '',
              'This is the check that would have caught the six weeks (2026-08-02 – 2026-09-10) in which the `pip-compile` manager extracted nothing at all. A manager that extracts nothing opens no pull requests and breaks no build; it is indistinguishable from "nothing to update" unless somebody enumerates the inventory.',
              '',
              '## Findings',
              '',
              ...measured,
              '',
              '## Inventory as read',
              '',
              `- Managers present: ${report.managers.map(m => `\`${m}\``).join(', ')}`,
              `- \`pep621\` package files: ${report.pep621_files.length ? report.pep621_files.map(f => `\`${f}\``).join(', ') : '**none**'}`,
              `- Expected (locked) trees: ${report.expected_pep621_files.map(f => `\`${f}\``).join(', ')}`,
              `- Known lock-less PEP 621 trees (allowed): ${report.known_lockless_pep621_files.map(f => `\`${f}\``).join(', ')}`,
              `- \`uv.lock\` found beside: ${report.locks_verified_on_disk.length}/${report.expected_pep621_files.length} expected trees — read from the CHECKOUT, not from the dashboard, which lists package files only`,
              '',
              `Run: ${runUrl}`,
              '',
              '## Triage',
              '',
              `1. Open the dashboard itself (#${dashboardIssue}) and read the \`## Repository problems\` section. Renovate writes it only when it has something to say.`,
              '2. If a manager disappeared, the usual cause is a config change here: a `matchManagers` rule that disabled more than intended, or a package file whose shape a manager stopped accepting (that is exactly what happened to `pip-compile`). Note that `enabled: false` disables a manager\'s DEPENDENCIES and not its extraction — a disabled manager still shows up, which is why the rule is "no second manager inside a locked tree" and not "this manager must be absent".',
              '3. Prove the fix before merging it with `task renovate:dry-run`, which runs Renovate against this checkout and prints the same inventory this check compares.',
              '4. If the change is intended — a new Python tree, or a newly observed manifest — give it a `uv.lock` and update `EXPECTED_PEP621_FILES` / `EXPECTED_OBSERVED_FILES` in `scripts/ci/check_renovate_dashboard.py` in the same pull request, so the expectation stays exact instead of being widened later from memory. `KNOWN_LOCKLESS_PEP621_FILES` is EMPTY since #1464 and an entry there needs its argument in writing, not just a line.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still drifting as of ${runUrl}: ${report.findings.length} finding(s).`,
              });
              core.notice(`Updated existing alert issue #${existing.number}.`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: TITLE, body, labels: [LABEL, 'dependencies'],
              });
              core.notice(`Opened alert issue #${created.data.number}.`);
            }

  stale-image-upstreams:
    name: Ask each pinned third-party image's registry when it last received a tag
    runs-on: ubuntu-latest
    # Measured 2026-11-20: 17 images, about 70 anonymous GETs, 30 seconds. The
    # bound covers three attempts with a 20-second timeout on a slow registry.
    timeout-minutes: 10
    # `issues: write` for the one alert issue, granted here and not at workflow
    # level (see above). No `packages` scope: every registry read is anonymous.
    # The job's GITHUB_TOKEN exists for the issue step ALONE — the script step
    # is handed no token and sends none to a registry.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job uses git after the checkout, and the script
          # step talks to third-party registries: the token is not left in
          # `.git/config` beside it.
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          allow-prereleases: true

      - name: Read the newest tag date of every pinned third-party image
        # The inventory is read from the checkout (Dockerfiles, compose files,
        # workflow image values, .pins/, Helm values) and printed image by
        # image, so the log always says what was looked at.
        #
        # Undetermined (a registry unreachable or rate-limiting after the
        # retries, an empty inventory, an unreadable pin) exits non-zero => the
        # run goes red and the issue step below no-ops (no report file). A
        # determined result writes the report and exits 0, stale or not.
        run: python3 scripts/ci/check_stale_image_upstreams.py stale-image-report.json

      - name: Open, update or close the stale-upstream issue
        # Same shape as the job above, for the same reasons: only on a
        # DETERMINED result, and never through a cancellation.
        if: ${{ !cancelled() && hashFiles('stale-image-report.json') != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Read via process.env, never interpolated into the script body.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('stale-image-report.json', 'utf8'));
            // Its own label, so this alert and the dashboard alert above never
            // find — and overwrite or close — each other's issue. GitHub
            // creates the label on the first `issues.create`.
            const LABEL = 'stale-image-upstream';
            const TITLE = 'A pinned third-party image\'s upstream repository stopped receiving tags (#3060)';
            const runUrl = process.env.RUN_URL;

            // Dedup anchor: the single open issue carrying our label AND our
            // exact title. One issue is updated; a new one is NOT opened per
            // run (#3040 and its nine duplicates are what that looks like).
            // The title is part of the anchor because a label can be put on
            // any issue by hand: an issue somebody labelled `stale-image-upstream`
            // themselves must not have its body overwritten or be closed by
            // this job.
            const open = (await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: LABEL,
            })).data.filter(i => !i.pull_request && i.title === TITLE);
            const existing = open[0];

            if (!report.alert) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `Resolved: all ${report.images.length} pinned third-party images sit on a repository that received activity inside its window, as of ${runUrl}. Closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, state: 'closed',
                });
                core.notice(`Image upstreams active again — closed alert issue #${existing.number}.`);
              } else {
                core.notice(`All ${report.images.length} pinned third-party image upstreams are active.`);
              }
              return;
            }

            const findings = [];
            for (const finding of report.findings) {
              findings.push(`- ${finding}`);
            }
            const rows = [];
            for (const image of report.images) {
              const measured = image.age_days === null
                ? image.signal
                : `${image.newest_activity.slice(0, 10)} (${image.age_days} d, ${image.signal})`;
              rows.push(`| \`${image.image}\` | ${image.status} | ${measured} | ${image.threshold_days} d |`);
            }

            const body = [
              `The scheduled check found **${report.findings.length}** problem(s) while asking the registries when each pinned third-party image last received a tag.`,
              '',
              'A repository that stopped receiving tags looks "up to date" to Renovate for as long as nobody asks. `nginxinc/nginx-unprivileged` did exactly that from 2026-10-19 on, after upstream moved to `nginx/nginx-unprivileged` (#3060).',
              '',
              '## Findings',
              '',
              ...findings,
              '',
              '## Every image as measured',
              '',
              '| Image | Status | Newest activity | Window |',
              '|---|---|---|---|',
              ...rows,
              '',
              `Run: ${runUrl}`,
              '',
              '## Triage',
              '',
              '1. Look at the upstream project: did it move to another registry or namespace, was it renamed, or is it archived? The registry page of the old repository usually says nothing — the project\'s README, release notes or Dockerfile do.',
              '2. If it moved, change the image name everywhere it is referenced (the finding lists the places) and in `renovate.json5` in the same pull request, as #3061 did.',
              '3. If the project is alive and simply releases rarely, give the image a wider window in `THRESHOLD_OVERRIDES_DAYS` in `scripts/ci/check_stale_image_upstreams.py`, with the measured release cadence as the reason.',
              '4. If the project is abandoned, the pin is a decision to take, not a number to widen: replace the image.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still stale as of ${runUrl}: ${report.findings.length} finding(s).`,
              });
              core.notice(`Updated existing alert issue #${existing.number}.`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: TITLE, body, labels: [LABEL, 'dependencies'],
              });
              core.notice(`Opened alert issue #${created.data.number}.`);
            }

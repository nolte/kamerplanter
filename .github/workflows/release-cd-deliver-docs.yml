name: Release — Deliver Docs

on:
  release:
    types: [published]

jobs:
  publish_docs:
    uses: nolte/gh-plumbing/.github/workflows/reusable-mkdocs.yaml@v1.1.24
    with:
      requirements: docs/requirements.txt
      # Regenerate the gitignored Claude skill/agent catalog before the
      # build. Without this the deployed nav links to de/skills, de/agents
      # and de/tags, which never exist in a fresh CI checkout -> 404.
      pre-build-command: python scripts/docs/gen_catalog.py
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      id-token: write
      pages: write
    concurrency:
      cancel-in-progress: true
      group: "pages"

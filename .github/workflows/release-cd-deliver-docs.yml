name: Release — Deliver Docs

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish_docs:
    uses: nolte/gh-plumbing/.github/workflows/reusable-mkdocs.yaml@6eeab5f407a63c182d82290dbf78faca18b2af3b # v2.0.1
    with:
      requirements: docs/requirements.txt
      # Regenerate the gitignored Claude skill/agent catalog before the
      # build. Without this the deployed nav links to de/skills, de/agents
      # and de/tags, which never exist in a fresh CI checkout -> 404.
      pre-build-command: python scripts/docs/gen_catalog.py
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      id-token: write
      pages: write
    concurrency:
      group: "pages"
      # NOT cancel-in-progress, despite that being GitHub's stock Pages snippet.
      # This runs on `release: published` — it is a DELIVERY workflow, and
      # cancelling one in flight can leave the published site half-written:
      # mkdocs-gh-pages pushes the built tree to gh-pages, and an interrupted
      # push is a documentation set that matches no release.
      #
      # The group is kept so two releases in quick succession serialise instead
      # of racing each other onto the same branch. Serialising is the property
      # worth having here; superseding is not.
      cancel-in-progress: false

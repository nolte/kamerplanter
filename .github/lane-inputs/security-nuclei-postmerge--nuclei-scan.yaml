unrecorded_invocations:
- command: python3 scripts/security/seed-nuclei-openapi-fixtures.py
  reason: Logs in to the running stack and seeds resources over the REST API; it imports no backend module and reads no tracked
    file (its output, required_openapi_params.yaml, is written to the workspace). scripts/security/** is in the on:-level
    filter.
- command: ./scripts/security/assert-nuclei-coverage.sh --label "Nuclei Scan (fast profile) — HTTP surface" --log "$GITHUB_WORKSPACE/nuclei-run.log"
    --results "$GITHUB_WORKSPACE/results.jsonl" --sarif "$GITHUB_WORKSPACE/results.sarif" --expect-targets 2 --targets "http://127.0.0.1:8000
    http://127.0.0.1:5173" --min-templates 100 --summary "$GITHUB_STEP_SUMMARY" --json-out "$GITHUB_WORKSPACE/nuclei-coverage.json"
    --write-empty-sarif "$GITHUB_WORKSPACE/results.sarif"
  reason: Asserts over the scan's own run log and results, which exist only after nuclei ran against the stack; its tracked
    inputs are the script itself (scripts/security/**, in the filter) — the template count it checks comes from the log, not
    from the tree.

status: measured
measured_on: '2026-09-24'
measured_at_commit: 08cacf699784e83e1b63edcf8b26ffc79c740ffe
replay_seconds: 3
job_spec_sha256: 6ef72619fa427d0912e47a28a963eb28e79274e041ed5382b85ae108958b153f
invocations:
- command: python3 ../../scripts/security/npm_audit_gate.py
  cwd: src/frontend
  recorder: strace -ff -y -z
  exit_code: 1
  env: []
  untracked_reads_dropped: 0
  allow_failure_reason: 'Exit 1 is the gate''s own verdict, reached after every read: `npm audit --json` on the recording

status: derived
measured_on: '2026-10-13'
measured_at_commit: 6e5271d9d40444b6e93b28d5d9fd410ad3b860b9
replay_seconds: 1
job_spec_sha256: 9aa83212bf36450626405fbf0b9301df043d4828064b35df39bb371df566d349
invocations:
- command: derive-docker --context docker/reranker-service --dockerfile docker/reranker-service/Dockerfile
  cwd: .

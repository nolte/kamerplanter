# Recorded by scripts/ci/lane_inputs.py — what this job READS, so its relevance
# filter can be held against it (#1596). Do not edit `reads` by hand: the CI lane
# .github/workflows/lane-inputs.yml replays the `invocations` below and fails when
# its recording differs from this file (#1683). The guard is
# src/backend/tests/unit/guards/test_lane_filters_cover_measured_inputs.py.
schema: 2
workflow: docker-lint-build.yml
job: build-reranker-service
gate:
  kind: paths-filter
  filter: reranker-service
status: derived
measured_on: '2026-09-25'
measured_at_commit: 1e825cdab0c1721a41951ad5b1b97da9ef8df17a
replay_seconds: 4
job_spec_sha256: 093e26e3c696b8020969c892795e23dae475fbc52c82ebec98f015ed3cf0a6e7
invocations:
- command: derive-docker --context docker/reranker-service --dockerfile docker/reranker-service/Dockerfile
  cwd: .
  recorder: docker build context probe (FROM scratch, COPY . — the daemon applies .dockerignore) narrowed to the Dockerfile's
    COPY/ADD sources
  copy_sources:
  - pyproject.toml
  - uv.lock
  - pyproject.toml
  - uv.lock
  - main.py
  - limits.py
  context_files_after_dockerignore: 5
subprocesses: []
accepted_gaps: []
reads:
- docker/reranker-service/.dockerignore
- docker/reranker-service/Dockerfile
- docker/reranker-service/limits.py
- docker/reranker-service/main.py
- docker/reranker-service/pyproject.toml
- docker/reranker-service/uv.lock
unrecorded_invocations:
- command: scripts/ci/smoke_model_image.sh kp-reranker-service:pr 8081 /ready
  reason: Runs against the image the job just built (`docker run` of a :pr tag that exists only on the runner); on a workstation
    there is no such image. The script reads nothing from the tree but itself, and scripts/ci/** is in this workflow's on:-level
    filter; the image's inputs are the derived build context above.
- command: scripts/ci/probe_model_service_contract.py kp-reranker-service:pr reranker
  reason: Runs against the image the job just built (`docker run` of a :pr tag that exists only on the runner); on a workstation
    there is no such image. Besides itself the script reads only the golden outputs under docker/reranker-service/golden/
    (#1763), which this job's own filter docker/reranker-service/** covers (it reads the body cap from `limits` INSIDE the
    image), and scripts/ci/** is in this workflow's on:-level filter; the image's inputs are the derived build context above.

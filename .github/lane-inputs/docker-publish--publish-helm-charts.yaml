# Recorded by scripts/ci/lane_inputs.py — what this job READS, so its relevance
# filter can be held against it (#1596). Do not edit `reads` by hand: the CI lane
# .github/workflows/lane-inputs.yml replays the `invocations` below and fails when
# its recording differs from this file (#1683). The guard is
# src/backend/tests/unit/guards/test_lane_filters_cover_measured_inputs.py.
schema: 2
workflow: docker-publish.yml
job: publish-helm-charts
gate:
  kind: paths-filter
  filter: helm
status: measured
measured_on: '2026-09-25'
measured_at_commit: 627783c035aaa58344845843b8d8d3c0d10bef39
replay_seconds: 3
job_spec_sha256: cfa02745b53b25a9832ef566db0161995a81fc1e5ccae3a3d8df94ef7ce170e4
invocations:
- command: scripts/ci/determine_chart_version.sh
  cwd: .
  recorder: strace -ff -y -z
  exit_code: 0
  env:
  - REF=refs/heads/develop
  - REF_NAME=develop
  untracked_reads_dropped: 0
- command: helm dependency build helm/kamerplanter
  cwd: .
  recorder: strace -ff -y -z
  exit_code: 0
  env: []
  untracked_reads_dropped: 8
- command: helm package helm/kamerplanter --destination /tmp/lane-inputs-scratch/helm-out
  cwd: .
  recorder: strace -ff -y -z
  exit_code: 0
  env: []
  untracked_reads_dropped: 6
- command: python3 scripts/check_chart_image_digests.py
  cwd: .
  recorder: strace -ff -y -z
  exit_code: 1
  env: []
  untracked_reads_dropped: 0
  allow_failure_reason: 'Exits 1 on the develop tree BY DESIGN (#987): helm/kamerplanter/values.yaml carries `latest` tags
    until the release-time pin step (scripts/ci/pin_chart_image_digests.sh) rewrites it, and the script''s verdict is that
    no reference is digest-pinned. It reads every helm/kamerplanter/values*.yaml before deciding (CHART_GLOB), so the failure
    path skipped no read of the tree; the only input it could not see is the rewritten values file, which exists only inside
    a release run and is the same tracked path.'
subprocesses:
- bash
- helm
- python3
- scripts/ci/determine_chart_version.sh
accepted_gaps:
- pattern: scripts/
  reason: Python enumerates the directory of the script it runs (scripts/check_chart_image_digests.py) to resolve imports
    — the FileFinder lists scripts/ once. The script imports stdlib and PyYAML only; a new module dropped into scripts/ could
    shadow one of those, which is the same exposure every script in this repository has and is not a chart-publishing input.
    The script itself is in the filter.
reads:
- helm/
- helm/kamerplanter/
- helm/kamerplanter/Chart.lock
- helm/kamerplanter/Chart.yaml
- helm/kamerplanter/templates/
- helm/kamerplanter/templates/common.yaml
- helm/kamerplanter/values-dev-ki.yaml
- helm/kamerplanter/values-dev-recognition.yaml
- helm/kamerplanter/values-dev.yaml
- helm/kamerplanter/values.yaml
- scripts/
- scripts/check_chart_image_digests.py
- scripts/ci/determine_chart_version.sh
unrecorded_invocations:
- command: scripts/ci/pin_chart_image_digests.sh "helm/$CHART/values.yaml" "$VERSION"
  reason: 'Runs only on a release tag: resolves every Kamerplanter image digest from GHCR for that version (network, and a
    tag that exists) and rewrites the values file it is given in place. What it reads from the tree is that one values file,
    helm/kamerplanter/values.yaml, which the helm filter selects.'
- command: scripts/ci/publish_release_asset.sh "$TAG" tar-content "$CHART"-*.tgz
  reason: Runs only on a release tag against the GitHub release of that tag (gh auth, an existing release). It reads the packaged
    chart archive from the working directory, not a tracked file; the script itself is in the on:-level filter.
test_modules: []
readers: {}
readers_scope_sha256: a3e5b0c952772d5628c96fd5690e62cea1f56648b523ecca58ab5d2d82da382a

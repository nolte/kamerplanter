# These settings are synced to GitHub by https://probot.github.io/apps/settings/

_extends: gh-plumbing:.github/commons-settings.yml

repository:
  name: kamerplanter
  description: Agricultural technology system for plant lifecycle management
  homepage: https://nolte.github.io/kamerplanter
  topics: agriculture, plant-management, fastapi, react, helm, kubernetes

# Merges by `name` into the commons `develop` block; only the fields below are
# overridden, everything else stays inherited. The commons deliberately ship
# `contexts: []` and require each consumer to declare its own required checks
# here — see spec/project/pull-request-workflow §required status checks, which
# also forbids adding or removing them through the GitHub UI.
#
# Context strings are the check-run names exactly as GitHub reports them, not
# the workflow file names. A job that calls a reusable workflow reports as
# "<caller-job-id> / <reusable-job-display-name>", which is where
# `static / Static CI Tests` comes from; a plain job reports its own `name:`.
# Verify with `gh api repos/nolte/kamerplanter/branches/develop/protection`
# after this lands on develop — the Probot Settings App syncs from the default
# branch, so the change only takes effect once merged.
#
# `E2E smoke (compose, light)` was required from ADR-011 until 2026-07-29 and is
# now advisory again. It is the ADR-011 rollback path taken deliberately
# (project/requirements/e2e-smoke-merge-gate.md R7 — a regular pull request
# against this file, never a one-off bypass), on latency rather than on flake:
# the job runs ~11 minutes and, multiplied by `strict: true` below, dominated
# merge-train time. `e2e-nightly.yml` keeps the coverage — the full 5-profile
# matrix runs nightly, and `e2e-smoke` still reports on every pull request; it
# just no longer blocks. The failure mode ADR-011 was written against (#763, an
# E2E check merged red) therefore returns as a review obligation rather than an
# enforced one: read the advisory check before merging.
# The repository RULESET that overlays branch protection, declared here so it has
# a versioned source (#1491). Until this block existed, `default-branch-protection`
# (id 17783737, `source_type: Repository`) lived ONLY in the GitHub UI: it requires
# `chain-bench / Chain Bench` and `security / Build`, two contexts that really do
# gate a merge to develop and that no file in this tree mentioned. A ruleset is not
# the same object as the `branches[].protection` block below — GitHub evaluates both
# and takes the union — so the two lists are deliberately different and neither is a
# copy of the other.
#
# SUPPORTED, MEASURED 2026-09-17, NOT ASSUMED. The Probot Settings App carries
# `lib/plugins/rulesets.js` (repository-settings/app#1029, 2024-09-17; documented in
# `docs/plugins/rulesets.md`). Upstream calls the support "still under development …
# adopt cautiously, with the expectation of breaking changes" and tracks it in
# repository-settings/app#732, which is why the fallback — folding the two contexts
# into `required_status_checks.contexts` below and leaving the ruleset redundant —
# stays written down here rather than only in the pull request that chose against it.
#
# THIS BLOCK MUST MIRROR THE LIVE RULESET FIELD FOR FIELD. The plugin diffs with
# `deepEqual` over the whole object minus `id`, `_links`, `created_at`, `updated_at`,
# `source_type`, `source`, `node_id` and `current_user_can_bypass`; an omitted key
# (`bypass_actors: []`, `conditions.ref_name.exclude: []`) is a difference, so the
# App would re-PUT on every sync. `rules` and `required_status_checks` are ARRAYS —
# their order is part of the comparison. Refresh with:
#   gh api repos/nolte/kamerplanter/rulesets/17783737
#
# IT ALSO OWNS DELETION. The plugin removes every repository-level ruleset this list
# does not declare (`includes_parents: false`). Measured 2026-09-17, this repository
# has exactly one; a second one created in the UI would be deleted on the next sync
# rather than silently surviving, which is the intended direction.
rulesets:
  - name: default-branch-protection
    target: branch
    enforcement: active
    bypass_actors: []
    conditions:
      ref_name:
        include:
          - refs/heads/develop
        exclude: []
    rules:
      - type: deletion
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: true
          do_not_enforce_on_create: false
          required_status_checks:
            # Both are jobs of `build-static-tests.yaml`, whose only trigger is a
            # bare `on: push:` — no `paths:`, no `branches:`. Measured, because a
            # required check in a path-filtered workflow never reports at all and
            # blocks the pull request forever (#1432, and the guard in
            # src/backend/tests/unit/guards/test_required_contexts_are_unfiltered.py
            # holds these two to it alongside the protection contexts).
            - context: static / Static CI Tests
            - context: chain-bench / Chain Bench
            - context: security / Build
      - type: non_fast_forward

branches:
  - name: develop
    protection:
      required_status_checks:
        # `strict: true` means every open pull request must rebuild after any
        # other one merges. That was the dominant cost of the merge train while
        # `E2E smoke (compose, light)` was required: measured over
        # 2026-07-27 15:00 → 2026-07-28 17:00, a window in which 14 pull requests
        # merged, it produced **60 `e2e-smoke` runs**. One Renovate
        # container-digest bump alone accounted for **10** of them (7 completed, 3
        # cancelled by the next update) — ~110 minutes of runner time for a change
        # that never differed between runs.
        #
        # #792 evaluated dropping `strict` and kept it; with the E2E context gone
        # the remaining required checks are minutes, not tens of minutes, so the
        # trade-off it protects — a pull request green on its own is still green
        # once merged — is now cheap. Revisit only if pull-request volume rises
        # enough that the *drift window*, how long `develop` and the open pull
        # requests disagree, produces real conflicts rather than just reruns.
        #
        # Check runtime is only half of what `strict` costs (#1584). Every base
        # update re-queues *every* workflow of every open pull request, not just
        # the required ones, and those runs compete for the same runner slots.
        # On 2026-09-19, with 18 pull requests open, 69 % of pull-request runs
        # re-verified code that had not changed and three lanes ended cancelled
        # 71–94 % of the time. Re-measured on 2026-09-20 over 566 runs, with 6
        # pull requests open and PR #1587 removing four jobs per pull request:
        # e2e-smoke 27 %, frontend 40 %, docker-lint-build 23 % cancelled. That
        # is relief from a drained train, not a repaired cause: `strict` and the
        # fan-out are unchanged. Reopen #1584 when any lane ends cancelled in
        # the majority of its pull-request runs (spec/project/workflow-health/);
        # the options then are a merge queue or dropping `strict`.
        strict: true
        contexts:
          - static / Static CI Tests
          # #828 — the frontend unit suite gated nothing until it was promoted:
          # a pull request whose entire vitest run was red could reach develop as
          # long as the contexts required at the time — `static / Static CI
          # Tests` and, until 2026-07-29, `E2E smoke (compose, light)` — passed.
          # #824 (jsdom 29 -> 30, 71 of 361 test files red) was stopped only
          # because the advisory checks were inspected by hand.
          #
          # Promoted on measured history, the standard ADR-011 set for
          # `E2E smoke`: across 60 runs (30 develop, 30 pull-request) the job
          # reported 12 failures and *every one* traced to a real defect — 8 to
          # the jsdom 30 incompatibility (#827), 4 to the WorkflowInstantiateDialog
          # render-phase state mutation (#821). No flake, so no false blocking.
          #
          # `frontend.yml`'s pull_request trigger had to lose its `paths:` filter
          # for this to work; see the header there.
          - lint-test-build (22)
          #
          # `lint-test (3.14)` (backend) is deliberately NOT promoted alongside
          # it, and the difference is measured rather than assumed. Over 30
          # develop runs it failed once — but that failure is a midnight-UTC
          # boundary flake, not a defect: three tests in
          # `test_care_task_followup_after_completion.py` /
          # `test_watering_log_care_advance.py` build their fixture as
          # `completed_at = datetime.now(UTC) - 2h` and assert the "#509 recency
          # rule" ("a task completed today satisfies the reminder"). The run
          # started at 00:04 UTC, so the fixture landed on the previous day and
          # the rule stopped matching. Arming that as a required check would
          # block every pull request in the repository whenever CI happens to
          # start between 00:00 and 02:00 UTC. Fix the date boundary first; the
          # promotion is a follow-up, not a decision left unmade.
          #
          # #1404 — the mechanical write-route guards, and ONLY those. Until this
          # promotion no backend test suite was an enforced check at all:
          # `static` runs pre-commit, `lint-test-build (22)` is the frontend, and
          # `Backend CI` is path-filtered and advisory. That is where
          # `tests/unit/api/test_write_route_gates.py` lives — the mechanical
          # guard against this repository's largest defect class, 23 closed
          # issues of which name a predecessor in their own title (#719 "same
          # IDOR as #717", #948 "write-side twin of #927", #1018 "same shape as
          # #997", #952, #1112, #1146, …). The guard that finally enumerates that
          # class could not block a merge.
          #
          # WHY A SEPARATE WORKFLOW AND NOT `Backend CI`: `on:` is a
          # workflow-level key, so a job cannot widen its workflow's triggers.
          # `backend.yml` is path-filtered to `src/backend/**`, which excludes the
          # exact case this promotion covers — a frontend-only pull request that
          # also adds an ungated backend write route. See the header of
          # `.github/workflows/backend-guards.yml`.
          #
          # MEASURED BEFORE PROMOTION, because `strict: true` multiplies every
          # required check across the merge train. The promotion cited "41 s in
          # CI on ce9f116ce" plus two local figures (`tests/unit/api/` 271 tests
          # 15 s, the whole unit suite 8345 tests 240 s). All three are retired
          # by the re-measurement below; the local ones because a workstation
          # figure never described this lane, the 41 s because it no longer
          # describes it either. The argument they supported — the lane runs two
          # DIRECTORIES and not the suite — is unchanged, and the expensive full
          # backend suite stays in `backend.yml`, path-filtered and advisory.
          #
          # STABILITY, measured over the last 40 runs of each on 2026-09-12:
          #   `Backend CI`        33 success, 0 failure, 7 cancelled
          #   `Static CI Tests`   34 success, 2 failure, 4 cancelled
          # The lane being promoted has fewer failures over that window than the
          # one already required. Cancellations are the merge train, not
          # instability: `strict: true` supersedes in-flight runs.
          #
          # ── THE ROLLBACK TRIGGER MOVED ON 2026-09-20 (#1597). ──────────────
          #
          # It read "the lane exceeds two minutes on a median run", and #1597
          # established by measurement that it was MET: the lane had drifted to
          # a median well past two minutes while this file still promised to take
          # it back at that mark. The choice was to make the lane cheap again, to
          # move the trigger, or to return the context to advisory. Moving the
          # trigger was chosen, and this is the argument — an unargued bigger
          # number would be the same NFR-018 §1 failure with more headroom.
          #
          # RE-MEASURED 2026-09-20, successful jobs only, window
          # 2026-09-19T18:16Z → 2026-09-20T16:37Z (22.4 h; the workflow fires on
          # every push to every branch, so the sample is dense rather than long).
          # Method: `gh api repos/nolte/kamerplanter/actions/workflows/
          # backend-guards.yml/runs?status=completed` → per-run `/jobs` →
          # `completed_at - started_at`, grouped by job name.
          #
          #   context                        n    median  p10   p90   p99   max
          #   Write-route and tree guards   248    166 s  141 s 187 s 201 s 204 s
          #   Integration tests (ArangoDB)  271    188 s  156 s 197 s 214 s 235 s
          #
          # WHAT IT COSTS PER MERGE. `strict: true` re-runs every open pull
          # request's required checks after any other merge, so this context is
          # paid once per open pull request per merge, not once per pull request.
          # But it is paid IN PARALLEL with `Integration tests (ArangoDB)` in the
          # same workflow, whose median is 22 s HIGHER. The guard lane therefore
          # adds nothing to the merge train's wall clock at today's numbers: the
          # lane's cost is the slower job either way. Two minutes was the right
          # trigger when this context was the only job in `backend-guards.yml`
          # and cost 41 s; since #1432 it shares the workflow with a job that
          # dominates it, and a trigger that fires while the lane is not on the
          # critical path measures the wrong thing.
          #
          # WHAT IT BUYS. The mechanical write-route gate sweep over this
          # repository's largest defect class — 23 closed issues naming a
          # predecessor in their own title — plus the guards over CI
          # configuration that no other enforced lane runs. Returning it to
          # advisory restores the state in which that sweep could not block a
          # merge, which is the state #1404 existed to end.
          #
          # TAKEN BACK IF, from 2026-09-20:
          #   (a) the median exceeds 200 s, or
          #   (b) the median exceeds that of `Integration tests (ArangoDB)`
          #       measured over the same window, or
          #   (c) it reports a failure that does not trace to a real ungated
          #       route.
          # Each is a measurement, not a judgement call.
          #
          # WHERE 200 s COMES FROM, so it is not a round number picked to be
          # safely above today's: it is this window's p99 (201 s), floored. A
          # MEDIAN that reaches today's p99 means half of all runs are now slower
          # than today's slowest — a wholesale shift of the distribution, not
          # runner noise. The observed spread (p10 141 s → p90 187 s, ±14 % about
          # the median) is what the 34 s of headroom over today's 166 s absorbs.
          # Clause (b) exists because (a) alone would keep firing on absolute
          # seconds after the lane has stopped being the one that costs anything;
          # it makes the trigger relative to the job the lane actually waits for.
          #
          # HOW THIS GETS RE-MEASURED, honestly: NOTHING MECHANICAL ENFORCES IT.
          # No guard under `src/backend/tests/unit/guards/` reads these numbers,
          # and none is added here — a lane cannot measure its own wall clock
          # from inside itself, and a scheduled job that opens an issue on drift
          # is a separate piece of work, not a comment. The commitment is
          # procedural: re-measure with the command above whenever this context's
          # entry is touched for any reason, and whenever a job is added to or
          # removed from `backend-guards.yml` (that changes which job dominates,
          # which is what clause (b) reads). A reader who finds these numbers
          # older than the lane's last structural change should treat them as
          # unverified rather than current.
          - Write-route and tree guards
          #
          # #1432 — the repository and AQL tier against a real ArangoDB. It is
          # the only measurement of that layer against a server, and until
          # 2026-09-16 it ran in no lane at all: each connecting module probed
          # `localhost:8529` itself and skipped when nothing answered, so on a
          # runner the tier reported `7 passed, 136 skipped` and exit code 0.
          # `tests/integration/conftest.py` now makes a missing database a
          # FAILURE whenever `CI` is set, and `task test:backend:integration`
          # declares `--max-skipped 0`, so a session that skipped anything is
          # red. That is what made the tier gateable.
          #
          # RECONCILED WITH THE LIVE STATE ON 2026-09-17, NOT PROMOTED HERE. The
          # context was already required live — `gh api …/branches/develop/
          # protection --jq '.required_status_checks.contexts'` listed it while
          # this file did not, which is the drift the header warns about and the
          # pull-request workflow forbids. The line is added so the versioned
          # declaration and the live state agree again; the promotion itself was
          # made outside a commit.
          #
          # ITS JOB IS IN `backend-guards.yml`, NOT `backend.yml`, and that is
          # load-bearing rather than tidy: it was promoted while defined in the
          # path-filtered `backend.yml`, so a pull request touching nothing under
          # `src/backend/**` never ran the workflow, never got the check run, and
          # sat on "Expected — waiting for status to be reported" indefinitely.
          # Measured 2026-09-17 with `gh pr view <n> --json statusCheckRollup`:
          # #1470 (frontend only), #1475 (workflow only) and #1410 (docs only)
          # each listed every other required context and not this one.
          # `src/backend/tests/unit/guards/test_required_contexts_are_unfiltered.py`
          # holds every context in this list to an unfiltered workflow, and
          # cross-checks this block against its fixture copy of the live state.
          #
          # COST: median 188 s with a service container, measured 2026-09-20 over
          # the same window and by the same method as the table above (n = 271;
          # p90 197 s, max 235 s). The "against the 41 s of the guard lane it now
          # shares a workflow with" that stood here used the figure #1597
          # retired: that lane's median is 166 s, so this job is the slower of
          # the two by about 22 s and it, not `guards`, sets the workflow's wall
          # clock. Accepted because the alternative is not a cheaper lane but an
          # unmeasured data layer.
          #
          # TAKEN BACK IF: it reports a failure that does not trace to a real
          # repository or AQL defect, or the ArangoDB service container becomes a
          # source of infrastructure flake. Either is a measurement.
          - Integration tests (ArangoDB)
      enforce_admins: true
      # No `required_pull_request_reviews` block, deliberately — recorded here
      # because the CI/CD audit on 2026-08-01 flagged its absence and the live
      # state (`required_pull_request_reviews: null`) had no written rationale,
      # which made it indistinguishable from an accident.
      #
      # This is a single-maintainer repository whose merges run through the
      # `automerge` label. A self-approval requirement would either be satisfied
      # by the same person who wrote the change — which is theatre — or block
      # the automerge path entirely. The review obligation is therefore carried
      # by the required status checks and by the `review` / `security-review`
      # step in the pull-request-merge flow, not by branch protection.
      #
      # Renovate pull requests take neither path: since 2026-09-24 Renovate
      # merges them itself once EVERY check on the head is green
      # (`platformAutomerge: false` in renovate.json5, NFR-009 §3.4). A review
      # requirement would block that path as well.
      #
      # Revisit if a second regular contributor appears: at that point the
      # approval stops being self-approval and starts being a review.
      # `restrictions: null` is load-bearing, not a tidy-up. The commons declare
      # `restrictions.apps: [nolte-portfolio-app]` for develop, but GitHub only
      # accepts push restrictions on ORGANISATION-owned repositories; on a
      # personal account the branch-protection PUT is rejected outright. The
      # Probot Settings App then drops the ENTIRE protection update — not just
      # the unsupported field — so every context declared above would be
      # silently ignored. That is exactly what happened after #793 merged:
      # `E2E smoke (compose, light)` never became required, and the same drift
      # is visible in nolte/gh-plumbing itself (two contexts declared, one
      # live). nolte/claude-shared overrides `restrictions: null` and does get
      # its contexts applied — that contrast is the evidence for this line.
      #
      # Verify after any change to this block:
      #   gh api repos/nolte/kamerplanter/branches/develop/protection \
      #     --jq '.required_status_checks.contexts'
      restrictions: null

# Repository-local labels, appended to the ones the commons declare (#1607).
#
# The Probot Settings App merges arrays of named objects by `name` and PUSHES
# every entry it does not find — `mergeArrayByName.js` in
# `repository-settings/app`, the same mechanism the `develop` block above relies
# on. So this block ADDS to the commons' 28 labels; it does not replace them.
# Measured before writing it, not assumed: the live label set was the commons
# set plus `deployment` and `release-lag`, both of which exist only because a
# `issues.create({labels: […]})` call in a workflow created them as a side
# effect. Those two stay undeclared on purpose — this block is not the place to
# retro-fit them, and doing so silently would change their colour.
#
# The App syncs from the DEFAULT branch, so this label appears only once this
# change is on `develop`. Verify with:
#   gh label list --limit 200 | grep security-scan
#
# The labels endpoint rejects a description over 100 characters, and the App
# reports that only in its own log (#1632: the first version of this block
# carried 193 and the label never appeared). The limit is held by
# src/backend/tests/unit/guards/test_settings_labels_fit_api.py. The label
# triggers nothing; the scan it marks is run with
#   gh workflow run security-zap-postmerge.yml --ref develop -f pull_request=<number>
labels:
  - name: security-scan
    color: "#b60205"
    description: "Triage marker: scanned pre-merge, or wants to be. Triggers nothing."

# These settings are synced to GitHub by https://probot.github.io/apps/settings/

_extends: gh-plumbing:.github/commons-settings.yml

repository:
  name: kamerplanter
  description: Agricultural technology system for plant lifecycle management
  homepage: https://nolte.github.io/kamerplanter
  topics: agriculture, plant-management, fastapi, react, helm, kubernetes

# Merges by `name` into the commons `develop` block; only the fields below are
# overridden, everything else stays inherited. The commons deliberately ship
# `contexts: []` and require each consumer to declare its own required checks
# here — see spec/project/pull-request-workflow §required status checks, which
# also forbids adding or removing them through the GitHub UI.
#
# Context strings are the check-run names exactly as GitHub reports them, not
# the workflow file names. A job that calls a reusable workflow reports as
# "<caller-job-id> / <reusable-job-display-name>", which is where
# `static / Static CI Tests` comes from; a plain job reports its own `name:`.
# Verify with `gh api repos/nolte/kamerplanter/branches/develop/protection`
# after this lands on develop — the Probot Settings App syncs from the default
# branch, so the change only takes effect once merged.
#
# `E2E smoke (compose, light)` was required from ADR-011 until 2026-07-29 and is
# now advisory again. It is the ADR-011 rollback path taken deliberately
# (project/requirements/e2e-smoke-merge-gate.md R7 — a regular pull request
# against this file, never a one-off bypass), on latency rather than on flake:
# the job runs ~11 minutes and, multiplied by `strict: true` below, dominated
# merge-train time. `e2e-nightly.yml` keeps the coverage — the full 5-profile
# matrix runs nightly, and `e2e-smoke` still reports on every pull request; it
# just no longer blocks. The failure mode ADR-011 was written against (#763, an
# E2E check merged red) therefore returns as a review obligation rather than an
# enforced one: read the advisory check before merging.
branches:
  - name: develop
    protection:
      required_status_checks:
        # `strict: true` means every open pull request must rebuild after any
        # other one merges. That was the dominant cost of the merge train while
        # `E2E smoke (compose, light)` was required: measured over
        # 2026-07-27 15:00 → 2026-07-28 17:00, a window in which 14 pull requests
        # merged, it produced **60 `e2e-smoke` runs**. One Renovate
        # container-digest bump alone accounted for **10** of them (7 completed, 3
        # cancelled by the next update) — ~110 minutes of runner time for a change
        # that never differed between runs.
        #
        # #792 evaluated dropping `strict` and kept it; with the E2E context gone
        # the remaining required checks are minutes, not tens of minutes, so the
        # trade-off it protects — a pull request green on its own is still green
        # once merged — is now cheap. Revisit only if pull-request volume rises
        # enough that the *drift window*, how long `develop` and the open pull
        # requests disagree, produces real conflicts rather than just reruns.
        strict: true
        contexts:
          - static / Static CI Tests
          # #828 — the frontend unit suite gated nothing until now: a pull
          # request whose entire vitest run was red could reach develop as long
          # as the two contexts above passed. #824 (jsdom 29 -> 30, 71 of 361
          # test files red) was stopped only because the advisory checks were
          # inspected by hand.
          #
          # Promoted on measured history, the standard ADR-011 set for
          # `E2E smoke`: across 60 runs (30 develop, 30 pull-request) the job
          # reported 12 failures and *every one* traced to a real defect — 8 to
          # the jsdom 30 incompatibility (#827), 4 to the WorkflowInstantiateDialog
          # render-phase state mutation (#821). No flake, so no false blocking.
          #
          # `frontend.yml`'s pull_request trigger had to lose its `paths:` filter
          # for this to work; see the header there.
          - lint-test-build (22)
          #
          # `lint-test (3.14)` (backend) is deliberately NOT promoted alongside
          # it, and the difference is measured rather than assumed. Over 30
          # develop runs it failed once — but that failure is a midnight-UTC
          # boundary flake, not a defect: three tests in
          # `test_care_task_followup_after_completion.py` /
          # `test_watering_log_care_advance.py` build their fixture as
          # `completed_at = datetime.now(UTC) - 2h` and assert the "#509 recency
          # rule" ("a task completed today satisfies the reminder"). The run
          # started at 00:04 UTC, so the fixture landed on the previous day and
          # the rule stopped matching. Arming that as a required check would
          # block every pull request in the repository whenever CI happens to
          # start between 00:00 and 02:00 UTC. Fix the date boundary first; the
          # promotion is a follow-up, not a decision left unmade.
      enforce_admins: true
      # `restrictions: null` is load-bearing, not a tidy-up. The commons declare
      # `restrictions.apps: [nolte-portfolio-app]` for develop, but GitHub only
      # accepts push restrictions on ORGANISATION-owned repositories; on a
      # personal account the branch-protection PUT is rejected outright. The
      # Probot Settings App then drops the ENTIRE protection update — not just
      # the unsupported field — so every context declared above would be
      # silently ignored. That is exactly what happened after #793 merged:
      # `E2E smoke (compose, light)` never became required, and the same drift
      # is visible in nolte/gh-plumbing itself (two contexts declared, one
      # live). nolte/claude-shared overrides `restrictions: null` and does get
      # its contexts applied — that contrast is the evidence for this line.
      #
      # Verify after any change to this block:
      #   gh api repos/nolte/kamerplanter/branches/develop/protection \
      #     --jq '.required_status_checks.contexts'
      restrictions: null

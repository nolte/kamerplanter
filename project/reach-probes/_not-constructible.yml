    location: DataExportEngine.EXCLUDED_FROM_DISCLOSURE (L517-623)
  reason: scope_not_countable
  detail: 'The declaration''s own claim is an absence — these 15 edges are deliberately not disclosed
    as their own bundle sections — so the correct expectation would be a zero/empty count, which the schema
    cannot express (CountExpectation.value >= 1, SetExpectation.values minItems 1). Note for whoever seeds

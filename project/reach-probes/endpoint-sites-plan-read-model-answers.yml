# Declaration: REQ-053 §21.1, table row GP-API-001 (`GET /sites/{key}/plan`): the whole plan of a site in one
# request — site plan (§20.2), locations with geometry (§20.3), garden objects (§20.4), slots in plan
# coordinates (§20.5), plant short info {key, instance_id, species_key, phase_key, slot_key}, task counters
# per location and zones; default include = all parts. Anchored on that row's content (sections anchor,
# survives a squash merge; the row is byte-identical on develop 1738dbc19).
#
# Environment (T2): the reach stack, then reach:seed:garden-plan builds one plan through the write routes as
# a freshly registered account in its personal tenant — boundary 10 x 10 m, one bed `reach-bed` and one
# compost heap `reach-compost` in one plan batch, three tomato plants on their own slots by quick planting,
# one open task on the bed, one zone `reach-zone` holding the bed. The observation signs in as that account,
# calls GET /api/v1/t/{slug}/sites/{key}/plan and prints the facts of the body, one per line
# (scripts/reach/observe_garden_plan.py); a non-200 answer prints http-status=<code>.
#
# Expected set: one member per declared part, with the values the build made. A part the read model drops,
# a zero task counter, a plant without a phase or a slot, or a zone without its bed reads as a different
# member and the probe as partially reached.

StylesPath = .github/styles
MinAlertLevel = suggestion

Packages = Microsoft, RedHat, https://github.com/nolte/vale-style/releases/download/v0.1.17/nolte-styles.zip

Vocab = kamerplanter, technical

IgnoredScopes = code, tt, em

[*.md]
BasedOnStyles = Vale, Microsoft
# Project style choices that diverge from Microsoft's general-audience guide and
# would otherwise produce noise on this technical documentation set:
#   - Dashes: the docs use a consistent spaced em-dash ( — ) as a deliberate style.
#   - GeneralURL: "URL" is the correct, audience-appropriate term.
#   - Headings: heading capitalization is a per-project choice here.
#   - Contractions: mandating contractions is a tone preference, not a defect.
Microsoft.Dashes = NO
Microsoft.GeneralURL = NO
Microsoft.Headings = NO
Microsoft.Contractions = NO
# Hyphenated "auto-" compounds (auto-registered, auto-selected) are established
# spelling; acronyms in headings (URL, API, EC, VPD) are audience-appropriate.
Microsoft.Auto = NO
Microsoft.HeadingAcronyms = NO

# German is canonical for this project (CLAUDE.md, NFR-003): the whole spec/ tree
# and the German documentation mirror stay out of Vale's English-prose scope and
# are checked via LanguageTool instead (prose-style §Multilingual text).
[docs/de/**]
BasedOnStyles =

[spec/**]
BasedOnStyles =

[*.de.md]
BasedOnStyles =

# LLM-instruction artifacts (CLAUDE.md peers), not end-user prose.
[CLAUDE.md]
BasedOnStyles =

[AGENTS.md]
BasedOnStyles =

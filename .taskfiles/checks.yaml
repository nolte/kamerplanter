# ── Static gates & aggregate quality gate ────────────────────────────────────
# The custom source-tree gates (also pre-commit hooks in the required `static`
# lane), the full pre-commit aggregate, and `task check` — the one-command
# pass/fail table.
#
# Included from the root Taskfile.yaml with `flatten: true` — task names here
# are global and MUST NOT collide with other .taskfiles/*.yaml.

version: "3"

vars:
  # The Renovate CLI used by `renovate:dry-run`, pinned by tag AND digest.
  # A floating `:latest` here would make the dry-run's verdict a function of
  # whatever Renovate shipped that morning — the same reproducibility defect the
  # nuclei binary pin records (#1177), where the meaning of "validated" changed
  # under an unchanged repository. Aged by the Taskfile custom manager in
  # renovate.json5 (added with this target), so the pin cannot rot either.
  # renovate: datasource=docker depName=renovate/renovate
  RENOVATE_IMAGE: renovate/renovate:44.111.4@sha256:ba43d12a1e6dca504f103d8b2515206d501d6c1f668afcb5f2a6f0af93c09608

tasks:
  renovate:dry-run:
    desc: |
      Run Renovate against THIS checkout and print what it would do — the
      manager inventory it extracts, the updates it would propose, and any
      config error — without touching the platform (#1383).

      Why this exists as a target. renovate.json5 is the one configuration file
      in the repository that nothing verifies before merge: a rule that matches
      nothing, a manager accidentally disabled, a `managerFilePatterns` typo —
      all of them parse fine and are only discovered on the next Renovate run,
      hours later and on develop. That is precisely how the pip-compile manager
      went silent for six weeks (#1303). The dry-run that proved the #1377
      config was a one-off shell command nobody could repeat.

      `--platform=local` reads the working tree instead of the GitHub API, so it
      also sees UNCOMMITTED changes — which is the point: prove the edit before
      committing it.

      WHAT IS EXCLUDED, AND WHY THIS WAY. The one-off run also scanned
      `src/backend/.venv/**` (the local platform has no git filter, and
      config:recommended's ignorePaths covers `node_modules` but not a Python
      virtualenv). The exclusion is done by MASKING those paths with anonymous
      volumes, not by overriding `ignorePaths` through RENOVATE_IGNORE_PATHS:
      overriding the setting would mean the dry-run proves a configuration that
      is not the one CI uses, which defeats the purpose. Masking changes only
      what the container can see.

      `.venv-docs` and `site` joined that list in #1509, measured rather than
      guessed, and they are TWO separate local artefacts of one command
      (`task docs:build`): the venv made the dry-run report an `html` manager
      with two package files that do not exist in a clean checkout (MkDocs' own
      site-packages), and the built site made it report `pip_requirements`
      fileCount 3 instead of 2, because MkDocs copies every non-Markdown file
      under `docs/` — `docs/requirements.txt` included — into `site/`.
      CI never sees either, so both were pure local noise in the one output this
      target exists to be read from — and the second one contradicted the
      dashboard fixture derived from it. `_SWEEP_EXCLUDED` in
      scripts/ci/check_renovate_dashboard.py excludes the same two directories;
      a fix in one instrument and not the other leaves the disagreement in
      place, which is what the #1509 review caught.

      GITHUB_TOKEN is passed through when set. Without it the datasource lookups
      run anonymously and hit the rate limit quickly — the manager inventory is
      still correct, the "would propose" half is not.

      READING THE OUTPUT. The manager inventory is the `Dependency extraction
      complete` / `packageFiles with updates` block; at LOG_LEVEL=debug each
      extracted file is listed individually. `LOG_LEVEL=debug task renovate:dry-run`
      is what you compare against `EXPECTED_PEP621_FILES` in
      scripts/ci/check_renovate_dashboard.py before merging a renovate.json5
      edit, instead of after the next Renovate run.

      THE MASKED PATHS ARE PRE-CREATED, AND WHY (#1600). An anonymous volume
      needs its mount point to exist inside the container; `$PWD` is bind-mounted
      at /repo, so a mount point Docker has to create lands on the HOST — created
      by the daemon, hence root-owned. A fresh worktree was left with five
      root-owned empty directories, and `src/backend/.venv` among them made the
      documented backend setup fail with `failed to open file
      .../src/backend/.venv/CACHEDIR.TAG: Permission denied`, pointing nowhere
      near the dry-run that caused it. `--user "$(id -u):$(id -g)"` does NOT fix
      this — measured: the daemon creates the mount point before the container's
      user applies, so it is root-owned either way. Creating the paths here, as
      the invoking user, does: Docker then finds them and creates nothing. The
      masking `-v` flags are derived from that same list, so what the run
      pre-creates and what it masks cannot drift apart. The EXIT trap removes
      again only what this run created and what stayed empty, so a real venv or
      node_modules is never touched. Should the trap be missed (an interrupt the
      task shell does not route through EXIT), the residue is user-owned and
      empty — annoying, but it breaks nothing.

      Requires Docker.
    cmds:
      - |
        set -euo pipefail
        printf 'renovate dry-run using %s\n\n' '{{.RENOVATE_IMAGE}}'
        masked='src/backend/.venv .venv-docs site src/frontend/node_modules node_modules'
        created=''
        mask_args=''
        for p in $masked; do
          if [ ! -e "$p" ]; then
            mkdir -p "$p"
            created="$created $p"
          fi
          mask_args="$mask_args -v /repo/$p"
        done
        cleanup() {
          for p in $created; do
            rmdir --ignore-fail-on-non-empty "$p" 2>/dev/null || true
          done
        }
        trap cleanup EXIT
        docker run --rm \
          -v "$PWD:/repo" \
          $mask_args \
          -w /repo \
          -e LOG_LEVEL="${LOG_LEVEL:-info}" \
          -e RENOVATE_CONFIG_FILE=/repo/renovate.json5 \
          -e RENOVATE_PLATFORM=local \
          -e RENOVATE_DRY_RUN=full \
          -e RENOVATE_TOKEN="${GITHUB_TOKEN:-}" \
          -e GITHUB_COM_TOKEN="${GITHUB_TOKEN:-}" \
          '{{.RENOVATE_IMAGE}}' {{.CLI_ARGS}}

  check:schema-examples:
    desc: |
      Count the request/response schemas without an OpenAPI example against the
      recorded ceiling (BACKEND.md §5.3, #850). No-growth: red only when the
      number rises above the ceiling; a drop is green and prints the resulting
      headroom. The ceiling is not lowered per pull request (#973), so this
      target — not the constant — is where the current number comes from. Also
      runs as a pre-commit hook in the required `static` lane.
    cmds:
      - python3 scripts/check_schema_examples.py {{.CLI_ARGS}}

  check:recurrence-boundary:
    desc: |
      Count the cadence advances computed outside RecurrenceEngine — the (a) half
      of the ADR-008 phase-0 inventory (#1061, feature F-6). Default mode is a
      gate: red when a date shift carries neither a route through the engine nor
      a `# recurrence-owner-ok: <reason>`, and red when such a reason has gone
      stale (a pardon left behind after the fix). Pass --inventory for the
      phase-0 instrument, which never fails and prints every site with file:line
      attribution; --json for machine-readable output.

      NOT a pre-commit hook and NOT in `task check` yet, deliberately: the gate
      mode is red today — the debt it measures is the point — and NFR-018 §2
      forbids shipping a gate that cannot pass. It joins the required `static`
      lane in ADR-008 phase 4 (F-10), once phases 1-2 have driven the count to
      zero. Until then the growth ratchet lives in
      src/backend/tests/unit/test_recurrence_boundary_check.py, which runs in the
      backend unit tier and carries the named register of what is still open.

      The number is computed from the tree on every run and recorded nowhere
      (NFR-018 §2.1). It is a floor, not a census — the script's docstring names
      what a static scan of this shape cannot see.
    cmds:
      - python3 scripts/check_recurrence_boundary.py {{.CLI_ARGS}}

  check:notification-write-boundary:
    desc: |
      Count the notification writes made outside NotificationPropagationService —
      the (b) half of the ADR-008 phase-0 inventory (#1061, feature F-6). Default
      mode is a gate: red when a mutating call on a notification repository
      declares no write class (`# notification-write-ok: event|user-action:
      <reason>`), when the declared class is unknown, or when a declaration has
      gone stale. Pass --inventory for the never-failing phase-0 instrument,
      --json for machine-readable output.

      Same wiring status, and the same reason for it, as
      check:recurrence-boundary above.

      READ THE DOCSTRING BEFORE TRUSTING A ZERO HERE. This counts writes made in
      the wrong place. It cannot see the propagation that never happens — a
      source mutation with no notification call at all — which is the entire
      #742/#769 class. Zero means no caller reaches around the owner, not that
      every edge is wired; the pairing tests of ADR-008 phase 2 (F-8) own that
      half.
    cmds:
      - python3 scripts/check_notification_write_boundary.py {{.CLI_ARGS}}

  check:frontend-calls-served:
    desc: |
      Join every frontend `client.<verb>` call against the routes the FastAPI app
      actually mounts, and fail on any call no route serves (#1334, #1339). Four
      such calls existed when this was first run: a phase-transition button, a
      sensor edit, a sensor delete offered from three pages and the task photo
      upload — each a live control that answered 404, and none of them findable
      by anything but a browser.

      NOT a pre-commit hook, and deliberately not in the `check` aggregate above.
      Its route operand is the *mounted* app, so it needs the backend importable,
      which the required `static` lane does not have; re-deriving the route table
      from source text would be a second, drifting implementation of FastAPI's
      mounting rules. It runs instead where both operands already exist and a
      required gate already runs — the backend unit tier, via
      src/backend/tests/unit/api/test_frontend_endpoints_are_served.py — and the
      extraction itself is asserted from
      src/backend/tests/unit/test_frontend_calls_served_check.py. This target is
      the local loop for that same check while a route is being written.

      Pass --list to name every joined call, --json for machine-readable output.
    cmds:
      - python3 scripts/check_frontend_calls_served.py {{.CLI_ARGS}}

  check:route-consumers:
    desc: |
      The reverse of check:frontend-calls-served (#1478, #1416): join every
      mounted /api/v1 operation against the paths written in src/frontend/src,
      tests/e2e and src/backend/app/mcp_server, and name the ones nothing in
      this tree reaches. 175 of 797 here; #1478 recorded 176 with a script that
      never landed in the tree, and the script's docstring shows where the two
      re-implementations agree exactly and where they do not. #1416
      (`POST /me/providers/{slug}/link`, mounted, documented, gated, called by
      nothing) was one instance of the class.

      AN INVENTORY, NOT A VERDICT, AND DELIBERATELY NOT A GATE. A zero here
      means this checkout holds no string for the path; it does not mean the
      route is dead. Home Assistant, Grafana, external MCP clients and a device
      redeeming its own pairing code consume routes and leave no trace in the
      tree. Promoting this to a gate is the triage decision #1478 asks for, so
      it is neither a pre-commit hook nor part of the `check` aggregate, and no
      CI job runs it. What makes that promotion possible later is
      scripts/route_consumer_exemptions.yaml: a declared consumer-outside-the-
      tree with a stated reason, which the script refuses without one and
      reports as stale once the operation is gone or consumed again.

      Same operand problem as check:frontend-calls-served, and the same answer:
      its route side is the *mounted* app, so it needs the backend importable,
      which the required `static` lane does not have. The extraction and the
      join are asserted from
      src/backend/tests/unit/test_route_consumers_check.py, which also pins the
      two route walks against each other so this one cannot drift from the
      sibling's.

      Pass --inventory for the full table at exit 0, --json for machine-readable
      output. Without either it exits 1 while candidates stand, which is its
      state until the triage lands.
    cmds:
      - python3 scripts/check_route_consumers.py {{.CLI_ARGS}}

  check:seed-catalogue-page-size:
    desc: |
      Compare the seeded rows of every reference catalogue against the page its
      list view fetches (#995). Both numbers are derived from the tree — the row
      count from the seed YAML, the fetch contract from the frontend slice — so
      nothing here is a recorded count that concurrent pull requests collide on.
      Red when a catalogue has more seeded rows than its list view can show, when
      a catalogue registered as loading completely quietly went back to a bounded
      page, or when a seed file carries rows that no seeder loads. Pass --list to
      name every seed file counted. Also runs as a pre-commit hook in the
      required `static` lane, and is asserted from
      src/backend/tests/unit/test_seed_catalogue_page_size_check.py.
    cmds:
      - python3 scripts/check_seed_catalogue_page_size.py {{.CLI_ARGS}}

  check:seed-harvest-integrity:
    desc: |
      Refuse seed species records asserting a harvest or sowing fact no consumer
      can act on (#1002, #1008): an effective `allows_harvest` without any
      `harvest_months` (which makes every pre-harvest Karenz undecidable rather
      than not-applicable), and flat top-level month fields that are not the
      union of the record's `growing_periods`. Boolean invariants, no baseline —
      a record either supplies a harvest date or it does not. Reads the merged
      view the seeders produce, so it sees a disagreement whose two halves live
      in different seed files. Also runs as a pre-commit hook in the required
      `static` lane. Pass --list to name every record checked, --json for
      machine-readable output.
    cmds:
      - python3 scripts/check_seed_harvest_integrity.py {{.CLI_ARGS}}

  check:seed-steckbrief:
    desc: |
      Verify the seeded species data is consistent with the Steckbrief documents
      (spec/knowledge/plants/) — the exact step Backend CI runs before the test
      tiers (backend.yml "lint-test"). No services needed.
    dir: src/backend
    cmds:
      - python app/migrations/seed_steckbrief_consistency.py --verbose

  check:workflow-shell-lint:
    desc: |
      Lint every file under .github/workflows/ with actionlint — which runs a
      bundled shellcheck over each `run:` block — and every own *.sh with
      shellcheck at --severity=warning (#1295). Both also run as pre-commit
      hooks in the required `static` lane; this target is how `task check`
      folds them into its table.

      It DELEGATES to those hooks (`pre-commit run --all-files <id>`) instead
      of calling `docker run` itself, and that is the whole design.
      .pre-commit-config.yaml is where both tool versions are pinned and where
      Renovate bumps them, so a second invocation here would be a second place
      to keep in sync — and it would have to re-derive the file selection, the
      --severity floor and the container mount, each of which is a chance to
      gate something subtly different from what CI gates. In particular
      actionlint exits 3 without checking anything when the mounted tree has
      no `.git` marker, which is a silent-green shape a hand-rolled
      `docker run` would have to remember and this one inherits for free.

      Requires pre-commit AND a running Docker daemon: these are the
      repository's first `language: docker_image` hooks.

      A hook that reports `Skipped` fails this target. pre-commit exits 0 when
      a hook matches no file, so a `files:`/`types:` filter that stops
      selecting anything would otherwise read as a pass — the vacuous green
      NFR-018 §2 forbids and #814 already produced once.

      EVERY PRECONDITION FAILS BY NAME (#1311). Every other missing tool in
      this file says what to install; these hooks brought two further ways to
      fail that said nothing actionable, because the failure happens inside
      pre-commit and arrives as its raw traceback:

        - no Docker daemon — measured, pre-commit dumps a ~2 KB
          `docker system info` JSON blob per hook and the words "the daemon is
          running" are the last line of it;
        - the image cannot be pulled — a Docker Hub rate limit or outage, which
          is an INFRA fault and not a defect in the tree being linted.

      Both are now probed and classified before the raw output is passed on.
    # The hook output IS the deliverable; echoing the loop above it would bury
    # the two lines a reader came for.
    silent: true
    cmds:
      - |
        if ! command -v pre-commit >/dev/null 2>&1; then
          printf 'FAIL  actionlint/shellcheck cannot run: pre-commit is not installed.\n' >&2
          printf '      Install first:  pipx install pre-commit\n' >&2
          exit 1
        fi

        # The `desc` above has named a running Docker daemon as a precondition
        # since these hooks landed, but nothing checked it: pre-commit's own
        # error is a `CalledProcessError` carrying the whole `docker system
        # info` payload, printed once per hook, with no hint that a precondition
        # is missing rather than a workflow being malformed.
        if ! command -v docker >/dev/null 2>&1; then
          printf 'FAIL  actionlint/shellcheck cannot run: docker is not installed.\n' >&2
          printf '      Both are `language: docker_image` pre-commit hooks and have no\n' >&2
          printf '      non-container fallback. Install Docker Engine first.\n' >&2
          exit 1
        fi
        if ! docker info >/dev/null 2>&1; then
          printf 'FAIL  actionlint/shellcheck cannot run: the Docker daemon is not reachable.\n' >&2
          printf '      Both are `language: docker_image` pre-commit hooks (#1295), so they\n' >&2
          printf '      need a running daemon — the same precondition as `task dev`.\n' >&2
          printf '      Start it first:  sudo systemctl start docker\n' >&2
          printf '      Then re-run:     task check:workflow-shell-lint\n' >&2
          exit 1
        fi

        rc=0
        for hook in actionlint-docker shellcheck; do
          if ! out=$(pre-commit run --all-files "$hook" 2>&1); then
            rc=1
          fi
          printf '%s\n' "$out"
          case "$out" in
            *Skipped*)
              printf 'FAIL  pre-commit hook %s selected no file and reported Skipped —\n' "$hook" >&2
              printf '      a gate that cannot fail is a failure (NFR-018 §2).\n' >&2
              rc=1
              ;;
          esac
          # The daemon was up a moment ago, so a registry error here is the
          # network or Docker Hub, not this repository. Saying so is the whole
          # point: the expensive mistake with an infra failure in a lint gate is
          # spending the next hour looking for it in the diff.
          case "$out" in
            *toomanyrequests*|*"pull rate limit"*|*"failed to resolve reference"*|\
            *"registry-1.docker.io"*|*"Error response from daemon"*|*"failed to do request"*)
              printf 'FAIL  actionlint/shellcheck could not obtain their pinned images.\n' >&2
              printf '      CLASSIFY THIS AS infra, NOT AS A DEFECT IN THE TREE. Both hooks pull\n' >&2
              printf '      unauthenticated from Docker Hub (docker.io/rhysd/actionlint and\n' >&2
              printf '      docker.io/koalaman/shellcheck), which is rate-limited per source IP\n' >&2
              printf '      and can be unavailable. Nothing in the diff causes it.\n' >&2
              printf '      Retry, or warm the cache once:  docker pull docker.io/rhysd/actionlint:<rev>\n' >&2
              rc=1
              ;;
          esac
        done
        exit "$rc"

  # ── The aggregate every report pastes ───────────────────────
  #
  # Every report in this repository quotes this command's output as evidence, so
  # #1641 and #1649 asked the only question that matters about it: can the
  # verdict be wrong? It was measured rather than reasoned about, and the record
  # with its numbers is spec/dev-tooling/PRECOMMIT-CONCURRENCY.md. Three results
  # belong here, next to the command:
  #
  #   * **A false green is real, and it is not the shared cache.** 175
  #     deliberately concurrent runs from two WORKTREES sharing
  #     ~/.cache/pre-commit — seeded E501, full CPU starvation, store wiped
  #     before each pair — produced no wrong verdict in either direction. The
  #     false green came from two WRITERS IN ONE WORKTREE (#1649): a file staged
  #     45 s into a 9-minute run is not in the list pre-commit enumerated with
  #     `git ls-files` at the start, and the whole suite reported 0 Failed and
  #     exit 0 over a tree the very next run called Failed.
  #   * **pre-commit's own after-check is half a net.** It diffs the working
  #     tree against the index after each hook, so it notices a content edit to
  #     a tracked file — and blames whichever hook held the window, which is the
  #     #1649 false red. A newly *staged* file moves the index, not the diff, so
  #     it passes unseen.
  #   * **`--all-files` never touches the patch/stash machinery** (pre-commit
  #     4.5.0, commands/run.py: `stash = not args.all_files and not
  #     args.files`), so the `~/.cache/pre-commit/patch*` collision class this
  #     repository already knows about cannot reach `task precommit`.
  #
  # So this target does NOT hand each worktree its own PRE_COMMIT_HOME, which is
  # what #1641 proposed. Measured, that store is 253 MB and 1:26 of environment
  # building PER WORKTREE (41 of them on this machine) — and it would not have
  # prevented the one false green that exists, which happens inside a single
  # worktree and never touches the store.
  #
  # What it does instead is stop "nothing else was running" from being an
  # assertion. scripts/precommit_sibling_notice.sh names any overlapping sibling
  # run, and names every path that changed while the suite was in flight. It
  # never changes the verdict or the exit code. Serialising the runs was
  # rejected for a reason worth stating: the demonstrated writer is an editor or
  # a second agent in the same tree, and no lock held by this command can stop
  # one. The binding rule stays organisational — one writer per worktree,
  # spec/project/parallel-working-copies/ — and the notice makes a breach of it
  # visible rather than preventing it.
  precommit:
    desc: |
      Run the full pre-commit hook suite over the whole tree — the local
      equivalent of the required `static / Static CI Tests` gate
      (build-static-tests.yaml → gh-plumbing reusable-pre-commit). Individual
      hooks also exist as their own check:* / test:e2e:selftest targets; this is
      the aggregate the PR gate actually enforces. Requires pre-commit
      (`pip install pre-commit` or pipx).

      Prints a notice when a sibling run overlapped this one, and when the tree
      changed while the suite was in flight — the two ways a pasted verdict can
      describe a tree that no longer exists (#1641, #1649). Both are
      informational; the verdict and the exit code are unaffected.
    cmds:
      - ./scripts/precommit_sibling_notice.sh {{.CLI_ARGS}}

  # ── Aggregate quality gate ──────────────────────────────────
  #
  # One command, four categories, one table. The point is the table: until this
  # target existed there was no way to ask "is this tree in shape?" without
  # remembering six invocations, and a category that silently did not run looked
  # exactly like one that passed. That is #814 in miniature — a pre-commit hook
  # printed `Passed` for a check whose tool was absent — which is why the rule
  # below is the harsh one: SKIPPED IS FAIL.
  #
  # A category whose tool is missing, or which cannot start, reports FAIL and
  # says why. It does not report "skipped", and it certainly does not report
  # PASS. If the answer is "I could not measure this", the honest verdict is not
  # a green one.
  #
  # What is NOT in here, said out loud rather than left to be assumed:
  #
  #   * `test:backend:api` and `test:backend:contracts` — both are CI gates, but
  #     this target is the fast local loop; the unit tier plus the static gates
  #     is what fits inside one. Run them explicitly before a pull request.
  #   * `tests/integration/` — needs a real ArangoDB, which this fast local loop
  #     does not start. Since #1432 it no longer self-skips into a vacuous green:
  #     without a server it FAILS under `CI` and skips loudly elsewhere, and
  #     `task test:backend:integration` declares `--max-skipped 0`, so even the
  #     local skip is red. It runs in CI in its own job with a service container
  #     (`Integration tests (ArangoDB)`); run it locally against `task dev:core`
  #     before changing repositories or AQL.
  #   * backend mypy — the backend declares `strict = true` and ships no mypy
  #     step anywhere; the four sibling packages have pre-commit hooks, the
  #     backend does not. A documented gap, not something to paper over with a
  #     category that would fail for everyone from day one.
  #   * `lint:frontend:deadcode` — advisory and red today (47 findings); adding
  #     it would make this table red for a reason unrelated to the change under
  #     test.
  #
  # The side-service suites (knowledge-service, inference-service, kp_vectordb)
  # ARE in here as of #1058, via `task test:side-services`. They are fake-only and
  # finish in ~2s combined, so they fit the fast local loop. Like every other
  # category they obey SKIPPED IS FAIL: if a service package is not installed in
  # the active environment, its pytest cannot import and the category reports
  # FAIL (install with `pip install -e '.[dev]'` in each service dir), never a
  # silent green. Their CI home is the advisory side-services.yml workflow.
  #
  # Workflow + shell linting (actionlint, shellcheck) joined the table in #1295,
  # via `task check:workflow-shell-lint`. It is the only category that runs
  # through pre-commit, and the reason is worth stating because the obvious
  # alternative looks tidier: `task precommit` already picks both hooks up, so
  # "just call `task precommit` from here" would need no new category at all.
  # It was rejected on what the whole suite actually does locally — it re-runs
  # ESLint, tsc and the frontend hooks this table already owns as their own
  # categories (one tool, two verdicts, no way to tell which one a reader is
  # looking at), and it pulls in hooks that need tools this fast local loop
  # deliberately does not require, `nuclei` among them. That would turn the
  # table red for everyone without a security scanner installed — the same
  # objection that keeps lint:frontend:deadcode out, above. Naming the two hook
  # ids keeps the pins, the file selection and the --severity floor in
  # .pre-commit-config.yaml (one source of truth with the required lane) while
  # this target stays the fast loop it is for.
  check:
    desc: |
      Run every locally runnable quality gate and print a pass/fail table:
      lint (ruff + ESLint), typecheck (tsc), unit tests (pytest + vitest), the
      side-service suites (knowledge-service, inference-service, kp_vectordb),
      the custom source-tree gates (UTC, boundary validation, layer imports,
      tenant body field, workflow gate integrity, seed harvest integrity, seed
      catalogue page size, plugin shadowing) and workflow + shell linting (actionlint over
      .github/workflows/, shellcheck over the own *.sh — the #1295 hooks, run
      through pre-commit so their version pins stay in one place).

      A category whose tool is missing counts as FAIL, never as skipped — the
      whole point is that "I did not measure this" and "this passed" must not
      look alike. Exits non-zero as soon as any category is not PASS.
    # The table is the deliverable; echoing ninety lines of shell above it would
    # bury the one thing this target exists to show. The tools' own output is
    # unaffected — `silent` suppresses the command echo, not the command.
    silent: true
    cmds:
      - |
        overall=0

        printf '\n=== lint (ruff + ESLint) ===\n'
        lint=0
        ( cd src/backend && ruff check . ) || lint=1
        if [ -d src/frontend/node_modules ]; then
          ( cd src/frontend && npx eslint . ) || lint=1
        else
          printf 'FAIL  ESLint cannot run: src/frontend/node_modules is missing.\n'
          printf '      Install first:  (cd src/frontend && npm ci)\n'
          lint=1
        fi

        printf '\n=== typecheck (tsc) ===\n'
        typecheck=0
        if [ -d src/frontend/node_modules ]; then
          ( cd src/frontend && npx tsc --noEmit ) || typecheck=1
        else
          printf 'FAIL  tsc cannot run: src/frontend/node_modules is missing.\n'
          typecheck=1
        fi

        printf '\n=== unit tests (pytest + vitest) ===\n'
        tests=0
        ( cd src/backend && python -m pytest tests/unit/ -q ) || tests=1
        if [ -d src/frontend/node_modules ]; then
          ( cd src/frontend && npx vitest run ) || tests=1
        else
          printf 'FAIL  vitest cannot run: src/frontend/node_modules is missing.\n'
          tests=1
        fi

        printf '\n=== side-service tests (pytest) ===\n'
        sideservices=0
        task test:side-services || sideservices=1

        printf '\n=== custom gates ===\n'
        gates=0
        python3 scripts/check_utc_calendar_day.py || gates=1
        python3 scripts/check_boundary_validation.py || gates=1
        python3 scripts/check_layer_imports.py || gates=1
        python3 scripts/check_tenant_body_field.py || gates=1
        python3 scripts/check_workflow_gate_integrity.py || gates=1
        python3 scripts/check_seed_harvest_integrity.py || gates=1
        python3 scripts/check_seed_catalogue_page_size.py || gates=1
        python3 scripts/check_skill_plugin_shadowing.py || gates=1

        printf '\n=== workflow + shell lint (actionlint + shellcheck) ===\n'
        shelllint=0
        task check:workflow-shell-lint || shelllint=1

        verdict() { if [ "$1" -eq 0 ]; then printf 'PASS'; else printf 'FAIL'; fi; }

        printf '\n  %-34s %s\n' 'CATEGORY' 'RESULT'
        printf '  %-34s %s\n' '----------------------------------' '------'
        printf '  %-34s %s\n' 'lint (ruff + ESLint)' "$(verdict $lint)"
        printf '  %-34s %s\n' 'typecheck (tsc)' "$(verdict $typecheck)"
        printf '  %-34s %s\n' 'test:unit (pytest + vitest)' "$(verdict $tests)"
        printf '  %-34s %s\n' 'side-service tests (pytest)' "$(verdict $sideservices)"
        printf '  %-34s %s\n' 'custom gates (8)' "$(verdict $gates)"
        printf '  %-34s %s\n' 'actionlint + shellcheck (#1295)' "$(verdict $shelllint)"
        printf '\n'

        overall=$(( lint + typecheck + tests + sideservices + gates + shelllint ))
        if [ "$overall" -ne 0 ]; then
          printf 'task check: not every category passed. A category that could not run\n'
          printf 'counts as FAIL, not as skipped — see the comment above this target.\n\n'
          exit 1
        fi
        printf 'task check: every category passed.\n\n'

  check:plugin-shadowing:
    desc: |
      Refuse a local `.claude/` skill or agent that shadows a portfolio-plugin
      one (#1405, CLAUDE.md §"Claude Code plugin adoption"). Pass `-- --refresh`
      to rewrite the names-only plugin inventory in `.claude/plugin-adoption.yml`
      from a live claude-shared checkout ($NOLTE_CLAUDE_SHARED, default
      ~/repos/github/claude-shared).

      READ THE SCRIPT HEADER BEFORE TRUSTING A ZERO. The comparison is lexical:
      exact names plus the token-multiset rung that catches the reordered
      `check-test-pyramid` / `test-pyramid-check` pair an exact-name guard misses.
      A shadow under an unrelated name — `pre-pr` over `quality-gate`, the second
      asset #1405 retired — is invisible here and still needs a reading pass.
    cmds:
      - python3 scripts/check_skill_plugin_shadowing.py {{.CLI_ARGS}}

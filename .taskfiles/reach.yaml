# ── Capability reach audit (#1680) ───────────────────────────────────────────
# The environment and act targets the approved reach probes under
# project/reach-probes/ name in their `environment:` / `teardown:` lists. The
# capability-reach-audit runner (nolte-engineering plugin, spec
# `spec/project/capability-reach-audit/` in nolte/claude-shared) calls them as
# `task <name>` from the repository root, then runs the probe's observation step
# (scripts/reach/observe_*.py) and compares its output with the expectation.
#
# These targets make the system exist and act on it; none of them says anything
# about reach, and a failing one makes the runner report the probe *not probed*.
#
# The T2 stack is the E2E stack's full-mode services (docker-compose.e2e.yml)
# with the docker-compose.reach.yml overlay, under a compose project unique to
# this working copy. `test:e2e` cannot be reused for it: run-e2e.sh starts the
# stack *and* the Selenium runner and removes everything when the tests end.
# Note that its concurrency guard sees a running reach stack as an E2E stack (it
# matches the compose file) and refuses to start until `reach:stack:down`.
#
# Needs Docker with Compose >= 2.24 (`!reset` in the overlay) and python3; the
# helpers use the standard library only.
#
# Included from the root Taskfile.yaml with `flatten: true` — task names here
# are global and MUST NOT collide with other .taskfiles/*.yaml.

version: "3"

vars:
  # The seeded data subject's user key; the probes' observation steps pass the
  # same value with --subject.
  REACH_SUBJECT: reach-subject
  # The seeded tenant of the tenant-erasure probes (#1769) and its control; the
  # observation steps pass the same value with --tenant.
  REACH_TENANT: reach-tenant
  REACH_CONTROL_TENANT: reach-control-tenant
  # The personal tenant of the seeded subject, and its control, for the
  # account-erasure probe of #1788.
  REACH_PERSONAL_TENANT: reach-personal-tenant
  REACH_PERSONAL_CONTROL_TENANT: reach-personal-control-tenant

tasks:
  reach:stack:up:
    desc: |
      Start the capability-reach T2 stack — ArangoDB, Valkey, the full-mode
      backend and its Celery worker from docker-compose.e2e.yml, plus the
      docker-compose.reach.yml overlay (127.0.0.1 ports picked by Docker,
      ArangoDB query tracking with bind variables, the API's and worker's shared
      object storage backed by .reach/storage) — and record the
      host-side addresses in .reach/stack.json. Builds from this working copy.
    cmds:
      - python3 scripts/reach/stack.py up

  reach:stack:down:
    desc: Remove the capability-reach T2 stack with its volumes and clear the run state under .reach/.
    cmds:
      - python3 scripts/reach/stack.py down

  reach:seed:privacy-subject:
    desc: |
      Seed one data subject (key {{.REACH_SUBJECT}}) into the running reach
      stack: a model-valid row in every collection the Art. 15 export manifest
      and the Art. 17 erasure plan declare, the declared edges from the subject
      to them, and a password the act targets sign in with. Writes the seed
      record to .reach/subjects/{{.REACH_SUBJECT}}.json. A declared field that
      is not a field of the collection's model stops the seed.
    cmds:
      - python3 scripts/reach/stack.py seed --subject {{.REACH_SUBJECT}}

  reach:seed:stored-files:
    desc: |
      Upload one real JPEG carrying GPS EXIF per attachment category for the
      seeded subject ({{.REACH_SUBJECT}}, run reach:seed:privacy-subject first)
      through the production AttachmentService.upload, as created_by in the
      subject's tenant, with EXIF stripping at ingest switched off (standing in
      for STORAGE_STRIP_EXIF=false). Categories whose whitelist refuses
      image/jpeg are recorded as refused. Fails when a stored file carries no
      EXIF. Then renders each file's WebP renditions with the production
      thumbnail task body and records their keys (#1760). Writes
      .reach/subjects/{{.REACH_SUBJECT}}.files.json.
    cmds:
      - python3 scripts/reach/stack.py seed-files --subject {{.REACH_SUBJECT}}

  reach:export:run-for-subject:
    desc: |
      Drive the seeded subject's Art. 15 export through the real path — sign
      in, POST /api/v1/privacy/export, the worker's retention.process_data_export
      — and wait until the request is terminal. Brackets the run with marker
      queries in ArangoDB's query log. Reports nothing about the result.
    cmds:
      - python3 scripts/reach/run_export_for_subject.py --subject {{.REACH_SUBJECT}}

  reach:erasure:finalise-for-subject:
    desc: |
      Request the seeded subject's Art. 17 erasure over the API, move the
      request's hard-delete date into the past (standing in for the 90-day
      grace period), send retention.execute_scheduled_erasures through the
      broker as the daily beat does, and wait until the worker finished it.
      Brackets the run with marker queries in ArangoDB's query log.
    cmds:
      - python3 scripts/reach/finalise_erasure_for_subject.py --subject {{.REACH_SUBJECT}}

  reach:erasure:admin-delete-subject:
    desc: |
      Register a platform admin over the API, promote it with
      app.migrations.add_platform_admin in the backend container, and send
      DELETE /api/v1/admin/platform/users/{{.REACH_SUBJECT}} as that admin —
      the immediate erasure entry of #1767. Brackets the call with marker
      queries in ArangoDB's query log. Reports nothing about the result.
    cmds:
      - python3 scripts/reach/admin_delete_subject.py --subject {{.REACH_SUBJECT}}

  reach:seed:erasure-tenant:
    desc: |
      Seed a tenant ({{.REACH_TENANT}}) and a control tenant
      ({{.REACH_CONTROL_TENANT}}) into the running reach stack: a model-valid row
      in every collection of TenantErasureEngine.INVENTORY (a parent-chained
      collection reached only through its parent), the member's account key on
      the retention rows, and one edge per graph edge definition between the
      tenant's rows (#1769). Writes .reach/subjects/tenant-{{.REACH_TENANT}}.json.
    cmds:
      - python3 scripts/reach/stack.py seed-tenant --tenant {{.REACH_TENANT}} --control {{.REACH_CONTROL_TENANT}}

  reach:seed:personal-tenant:
    desc: |
      Seed a personal tenant ({{.REACH_PERSONAL_TENANT}}) of the seeded subject
      ({{.REACH_SUBJECT}}, run reach:seed:privacy-subject first) and a control
      tenant ({{.REACH_PERSONAL_CONTROL_TENANT}}) of another account: a
      model-valid row in every collection of TenantErasureEngine.INVENTORY, the
      subject the tenant's owner and only active member, the subject's key on the
      retention rows (#1788). Writes
      .reach/subjects/tenant-{{.REACH_PERSONAL_TENANT}}.json.
    cmds:
      - python3 scripts/reach/stack.py seed-tenant --tenant {{.REACH_PERSONAL_TENANT}} --control {{.REACH_PERSONAL_CONTROL_TENANT}} --personal-of {{.REACH_SUBJECT}}

  reach:erasure:admin-delete-tenant:
    desc: |
      Register a platform admin over the API, promote it, and send
      DELETE /api/v1/admin/platform/tenants/{{.REACH_TENANT}} as that admin — the
      tenant deletion of #1769. Brackets the call with marker queries in
      ArangoDB's query log. Reports nothing about the result.
    cmds:
      - python3 scripts/reach/admin_delete_tenant.py --tenant {{.REACH_TENANT}}

  reach:ranking:up:
    desc: |
      Build the cross-encoder ranking service (docker/reranker-service, target
      bge-reranker-v2-m3) from this working copy, run it on a 127.0.0.1 port
      Docker picks, and write its base URL to .reach/ranking.url. Does not wait
      for /ready or the HEALTHCHECK — the probe polls /rerank itself.
    cmds:
      - python3 scripts/reach/ranking.py up

  reach:ranking:down:
    desc: Remove the ranking service container and .reach/ranking.url.
    cmds:
      - python3 scripts/reach/ranking.py down

  reach:vectordb:up:
    desc: |
      Build the pgvector reference index (docker/vectordb) and the
      inference-service from this working copy, run both on the reach stack's
      network without a published port (the helpers use docker exec psql), let
      the inference-service apply its species_embeddings migrations, recreate
      backend-full and celery-worker-full with INFERENCE_SERVICE_ENABLED, the
      service URL and the shared token (#1753), and record the containers in
      .reach/vectordb.json. Run after reach:stack:up.
    cmds:
      - python3 scripts/reach/vectordb.py up

  reach:vectordb:down:
    desc: Remove the reference-index and inference-service containers, the store's data volume, the backend override and .reach/vectordb.json.
    cmds:
      - python3 scripts/reach/vectordb.py down

  reach:seed:pest-prototype:
    desc: |
      Insert a pest-recognition prototype for the seeded subject's
      pest_image_contributions row ({{.REACH_SUBJECT}}, run
      reach:seed:privacy-subject and reach:vectordb:up first) into the
      inference-service's pest_embeddings, the way the promotion index task
      writes it (source user_contributed, source_record_id = contribution key,
      source_url contribution://<tenant>/<key>) but deactivated, plus a curated
      control row with the same record id (#1759). Writes the row ids to
      .reach/subjects/{{.REACH_SUBJECT}}.pest-prototypes.json.
    cmds:
      - python3 scripts/reach/vectordb.py seed-pest --subject {{.REACH_SUBJECT}}

  reach:seed:pest-orphans:
    desc: |
      Insert contributed pest-recognition prototypes into the inference-service's
      pest_embeddings (run reach:seed:privacy-subject and reach:vectordb:up
      first): three orphaned contribution keys whose pest_image_contributions
      document does not exist (active, deactivated, and one in another tenant
      with rows under two labels), the live prototype of the subject's own
      contribution, and a curated control row sharing an orphan's record id
      (#1771). Refuses when an orphan key names a document or the live key names
      none. Writes .reach/subjects/{{.REACH_SUBJECT}}.pest-orphans.json.
    cmds:
      - python3 scripts/reach/vectordb.py seed-pest-orphans --subject {{.REACH_SUBJECT}}

  reach:sweep:pest-orphans:
    desc: |
      Send pest_image.sweep_orphaned_prototypes — the task the beat schedules
      daily at 04:30 UTC — through the broker from the worker container and wait
      until the sweep records a new run in system_settings (#1771). Reports
      nothing about the result.
    cmds:
      - python3 scripts/reach/sweep_orphan_pest_prototypes.py

  reach:seed:reference-embedding:
    desc: |
      Insert one user_contributed embedding of the seeded subject
      ({{.REACH_SUBJECT}}, run reach:seed:privacy-subject first) into the
      reference index, with the column set the inference-service writes
      (is_active=false, contributed_by, tenant_key), plus one curated control
      row. Writes the row ids to .reach/subjects/{{.REACH_SUBJECT}}.embeddings.json.
    cmds:
      - python3 scripts/reach/vectordb.py seed --subject {{.REACH_SUBJECT}}

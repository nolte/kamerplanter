# ── Docker images, deployment verify & security scans ────────────────────────
# Hadolint over every Dockerfile, the Helm/Skaffold wiring verification and the
# Nuclei template validation — the local pendants of docker-lint-build.yml,
# skaffold-verify.yml and security-nuclei-templates.yml. The full Nuclei/ZAP
# scans stay CI-only (they need the ephemeral stack).
#
# Included from the root Taskfile.yaml with `flatten: true` — task names here
# are global and MUST NOT collide with other .taskfiles/*.yaml.

version: "3"

tasks:
  lint:docker:
    desc: |
      Lint every Dockerfile with hadolint — the docker-lint-build CI job's
      exact set (all eight images, including inference-service, which is built
      elsewhere but linted here). Uses the same pinned image as CI; when
      bumping, keep HADOLINT_IMAGE in .github/workflows/docker-lint-build.yml
      and here in sync.
    vars:
      # renovate: datasource=docker depName=ghcr.io/hadolint/hadolint
      HADOLINT_IMAGE: ghcr.io/hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
    cmds:
      - for:
          - src/backend/Dockerfile
          - src/frontend/Dockerfile
          - docker/vectordb/Dockerfile
          - docker/knowledge/Dockerfile
          - docker/embedding-service/Dockerfile
          - docker/reranker-service/Dockerfile
          - src/knowledge-service/Dockerfile
          - src/inference-service/Dockerfile
        cmd: docker run --rm -v "$PWD":/w -w /w "{{.HADOLINT_IMAGE}}" hadolint {{.ITEM}}

  verify:skaffold:
    desc: |
      Verify the Helm chart and the Skaffold deploy configuration wire together
      — the skaffold-verify CI job's check sequence: chart dependency build,
      helm lint, template render, skaffold diagnose, and an offline skaffold
      render that must produce the full chart (>= 10 resources; an empty render
      passing silently is the vacuous green that job exists to prevent). Needs
      helm and skaffold, no cluster and no registry (--offline,
      --digest-source=none).
    cmds:
      - helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts/ --force-update
      - helm repo add ollama https://otwld.github.io/ollama-helm/ --force-update
      - helm dependency build helm/kamerplanter
      - helm lint helm/kamerplanter -f helm/kamerplanter/values-dev.yaml
      - helm template kamerplanter helm/kamerplanter/ -f helm/kamerplanter/values-dev.yaml > /dev/null
      - skaffold diagnose > /dev/null
      - |
        set -euo pipefail
        out=$(mktemp)
        trap 'rm -f "$out"' EXIT
        skaffold render --offline=true --digest-source=none --output "$out"
        kinds=$(grep -c '^kind:' "$out" || true)
        if [ "$kinds" -lt 10 ]; then
          echo "verify:skaffold: render produced only $kinds resources — expected the full chart." >&2
          exit 1
        fi
        echo "verify:skaffold: render produced $kinds resources."

  security:nuclei:validate:
    desc: |
      Validate the project-specific Nuclei templates — the
      security-nuclei-templates CI job's exact invocation. Requires the nuclei
      binary (https://github.com/projectdiscovery/nuclei); the full scans
      themselves stay CI-only because they need the ephemeral stack.
    preconditions:
      - sh: command -v nuclei
        msg: "nuclei not found — install it from https://github.com/projectdiscovery/nuclei/releases"
    cmds:
      - nuclei -validate -t tests/security/nuclei-templates/

  verify:deployed-build:
    desc: |
      Ask a running instance whether it serves the build its chart version pins
      — hop 4 of the delivery chain (#1236), the one the 2026-08-17 incident
      failed on while the hop-3 digest guard stayed green and correct.

      Deliberately a local task and NOT a scheduled workflow. Measured
      2026-09-01: the reference deployment resolves to an RFC1918 address from
      every public resolver, and this repository has no self-hosted runners, so
      a GitHub-hosted runner cannot reach the instance — and one that could
      reach 192.168.178.0/24 would silently measure a different machine. This
      runs where the instance is actually reachable: an operator workstation,
      or a job inside the cluster.

      CHART_VERSION is the version the deployment targets (ArgoCD
      `targetRevision`), not this repository's `develop` channel — comparing
      production against `develop` reports permanent drift for ordinary release
      lag, which is what release-lag.yml already watches.

      Exit codes: 0 the instance serves the pinned build (or a rollout is in
      progress), 3 drift, 1 undetermined — including an instance that does not
      disclose `build_revision` at all, which is loud on purpose and never
      reported as clean.

      Usage:
        task verify:deployed-build INSTANCE_URL=https://example.org CHART_VERSION=0.2.1
    requires:
      vars: [INSTANCE_URL, CHART_VERSION]
    vars:
      REPORT: '{{.REPORT | default "deployed-build-report.json"}}'
    cmds:
      - >-
        python3 scripts/ci/check_deployed_build.py
        --instance-url {{.INSTANCE_URL}}
        --chart-version {{.CHART_VERSION}}
        --json {{.REPORT}}

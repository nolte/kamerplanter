# ── Documentation ────────────────────────────────────────────────────────────
# MkDocs build/serve from the isolated .venv-docs, plus the generators for the
# Claude catalog pages and the fact-table snippets.
#
# Included from the root Taskfile.yaml with `flatten: true` — task names here
# are global and MUST NOT collide with other .taskfiles/*.yaml.

version: "3"

tasks:
  docs:catalog:
    desc: Regenerate the Claude skill & agent catalog pages (docs/<locale>/skills/, agents/, tags.md)
    cmds:
      - python scripts/docs/gen_catalog.py

  docs:fact-tables:
    desc: Regenerate the fact-table snippets (docs/_generated/) from backend code & seed data
    cmds:
      - python scripts/docs/gen_fact_tables.py

  docs:lock:
    desc: |
      Recompile docs/requirements.txt from docs/requirements.in, pinning every
      direct and transitive distribution by version AND hash (#1509).

      Run this after every edit to docs/requirements.in — the .in file is the
      source of ranges, the .txt is what every consumer installs
      (`task docs:venv`, and `release-cd-deliver-docs.yml` through
      gh-plumbing's reusable-mkdocs workflow). `pip install -r` switches itself
      into hash-checking mode as soon as one hash is present, so a stale .txt
      fails the install loudly rather than resolving something else.

      The two flags are MEASURED, not stylistic. The release lane installs the
      set twice: once on the runner (Python 3.14) and once inside
      `mhausenblas/mkdocs-deploy-gh-pages`, whose image is
      `squidfunk/mkdocs-material:9.0.6` — Alpine, CPython 3.11.0. `--universal`
      emits one file valid for both, including the musllinux wheel hashes the
      musl container needs; `--python-version 3.11` keeps the resolve inside the
      older interpreter.

      uv is pinned to [tool.uv].required-version of the backend, the same value
      every other lock in this repository is produced with.

      WHAT CHECKS THIS BEFORE A RELEASE (#1571). `docs-requirements.yml` — a
      path-filtered, ADVISORY pull-request lane — installs the compiled file
      (`docs:venv`, hash-verified) and then re-runs this task and diffs the
      result, so an edit to docs/requirements.in that was never compiled is red
      on the pull request rather than in `release-cd-deliver-docs.yml`, which
      triggers on `release: published` and was the only consumer before.
    vars:
      UV_SPEC:
        sh: python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("src/backend/pyproject.toml").read_text())["tool"]["uv"]["required-version"])'
    cmds:
      - >-
        uvx --from 'uv{{.UV_SPEC}}' uv pip compile docs/requirements.in
        --universal --python-version 3.11 --generate-hashes
        -o docs/requirements.txt

  docs:venv:
    desc: |
      Create the isolated MkDocs venv (.venv-docs) and install docs/requirements.txt.
      Idempotent. The system Pythons cannot run MkDocs here (PEP-668 / mixed
      user-site packages), so docs:serve/build run from this venv. Override the
      base interpreter with DOCS_PYTHON=<path> if `python3` is not usable.

      The install is hash-verified: docs/requirements.txt carries a `--hash=`
      for every distribution (#1509), which puts pip into hash-checking mode by
      itself. Edit docs/requirements.in and run `task docs:lock` to change the
      set — editing the .txt by hand produces an install that refuses itself.

      pip ITSELF IS BOUNDED (#1572). It used to be `--upgrade pip`, unbounded —
      and it is the tool that then performs the hash verification, on every run
      of the docs-requirements lane. Under NFR-009 §2.3.1 that install is class
      (b) (runner-only, no delivered artefact), so it needs no hashes but it does
      need a bound, and "it verifies the hashes" is the strongest possible reason
      not to let it float. The ceiling is the current major; raising it is a
      reviewed decision, which is the whole point of having one. Note the
      consequence, so it is not a surprise: if a future venv ships a pip ABOVE
      the ceiling, `--upgrade` with this range downgrades it.
    vars:
      DOCS_PYTHON: '{{.DOCS_PYTHON | default "python3"}}'
    cmds:
      - '{{.DOCS_PYTHON}} -m venv .venv-docs'
      - .venv-docs/bin/pip install -q --upgrade 'pip>=25.0,<27.0'
      - .venv-docs/bin/pip install -q -r docs/requirements.txt
    status:
      - test -x .venv-docs/bin/mkdocs

  docs:serve:
    desc: |
      Serve MkDocs documentation locally (regenerates the Claude catalog and
      fact tables first). Runs on port DOCS_PORT (default 8001; 8000 is taken by
      the backend port-forward). Override with: task docs:serve DOCS_PORT=8123
    deps: [docs:catalog, docs:fact-tables, docs:venv]
    vars:
      DOCS_PORT: '{{.DOCS_PORT | default "8001"}}'
    cmds:
      - .venv-docs/bin/mkdocs serve --dev-addr 127.0.0.1:{{.DOCS_PORT}}

  docs:build:
    desc: Build MkDocs documentation (regenerates the Claude catalog & fact tables first)
    deps: [docs:catalog, docs:fact-tables, docs:venv]
    cmds:
      - .venv-docs/bin/mkdocs build
